<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구 시간표 공유 (테스트)</title>
<style>
  :root{
    --bg:#0B0B0E; --surface:#16161B; --surface-2:#1D1D24; --border:#2A2A33;
    --text:#F2F2F5; --text-dim:#9C9CA8; --text-faint:#6B6B76;
    --crimson:#A72A3A; --teal:#E0AC55; --danger:#FF6B6B; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; padding:16px; padding-bottom:60px;}
  h1{font-size:16px; margin:0 0 4px;}
  .badge{display:inline-block; background:rgba(167,42,58,0.18); color:var(--crimson); border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; margin-bottom:14px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .row{display:flex; gap:8px;}
  input[type=text]{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-size:14px; min-width:0;}
  input[type=text]:focus{outline:none; border-color:var(--crimson);}
  button{background:var(--crimson); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;}
  button:disabled{opacity:.5; cursor:default;}
  button.ghost{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}
  button.danger{background:rgba(255,107,107,0.12); color:var(--danger);}
  .section-title{font-size:12px; color:var(--text-dim); margin:0 0 8px; font-weight:700;}
  .msg{font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.5;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--teal);}
  .friend-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .friend-row:last-child{border-bottom:none;}
  .friend-row b{font-size:13.5px;}
  .friend-row .sub{font-size:11px; color:var(--text-faint); font-family:monospace;}
  .empty{color:var(--text-faint); font-size:12px; padding:12px 0; text-align:center;}
  .tt-grid{display:grid; grid-template-columns:34px repeat(5,1fr); gap:2px; font-size:10px; margin-top:10px;}
  .tt-head{text-align:center; color:var(--text-dim); font-size:10.5px; padding:4px 0; font-weight:700;}
  .tt-hourlabel{color:var(--text-faint); font-size:9px; text-align:right; padding-right:3px;}
  .tt-col{position:relative; background:var(--surface-2); border-radius:4px; min-height:520px;}
  .tt-block{position:absolute; left:2px; right:2px; border-radius:5px; padding:3px 4px; font-size:9.5px; color:#fff; overflow:hidden; line-height:1.3;}
  .back-link{color:var(--text-faint); font-size:12px; text-decoration:none; display:inline-block; margin-bottom:10px;}
  #login-gate{text-align:center; padding:60px 20px;}
</style>
</head>
<body>

<a class="back-link" href="/">← 메인 앱으로</a>
<h1>친구 시간표 공유</h1>
<span class="badge">테스트 페이지 · 별도 화면</span>

<div id="login-gate" style="display:none;">
  <p style="color:var(--text-dim); font-size:13px; line-height:1.6;">로그인 정보가 없어요.<br>메인 앱에서 먼저 로그인한 뒤 이 페이지를 열어주세요.</p>
</div>

<div id="app-root" style="display:none;">
  <div class="card" id="me-card"></div>

  <div class="card">
    <div class="section-title">학번으로 친구 추가</div>
    <div class="row">
      <input type="text" id="add-input" placeholder="예: 2022271522" inputmode="numeric">
      <button id="btn-add">추가</button>
    </div>
    <div class="msg" id="add-msg"></div>
  </div>

  <div class="card">
    <div class="section-title">내 친구 (<span id="friend-count">0</span>)</div>
    <div id="friend-list"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="card" id="tt-card" style="display:none;">
    <div class="section-title" id="tt-title">시간표</div>
    <div id="tt-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, deleteDoc,
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDskfhLLU_CsMnhlbsuHgNgDNRinx-BRXY",
  authDomain: "ku-ise-d95ee.firebaseapp.com",
  projectId: "ku-ise-d95ee",
  storageBucket: "ku-ise-d95ee.firebasestorage.app",
  messagingSenderId: "808683287364",
  appId: "1:808683287364:web:713f7c2e245b9d61949d11",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const DAYS = ['월','화','수','목','금'];
const DAY_COLORS = ['#A72A3A','#3C7AA0','#4C9E6B','#B98CFF','#E0AC55','#6FA3F5'];

function pairKey(a, b){ return a < b ? `${a}_${b}` : `${b}_${a}`; }
function $(id){ return document.getElementById(id); }

let me = null; // { uid, studentId, name }

onAuthStateChanged(auth, async (user) => {
  if(!user){ $('login-gate').style.display='block'; return; }
  try{
    const meSnap = await getDoc(doc(db,'users',user.uid));
    if(!meSnap.exists()){ $('login-gate').style.display='block'; return; }
    const d = meSnap.data();
    me = { uid: user.uid, studentId: d.studentId, name: d.name };
  }catch(e){
    $('login-gate').style.display='block';
    $('login-gate').innerHTML += `<p class="msg err">${e.message||e}</p>`;
    return;
  }

  // 학번으로 서로를 찾을 수 있도록, 내 항목을 공개 명단(studentDirectory)에 올려둔다.
  // (테스트 페이지라 여기서 처음 여는 사람 기준으로 하나씩 채워진다 — 본가입 시 자동으로
  // 만들어주려면 나중에 메인 index.html의 가입 로직에도 같이 넣어야 한다.)
  try{
    await setDoc(doc(db,'studentDirectory',me.uid), { studentId: me.studentId, name: me.name });
  }catch(e){ console.warn('[studentDirectory] 갱신 실패', e); }

  $('app-root').style.display='block';
  $('me-card').innerHTML = `<div class="section-title">내 정보</div>
    <div style="font-size:13.5px;"><b>${escapeHtml(me.name||'')}</b> <span style="color:var(--text-faint); font-family:monospace;">${escapeHtml(me.studentId||'')}</span></div>`;

  await loadFriends();

  $('btn-add').onclick = onAddFriend;
  $('add-input').addEventListener('keydown', e => { if(e.key==='Enter') onAddFriend(); });
});

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function onAddFriend(){
  const sid = ($('add-input').value||'').trim();
  const msgEl = $('add-msg');
  msgEl.className='msg'; msgEl.textContent='';
  if(!sid){ msgEl.className='msg err'; msgEl.textContent='학번을 입력해주세요.'; return; }
  if(sid === me.studentId){ msgEl.className='msg err'; msgEl.textContent='본인은 추가할 수 없어요.'; return; }

  $('btn-add').disabled = true;
  try{
    const q = query(collection(db,'studentDirectory'), where('studentId','==',sid));
    const snap = await getDocs(q);
    if(snap.empty){
      msgEl.className='msg err';
      msgEl.textContent = '해당 학번을 찾을 수 없어요 (그 사람이 이 테스트 페이지를 한 번 열어야 명단에 등록돼요).';
      return;
    }
    const targetDoc = snap.docs[0];
    const targetUid = targetDoc.id;
    const targetData = targetDoc.data();
    const pid = pairKey(me.uid, targetUid);

    const existing = await getDoc(doc(db,'friendLinks',pid));
    if(existing.exists()){
      msgEl.className='msg err'; msgEl.textContent = '이미 친구예요.';
      return;
    }

    await setDoc(doc(db,'friendLinks',pid), {
      uids: [me.uid, targetUid].sort(),
      names: { [me.uid]: me.name, [targetUid]: targetData.name },
      studentIds: { [me.uid]: me.studentId, [targetUid]: targetData.studentId },
      createdBy: me.uid,
      createdAt: Date.now(),
    });

    msgEl.className='msg ok'; msgEl.textContent = `${targetData.name}님과 친구가 됐어요. 서로 시간표를 볼 수 있어요.`;
    $('add-input').value='';
    await loadFriends();
  }catch(e){
    console.error(e);
    msgEl.className='msg err'; msgEl.textContent = '실패했어요 (' + (e.code||e.message||'알 수 없음') + ')';
  }finally{
    $('btn-add').disabled = false;
  }
}

async function loadFriends(){
  const listEl = $('friend-list');
  try{
    const q = query(collection(db,'friendLinks'), where('uids','array-contains', me.uid));
    const snap = await getDocs(q);
    const friends = snap.docs.map(d => {
      const data = d.data();
      const otherUid = data.uids.find(u => u !== me.uid);
      return { pairId: d.id, uid: otherUid, name: data.names?.[otherUid]||'(이름 없음)', studentId: data.studentIds?.[otherUid]||'' };
    });
    $('friend-count').textContent = friends.length;
    if(!friends.length){ listEl.innerHTML = `<div class="empty">아직 친구가 없어요. 위에서 학번을 입력해 추가해보세요.</div>`; return; }
    listEl.innerHTML = friends.map(f => `
      <div class="friend-row" data-uid="${escapeHtml(f.uid)}" data-name="${escapeHtml(f.name)}" data-pair="${escapeHtml(f.pairId)}">
        <div>
          <b>${escapeHtml(f.name)}</b><br>
          <span class="sub">${escapeHtml(f.studentId)}</span>
        </div>
        <button class="ghost btn-unfriend" data-pair="${escapeHtml(f.pairId)}">삭제</button>
      </div>`).join('');
    listEl.querySelectorAll('.friend-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('.btn-unfriend')) return;
        showTimetable(row.dataset.uid, row.dataset.name);
      });
    });
    listEl.querySelectorAll('.btn-unfriend').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(!confirm('이 친구를 삭제할까요?')) return;
        await deleteDoc(doc(db,'friendLinks',btn.dataset.pair));
        await loadFriends();
      });
    });
  }catch(e){
    console.error(e);
    listEl.innerHTML = `<div class="msg err">불러오기 실패 (${e.code||e.message||'알 수 없음'})</div>`;
  }
}

async function showTimetable(uid, name){
  const card = $('tt-card');
  const title = $('tt-title');
  const body = $('tt-body');
  card.style.display='block';
  title.textContent = `${name}님의 시간표`;
  body.innerHTML = `<div class="empty">불러오는 중…</div>`;
  card.scrollIntoView({behavior:'smooth', block:'nearest'});

  try{
    const snap = await getDoc(doc(db,'timetables',uid));
    if(!snap.exists() || !snap.data().bySemester){
      body.innerHTML = `<div class="empty">아직 등록된 시간표가 없어요.</div>`;
      return;
    }
    const d = snap.data();
    const semKey = d.activeSemester || Object.keys(d.bySemester)[0];
    const variants = d.bySemester[semKey];
    const slots = (variants && variants[0] && variants[0].slots) || [];
    if(!slots.length){
      body.innerHTML = `<div class="empty">${escapeHtml(semKey||'')} 학기에 등록된 수업이 없어요.</div>`;
      return;
    }
    body.innerHTML = renderGrid(slots, semKey);
  }catch(e){
    console.error(e);
    body.innerHTML = `<div class="msg err">불러오기 실패 (${e.code||e.message||'알 수 없음'}) — 친구가 아니면 볼 수 없어요.</div>`;
  }
}

function renderGrid(slots, semKey){
  const minStart = 8*60, maxEnd = 21*60;
  const totalMin = maxEnd - minStart;
  const pxPerMin = 520 / totalMin;
  const hours = [];
  for(let h=8; h<=20; h++) hours.push(h);

  const cols = DAYS.map((label, day) => {
    const daySlots = slots.filter(s => Number(s.day) === day);
    const blocks = daySlots.map(s => {
      const top = Math.max(0, (s.start - minStart) * pxPerMin);
      const height = Math.max(16, (s.end - s.start) * pxPerMin);
      const color = s.color || DAY_COLORS[day % DAY_COLORS.length];
      return `<div class="tt-block" style="top:${top}px; height:${height}px; background:${escapeHtml(color)};">
        <b>${escapeHtml(s.subject||'')}</b>${s.room?('<br>'+escapeHtml(s.room)):''}
      </div>`;
    }).join('');
    return `<div class="tt-col">${blocks}</div>`;
  }).join('');

  const hourLabels = hours.map(h => {
    const top = (h*60 - minStart) * pxPerMin;
    return `<div class="tt-hourlabel" style="position:absolute; top:${top-5}px; right:3px;">${h}</div>`;
  }).join('');

  return `
    <div style="font-size:10.5px; color:var(--text-faint); margin-bottom:6px;">${escapeHtml(semKey||'')}</div>
    <div class="tt-grid">
      <div></div>
      ${DAYS.map(d=>`<div class="tt-head">${d}</div>`).join('')}
      <div style="position:relative;">${hourLabels}</div>
      ${cols}
    </div>`;
}
</script>
</body>
</html>
