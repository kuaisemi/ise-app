.section-title:has(> svg) > svg{margin-right:0; flex:none; display:block;}
/* 작성 창의 스위치 줄(알림 발송·이름 비공개·안드로이드 전용 등): 아이콘 크기를 모두 같게 맞추고 글자와 가운데 정렬 */
#notice-form .row-between label svg{width:16px; height:16px; flex:none; display:block;}
#notice-form .row-between label{line-height:1.3;}
.notify-row svg{width:15px; height:15px;}
/* ICON.plus 등 아이콘은 원래 24x24로 만들어져서, "+ 작성"처럼 작은 버튼(btn-sm) 안에
   그대로 들어가면 옆의 작은 글씨에 비해 아이콘만 크게 튀어 보였다. 버튼 글씨 크기에
   맞춰 아이콘도 같이 작아지게 한다. */
.btn-sm svg{width:12px; height:12px; flex-shrink:0;}
.meal-block .m-text{font-size:12px; line-height:1.7; color:var(--text); white-space:pre-wrap;}
/* 학식 한 줄 = 분류명(색 글자) + 메뉴, 한 줄에 붙여서 세로 공간을 아낀다.
   알약 배지로 감싸면 메뉴 글자와 경쟁해서 눈이 분산되므로 색은 글자에만 준다. */
.meal-line{display:flex; align-items:baseline; gap:6px; padding:3px 0; line-height:1.5;}
.meal-cat{flex-shrink:0; font-size:11.5px; font-weight:700; color:var(--meal-accent, var(--text-dim));}
.meal-line-text{font-size:12.5px; color:var(--text);}
.meal-cat-teal{--meal-accent:var(--teal);}
.meal-cat-blue{--meal-accent:var(--blue);}
.meal-cat-amber{--meal-accent:var(--amber);}
.meal-cat-crimson{--meal-accent:var(--crimson-text);}
.meal-cat-dim{--meal-accent:var(--border-light);}

.like-bar{display:flex; align-items:center; gap:8px; margin-top:8px;}
.btn-like{background:var(--surface-2); border:1px solid var(--border); border-radius:16px; padding:4px 10px; font-size:11px; font-weight:700; color:var(--text-dim); cursor:pointer; display:inline-flex; align-items:center; gap:4px;}
.btn-like.active{background:var(--teal-glow); border-color:var(--teal); color:var(--teal);}
.btn-like:active{transform:scale(0.96);}
.btn-comment-like{background:transparent; border:none; padding:2px 6px; font-size:10.5px; font-weight:700; color:var(--text-faint); cursor:pointer; display:inline-flex; align-items:center; gap:3px;}
.btn-comment-like.active{color:var(--teal);}

details.likers-accordion, details.voters-accordion{margin-top:6px; background:var(--teal-glow-3); border:1px solid var(--teal-glow-4); border-radius:6px; padding:6px 10px; font-size:11px;}
details.likers-accordion summary, details.voters-accordion summary{cursor:pointer; font-weight:700; color:var(--teal); outline:none; user-select:none;}
/* 명단은 한 줄에 한 명씩 세로로 늘어놓는다 — 이름+학번이 붙은 텍스트를 좁은 알약 배지 여러 개로
   줄바꿈하면 몇 명인지, 누가 있는지 한눈에 훑기가 어려워서, 스크롤되는 목록으로 바꿨다. */
details.likers-accordion > div, details.voters-accordion > div{
  display:flex; flex-direction:column; max-height:220px; overflow-y:auto;
  margin-top:8px !important; border:1px solid var(--border); border-radius:8px; background:var(--surface);
}
.voter-badge{
  display:block; width:100%; box-sizing:border-box; margin:0; padding:7px 11px;
  background:none; color:var(--text); border-radius:0; border-bottom:1px solid var(--border);
  font-size:12px; text-align:left; line-height:1.4;
}
.voter-badge:last-child{border-bottom:none;}
.voter-badge.unvoted{background:rgba(var(--danger-rgb),0.06); color:var(--danger);}

.time-slot-inline{display:flex; align-items:center; gap:8px; background:var(--surface-3); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px; margin-top:4px;}
.time-slot-inline input[type=time]{background:transparent; border:none; padding:2px; font-size:12.5px; font-family:var(--font-mono); color:var(--text); outline:none; width:90px; text-align:center;}
.time-slot-inline span.sep{color:var(--text-faint); font-weight:700; flex:0 0 auto;}
.time-slot-inline{justify-content:center;}
.time-slot-inline .time-picker{flex:1 1 0; min-width:0; justify-content:center;}
#poll-deadline-inputs .time-picker{display:flex; width:100%;}
#poll-deadline-inputs .time-picker .tp-col{flex:1; min-width:0;}
#poll-deadline-inputs .time-picker .tp-btn, #poll-deadline-inputs .time-picker .tp-col-ampm .tp-btn{width:100%;}
#poll-deadline-inputs .time-picker .tp-val, #poll-deadline-inputs .time-picker .tp-ampm{width:100%; min-width:0; text-align:center; justify-content:center;}
#poll-deadline-inputs .time-picker .tp-colon{flex:0 0 auto;}
/* 마감 날짜 달력은 좁은 오른쪽 칸 안에서 날짜 바로 아래로 펼쳐지므로, 조금 작게(여백·글씨·칸 간격을 줄여) 보여 준다 */
#poll-deadline-inputs .date-field-panel{padding:6px; margin-top:6px;}
#poll-deadline-inputs .dp-head{font-size:11px; margin-bottom:4px;}
#poll-deadline-inputs .dp-nav{padding:2px;}
#poll-deadline-inputs .dp-weekdays{font-size:8.5px; margin-bottom:2px;}
#poll-deadline-inputs .dp-grid{gap:1px;}
#poll-deadline-inputs .dp-cell{font-size:9.5px; border-radius:6px;}
/* 시간 선택기 — 시간표 수업시간 · 투표 마감 · 일정 알림이 함께 쓴다.
   예전에는 26x20px 버튼이 낱개로 떠 있어서 누르기도 어렵고 입력칸처럼 보이지도 않았다.
   하나의 입력 필드처럼 테두리로 묶고, 손가락에 맞게 버튼을 키웠다(권장 최소 크기에 맞춤). */
.time-picker{display:inline-flex; align-items:stretch; gap:0; border:1px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm); overflow:hidden;}
.time-picker .tp-col{display:flex; flex-direction:column; align-items:stretch; gap:0;}
/* 세 칸(오전·시·분)의 글자 크기가 서로 달라서 높이를 안 고정하면 "오전"만 아래로 처진다.
   같은 높이로 못 박아 세 칸의 글자가 한 줄에 정확히 놓이게 한다. */
.time-picker .tp-val{font-family:var(--font-mono); font-size:17px; font-weight:800; color:var(--text); min-width:38px; height:28px; text-align:center; user-select:none; display:flex; align-items:center; justify-content:center; padding:0;}
.time-picker .tp-btn{width:38px; height:22px; border:none; background:transparent; color:var(--text-faint); font-size:8px; line-height:1; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s;}
/* 마우스가 있는 기기에서만 hover 색을 쓴다 — 터치 기기는 한 번 누른 뒤에도 hover 상태가 남아서 화살표가 노랗게 굳어 있던 문제 */
@media (hover:hover) and (pointer:fine){ .time-picker .tp-btn:hover{color:var(--teal);} }
.time-picker .tp-btn:active{background:var(--teal); color:var(--teal-ink);}
.time-picker .tp-btn:focus{outline:none;}
.time-picker .tp-btn{touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
.time-picker .tp-colon{color:var(--text-faint); font-weight:800; font-size:17px; display:flex; align-items:center; padding:0 1px;}
/* 오전/오후 칸은 글자가 두 자라 조금 넓고, 숫자가 아니라 본문 서체를 쓴다. */
.time-picker .tp-col-ampm{border-right:1px solid var(--border);}
.time-picker .tp-col-ampm .tp-btn{width:46px;}
.time-picker .tp-ampm{font-family:inherit; font-size:13px; font-weight:700; color:var(--teal); width:46px; min-width:46px; text-align:center; justify-content:center;}

.date-field-btn{width:100%; display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 13px; font-size:13px; color:var(--text); cursor:pointer; font-family:var(--font-display);}
.date-field-btn svg{width:14px; height:14px; color:var(--text-faint); flex-shrink:0;}
.date-field-panel{margin-top:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px;}
/* 날짜를 왼쪽 반 칸에 두는 배치. 오른쪽 칸(장소·시간)은 위에 맞춰 붙인다. */
.field-row-split{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start;}
/* 반 칸에 놓인 날짜 버튼을 눌렀을 때, 달력만 행 전체 폭으로 떠오르게 한다.
   좁은 칸 안에서 펼치면 7칸이 눌려서 날짜를 누르기 어려운데, 이렇게 하면 버튼은 반 칸에
   있으면서 달력은 평소 크기 그대로 보인다. (부모 .field-row-split에 position:relative 필요) */
/* 입력칸과 날짜/선택 버튼을 나란히 두면 줄이 미세하게 어긋난다 — 안쪽 여백은 같은데
   서체(입력은 mono, 버튼은 display)와 버튼 안 화살표 아이콘 때문에 줄 높이가 달라서다.
   모달 폼 전체에서 한 줄짜리 입력·버튼 높이를 같은 값으로 못 박아 어느 줄이든 맞게 한다. */
.modal-sheet .date-field-btn,
.modal-sheet .field input[type=text],
.modal-sheet .field input[type=password]{ height:43px; box-sizing:border-box; }
/* 2단으로 세운 줄끼리도 아래 줄과 같은 간격을 둔다(.field의 margin이 죽어 있어서 필요). */
.field-row-split{margin-bottom:14px;}
.date-field-pop .date-field-panel{
  position:absolute; left:0; right:0; top:100%; z-index:6;
  box-shadow:0 10px 26px rgba(0,0,0,.20);
}
.dp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:12.5px; font-weight:800;}
.dp-nav{background:none; border:none; color:var(--text-dim); padding:4px; cursor:pointer; display:flex;}
.dp-nav svg{width:14px; height:14px;}
.dp-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-faint); margin-bottom:4px;}
.dp-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
.dp-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11.5px; background:none; border:none; border-radius:8px; color:var(--text); cursor:pointer;}
.dp-cell:active{background:var(--surface-3);}
.dp-cell.dp-selected{background:var(--teal); color:var(--teal-ink); font-weight:800;}
.dp-cell.dp-sun{color:var(--danger-text);}
.dp-cell.dp-sat{color:var(--blue);}
.dp-cell.dp-selected.dp-sun,.dp-cell.dp-selected.dp-sat{color:var(--teal-ink);}
.dp-weekdays .dp-sun{color:var(--danger-text);}
.dp-weekdays .dp-sat{color:var(--blue);}
.dp-cell.dp-empty{cursor:default;}

.post-title{font-size:14px; font-weight:800; line-height:1.35; margin:0 0 4px; word-break:break-word;}
.comment-box{margin-top:7px; padding:8px 10px; background:var(--surface-2); border-radius:8px; border-left:2px solid var(--border-light);}
.comment-box.best-comment{border-left-color:var(--amber); background:rgba(var(--amber-rgb),0.06);}
.comment-box b{font-size:11.5px; color:var(--teal);}
.comment-box .c-body{font-size:12px; margin-top:3px; white-space:pre-wrap; line-height:1.5;}
.comment-form{display:flex; gap:6px; margin-top:10px;}
.comment-form input{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px; font-size:11.5px; outline:none;}

.btn-more-comments{background:none; border:none; color:var(--teal); font-size:11px; font-weight:700; cursor:pointer; padding:6px 0; margin-top:4px; display:inline-block;}

/* 짧은 시간표는 화면 가운데 오게 하고 싶은데, 예전처럼 .capture-container{margin:auto}로 하면
   내용이 화면보다 길어졌을 때 위쪽이 스크롤로 닿지 않는 영역으로 밀려나 버린다(iOS에서 특히).
   justify-content의 safe 키워드가 정확히 이 경우를 위한 것 — 남는 공간이 있을 때만 가운데로 놓고,
   넘치면 알아서 위쪽 기준으로 되돌아간다. overscroll-behavior는 고무줄 스크롤이 뒤 페이지로
   새는 것 차단. */
.capture-overlay{position:fixed; inset:0; background:var(--capture-bg); z-index:90; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:0 16px 40px; display:flex; flex-direction:column; justify-content:safe center;}
.capture-container{width:100%; max-width:440px; margin:0 auto;}
/* z-index는 시간표 요일 헤더(.tt-head, z-index:4)보다 반드시 높아야 한다. iOS 사파리에서는
   sticky한 .tt-head가 안쪽 .tt-wrap이 아니라 바깥 오버레이를 기준으로 달라붙어서, 이 값이
   낮으면 스크롤할 때 요일 헤더가 "닫기 / 캡처 완료" 버튼 위를 덮어 버튼을 누를 수 없게 된다. */
.capture-topbar{position:sticky; top:0; z-index:12; background:var(--capture-bg); padding:16px 0 12px; margin-bottom:4px;}

.app-version{text-align:center; font-size:9.5px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:.06em; margin:28px 0 2px; opacity:.8;}
/* "꾸밀 위젯 고르기" 아이콘들은 원래 다른 화면(네비바·버튼 등)에서 쓰던 아이콘을 그대로
   가져다 써서 SVG 자체 width/height가 15~21로 제각각이었다 — 아이콘 문자열(ICON.*)은 다른
   곳에서도 쓰이므로 거기를 고치는 대신, 이 그리드 안에서만 강제로 같은 칸에 맞춘다. */
.widget-type-icon{display:flex; align-items:center; justify-content:center; width:20px; height:20px;}
.widget-type-icon svg{width:100%; height:100%;}

// 시간표/학사일정 사진 인식용 Gemini API 키 (학생회 고정 키, 1번 실패 시 2번으로 자동 폴백)
// 사진 인식(Gemini) 키는 Firestore의 shared/geminiKeys 문서에서 실행할 때 읽어온다.
//
// 예전에는 빌드하면서 이 자리에 실제 키를 끼워 넣었다. 저장소가 Public이라 소스에 커밋하면
// GitHub가 구글에 신고해 키가 자동 폐기되는 걸 겪었기 때문인데, 사실 그걸로는 반만 막은

// 그래서 새 키를 발급받아 끼울 때마다 얼마 못 가 또 폐기되는 일이 반복됐다.
//
// 이제 배포물에는 키가 전혀 들어가지 않는다. 키를 갈아끼울 때도 앱을 다시 빌드·배포할
// 필요 없이 MY → "AI 인식 키 관리"(회장급)에서 바꾸면 끝난다.
let GEMINI_KEYS_CACHE = null;
let GEMINI_KEYS_ERROR = '';
async function getGeminiKeys(){
  // 캐시는 키를 실제로 받아왔을 때만 남긴다. 빈 배열([])도 자바스크립트에서는 참이라,
  // 조건을 그냥 GEMINI_KEYS_CACHE로 두면 첫 조회가 실패했을 때 그 빈 값이 계속 재사용돼
  // 회장이 키를 저장한 뒤에도 앱을 껐다 켜기 전까지 "키가 없다"가 반복된다.
  if(GEMINI_KEYS_CACHE && GEMINI_KEYS_CACHE.length) return GEMINI_KEYS_CACHE;
  try{
    const snap = await getDoc(doc(db,'shared','geminiKeys'));
    const list = snap.exists() ? snap.data().keys : null;
    GEMINI_KEYS_CACHE = Array.isArray(list) ? list.map(k=>String(k).trim()).filter(Boolean) : [];
    GEMINI_KEYS_ERROR = snap.exists() ? '' : 'not-found';
  }catch(e){
    // 규칙에 막혔거나(가입 미완료) 네트워크가 끊긴 경우.
    GEMINI_KEYS_CACHE = [];
    GEMINI_KEYS_ERROR = (e && e.code) || 'unknown';
    console.warn('[geminiKeys] 조회 실패', e);
  }
  return GEMINI_KEYS_CACHE;
}
// "키를 분명히 넣었는데 없다고 나온다"에서 원인을 좁히려면 왜 못 읽었는지까지 말해줘야 한다.
function geminiNoKeyMessage(){
  if(GEMINI_KEYS_ERROR === 'permission-denied') return '사진 인식 키를 읽을 권한이 없습니다. 로그인 상태를 확인해주세요.';
  if(GEMINI_KEYS_ERROR === 'not-found') return '사진 인식 키가 아직 등록되지 않았습니다. (MY → AI 인식 키 관리)';
  if(GEMINI_KEYS_ERROR) return '사진 인식 키를 불러오지 못했습니다 (' + GEMINI_KEYS_ERROR + ')';
  return '사진 인식 키가 등록되어 있지 않습니다. 학생회에 문의해주세요.';
}

// 사진 인식 키가 만료·해지되면 구글이 401(UNAUTHENTICATED)을 돌려주는데, 그 영어 원문이 그대로
// 화면에 뜨면 쓰는 사람 입장에서는 뭘 해야 할지 알 수가 없다. 학생이 손쓸 수 없는 오류라서
// "키 문제"라는 것만 알려주고 직접 입력으로 우회할 수 있다고 안내한다.
function geminiError(res, data){
  const err = (data && data.error) || {};
  const msg = err.message || '';
  const code = err.code || (res && res.status) || 0;
  if(code===401 || code===403 || /API key not valid|invalid authentication credentials/i.test(msg)){
    const e = new Error('AI 사진 인식 키가 만료됐어요. 학생회에 알려주시면 교체할게요. (그동안은 직접 입력으로 등록할 수 있어요)');
    e.geminiAuth = true;   // 키가 죽은 거라 다른 키·모델로 다시 시도해도 소용없다
    return e;
  }
  if(code===429 || /quota|RESOURCE_EXHAUSTED/i.test(msg)){
    return new Error('AI 사진 인식 사용량이 잠시 가득 찼어요. 조금 뒤에 다시 시도해주세요.');
  }
  return new Error(msg || 'AI 사진 인식 서버 오류');
}

    { title:'32x32 도트로 직접 그려요', text:'"내 그림"의 + 칸이나 새로 그리기를 누르면 별도 그림판이 열려요. 펜 · 지우개 · 채우기 · 되돌리기와 1~8px 펜 굵기를 지원하고, 그림은 3개까지 보관해요' },

/* ===== 학기(시간표 탭) 관련 헬퍼 ===== */
const SEASON_ORDER = { '봄':0, '여름':1, '가을':2, '겨울':3 };
function seasonForMonth(m){
  if(m>=3 && m<=6) return '봄';
  if(m>=7 && m<=8) return '여름';
  if(m>=9 && m<=12) return '가을';
  return '겨울';
}
function currentSemesterKey(){
  const d = new Date();
  let y = d.getFullYear();
  const m = d.getMonth()+1;
  const season = seasonForMonth(m);
  if(season==='겨울' && m<=2) y -= 1; // 겨울학기는 보통 전년도 12월~다음해 2월
  return `${y}-${season}`;
}
function semesterSortValue(key){
  const [y,season] = key.split('-');
  return (parseInt(y,10)||0)*10 + (SEASON_ORDER[season]!==undefined ? SEASON_ORDER[season] : 0);
}
function semesterLabel(key){
  const [y,season] = (key||'').split('-');
  const seasonLabel = season==='봄' ? '1학기' : season==='가을' ? '2학기' : `${season}학기`;
  return `${y}년 ${seasonLabel}`;
}
function sortedSemesterKeys(){
  return Object.keys(state.timetablesBySemester||{}).sort((a,b)=>semesterSortValue(b)-semesterSortValue(a));
}
// 학기(semKey)가 몇 월 며칠부터 화면에 노출되어야 하는지 규칙. 특정 연도에 종속되지 않고 매년 자동 반복 적용됨.
// 1학기(봄) → 1/25, 여름학기 → 5/1, 2학기(가을) → 7/25, 겨울학기 → 11/1
function semesterRevealDate(key){
  const [yStr, season] = (key||'').split('-');
  const y = parseInt(yStr,10);
  if(!y || !season) return null;
  if(season==='봄')   return new Date(y, 0, 25);   // 1월 25일
  if(season==='여름') return new Date(y, 4, 1);    // 5월 1일
  if(season==='가을') return new Date(y, 6, 25);   // 7월 25일
  if(season==='겨울') return new Date(y, 10, 1);   // 11월 1일
  return null;
}
function isSemesterRevealed(key){
  const d = semesterRevealDate(key);
  if(!d) return true;
  return new Date() >= d;
}
function nextSemesterKey(key){
  const [yStr,season] = key.split('-');
  let y = parseInt(yStr,10);
  const order = ['봄','여름','가을','겨울'];
  let idx = order.indexOf(season);
  idx++;
  if(idx>=order.length){ idx=0; y++; }
  return `${y}-${order[idx]}`;
}
function prevSemesterKey(key){
  const [yStr,season] = key.split('-');
  let y = parseInt(yStr,10);
  const order = ['봄','여름','가을','겨울'];
  let idx = order.indexOf(season);
  idx--;
  if(idx<0){ idx=order.length-1; y--; }
  return `${y}-${order[idx]}`;
}
// 학기 목록 팝업에 쓸, 미래~2021년까지의 전체 학기 키 목록(최신순)
function allBrowsableSemesterKeys(){
  const order = ['겨울','가을','여름','봄'];
  const maxYear = new Date().getFullYear() + 1;
  const list = [];
  for(let y=maxYear; y>=2021; y--){
    order.forEach(season=>list.push(`${y}-${season}`));
  }
  return list;
}
// 한 학기(semKey) 안의 이름 있는 시간표 배열. 예전 형식(단순 배열의 배열)은 자동으로 {name,slots}로 마이그레이션.
function semesterVariants(semKey){
  const raw = (state.timetablesBySemester && state.timetablesBySemester[semKey]) || [];
  return raw.map((v,i)=> (v && typeof v==='object' && !Array.isArray(v)) ? v : { name:`시간표 ${i+1}`, slots: v||[] });
}
// 현재 활성 학기/변형(variant)에 해당하는 수업 배열을 반환. state.timetable은 항상 이 값과 동기화된다.
function activeSemesterSlots(){
  const variants = semesterVariants(state.activeSemester);
  const v = variants[state.activeVariant] || variants[0];
  return v ? v.slots : [];
}
function activeVariantName(){
  const variants = semesterVariants(state.activeSemester);
  const v = variants[state.activeVariant] || variants[0];
  return v ? v.name : '';
}
function syncActiveTimetable(){ state.timetable = activeSemesterSlots(); }

// 대체공휴일 발생 조건 — 관공서의 공휴일에 관한 규정 제3조 그대로.
//   'weekend'(제2항) 토·일과 겹치면 대체. 삼일절·어린이날·석탄일·광복절·개천절·한글날·성탄절.
//   'sunday' (제1항) "다른 공휴일과 겹치는 경우"만. 설날·추석 연휴가 여기 해당.
//            토요일은 법정 공휴일이 아니라 대체가 안 생기고, 일요일은 그 자체가 공휴일이라 생긴다.
//            ★ 설·추석에 토요일 규칙을 잘못 씌우면 2026년 추석(9/26 토)처럼 있지도 않은
//              대체공휴일 9/28을 만들어낸다.
//   false    대체 없음. 신정·현충일·선거일.
function holidayFallbackFor(year){
  const lunar = HOLIDAY_LUNAR_BY_YEAR[year];
  if(!lunar) return [];
  const threeDays = (dateStr)=>{
    const base = parseDateStr(dateStr);
    return [-1,0,1].map(off=>{ const d=new Date(base); d.setDate(d.getDate()+off); return fmtDateStr(d); });
  };
  const base = [
    { date:`${year}-01-01`, sub:false },
    ...threeDays(lunar.seollal).map(date=>({ date, sub:'sunday' })),
    { date:`${year}-03-01`, sub:'weekend' },
    { date:`${year}-05-05`, sub:'weekend' },
    { date:lunar.buddha,    sub:'weekend' },
    { date:`${year}-06-06`, sub:false },
    { date:`${year}-08-15`, sub:'weekend' },
    ...threeDays(lunar.chuseok).map(date=>({ date, sub:'sunday' })),
    { date:`${year}-10-03`, sub:'weekend' },
    { date:`${year}-10-09`, sub:'weekend' },
    { date:`${year}-12-25`, sub:'weekend' },
    ...(HOLIDAY_EXTRA_BY_YEAR[year]||[]).map(date=>({ date, sub:false })),
  ];
  const taken = new Set(base.map(h=>h.date));
  const out = base.map(h=>h.date);
  base.forEach(h=>{
    if(!h.sub) return;
    const dow = parseDateStr(h.date).getDay();
    const triggers = h.sub==='weekend' ? (dow===0||dow===6) : dow===0;
    if(!triggers) return;
    // "그 다음의 첫 번째 비공휴일" — 이미 공휴일인 날과 주말은 건너뛴다.
    const cur = parseDateStr(h.date);
    for(let i=0;i<10;i++){
      cur.setDate(cur.getDate()+1);
      const s = fmtDateStr(cur), d = cur.getDay();
      if(d===0 || d===6 || taken.has(s)) continue;
      taken.add(s); out.push(s); return;
    }
  });
  return out.sort();
}
function parseDateStr(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function fmtDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

const holidaySetCache = {};
function holidaySetFor(year){
  if(!holidaySetCache[year]) holidaySetCache[year] = new Set(holidayFallbackFor(year));
  return holidaySetCache[year];
}
// dateStr은 'YYYY-MM-DD'. Date를 넘겨도 되도록 받아준다.
function toDateStr(v){ return v instanceof Date ? fmtDateStr(v) : String(v); }

// 학사일정에 들어 있는 공휴일(category==='holiday')이 실제로 덮고 있는 기간.
// 학교가 올리는 공식 학사일정은 보통 한 학년도치(8월~다음해 2월 등)만 들어 있어서,
// "이 범위 안"과 "밖"을 구분해야 한다.
function academicHolidayRange(){
  let min = null, max = null;
  live(state.calendar).forEach(ev=>{
    if(ev.category !== 'holiday') return;
    if(min === null || ev.startDate < min) min = ev.startDate;
    if(max === null || ev.endDate > max) max = ev.endDate;
  });
  return (min && max) ? { min, max } : null;
}
function inAcademicHolidayList(s){
  return live(state.calendar).some(ev=>ev.category==='holiday' && ev.startDate<=s && ev.endDate>=s);
}

// 공휴일 판정. 출처가 셋이고, 믿을 수 있는 순서대로 본다:
//
//   1. shared/holidays — 공공데이터포털 특일정보. 임시공휴일까지 나오는 유일한 경로라 최우선.
//   2. 학사일정(category==='holiday') — 학교가 직접 올린 값이라 실제 휴무와 가장 잘 맞는다.
//      ★ 이 범위 안에서는 아래 내장 표를 아예 쓰지 않고 학사일정만 믿는다. 둘을 합치면
//        내장 표의 오차가 그대로 섞여 들어오기 때문. 실제로 내장 표는 2027년 설날을 하루
//        일찍(2/6) 잡고 있었고, 그대로 합쳤다면 2027-02-05(금)이 공휴일로 잡혀 셔틀이
//        멀쩡한 금요일에 운휴로 표시됐을 것이다. 학사일정에는 2/6~2/8 + 대체 2/9로 정확히 들어 있다.
//   3. 내장 표 — 학사일정이 안 덮는 기간(다음 학년도, 방학 전후 등)용 안전망.
function isHolidayDate(v){
  const s = toDateStr(v);
  const year = Number(s.slice(0,4));
  if(!year) return false;

  const fromServer = state.holidays && state.holidays.byYear && state.holidays.byYear[String(year)];
  if(Array.isArray(fromServer) && fromServer.length) return fromServer.includes(s);

  const range = academicHolidayRange();
  if(range && s >= range.min && s <= range.max) return inAcademicHolidayList(s);

  // 학사일정 범위 밖 — 내장 표로 보되, 달력에 따로 적힌 날(재량휴업일 등)도 같이 인정한다.
  return holidaySetFor(year).has(s) || inAcademicHolidayList(s);
}
// 셔틀의 "쉬는 날" — 주말이거나 공휴일.
function isRestDay(v){
  const s = toDateStr(v);
  const dow = parseDateStr(s).getDay();
  if(dow===0 || dow===6) return true;
  return isHolidayDate(s);
}
// 평일 알림을 보내도 되는 날 — 월~금이면서 공휴일이 아닌 날.
function isSchoolWeekday(v){
  const s = toDateStr(v);
  const dow = parseDateStr(s).getDay();
  if(dow===0 || dow===6) return false;
  return !isHolidayDate(s);
}

/* ===== 유틸 ===== */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateStrOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(str, delta){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+delta); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addMonths(ym, delta){ let [y,m]=ym.split('-').map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${pad(m)}`; }
function monthBounds(ym){ const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); return [`${y}-${pad(m)}-01`, `${y}-${pad(m)}-${pad(last)}`]; }
function fmtMonthLabel(ym){ const [y,m]=ym.split('-').map(Number); return `${y}년 ${m}월`; }
function fmtDateLabel(str){ const d=new Date(str+'T00:00:00'); const wd=['일','월','화','수','목','금','토'][d.getDay()]; return `${d.getMonth()+1}월 ${d.getDate()}일 (${wd})`; }
function fmtDateShort(str){ if(!str) return ''; const d=new Date(str.includes('T')?str:str+'T00:00:00'); return `${d.getMonth()+1}.${d.getDate()}`; }
function fmtDateTime(ts){
  if(!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts : (String(ts).includes('T') ? ts : ts + 'T00:00:00'));
  if(isNaN(d.getTime())) return String(ts);
  return `${d.getMonth()+1}.${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function getNearestWeekday(s){ const d=new Date(s+'T00:00:00'); const g=d.getDay(); if(g===6) return addDays(s,2); if(g===0) return addDays(s,1); return s; }
function getWeekMonday(s){ const d=new Date(s+'T00:00:00'); const g=d.getDay(); const diff=d.getDate()-g+(g===0?-6:1); const mon=new Date(d.setDate(diff)); return `${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`; }
function getWeekdayDates(base){ const mon=new Date(getWeekMonday(base)+'T00:00:00'); const w=[]; for(let i=0;i<5;i++){ const c=new Date(mon); c.setDate(mon.getDate()+i); w.push(`${c.getFullYear()}-${pad(c.getMonth()+1)}-${pad(c.getDate())}`);} return w; }
function minutesToLabel(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function todayDayIndex(){ const g=new Date().getDay(); return (g>=1&&g<=5)?g-1:-1; }
function escapeHtml(s){ if(s==null) return ''; return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;'); }
// 공지 등 게시글 본문에 http(s) 링크를 적으면 눌러서 바로 열 수 있게 한다.
// escapeHtml을 먼저 거친 뒤에만 호출해야 안전하다 — URL 문자열 안에는 <,>,"가 나올
// 일이 없어서 이스케이프 이후에도 그대로 매치된다.
function linkifyEscaped(escaped){
  return String(escaped||'').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--teal); text-decoration:underline; word-break:break-all;">$1</a>');
}

function timeInputToMinutes(v){ const m=String(v||'').match(/^(\d{1,2}):(\d{2})$/); if(!m) return NaN; return parseInt(m[1],10)*60+parseInt(m[2],10); }

function renderSegPicker(name, options, value, equal=true, inputId='', slide=false){
  // slide=true: 알약 모양 선택기(.seg-group)로 그려서 선택 칸이 미끄러지고, 선택 안 된 칸은 흐릿한 글자로만 보인다(요일 선택용)
  if(slide){
    const idx = Math.max(0, options.findIndex(([v])=>String(v)===String(value)));
    const btns2 = options.map(([v,label],i)=>`<button type="button" class="seg-opt ${i===idx?'on':''}" data-action="seg-pick" data-value="${escapeHtml(String(v))}">${label}</button>`).join('');
    return `<div class="seg-picker seg-group" data-name="${name}"><span class="seg-thumb" style="--n:${options.length}; --i:${idx};"></span>${btns2}<input type="hidden" name="${name}" ${inputId?`id="${inputId}"`:''} value="${escapeHtml(String(value))}"></div>`;
  }
  const btns = options.map(([v,label])=>`
    <button type="button" class="btn ${String(v)===String(value)?'btn-primary':'btn-ghost'} btn-sm seg-opt"
      data-action="seg-pick" data-value="${escapeHtml(String(v))}"
      style="${equal?'flex:1;':'width:auto;'} padding-left:8px; padding-right:8px; white-space:nowrap;">${label}</button>`).join('');
  return `<div class="seg-picker" data-name="${name}" style="display:flex; gap:5px; ${equal?'':'flex-wrap:wrap;'}">
    ${btns}
    <input type="hidden" name="${name}" ${inputId?`id="${inputId}"`:''} value="${escapeHtml(String(value))}">
  </div>`;
}

// 안드로이드/iOS 시스템 시계 UI(<input type=time>)를 쓰지 않기 위한 자체 제작 시간 선택 위젯.
// 5분 단위 +/- 버튼으로만 조작하며, 실제 값은 name이 그대로인 hidden input에 저장돼
// 기존 FormData 처리 로직(querySelector('[name=...]').value)과 100% 호환된다.
// 화면에는 "오전 9시"처럼 12시간제로 보여주고, 저장값(hidden input)은 계속 24시간 "HH:MM"으로
// 둔다 — 저장·비교·서버 전송이 전부 24시간 기준이라 거기까지 바꾸면 손댈 곳이 확 늘어난다.
function hour24To12(h){ const v = h % 12; return v === 0 ? 12 : v; }
function meridiemLabel(h){ return h >= 12 ? '오후' : '오전'; }
// opts.clamp === false 면 09:00~22:00(TIME_START~TIME_END) 제한을 걸지 않는다.
// 이 제한은 원래 시간표 수업 시간용이라, 아침 7시 알림 같은 걸 09:00으로 끌어올려 버린다.
// 시간 선택기 ▲▼ 한 번 누름(또는 꾹 눌러 반복될 때 한 칸)
function tpStepEl(el){
  const picker = el.closest('.time-picker');
  if(!picker) return;
  const hidden = picker.querySelector('input[type=hidden]');
  const part = el.dataset.part, dir = parseInt(el.dataset.dir, 10);
  let [h, m] = hidden.value.split(':').map(Number);
  if(part==='a'){
    // 오전 ↔ 오후. 위·아래 어느 쪽을 눌러도 두 값뿐이라 똑같이 뒤집는다.
    h = (h + 12) % 24;
  } else if(part==='h'){
    // 화면이 12시간제이므로 1~12 안에서만 돌고, 오전/오후는 여기서 바뀌지 않는다.
    // (24시간으로 그냥 ±1 하면 11시→12시에서 오전이 오후로 넘어가 버린다)
    const isPM = h >= 12;
    const next12 = ((hour24To12(h) - 1 + dir + 12) % 12) + 1;
    h = (next12 % 12) + (isPM ? 12 : 0);
  } else {
    m = (m + dir*5 + 60) % 60;
  }
  hidden.value = `${pad(h)}:${pad(m)}`;
  const ampmEl = picker.querySelector('.tp-val[data-part="a"]');
  if(ampmEl) ampmEl.textContent = meridiemLabel(h);
  picker.querySelector('.tp-val[data-part="h"]').textContent = pad(hour24To12(h));
  picker.querySelector('.tp-val[data-part="m"]').textContent = pad(m);
  try{ el.blur(); }catch(_){}   // 누른 뒤 포커스가 남아 색이 그대로 유지되지 않게
}
// ▲▼를 꾹 누르고 있으면(0.35초 뒤부터) 계속 올라가거나 내려가고, 약 3초에 걸쳐 점점 빨라진다. 오전/오후 버튼은 반복하지 않는다.
if(!window.__tpHoldBound){
  window.__tpHoldBound = true;
  let hold = null;
  const stopHold = ()=>{
    if(!hold) return;
    clearTimeout(hold.t); clearTimeout(hold.r);
    if(hold.active) window.__tpSuppressUntil = Date.now() + 400;   // 꾹 누른 뒤 손을 뗄 때 따라오는 클릭이 한 번 더 바꾸지 않게
    hold = null;
  };
  document.addEventListener('pointerdown', (e)=>{
    const b = e.target.closest && e.target.closest('.tp-btn');
    if(!b || b.dataset.part === 'a') return;
    stopHold();
    const t0 = Date.now();
    hold = { t:null, r:null, active:false };
    const tick = ()=>{
      if(!hold) return;
      tpStepEl(b);
      const prog = Math.min(1, Math.max(0, (Date.now() - t0 - 350) / 3000));
      hold.r = setTimeout(tick, Math.round(170 - 135 * prog));   // 170ms → 35ms
    };
    hold.t = setTimeout(()=>{ if(hold){ hold.active = true; tick(); } }, 350);
  }, true);
  document.addEventListener('pointerup', stopHold, true);
  document.addEventListener('pointercancel', stopHold, true);
  document.addEventListener('visibilitychange', stopHold);
  document.addEventListener('contextmenu', (e)=>{ if(e.target.closest && e.target.closest('.tp-btn')) e.preventDefault(); });
  document.addEventListener('click', (e)=>{
    if(Date.now() < (window.__tpSuppressUntil || 0) && e.target.closest && e.target.closest('.tp-btn')){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}
function renderTimePicker(name, minutes, opts={}){
  const hhmm = opts.clamp === false
    ? `${pad(Math.floor((Number(minutes)||0)/60)%24)}:${pad((Number(minutes)||0)%60)}`
    : minutesToTimeInput(minutes);
  const [hh, mm] = hhmm.split(':');
  const h24 = parseInt(hh, 10);
  return `
    <div class="time-picker" data-name="${name}">
      <div class="tp-col tp-col-ampm">
        <button type="button" class="tp-btn" data-action="tp-step" data-part="a" data-dir="1" aria-label="오전/오후 바꾸기">▲</button>
        <span class="tp-val tp-ampm" data-part="a">${meridiemLabel(h24)}</span>
        <button type="button" class="tp-btn" data-action="tp-step" data-part="a" data-dir="-1" aria-label="오전/오후 바꾸기">▼</button>
      </div>
      <div class="tp-col">
        <button type="button" class="tp-btn" data-action="tp-step" data-part="h" data-dir="1" aria-label="시 증가">▲</button>
        <span class="tp-val" data-part="h">${pad(hour24To12(h24))}</span>
        <button type="button" class="tp-btn" data-action="tp-step" data-part="h" data-dir="-1" aria-label="시 감소">▼</button>
      </div>
      <span class="tp-colon">:</span>
      <div class="tp-col">
        <button type="button" class="tp-btn" data-action="tp-step" data-part="m" data-dir="1" aria-label="분 증가">▲</button>
        <span class="tp-val" data-part="m">${mm}</span>
        <button type="button" class="tp-btn" data-action="tp-step" data-part="m" data-dir="-1" aria-label="분 감소">▼</button>
      </div>
      <input type="hidden" name="${name}" value="${hhmm}">
    </div>`;
}

function currentAdmissionYear2(){
  const now = new Date();

// handleEventSubmit이 시간·장소를 description 맨 앞에 "시간: X"/"장소: Y" 줄로 합쳐서
// 저장한다(별도 필드가 없어서). 수정 화면을 다시 열 때 그 두 줄만 원래 입력칸으로
// 되돌리고, 나머지(사용자가 직접 쓴 메모)만 세부 메모 칸에 남긴다.
function parseEventDetails(description){
  const lines = String(description||'').split('\n');
  let time = '', room = '';
  const rest = [];
  // 개인 일정은 "시간:"/"장소:", 시험 일정은 "시험 시간:"/"시험 장소:"로 접두어가 다르다.
  for(const line of lines){
    const mTime = line.match(/^(?:시험 )?시간: (.*)$/);
    const mRoom = line.match(/^(?:시험 )?장소: (.*)$/);
    const isLinkedClass = /^연동 수업: /.test(line); // linkedClassSubject로 따로 저장되므로 여기선 버린다
    if(mTime && !time) time = mTime[1];
    else if(mRoom && !room) room = mRoom[1];
    else if(!isLinkedClass) rest.push(line);
  }
  return { time, room, description: rest.join('\n').trim() };
}
// forceYear=true(구인글)면 직급과 상관없이 '(22학번)'으로 표시한다 — 동명이인 구분용. 그 밖의 곳은 학생회 등 직급으로 보인다.

function isPollEnded(p){
  if(p.closed) return true;
  const dt=p.endDateTime||p.endDate;
  if(!dt) return false;
  return new Date() > new Date(dt.includes('T')?dt:dt+'T23:59:59');
}
function fmtPollDeadline(p){
  if(p.closed) return '투표 종료됨';
  const dt=p.endDateTime||p.endDate;
  if(!dt) return '마감일 없음';
  if(dt.includes('T')){ const [dp,tp]=dt.split('T'); const [,m,d]=dp.split('-').map(Number); const [hh,mm]=tp.split(':'); return `마감 ${m}월 ${d}일 ${hh}:${mm}`; }
  const [,m,d]=dt.split('-').map(Number); return `마감 ${m}월 ${d}일`;
}
function pollDeadlineSortValue(p){

  if(!dt) return Number.MAX_SAFE_INTEGER;
  const ts = new Date(dt.includes('T')?dt:dt+'T23:59:59').getTime();
  return Number.isFinite(ts) ? ts : Number.MAX_SAFE_INTEGER;
}

// 그냥 "기록 없음"만 띄우면 계정이 이상한 것처럼 보여서, 가입일이라도 대신 보여준다.
function fmtLastSeen(ts){

// 글자만 쓰는 곳(위젯 등)용: 메인*소스 → 메인(소스). 원본 데이터는 그대로 두고 보여 줄 때만 바꾼다
function mealParen(raw){ return raw ? String(raw).replace(/\*([^,·\n]+)/g, '($1)') : raw; }
// 화면용: 항목마다 * 뒤를 괄호로 감싸 작게 보여 준다
function mealTextHtml(str){
  return String(str).split(' · ').map(item=>{
    const i = item.indexOf('*');
    if(i < 0) return escapeHtml(item);
    const main = item.slice(0, i).trim(), side = item.slice(i + 1).trim();
    return side ? `${escapeHtml(main)}<span class="meal-side">(${escapeHtml(side)})</span>` : escapeHtml(main);
  }).join(' · ');
}
function formatMealText(raw){
  if(!raw) return '';
  raw = mealParen(raw);
  return String(raw).split(/\r?\n/).map(l=>l.trim()).filter(Boolean)
    .map(line => line.split(/[,·•]+|\s{2,}/).map(x=>x.trim()).filter(Boolean).join(' · '))
    .join('\n');
}
// 식단 서브카테고리(한식/일품/분식/plus 등)를 대괄호 텍스트 대신 색상 배지로 보여줘서
// 여러 카테고리가 한 끼에 섞여 있어도 한눈에 구분되도록 함
// 홈 화면 미리보기의 중식만 "[plus]" 코너 메뉴를 뺀다 (조식·석식과 학사정보 탭 전체 메뉴는 그대로 보여줌).
function stripPlusMealLines(raw){
  if(!raw) return raw;
  return String(raw).split(/\r?\n/).filter(line => !/^\s*\[[^\]]*plus[^\]]*\]/i.test(line)).join('\n');
}
function mealCatClass(cat){
  if(/한식/.test(cat)) return 'meal-cat-teal';
  if(/일품/.test(cat)) return 'meal-cat-blue';
  if(/분식/.test(cat)) return 'meal-cat-amber';
  if(/plus/i.test(cat)) return 'meal-cat-crimson';
  return 'meal-cat-dim';
}
function mealLineHtml(line){
  const m = line.match(/^\[([^\]]+)\]\s*(.*)$/);
  if(!m) return `<div class="meal-line"><span class="meal-line-text">${mealTextHtml(line)}</span></div>`;
  const cat = m[1].trim();
  const rest = m[2].trim();
  return `<div class="meal-line ${mealCatClass(cat)}"><b class="meal-cat">${escapeHtml(cat)}</b><span class="meal-line-text">${mealTextHtml(rest)}</span></div>`;
}
function formatMealHtml(raw){
  if(!raw) return '';
  return String(raw).split(/\r?\n/).map(l=>l.trim()).filter(Boolean)
    .map(line => line.split(/[,·•]+|\s{2,}/).map(x=>x.trim()).filter(Boolean).join(' · '))
    .map(mealLineHtml).join('');
}
function formatRoomForBlock(roomStr){
  if(!roomStr) return '';
  const str=String(roomStr).trim();
  if(str.includes('\n')) return str.split('\n').map(line=>escapeHtml(line.trim())).join('<br>');
  const m=str.match(/^([가-힣A-Za-z0-9]+관)\s*(.*)$/);
  if(m && m[2]) return `${escapeHtml(m[1])}<br>${escapeHtml(m[2])}`;
  return escapeHtml(str);
}
function validateStudentId(sid){
  if(!sid) return { valid:false, message:'학번을 입력해주세요.' };
  if(!/^\d{10}$/.test(sid)) return { valid:false, message:'학번 10자리를 정확히 입력해주세요.' };

  // 실제 소속 확인은 회원가입 시 학생 명단(로스터) 대조로 처리됨.
  return { valid:true };
}
function parseBuildingAndDetail(fullRoom){

// 학교 수업 시간표는 시작이 거의 항상(약 95%) 정각(00분), 끝은 거의 항상(약 90%) 50분이다. 그래서 인식 결과를 그 틀에 무조건 맞춘다:
// 시작 = 가장 가까운 정각, 끝 = 가장 가까운 정각에서 10분 앞(50분). 끝이 시작보다 이르거나 같으면 시작 + 50분.
// 30분에 시작하거나 끝나는 수업은 없다고 본다: 시작은 항상 정각, 끝은 항상 50분.
function snapClassStart(m){ return Math.round((m - 0.001) / 60) * 60; }
function snapClassEnd(start, rawEnd){
  let e = Math.round(rawEnd / 60) * 60 - 10;
  if(e <= start) e = start + 50;
  return e;
}
function snapToSchoolPeriod(mins){
  const rem = mins % 60;
  if(rem >= 45) return mins + (60 - rem);
  if(rem <= 8) return mins - rem;
  if(Math.abs(rem - 30) <= 8) return mins - rem + 30;
  return mins;
}

/* ===== 저장소 ===== */
function localGet(key, fallback){
  try{
    const v=localStorage.getItem('ku_ise_'+key);
    if(v) return JSON.parse(v);
    const legacy=localStorage.getItem('ku_ies_'+key); // 개명 이전 값 폴백
    return legacy ? JSON.parse(legacy) : fallback;
  }catch(e){ return fallback; }
}
function localSet(key, val){
  try{ localStorage.setItem('ku_ise_'+key, JSON.stringify(val)); }
  catch(e){
    // 저장 공간이 찼으면 지워도 되는 캐시(서버에서 다시 받을 수 있는 것)부터 비우고 한 번 더 시도한다
    try{ clearAppCaches(); localStorage.setItem('ku_ise_'+key, JSON.stringify(val)); }catch(_){}
  }
}
// 캐시로만 쓰는 저장분(공용 문서 사본·친구 시간표 사본). 지워도 서버에서 다시 받으면 되고 로그인·설정에는 영향이 없다.
const CACHE_PREFIXES = ['ku_ise_shared_', 'ku_ise_friend_tt_'];
function cacheKeys(){
  const out = [];
  try{ for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && CACHE_PREFIXES.some(p=>k.startsWith(p))) out.push(k); } }catch(e){}
  return out;
}
function cacheBytes(){
  let n = 0;
  try{ cacheKeys().forEach(k=>{ n += k.length + (localStorage.getItem(k) || '').length; }); }catch(e){}
  return n * 2; // 글자당 2바이트
}
function clearAppCaches(){ cacheKeys().forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); }
// 알아서 정리: 지금 친구가 아니거나 30일 넘게 안 본 친구 시간표 사본은 지운다.
function pruneCaches(){
  try{
    const friendUids = new Set(((state.friendsUI && state.friendsUI.data && state.friendsUI.data.friends) || []).map(f=>f.uid));
    const limit = Date.now() - 30 * 24 * 3600 * 1000;
    cacheKeys().forEach(k=>{
      if(!k.startsWith('ku_ise_friend_tt_')) return;
      const uid = k.slice('ku_ise_friend_tt_'.length);
      let at = 0; try{ at = (JSON.parse(localStorage.getItem(k)) || {}).at || 0; }catch(e){}
      if(at < limit || (friendUids.size && !friendUids.has(uid))) localStorage.removeItem(k);
    });
  }catch(e){}
}

/* ===== 테마(다크/라이트) — 기기 설정을 기본값으로 따르되, 수동으로 강제 지정 가능 ===== */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme==='light' ? 'light' : 'dark');
  // 'only'를 붙여야 안드로이드 Chrome/웹뷰의 "강제 다크모드(색 자동 보정)"가
  // OS 다크 설정과 무관하게 완전히 비활성화된다. 'only' 없이 light/dark만 선언하면
  // 기기가 다크모드일 때 크롬이 라이트 테마 화면을 "다크 지원 안 함"으로 오인해
  // 엘리먼트별로 색을 임의 보정(반전)해버려 검정이 검정이 아니게 되거나
  // 시간표 색상이 깨지는 문제가 생긴다.
  // 먼저 표준 값을 넣고, 그 위에 'only'를 덧씌운다. 'only'를 모르는 구형 엔진은
  // 두 번째 대입을 무시하므로 첫 번째 값이 그대로 남아 최소한의 선언은 유지된다.
  document.documentElement.style.colorScheme = theme==='light' ? 'light' : 'dark';
  document.documentElement.style.colorScheme = theme==='light' ? 'only light' : 'only dark';
  // meta 태그는 삼성 인터넷이 참조하는 값이라 호환성을 위해 'only' 없이 표준 값만 넣는다.
  const csMeta = document.querySelector('meta[name="color-scheme"]');
  if(csMeta) csMeta.setAttribute('content', theme==='light' ? 'light' : 'dark');
  // 상태표시줄(시계·배터리가 있는 최상단 영역)은 테마와 무관하게 크림슨으로 통일.
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', theme==='light' ? '#8C1D2B' : '#A72A3A');
}
function systemPrefersLight(){
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}
// 기기의 다크/라이트 설정을 그대로 따라가면 일부 기기의 웹뷰 "강제 다크모드"와 충돌해
// 시간표 색상 등이 깨지는 문제가 있어, 기본값은 기기 설정과 무관하게 다크로 고정.
// MY 탭 "화면" 설정에서 "기기 설정"을 직접 고르면 그때만 기기 설정을 따라감.
function getThemeOverride(){ return localGet('theme_override', 'dark'); }
function setThemeOverride(v){
  localSet('theme_override', v);
  applyTheme(getTheme());
  renderApp();
}
function getTheme(){
  const ov = getThemeOverride();
  if(ov==='light' || ov==='dark') return ov;
  return systemPrefersLight() ? 'light' : 'dark';
}

/* ===== 글씨 크기 =====
   이 앱은 폰트 크기가 전부 px 하드코딩(인라인 스타일 포함)이라 rem 전환이 현실적이지 않다.
   그래서 루트에 zoom을 걸어 화면 전체를 배율로 확대/축소한다(브라우저 확대와 같은 방식).
   글씨만이 아니라 여백·버튼까지 같이 커지므로 저시력 사용자에게 오히려 유리하다. */
const FONT_SCALES = [['s','작게',0.9], ['m','보통',1], ['l','크게',1.12], ['xl','아주 크게',1.25]];
function getFontScale(){ return localGet('font_scale', 'm'); }
function fontScaleValue(key){ const f = FONT_SCALES.find(s=>s[0]===key); return f ? f[2] : 1; }
// 루트 전체가 아니라 콘텐츠 영역(main/모달)에만 배율을 건다.
// 상단바와 하단 탭바는 배율 밖에 있어 항상 같은 크기로 유지된다.
function applyFontScale(key){
  document.documentElement.style.setProperty('--font-scale', fontScaleValue(key));
}
function setFontScale(key){
  localSet('font_scale', key);
  applyFontScale(key);
  renderApp();
}

applyTheme(getTheme());
applyFontScale(getFontScale());
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
    if(getThemeOverride()==='system'){
      applyTheme(getTheme());
      if(state.user || state.authMode) renderApp();
    }
  });
}

// 공용 문서 캐시: shared/ver 문서 하나에 "문서 이름 → 마지막으로 바뀐 시각"을 적어 두고(쓰는 쪽이 저장할 때 같이 갱신),
// 읽는 쪽은 그 문서 하나만 읽어서 내 폰에 저장해 둔 사본이 최신인지 본다. 같으면 서버에서 문서를 읽지 않고 사본을 쓴다.
// (예전에는 접속할 때·탭을 옮길 때마다 문서를 전부 다시 읽었다.) 값을 못 읽거나 이 문서에 시각이 없으면 예전처럼 읽는다.
let sharedVerPromise = null, sharedVerAt = 0;
let sharedDirty = false; // 이번에 서버에서 문서를 실제로 새로 받았는지(화면을 다시 그릴지 판단용)
function getSharedVers(){
  if(sharedVerPromise && Date.now() - sharedVerAt < 5000) return sharedVerPromise;
  sharedVerAt = Date.now();
  sharedVerPromise = (async()=>{
    try{ const sn = await getDoc(doc(db,'shared','ver')); return sn.exists() ? (sn.data() || {}) : {}; }
    catch(e){ return null; }
  })();
  return sharedVerPromise;
}
const SHARED_NOVER_TTL = 30 * 60 * 1000;
async function loadShared(name, fallback){
  const localVal = localGet('shared_'+name, fallback);
  const cachedRaw = localGet('shared_'+name, null);
  const vers = auth.currentUser ? await getSharedVers() : null;
  const serverVer = vers ? vers[name] : undefined;
  let sawVer = serverVer;
  if(vers && cachedRaw !== null){
    const cachedVer = localGet('shared_ver_'+name, null);
    const fresh = (serverVer !== undefined)
      ? cachedVer === serverVer
      : (Date.now() - localGet('shared_at_'+name, 0) < SHARED_NOVER_TTL);
    if(fresh) return cachedRaw;
  }
  // 로그인 직후(onAuthStateChanged 콜백 안에서) 여러 shared/* 문서를 한꺼번에 Promise.all로
  // 불러오면, 인증 토큰이 아직 Firestore SDK에 완전히 붙기 전이라 이 중 일부가 조용히
  // permission-denied로 실패하는 경우가 있었다(같은 계정으로 새로고침 버튼을 눌러 다시
  // 부르면 그때는 성공 — 딱 그 타이밍 차이). 실패해도 곧바로 캐시로 눙치지 말고, 아주 짧게
  // 한 번 더 시도해서 그 경합을 흡수한다.
  //
  // ★ getDoc이 성공하면 그 결과가 이미 그 문서의 전체 최신 내용이라, 캐시된 local 값과
  // 합칠 이유가 없다 — 예전엔 여기서 항상 mergeLists로 합쳤는데, 그러면 캐시에 남아있는
  // "예전에 다른 id로 만들어졌다가 그 뒤 삭제·재생성된 항목"이 remote가 아무리 깨끗해도
  // 영원히 되살아났다(id가 바뀌면 mergeLists가 "새 항목"으로 보고 그대로 유지하기 때문).
  // 실제로 학사일정을 이 방식 때문에 모든 공식 일정이 2개씩 보이는 문제가 있었다.
  // local은 오직 "이번 시도가 전부 실패했을 때"의 폴백으로만 쓴다.
  for(let attempt=0; attempt<2; attempt++){
    try{
      const snap = await getDoc(doc(db,'shared',name));
      if(snap && snap.exists()){
        const remote = snap.data();
        localSet('shared_'+name, remote);
        localSet('shared_ver_'+name, sawVer === undefined ? null : sawVer);
        localSet('shared_at_'+name, Date.now());
        sharedDirty = true;
        return remote;
      }
      break; // 문서가 진짜 없는 것뿐이면(exists()===false) 재시도해도 의미 없다
    }catch(e){
      console.warn('[load]', name, e && e.code, attempt===0?'(재시도)':'(포기)');
      if(attempt===0) await new Promise(r=>setTimeout(r, 700));
    }
  }
  return localVal;
}

let LAST_SAVE_ERROR = '';
// ===== 저장 대기열: 폰에 먼저 저장해 두고, 서버가 바쁘거나 연결이 끊겨도 나중에 자동으로 다시 올린다 =====
// 내 시간표·메모는 저장할 때 먼저 "저장 대기" 표시(dirty)를 폰에 남기고, 서버가 확인해 주면 지운다. 서버가 바쁘거나(resource-exhausted 등)
// 응답이 오래 안 오거나 앱이 그 사이 꺼져도 표시가 남아 있어서, 다음에 켜거나 연결이 돌아왔을 때 폰에 있는 최신 내용을 서버에 올린다.
let LAST_SAVE_QUEUED = false;
const TRANSIENT_SAVE_ERRORS = ['resource-exhausted','unavailable','deadline-exceeded','aborted','internal','unknown','cancelled'];
function dirtyGet(kind, u){ return localGet('dirty_'+kind+'_'+u, 0); }
function dirtySet(kind, u, v){ localSet('dirty_'+kind+'_'+u, v); }
function withSaveTimeout(promise, ms){
  return new Promise((resolve, reject)=>{
    const t = setTimeout(()=>reject({ code:'deadline-exceeded' }), ms);
    promise.then(v=>{ clearTimeout(t); resolve(v); }, e=>{ clearTimeout(t); reject(e); });
  });
}
let dirtyFlushTimer = null, dirtyFlushing = false, dirtyBackoff = 30000;
function scheduleDirtyFlush(){
  clearTimeout(dirtyFlushTimer);
  dirtyFlushTimer = setTimeout(()=>flushDirtyWrites(true), dirtyBackoff);
}
async function flushDirtyWrites(force){
  if(dirtyFlushing || !state.user || !auth.currentUser) return;
  const u = state.user.uid;
  if(!dirtyGet('tt', u) && !dirtyGet('memos', u)){ dirtyBackoff = 30000; return; }
  dirtyFlushing = true;
  let allOk = true, did = false;
  try{
    if(dirtyGet('tt', u)){
      const local = localGet('tt_'+u, null);
      const at = localGet('tt_at_'+u, now());
      if(local && local.bySemester){
        try{
          // 그 사이 다른 기기에서 더 최근에 저장한 게 서버에 있으면 그쪽을 존중한다(폰의 오래된 내용으로 덮어쓰지 않는다)
          const cur = await withSaveTimeout(getDoc(doc(db,'timetables',u)), 10000);
          if(cur.exists() && (cur.data().updatedAt || 0) > at){ dirtySet('tt', u, 0); localSet('own_sync_tt_'+u, ''); }
          else{
            await withSaveTimeout(setDoc(doc(db,'timetables',u), JSON.parse(JSON.stringify({ bySemester: local.bySemester, activeSemester: local.activeSemester || null, updatedAt: at }))), 12000);
            dirtySet('tt', u, 0); ttVerQueue(); did = true;
          }
        }catch(e){ allOk = false; console.warn('[dirty tt]', e && e.code); }
      } else dirtySet('tt', u, 0);
    }
    if(dirtyGet('memos', u)){
      const byDate = localGet('memos_'+u, null);
      const at = localGet('memos_at_'+u, now());
      if(byDate){
        try{
          const cur = await withSaveTimeout(getDoc(doc(db,'memos',u)), 10000);
          if(cur.exists() && (cur.data().updatedAt || 0) > at){ dirtySet('memos', u, 0); localSet('own_sync_memos_'+u, ''); }
          else{
            await withSaveTimeout(setDoc(doc(db,'memos',u), { byDate, updatedAt: at }), 12000);
            dirtySet('memos', u, 0); did = true;
          }
        }catch(e){ allOk = false; console.warn('[dirty memos]', e && e.code); }
      } else dirtySet('memos', u, 0);
    }
  } finally { dirtyFlushing = false; }
  if(allOk){ dirtyBackoff = 30000; if(did) toast('폰에 저장해 두었던 내용을 서버에 올렸어요'); }
  else { dirtyBackoff = Math.min(dirtyBackoff * 2, 5 * 60 * 1000); scheduleDirtyFlush(); }
}
window.addEventListener('online', ()=>{ dirtyBackoff = 30000; flushDirtyWrites(true); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) flushDirtyWrites(); });
// Firestore는 문서 하나당 1 MiB를 넘길 수 없다. 이 앱은 공지·버그제보 목록을 문서 하나에
// 통째로 넣고 사진도 base64로 함께 저장하므로, 사진이 붙은 글이 몇 개만 쌓여도 한도에 닿는다.
// 한도를 넘으면 Firestore가 알 수 없는 에러로 거절해서 원인을 알기 어렵기 때문에,
// 저장 전에 크기를 재서 사람이 이해할 수 있는 메시지를 보여준다.
const FIRESTORE_DOC_LIMIT = 1048576;
const DOC_SIZE_WARN = Math.floor(FIRESTORE_DOC_LIMIT * 0.9);
function approxDocBytes(data){
  try{ return new Blob([JSON.stringify(data)]).size; }
  catch(e){ try{ return JSON.stringify(data).length; }catch(_){ return 0; } }
}
// 문서를 저장한 뒤 shared/ver에 이 문서의 변경 시각을 남긴다(다른 기기가 사본을 새로 읽어야 한다는 신호). 내 기기 사본은 이미 최신이다.
async function bumpSharedVer(name){
  const ts = Date.now();
  try{
    await setDoc(doc(db,'shared','ver'), { [name]: ts }, { merge:true });
    localSet('shared_ver_'+name, ts); localSet('shared_at_'+name, ts);
    sharedVerPromise = null;
  }catch(e){ console.warn('[shared ver]', name, e && e.code); localSet('shared_ver_'+name, null); }
}
async function saveShared(name, data){
  localSet('shared_'+name, data);
  if(!auth.currentUser){
    LAST_SAVE_ERROR = 'unauthenticated';
    return false;
  }
  const size = approxDocBytes(data);
  if(size > DOC_SIZE_WARN){
    LAST_SAVE_ERROR = 'doc-too-large';
    console.error(`[saveShared] ${name} 문서가 ${Math.round(size/1024)}KB로 한도(1MB)에 근접/초과`);
    return false;
  }
  try{
    await setDoc(doc(db,'shared',name), data);
    await bumpSharedVer(name);
    LAST_SAVE_ERROR = '';
    return true;
  }catch(e){
    LAST_SAVE_ERROR = (e && e.code) || (e && e.message) || 'unknown';
    return false;
  }
}
// 투표·좋아요처럼 여러 사람이 동시에 누르는 동작은, 목록 전체를 불러와 고친 뒤 통째로
// 덮어쓰면 나중에 저장한 사람이 앞선 사람의 결과를 지워버린다(A와 B가 몇 초 안에 투표하면
// 한 명의 표가 사라짐). 트랜잭션 안에서 문서를 다시 읽고 바꾸도록 해서 이를 막는다.
// mutate(list)는 새 배열을 돌려주거나, 바꿀 게 없으면 null을 돌려준다.
async function mutateSharedList(name, field, mutate){
  const ref = doc(db,'shared',name);
  let bumpTs = 0;
  if(!auth.currentUser){ LAST_SAVE_ERROR = 'unauthenticated'; return null; }
  try{
    const result = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ref);
      const cur = (snap.exists() ? snap.data() : {}) || {};
      const list = Array.isArray(cur[field]) ? cur[field] : [];
      const nextList = mutate(list);
      if(!nextList) return null;
      tx.set(ref, { ...cur, [field]: nextList });
      bumpTs = Date.now();
      tx.set(doc(db,'shared','ver'), { [name]: bumpTs }, { merge:true });
      return nextList;
    });
    if(result){
      localSet('shared_'+name, { [field]: result });
      localSet('shared_ver_'+name, bumpTs); localSet('shared_at_'+name, bumpTs); sharedVerPromise = null;
      LAST_SAVE_ERROR = '';
    }
    return result;
  }catch(e){
    LAST_SAVE_ERROR = (e && e.code) || (e && e.message) || 'unknown';
    console.error('[mutateSharedList]', name, e);
    return null;
  }
}

// 삭제 기록 — "누가 · 언제 · 어디서(IP) 뭘 지웠는지" 학생회장이 나중에 확인할 수 있게 남긴다.
// IP는 클라이언트가 외부 서비스(ipify)에 직접 물어본 값이라 조작하려면 얼마든지 가능하다 —
// 서버 없이(Cloud Functions 없이) 만드는 구조상 한계라, 진짜 감사 기록이 아니라 참고용이다.
// 배포할 때마다 build-dist.mjs가 이 자리에 그 빌드의 식별자를 넣고, 같은 값을
// dist/version.json 으로도 함께 내보낸다. 둘을 비교해 새 버전이 떴는지 안다.
// (빌드를 거치지 않은 public/ 원본에는 자리표시자가 그대로 남아 있어서 검사를 건너뛴다)
const BUILD_ID = '__BUILD_ID__';

async function getClientIp(){
  try{
    const res = await fetch('https://api.ipify.org?format=json', { cache:'no-store' });
    if(!res.ok) return '';
    const j = await res.json();
    return j.ip || '';
  }catch(e){ return ''; }
}
async function logAudit(action, itemType, itemTitle){
  try{
    const ip = await getClientIp();
    const entry = {
      id: uid(), ts: now(),
      actorId: (state.user && state.user.studentId) || '',
      actorName: (state.user && state.user.name) || '',
      actorRole: myRole(),
      ip, action, itemType,
      itemTitle: (itemTitle||'').slice(0,100),
    };
    await mutateSharedList('auditLog', 'list', (list)=>[...list, entry].slice(-500));
  }catch(e){ console.warn('[logAudit]', e); }
}

// 삭제된(deleted:true) 글은 tombstone으로 남아있다가 GitHub Actions 크론이 5분마다
// 자동으로 24시간 지난 것들을 정리한다(notify/send-notifications.mjs의 purgeOldTombstones와
// 동일 로직). 그걸 기다리지 않고 학생회장이 그 자리에서 바로 실행하고 싶을 때 쓰는 수동 버튼.
const TOMBSTONE_TTL_MS = 24*60*60*1000;
const TOMBSTONE_DOCS = [
  { name:'notices', field:'list', stateKey:'notices' },
  { name:'polls', field:'list', stateKey:'polls' },
  { name:'suggestions', field:'list', stateKey:'suggestions' },
  { name:'recruitments', field:'list', stateKey:'recruitmentPosts' },
  { name:'bugReports', field:'list', stateKey:'bugReports' },
  { name:'calendarEvents', field:'events', stateKey:'calendar' },
];
async function purgeOldTombstonesNow(){
  const cutoff = Date.now() - TOMBSTONE_TTL_MS;
  let removed = 0;
  for(const {name, field, stateKey} of TOMBSTONE_DOCS){
    try{
      const result = await mutateSharedList(name, field, (cur)=>{
        const kept = cur.filter(it=>{
          if(!it || !it.deleted) return true;
          if(!it.updatedAt) return true; // 삭제 시각을 알 수 없으면 이번엔 건드리지 않음
          return it.updatedAt > cutoff;
        });
        if(kept.length === cur.length) return null; // 지울 게 없으면 저장 자체를 안 함
        removed += cur.length - kept.length;
        return kept;
      });
      if(result) state[stateKey] = result;
    }catch(e){ console.warn('[purge]', name, e); }
  }
  return removed;
}

  const map = {

async function fetchUserDoc(uidStr){
  try{
    const snap = await getDoc(doc(db,'users',uidStr));
    if(snap && snap.exists()){ const u=snap.data(); localSet('user_'+uidStr,u); return u; }
  }catch(e){}
  return null;
}
async function createUserDoc(uidStr, data){
  localSet('user_'+uidStr, data);
  try{ await setDoc(doc(db,'users',uidStr), data, {merge:true}); return true; }
  catch(e){ return false; }
}

// 학생회 이상으로 가입·승급할 때 쓰는 경로. 코드가 맞는지는 클라이언트가 모르고,
// role+roleCode를 함께 써서 Firestore 규칙의 판정을 받는다. 어느 직급의 코드인지
// 알 수 없으므로 높은 권한부터가 아니라 낮은 쪽부터 시도해 통과하는 직급을 찾는다.
// (규칙이 거부하면 permission-denied가 나고, 그 직급은 아닌 것으로 본다)
const ROLE_CODE_CANDIDATES = ['council','president','developer'];
async function createUserDocWithCode(uidStr, baseData, code){
  for(const role of ROLE_CODE_CANDIDATES){
    try{
      await setDoc(doc(db,'users',uidStr), { ...baseData, role, roleCode: code }, {merge:true});
      // 통과했으면 코드 자체는 문서에 남길 필요가 없으니 지운다(직급은 그대로라 규칙 통과).
      await setDoc(doc(db,'users',uidStr), { roleCode: deleteField() }, {merge:true}).catch(()=>{});
      const saved = { ...baseData, role };
      localSet('user_'+uidStr, saved);
      return role;
    }catch(e){ /* 이 직급의 코드가 아님 — 다음 후보로 */ }
  }
  return null;
}

// 개인 일정 판정 — 학생이 학사 달력에서 직접 추가한 일정(개인 일정·시험 일정).
// 학교 공식 학사일정(source:'official')이나 학생회 일정(category:'council')과 구분한다.
// 예전 데이터에는 source가 없을 수 있어서, 그 경우 시험만 개인 일정으로 본다.
function isPersonalEvent(ev){
  if(!ev || ev.category === 'council') return false;
  if(ev.source === 'personal') return true;
  return !ev.source && ev.category === 'exam';
}
function isMyEvent(ev){ return !!(state.user && ev && ev.authorId === state.user.studentId); }
// 화면에 보여도 되는 일정만. 개인 일정은 만든 사람에게만 보인다.
// 일정이 전부 한 문서(shared/calendarEvents)에 들어 있어서, 이걸 안 거치면 달력·위젯·홈
// 어디서든 49명의 개인 일정이 서로에게 그대로 노출된다.
function visibleCalendar(){ return live(state.calendar).filter(ev=>!isPersonalEvent(ev) || isMyEvent(ev)); }

async function loadCalendar(){ return (await loadShared('calendarEvents',{events:[]})).events || []; }
async function saveCalendar(a){ return await saveShared('calendarEvents',{events:a}); }

/* ===== 일정 알림 예약 (notifyQueue) ===== */
// 일정에 "알림 받기"를 켜면 여기 문서가 하나 생기고, Cloudflare Worker가 매분 "발송 시각이 된"
// 문서를 찾아 FCM으로 보낸다. 앱이나 브라우저가 꺼져 있어도 오는 이유가 이것 — 기기 로컬
// 알림이 아니라 서버가 보내는 푸시다.
//
// 왜 일정 문서(shared/calendarEvents) 안에 넣지 않았나:
//   - 일정은 전교생이 공유하는 문서 하나에 다 들어 있어서, 거기에 "누가 알림을 켰는지"를
//     적으면 남의 알림 설정까지 서로 덮어쓰게 된다.
//   - 발송기가 매분 "시각이 된 것"만 뽑아가려면 인덱스 걸린 컬렉션이어야 한다. 배열이 든
//     문서 하나로는 매분 전체를 내려받아 훑는 수밖에 없다.
//
// 문서 id는 (일정 id + 대상)으로 고정한다 — 같은 일정을 여러 번 저장해도 예약이 쌓이지 않고
// 항상 덮어써지므로, 시각을 바꾸면 자동으로 갱신되고 따로 옛 예약을 지울 필요가 없다.
function reminderDocId(eventId, audience){
  if(audience === 'all') return `${eventId}_all`;
  return `${eventId}_${state.user ? state.user.uid : 'anon'}`;
}
async function loadScheduleReminder(eventId){
  if(!state.user || !eventId) return null;
  // 개인 예약을 먼저 보고, 없으면 전체 발송 예약을 본다(공식 일정 수정 화면에서 필요).
  for(const audience of ['self','all']){
    try{
      const snap = await getDoc(doc(db,'notifyQueue', reminderDocId(eventId, audience)));
      if(snap && snap.exists()) return { id: snap.id, ...snap.data() };
    }catch(e){ /* 읽기 권한이 없으면 없는 것으로 본다 */ }
  }
  return null;
}
async function deleteScheduleReminder(eventId){
  if(!state.user || !eventId) return;
  for(const audience of ['self','all']){
    try{ await deleteDoc(doc(db,'notifyQueue', reminderDocId(eventId, audience))); }
    catch(e){ /* 없거나 내 것이 아니면 무시 */ }
  }
}
// fd(FormData)에서 알림 입력값을 읽어 예약을 만들거나 지운다.
// broadcast=true면 전교생 발송(공식 일정에서 학생회가 켠 경우), 아니면 나에게만.
async function syncScheduleReminder(fd, ev, broadcast){
  if(!state.user || !ev || !ev.id) return;
  const on = fd.get('remindOn') === 'on';
  if(!on){ await deleteScheduleReminder(ev.id); return; }
  const dateStr = fd.get('remindDate') || ev.startDate;
  const timeStr = fd.get('remindTime') || '09:00';
  const [h, mi] = String(timeStr).split(':').map(Number);
  const at = parseDateStr(dateStr).setHours(h || 0, mi || 0, 0, 0);
  const audience = broadcast ? 'all' : 'self';
  // 반복 설정. Worker가 발송한 뒤 이 값을 보고 다음 날짜로 스스로 재예약한다.
  const repeatKind = fd.get('remindRepeat') || 'none';
  const repeatDays = String(fd.get('remindDays') || '')
    .split(',').map(s=>parseInt(s,10)).filter(n=>!isNaN(n) && n>=0 && n<=6);
  const repeat = repeatKind === 'weekly'
    ? { kind:'weekly', days: repeatDays.length ? repeatDays : [parseDateStr(dateStr).getDay()] }
    : (repeatKind === 'daily' ? { kind:'daily', days: [] } : { kind:'none', days: [] });
  // 대상이 바뀌었을 수 있으니(개인 → 전체) 반대쪽 예약은 지운다.
  try{ await deleteDoc(doc(db,'notifyQueue', reminderDocId(ev.id, broadcast ? 'self' : 'all'))); }catch(e){}
  try{
    await setDoc(doc(db,'notifyQueue', reminderDocId(ev.id, audience)), {
      uid: state.user.uid,
      audience,
      at,
      title: broadcast ? '학과 일정 알림' : '일정 알림',
      body: `${ev.title}${ev.startDate === dateStr ? ' (오늘)' : ` (${fmtDateLabel(ev.startDate)})`}`,
      category: 'schedule',
      eventId: ev.id,
      repeat,
      // 반복 알림은 매번 시각(at)만 바뀌므로, 원래 몇 시 몇 분에 보내기로 했는지를 따로
      // 들고 있어야 다음 날짜를 계산할 때 그 시각을 그대로 쓸 수 있다.
      repeatTime: timeStr,
      // 시각을 바꿨으면 이미 보낸 예약이어도 다시 보내야 하므로 항상 false로 되돌린다.
      sent: false,
      createdAt: now(),
    });
  }catch(e){ console.warn('[reminder]', e && e.code); }
}

/* ===== 즉시 알림 (notifyQueue, at:지금) =====
   일정 알림과 같은 큐를 쓰지만 "몇 시에 보낼지" 대신 "만들어지자마자 보낸다"는 점이 다르다.
   새 공지·투표·구인글·채팅 메시지가 이걸 쓴다. Cloudflare Worker가 매분 이 큐를 훑으므로
   최대 1분 안에 나간다(이전에는 GitHub Actions가 5분마다 새 글이 있는지 직접 뒤져서
   찾아야 했다 — 그 감지 로직은 이제 여기로 옮겨왔고 Actions 쪽 코드는 지웠다).

   audience별로 필요한 필드가 다르다:
     notice / poll / recruit / bugAlert / councilAlert / councilChat — 그 카테고리
       구독자 전체에게. 카테고리별로 누가 구독했는지는 Worker가 shared/pushAudience에서
       가져다 본다(GitHub Actions가 5분마다 users 전체를 훑어 갱신해두는 값).
     cohortChat — 위와 같지만 그 학번 방 구독자에게만. cohortYear 필드 필요.
     user       — 특정 한 사람에게(친구 채팅). targetUid 필요, gateKey를 주면 그 사람이
                  해당 알림 종류를 켰는지도 Worker가 확인한다.
   실패해도 조용히 넘어간다 — 이건 "더 빨리 오는" 경로일 뿐, 안 되더라도 앱을 열면 최신
   데이터는 어차피 보이므로 사용자가 못 볼 내용은 아니다. */
async function enqueuePush(opts){
  if(!state.user) return;
  try{
    await setDoc(doc(db,'notifyQueue', uid()), {
      uid: state.user.uid,
      audience: opts.audience,
      at: Date.now(),
      title: opts.title,
      body: String(opts.body||'').slice(0,200),
      category: opts.category || opts.audience,
      sent: false,
      createdAt: now(),
      ...(opts.targetUid ? { targetUid: opts.targetUid } : {}),
      ...(opts.gateKey ? { gateKey: opts.gateKey } : {}),
      ...(opts.cohortYear ? { cohortYear: opts.cohortYear } : {}),
      ...(opts.pairId ? { pairId: opts.pairId } : {}),
    });
  }catch(e){ console.warn('[push]', opts.audience, e && e.code); }
}

// 일정 추가·수정 폼 세 곳(개인 일정 / 시험 일정 / 학사일정)이 같이 쓰는 입력 블록.
// 체크를 끄면 날짜·시각·반복 입력을 통째로 감춘다(회색으로 죽여두면 쓰지도 않을 칸이
// 자리만 차지해서 폼이 길어 보인다).
// 반복 요일 표시 순서 — Date.getDay()와 맞춘다(0=일 ... 6=토).
const REMIND_WEEKDAYS = ['일','월','화','수','목','금','토'];
// 상자(display:none ↔ 보임)를 부드럽게 열고 닫는다. 높이 자체를 애니메이션하면 폼 전체가 프레임마다 다시 계산돼서 끊겨 보이므로,
// 열 때는 "늘어난 만큼 시트를 아래에서 위로 미끄러뜨리기"(변환만 쓰므로 GPU가 처리) + 내용 서서히 나타나기, 닫을 때는 서서히 사라진 뒤 감춘다.
// 새 카드가 "뿅" 나타난다: 높이가 부드럽게 열리면서 살짝 커졌다 자리를 잡는다(시간대 추가 등)
function popInEl(el){
  if(!el) return;
  try{
    el.dataset.noAnim = '1';
    const h = el.getBoundingClientRect().height;
    const mb = getComputedStyle(el).marginBottom;
    el.animate([
      { height:'0px', opacity:0, marginBottom:'0px', transform:'scale(.92) translateY(-8px)', overflow:'hidden', offset:0 },
      { opacity:1, transform:'scale(1.025)', overflow:'hidden', offset:.6 },
      { height:h + 'px', opacity:1, marginBottom:mb, transform:'none', overflow:'hidden', offset:1 }
    ], { duration:480, easing:'cubic-bezier(.22,1,.36,1)' });
    el.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }catch(_){}
}
// 카드를 지울 때: 살짝 작아지며 흐려진 뒤 높이가 접히고, 끝나면 done()을 부른다
function popOutEl(el, done){
  try{
    el.dataset.noAnim = '1';
    const h = el.getBoundingClientRect().height;
    const mb = getComputedStyle(el).marginBottom;
    const a = el.animate([
      { height:h + 'px', opacity:1, marginBottom:mb, transform:'none', overflow:'hidden', offset:0 },
      { opacity:0, transform:'scale(.94)', overflow:'hidden', offset:.5 },
      { height:'0px', opacity:0, marginBottom:'0px', transform:'scale(.94)', overflow:'hidden', offset:1 }
    ], { duration:340, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
    a.onfinish = ()=>{ done(); };
  }catch(_){ done(); }
}
function smoothToggleBox(box, show){
  if(!box) return;
  box.dataset.noAnim = '1';   // 공통 높이 애니메이션은 이 상자에는 쓰지 않는다
  try{
    if(show){
      const sheet = box.closest('.modal-sheet');
      const before = sheet ? sheet.getBoundingClientRect().height : 0;
      box.style.display = '';
      const delta = sheet ? sheet.getBoundingClientRect().height - before : 0;
      if(sheet && delta > 0) sheet.animate([{ transform:'translateY(' + delta + 'px)' }, { transform:'translateY(0)' }], { duration:500, easing:'cubic-bezier(.22,1,.36,1)' });
      box.animate([{ opacity:0, transform:'translateY(-12px)' }, { opacity:1, transform:'none' }], { duration:460, delay:70, easing:'cubic-bezier(.22,1,.36,1)', fill:'backwards' });
    } else {
      // 닫을 때: 먼저 위로 살짝 올라가며 흐려지고, 그다음 높이가 부드럽게 접힌다(아래 내용이 툭 끊기지 않고 위로 스르륵 올라온다)
      const h0 = box.getBoundingClientRect().height;
      const fade = box.animate([{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-10px)' }], { duration:200, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
      fade.onfinish = ()=>{
        const col = box.animate([{ height:h0 + 'px', overflow:'hidden' }, { height:'0px', overflow:'hidden' }], { duration:340, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
        col.onfinish = ()=>{ box.style.display = 'none'; try{ col.cancel(); fade.cancel(); }catch(_){} };
      };
    }
  }catch(_){ box.style.display = show ? '' : 'none'; }
}
function reminderFieldsHtml(opts={}){
  const broadcast = !!opts.broadcast;
  const on = !!opts.enabled;
  const dateStr = opts.dateStr || opts.targetDate || todayStr();
  const timeStr = opts.timeStr || '09:00';
  const repeatKind = opts.repeatKind || 'none';
  // 매주를 골랐는데 요일을 하나도 안 고른 상태면 시작 날짜의 요일을 기본으로 켜둔다.
  const repeatDays = (opts.repeatDays && opts.repeatDays.length)
    ? opts.repeatDays
    : [parseDateStr(dateStr).getDay()];
  return `
    <div style="margin:10px 0 0; padding-top:10px; border-top:1px solid var(--border);">
      <div class="row-between" style="gap:10px;">
        <label for="remind-on-check" style="margin:0; cursor:pointer; color:var(--text); font-size:11.5px; display:flex; align-items:center; gap:5px;">${ICON.bell} ${broadcast ? '전체 알림 보내기' : '알림 받기'}</label>
        <label class="switch"><input type="checkbox" name="remindOn" id="remind-on-check" data-action="toggle-remind" ${on?'checked':''}><span class="slider"></span></label>
      </div>
      <div id="remind-fields" style="${on?'':'display:none;'}">

// ===== 날짜별 개인 메모 (과제 정리 등) =====
// 공용 문서(shared/*)가 아니라 memos/{uid}에 사람별로 따로 저장한다. 남에게 보이지 않고,
// Firestore 1MiB 문서 한도도 사람마다 따로 적용돼서 인원이 늘어도 서로 영향을 주지 않는다.
const MEMO_MAX_CHARS = 2000;      // 하루치 메모 길이 제한
const MEMO_DOC_MAX_BYTES = 200000; // 전체 메모 문서 크기 상한 (1MiB 한도 대비 여유 있게)
async function loadMemos(uidStr){
  const localVal = localGet('memos_'+uidStr, null);
  const localAt = localGet('memos_at_'+uidStr, 0);
  if(localVal && ownSyncFresh('memos', uidStr)) return localVal;
  try{
    const snap = await getDoc(doc(db,'memos',uidStr));
    ownSyncMark('memos', uidStr);
    if(snap && snap.exists()){
      const d = snap.data() || {};
      if((d.updatedAt||0) >= localAt){
        const byDate = d.byDate || {};
        localSet('memos_'+uidStr, byDate);
        localSet('memos_at_'+uidStr, d.updatedAt||0);
        return byDate;
      }
    }
  }catch(e){}
  return localVal || {};
}
async function saveMemos(uidStr, byDate){
  const ts = now();
  localSet('memos_'+uidStr, byDate);
  localSet('memos_at_'+uidStr, ts);
  if(!auth.currentUser){ LAST_SAVE_ERROR='unauthenticated'; return false; }
  const payload = { byDate, updatedAt: ts };
  const size = new Blob([JSON.stringify(payload)]).size;
  if(size > MEMO_DOC_MAX_BYTES){
    LAST_SAVE_ERROR='memo-too-large';
    toast('메모가 너무 많아요. 오래된 메모를 정리해주세요');
    return false;
  }
  dirtySet('memos', uidStr, Date.now()); LAST_SAVE_QUEUED = false;
  try{ await withSaveTimeout(setDoc(doc(db,'memos',uidStr), payload), 12000); dirtySet('memos', uidStr, 0); LAST_SAVE_ERROR=''; return true; }
  catch(e){
    LAST_SAVE_ERROR=(e&&e.code)||'unknown'; console.error('메모 저장 실패', e);
    if(TRANSIENT_SAVE_ERRORS.includes(LAST_SAVE_ERROR)){ LAST_SAVE_QUEUED = true; scheduleDirtyFlush(); return true; }
    dirtySet('memos', uidStr, 0);
    return false;
  }
}

// 있어서 일반 학생은 자기 자신을 기록조차 못 했다. 그래서 신입생이 가입해도 목록에 안 뜨고

// users/{uid}가 원래부터 진짜 원본이고(1600행대 주석 참고) 규칙도 학생회 이상에게 전체
// 조회를 허용하므로, 캐시를 거치지 말고 그걸 그대로 읽는다. 쓰기가 없으니 덮어쓸 일도 없다.

let allUsersPromise = null;
// 필요한 순간에만 가입자 전체를 읽는다(가입자 수만큼 읽기가 나간다). 학생 계정은 읽기 권한이 없어 호출해도 읽지 않는다.
async function ensureAllUsers(force){
  if(!isCouncil()) return state.allUsers || {};
  const have = state.allUsers && Object.keys(state.allUsers).length > 0;
  if(have && !force && Date.now() - usersFetchedAt < 30 * 60 * 1000) return state.allUsers;
  if(!allUsersPromise){
    allUsersPromise = loadAllUsersList().then(m=>{ state.allUsers = m; usersFetchedAt = Date.now(); return m; }).finally(()=>{ allUsersPromise = null; });
  }
  return allUsersPromise;
}
async function loadAllUsersList(){
  try{
    const snap = await getDocs(collection(db,'users'));
    const map = {};
    snap.forEach(d=>{
      const v = d.data() || {};
      if(!v.studentId) return;
      map[v.studentId] = {
        uid: d.id,
        name: v.name || '재학생',
        studentId: v.studentId,
        role: v.role || 'student',
        lastSeen: v.lastSeen || 0,
        platform: v.platform || '',
        createdAt: v.createdAt || 0,
        // 앱(APK)으로 접속한 사람만 남는 값. 웹 접속자는 늘 최신 코드를 받으므로 기록하지 않는다.
        // appVersion('Beta 0.3.0')은 0.3.1부터 기록되기 시작해서, 그 전에 마지막으로 접속한
        // 사람은 androidVersionCode(숫자)만 있다.
        androidVersionCode: v.androidVersionCode || 0,
        appVersion: v.appVersion || '',
      };
    });
    localSet('shared_usersList', { map });
    return map;
  }catch(e){
    // 학생 계정은 전체 조회 권한이 없다(정상). 예전에 받아둔 캐시가 있으면 그거라도 쓴다.
    console.warn('[usersList] 조회 실패', e && e.code);
    return (localGet('shared_usersList', {map:{}}) || {}).map || {};
  }
}

function ownSyncDay(){ return new Date(Date.now() + 6 * 3600 * 1000).toISOString().slice(0, 10); }
function ownSyncFresh(kind, uidStr){ return localGet('own_sync_' + kind + '_' + uidStr, '') === ownSyncDay(); }

async function loadTimetable(uidStr){
  const localVal = localGet('tt_'+uidStr, null); // 최신 형식: { bySemester, activeSemester }
  const localAt = localGet('tt_at_'+uidStr, 0);
  if(localVal && localVal.bySemester && ownSyncFresh('tt', uidStr)) return localVal;
  try{
    const snap = await getDoc(doc(db,'timetables',uidStr));
    if(snap && snap.exists()){
      const d = snap.data();
      ownSyncMark('tt', uidStr);
      if(d && (d.updatedAt||0) >= localAt){
        if(d.bySemester){
          localSet('tt_'+uidStr, { bySemester: d.bySemester, activeSemester: d.activeSemester });
          localSet('tt_at_'+uidStr, d.updatedAt||0);
          return { bySemester: d.bySemester, activeSemester: d.activeSemester || sortedKeysOf(d.bySemester)[0] || null };
        } else if(d.classes){
          // 예전(학기 구분 없던) 단일 시간표 → 현재 학기로 1회 마이그레이션
          const key = currentSemesterKey();
          const migrated = { [key]: [{ name:'시간표 1', slots: d.classes }] };
          localSet('tt_'+uidStr, { bySemester: migrated, activeSemester: key });
          localSet('tt_at_'+uidStr, d.updatedAt||0);
          return { bySemester: migrated, activeSemester: key };
        }
      }
    }
  }catch(e){}
  if(localVal && localVal.bySemester) return localVal;
  return { bySemester: {}, activeSemester: null };
}
function sortedKeysOf(map){ return Object.keys(map||{}).sort((a,b)=>semesterSortValue(b)-semesterSortValue(a)); }

async function saveTimetable(uidStr, arr){
  const sem = state.activeSemester || currentSemesterKey();
  state.timetablesBySemester = state.timetablesBySemester || {};
  if(!state.timetablesBySemester[sem]) state.timetablesBySemester[sem] = [];
  // 기존 항목이 예전 형식(순수 배열)이면 {name,slots}로 변환 후 갱신
  const list = state.timetablesBySemester[sem].map((v,i)=> (v && typeof v==='object' && !Array.isArray(v)) ? v : { name:`시간표 ${i+1}`, slots: v||[] });
  const idx = state.activeVariant || 0;
  if(!list[idx]) list[idx] = { name:`시간표 ${idx+1}`, slots: [] };
  list[idx] = { ...list[idx], slots: arr };
  state.timetablesBySemester[sem] = list;
  state.activeSemester = sem;

  const ts=now();
  localSet('tt_'+uidStr, { bySemester: state.timetablesBySemester, activeSemester: sem });
  localSet('tt_at_'+uidStr, ts);
  if(!auth.currentUser){ LAST_SAVE_ERROR='unauthenticated'; return false; }
  // Firestore는 undefined 필드가 섞여 있으면 저장 자체를 거부하므로, JSON 왕복으로 안전하게 정리한다.
  let payload;
  try{ payload = JSON.parse(JSON.stringify({ bySemester: state.timetablesBySemester, activeSemester: sem, updatedAt: ts })); }
  catch(e){ payload = { bySemester: state.timetablesBySemester, activeSemester: sem, updatedAt: ts }; }
  scheduleTimetableReminders(arr);
  pushWidgetData();
  dirtySet('tt', uidStr, Date.now()); LAST_SAVE_QUEUED = false;
  try{ await withSaveTimeout(setDoc(doc(db,'timetables',uidStr), payload), 12000); dirtySet('tt', uidStr, 0); LAST_SAVE_ERROR=''; ttVerQueue(); return true; }
  catch(e){
    LAST_SAVE_ERROR=(e&&e.code)||'unknown'; console.error('시간표 저장 실패', e);
    // 서버가 바쁘거나 연결이 불안정한 경우는 폰에 저장된 상태로 두고 나중에 자동으로 올린다
    if(TRANSIENT_SAVE_ERRORS.includes(LAST_SAVE_ERROR)){ LAST_SAVE_QUEUED = true; scheduleDirtyFlush(); return true; }
    dirtySet('tt', uidStr, 0);
    return false;
  }
}
// 현재 활성 학기/시간표 이름만 바꿔서 저장 (수업 목록은 그대로 유지)
async function renameActiveVariant(uidStr, newName){

  localSet('tt_at_'+uidStr, ts);
  dirtySet('tt', uidStr, Date.now()); LAST_SAVE_QUEUED = false;
  try{ await withSaveTimeout(setDoc(doc(db,'timetables',uidStr), { bySemester: state.timetablesBySemester, activeSemester: sem, updatedAt: ts }), 12000); dirtySet('tt', uidStr, 0); ttVerQueue(); return true; }
  catch(e){ const code=(e&&e.code)||''; if(TRANSIENT_SAVE_ERRORS.includes(code)){ LAST_SAVE_QUEUED = true; scheduleDirtyFlush(); return true; } dirtySet('tt', uidStr, 0); return false; }
}

let booted=false;
setTimeout(()=>{ if(!booted){ booted=true; if(!state.user) renderApp(); } }, 3000);

function boot(){
  state.mealDate = getNearestWeekday(todayStr());
  state.calendarMonth = todayStr().slice(0,7);
  state.selectedExamDate = todayStr();
  state.showCouncilEvents = localGet('cal_show_council', true);
  state.showAcademicEvents = localGet('cal_show_academic', true);
  state.ttOpts = { ...state.ttOpts, ...(localGet('tt_display_opts',{})||{}) };
  state.ttFabDocked = !!localGet('tt_fab_docked', false);
  try{
    onAuthStateChanged(auth, async (fbUser)=>{
      booted = true;
      if(fbUser){
        // 가입 검증(학번·실명·출생연도 대조)이 끝날 때까지 기다린다. 예전에는 이 감지기가
        // 계정이 만들어지자마자 깨어나 학번만 확인하고 프로필을 만들어 로그인시켜 버려서,
        // 명단과 다른 이름으로 가입해도 그대로 들어와졌다(handleSignup이 뒤늦게 계정을
        // 지워도 이미 로그인된 뒤였다). 최대 15초까지만 기다리고, 그 사이 검증에 걸려
        // 계정이 삭제됐다면 여기서 멈춘다(곧 null로 다시 호출된다).
        for(let i=0; signupInProgress && i<150; i++){
          await new Promise(r=>setTimeout(r, 100));
        }
        if(!auth.currentUser) return;
        try{
          // fetchUserDoc은 네트워크/권한 오류가 나면 예외를 삼키고 null을 반환한다.
          // 새 창(예: "전체 가입자 관리")을 열면 Firebase Auth 토큰이 막 초기화되는 순간이라
          // 첫 조회가 일시적으로 실패하는 경우가 있는데, 이걸 "진짜로 프로필이 없는 신규가입자"와
          // 구분하지 못하면 기존 회원의 role/이름을 기본값으로 덮어써버리는 심각한 버그가 생긴다.
          // → 한 번 더 재시도해서 "진짜 없음"과 "일시적 조회 실패"를 구분한다.
          // usersList(전체 가입자 목록)는 udoc 조회 결과와 무관하게 필요하므로, 왕복을 하나
          // 줄이려고 fetchUserDoc과 동시에 요청한다 (예전엔 fetchUserDoc이 끝난 뒤에야 순서대로
          // 요청해서, 로그인할 때마다 매번 왕복 하나만큼 초기 로딩이 더 걸렸다).
          let [udoc, usersList] = await Promise.all([
            fetchUserDoc(fbUser.uid),
            Promise.resolve(cachedUsersMap()),   // 가입자 전체 목록은 로그인 때 읽지 않는다(필요한 화면에서만 읽는다)
          ]);
          if(!udoc){
            await new Promise(r=>setTimeout(r, 700));
            udoc = await fetchUserDoc(fbUser.uid);
          }

          const sid = (udoc && udoc.studentId) || (fbUser.email||'').split('@')[0];
          // usersList는 어디까지나 관리자 화면용 캐시일 뿐, 진짜 원본은 users/{uid} 문서(udoc)다.
          // 캐시가 뭔가 다르다고 원본을 되받아쓰기하면 안 되므로 udoc이 있을 땐 절대 손대지 않고,
          // udoc을 못 찾았을 때의 "복구용 힌트"로만 쓴다.
          let currentRole = (udoc && udoc.role) || (usersList[sid] && usersList[sid].role) || 'student';

          if(!udoc){
            // 재시도까지 실패했다면, 로그아웃 없이 재접속한 경우를 대비해 로컬 캐시부터 확인한다.
            // (예전에 정상적으로 받아온 프로필이 남아있다면 그걸 신뢰하고 절대 초기화하지 않는다.)
            const cachedLocal = localGet('user_'+fbUser.uid, null);
            if(cachedLocal && cachedLocal.studentId){
              udoc = cachedLocal;
              currentRole = cachedLocal.role || currentRole;
            } else {
              const rosterCheck = await loadRoster().catch(()=>({}));
              const rEntry = rosterEntry(rosterCheck[sid]);
              if(Object.keys(rosterCheck).length>0 && !rEntry){
                await signOut(auth).catch(()=>{});
                state.user = null;
                renderApp();
                showAuthError('이 계정은 더 이상 사용할 수 없습니다. 학생회에 문의해주세요.');
                return;
              }
              // 이 시점에서만 정말로 신규 가입자로 간주해 기본 프로필을 만든다.
              // 이름은 지어내지 않고 명단의 실명을 쓴다. 예전처럼 '재학생'으로 만들어두면
              // 아래 이름 대조에서 명단과 달라 그 계정이 영영 로그인되지 않는다.
              const fallbackName = (rEntry && String(rEntry.name).trim()) || '재학생';
              udoc={ studentId:sid, name:fallbackName, role:currentRole, createdAt:now() };
              await createUserDoc(fbUser.uid, udoc);
            }
          } else {
            currentRole = udoc.role || currentRole;
          }

          state.user = {
            uid: fbUser.uid,
            studentId: sid,
            name: udoc.name || '재학생',
            role: ROLES[currentRole] ? currentRole : 'student',
            suspension: udoc.suspension || null,
            warnings: udoc.warnings || [],
          };
          // 알림 목록의 "읽음/지움" 상태를 기기 로컬(localStorage)에만 두면, 앱을 지우고 새로
          // 깔거나 다른 기기로 바꿨을 때 이미 확인한 알림이 다시 나타난다. 로그인할 때
          // 서버(udoc)에 저장된 값과 합쳐서 두 기록 중 더 최근 것을 기준으로 맞춘다.
          mergeNotifFeedStateFromServer(udoc.notifFeedState);
          mergeProfileFromServer(udoc.profile);
          await loadAllData(usersList);
          trackUserPresence(state.user, true);
          ensureStudentDirectoryEntry(); // 친구 찾기(학번 검색)가 되려면 매번 로그인할 때 여기 올라가 있어야 한다
          recordDailyVisit();
          shareSchedule();
          ttVerSchedule();
          setTimeout(()=>flushDirtyWrites(true), 6000);
          setTimeout(pruneCaches, 15000);
          setupPresenceHeartbeat();
          setupTimetableResizeListener();
          startRoleRealtimeListener();
          if(isCouncil()) refreshAdminBadgeCounts().then(refreshBellDot);
          setupForegroundMessageListener();
          // 첫 실행 안내(runNotificationOnboarding)를 아직 안 본 기기에서는 여기서 권한창을 띄우지 않는다.
          // 안내 없이 권한창부터 뜨면 거부당하기 쉽고, 한 번 거부되면 되돌리기 어렵기 때문.
          const np = getNotifyPrefs();
          syncNotifyPrefsToServer(np);
          if(localGet('notif_onboarded', false) && (np.notice || np.poll || np.mealJinri || np.mealMirae)) ensurePushToken();
          scheduleTimetableReminders();
          pushWidgetData();
          setupWidgetDeepLink();
          checkWeeklyAutoMealFetch();
          checkAutoDeptNoticeFetch();
        }catch(err){ console.error('부팅 오류', err); }
        renderApp();
        // 로그인 전에 알림을 눌러서 들어온 경우, 이제 화면이 있으니 미뤄둔 이동을 처리한다.
        if(state.pendingNotifRoute){ const r=state.pendingNotifRoute; state.pendingNotifRoute=null; routeNotificationTap(r.category, r.data); }
        toast(`${state.user.name}님 환영합니다`);
        // 화면이 그려진 뒤에 안내를 띄운다(부팅 중 흰 화면 위에 뜨는 것 방지)
        setTimeout(()=>{ runNotificationOnboarding(); }, 1200);
        setTimeout(()=>{ maybeShowApkInstallPopup(); }, 2200);
        // 웹에서 새 버전으로 처음 들어온 경우에만 패치내역을 한 번 띄운다.
        // APK 설치 안내 팝업과 겹치지 않도록 그보다 늦게 띄우고, 그 팝업이 떠 있으면 건너뛴다.
        setTimeout(()=>{ if(!document.querySelector('.apk-popup-overlay.open')) maybeShowWebPatchNotes(); }, 3400);
      } else {
        state.user = null;
        state.authMode = 'login';
        renderApp();
        if(state.pendingAuthFlash){ showAuthError(state.pendingAuthFlash); state.pendingAuthFlash = null; }
        setTimeout(()=>{ maybeShowApkInstallPopup(); }, 1200);
      }
    });
  }catch(e){ renderApp(); }
}

// 이 기기가 어떤 형태로 앱을 쓰고 있는지. 홈 화면에 설치한 PWA는 브라우저와 화면이

function currentPlatform(){

  const standalone = isStandaloneDisplay();
  if(isIOSDevice()) return standalone ? 'ios-pwa' : 'ios';

let presenceWrittenAt = 0;
async function trackUserPresence(u, force){
