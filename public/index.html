/* ===== 학사 및 시험 일정 ===== */
async function handleEventSubmit(fd){
  const id = (fd.get('itemId') || '').trim();
  const startDate = fd.get('startDate');
  const endDate = fd.get('endDate') || startDate;
  if(endDate < startDate){ toast('종료일은 시작일 이후여야 합니다'); return; }
  const category = fd.get('category') || 'academic';
  const source = fd.get('source') || 'personal';
  const color = fd.get('color') || '';
  let title = (fd.get('title') || '').trim();
  let description = (fd.get('description') || '').trim();

  const eventRoom = (fd.get('event_room') || '').trim();
  const eventTime = (fd.get('event_time') || '').trim();
  const details = [];
  if(eventTime) details.push(`시간: ${eventTime}`);
  if(eventRoom) details.push(`장소: ${eventRoom}`);
  if(description) details.push(description);
  description = details.join('\n');

  const latest = await loadCalendar();
  const existing = latest.find(x => x.id === id);
  const obj = {
    id: id || uid(),
    title,
    startDate,
    endDate,
    category,
    source,
    color,
    description,
    // 수정일 때는 원래 작성자를 유지한다 — 국장 이상은 남의 개인 일정도 지울 수 있어서
    // 수정도 할 수 있는데, 그걸 편집한다고 소유권이 편집자로 넘어가면 안 된다.
    authorId: existing ? existing.authorId : state.user.studentId,
    authorRole: existing ? existing.authorRole : myRole(),
    updatedAt: now()
  };
  const next = existing ? latest.map(x => x.id === obj.id ? { ...x, ...obj } : x) : [...latest, obj];
  const ok = await saveCalendar(next);
  state.calendar = next;
  // 알림 예약은 일정이 실제로 저장된 뒤에만 건다 — 저장이 실패했는데 알림만 남으면
  // 존재하지 않는 일정 알림이 오게 된다.
  // 전교생 발송은 학사일정(official)·학생회 일정처럼 모두가 보는 일정에서만 가능하다.
  if(ok) await syncScheduleReminder(fd, obj, source === 'official' || category === 'council');
  closeModal();
  renderMain();
  saveResultToast(ok, category === 'council' ? '학생회 일정이 등록되었습니다' : '일정이 저장되었습니다');
}

async function deleteEvent(id){
  // 전역 councilOnly 가드에서 뺐으므로 권한 판단을 여기서 한다.
  // 개인 일정은 만든 본인이, 그 외(학사·학생회 일정)는 학생회 이상이 지울 수 있다.
  const target = live(state.calendar).find(x=>x.id===id);
  if(target && !(isMyEvent(target) || isCouncil())){
    toast('이 일정을 지울 권한이 없습니다');
    return;
  }
  if(!await showConfirm('이 일정을 삭제할까요?')) return;
  const latest = await loadCalendar();
  const next = latest.map(x => x.id === id ? { ...x, deleted: true, updatedAt: now() } : x);
  const ok = await saveCalendar(next);
  // 일정이 사라졌으니 걸려 있던 예약 알림도 같이 취소한다.
  if(ok) await deleteScheduleReminder(id);
  state.calendar = next;
  closeModal();
  renderMain();
  saveResultToast(ok, '일정이 삭제되었습니다');
}

/* ===== 공지 ===== */
async function handleNoticeSubmit(fd){
  const id = (fd.get('itemId') || '').trim();
  const title = (fd.get('title') || '').trim();
  const content = (fd.get('content') || '').trim();
  let imageUrls = [];
  try{ imageUrls = JSON.parse(fd.get('imageUrls') || '[]'); }catch(e){ imageUrls = []; }
  if(!Array.isArray(imageUrls)) imageUrls = [];
  imageUrls = imageUrls.slice(0, 3);
  if(!title || !content){ toast('제목과 내용을 모두 입력해주세요'); return; }

  const btn = document.querySelector('#notice-form button[type=submit]');
  if(btn) btn.disabled = true;
  try{
    const latest = await loadNotices();
    let next;
    if(id && latest.some(x => x.id === id)){
      const target = latest.find(x => x.id === id);
      if(!canModify(target)){ return; }
      // 예전 단일 imageUrl 필드는 더 이상 쓰지 않으므로 수정 시 imageUrls로 정리한다.
      next = latest.map(x => x.id === id ? { ...x, title, content, imageUrls, imageUrl:'', androidOnly: isDeveloper() ? fd.get('androidOnly') === 'on' : !!x.androidOnly, updatedAt: now() } : x);
    } else {
      // 이름 비공개는 개발자 전용 — canModify는 authorId로 판단하므로 그건 그대로 두고
      // 화면에 보이는 author/authorRole만 "학생회"로 감춘다.
      const dv = fd.get('displayAs');
      const displayAs = isDeveloper() ? (['developer','real','none'].includes(dv) ? dv : 'council') : '';
      const anonymous = isDeveloper() ? displayAs !== 'real' : (isCouncil() && fd.get('anonymous') === 'on');
      next = [{
        id: id || uid(),
        title,
        content,
        imageUrls,
        author: anonymous ? (displayAs === 'developer' ? '개발자' : (displayAs === 'none' ? '' : '학생회')) : state.user.name,
        authorId: state.user.studentId,
        authorRole: anonymous ? null : myRole(),
        anonymous,
        hideRealName: isDeveloper() && displayAs !== 'real',
        displayAs,
        androidOnly: isDeveloper() && fd.get('androidOnly') === 'on',
        date: todayStr(),
        pinned: false,
        likes: {},
        // 알림은 작성자가 명시적으로 체크했을 때만 발송된다(기본 꺼짐).
        notifyPush: fd.get('sendPush') === 'on' && !(isDeveloper() && fd.get('androidOnly') === 'on'),
        createdAt: now(),
        updatedAt: now()
      }, ...latest];
    }
    const ok = await saveNotices(next);
    state.notices = next;
    closeModal();
    renderMain();
    // 안드로이드 전용 공지는 알림 대상을 플랫폼으로 가를 수 없어서(아이폰 사용자에게도 갈 수 있으므로) 알림을 보내지 않는다.
    const pushed = !id && fd.get('sendPush') === 'on' && !(isDeveloper() && fd.get('androidOnly') === 'on');
    if(ok && pushed){
      enqueuePush({ audience:'notice', title:'새로운 공지가 있어요', body:`제목: ${title}` });
    }
    saveResultToast(ok, pushed ? '공지가 게시되었습니다 (1분 안에 알림이 가요)' : '공지가 게시되었습니다');
  } finally {
    if(btn) btn.disabled = false;
  }
}

async function deleteNotice(id){
  const latest = await loadNotices();
  const target = latest.find(x => x.id === id);
  if(!target || !canModify(target)) return;
  if(!await showConfirm('이 공지를 삭제할까요?')) return;
  const next = latest.map(x => x.id === id ? { ...x, deleted: true, updatedAt: now() } : x);
  const ok = await saveNotices(next);
  state.notices = next;
  renderMain();
  saveResultToast(ok, '공지가 삭제되었습니다');
  logAudit('삭제', '공지', target.title);
}

async function togglePin(id){
  const latest = await loadNotices();
  const target = latest.find(x => x.id === id);
  if(!target || !canModify(target)) return;
  const next = latest.map(n => n.id === id ? { ...n, pinned: !n.pinned, updatedAt: now() } : n);
  const ok = await saveNotices(next);
  state.notices = next;
  renderMain();
}

/* ===== 건의 ===== */
async function handleSuggestionSubmit(fd){
  const content = (fd.get('content') || '').trim();
  if(!content){ toast('건의 내용을 입력해주세요'); return; }
  const entry = {
    id: uid(),
    studentId: state.user.studentId,
    name: state.user.name,
    anonymous: fd.get('anonymous') === 'on',
    content,
    date: todayStr(),
    status: '대기',
    answer: '',
    answerDate: '',
    isPrivate: false,
    likes: {},
    createdAt: now(),
    updatedAt: now()
  };
  // 다른 사람이 거의 같은 순간에 삭제·답변을 저장하면, 그 저장 이후에 이 글만 얹어 다시
  // 쓰지 않는 한 서로의 변경을 덮어써 버린다(예: 삭제 직후 되살아나는 문제) — 그래서 항상
  // "지금 서버에 있는 최신 목록"을 트랜잭션으로 다시 읽어와서 그 위에 얹는다.
  const next = await mutateSharedList('suggestions', 'list', (list)=>[entry, ...list]);
  if(next) state.suggestions = next;
  closeModal();
  renderMain();
  if(next) enqueuePush({ audience:'councilAlert', title:'새 건의사항이 올라왔어요', body:`제목: ${content}` });
  saveResultToast(!!next, '건의사항이 접수되었습니다');
}

// 답변 수정 중에 "이 답변 자체를 취소"할 때 쓴다 — 답변 내용을 지우고 다시 미답변 상태로 되돌린다
// (건의 자체를 지우는 '삭제'와 다르다).
async function cancelSuggestionAnswer(id){
  if(!await showConfirm('등록된 답변을 취소할까요? 다시 미답변 상태로 돌아갑니다.')) return false;
  const latest = await loadSuggestions();
  if(!latest.some(s => s.id === id)) return false;
  const next = latest.map(s => s.id === id ? {
    ...s,
    answer: '',
    isPrivate: false,
    status: '대기',
    answerDate: '',
    answeredBy: '',
    answeredRole: '',
    updatedAt: now()
  } : s);
  const ok = await saveSuggestions(next);
  state.suggestions = next;
  closeModal();
  renderMain();
  saveResultToast(ok, '답변을 취소했습니다');
  return ok;
}
async function handleReplySubmit(fd){
  const id = (fd.get('itemId') || '').trim();
  const answer = (fd.get('answer') || '').trim();
  const isPrivate = fd.get('isPrivate') === 'on';
  if(!answer){ toast('답변 내용을 입력해주세요'); return; }
  const btn = document.querySelector('#reply-form button[type=submit]');
  if(btn) btn.disabled = true;
  try{
    const next = await mutateSharedList('suggestions', 'list', (list)=>{
      if(!list.some(s => s.id === id)) return null;
      return list.map(s => s.id === id ? {
        ...s,
        answer,
        isPrivate,
        status: '답변완료',
        answerDate: todayStr(),
        answeredBy: state.user.name,
        answeredRole: myRole(),
        updatedAt: now()
      } : s);
    });
    if(!next) return;
    state.suggestions = next;
    closeModal();
    renderMain();
    // 건의사항 답변은 게시판 전체가 아니라 글쓴이 본인에게만 간다. studentId로만 알고 있어서
    // uid가 필요한 notifyQueue에는 state.allUsers에서 찾아 넘긴다 — 탈퇴 등으로 명단에
    // 없으면(못 찾으면) 조용히 건너뛴다.
    const answered = next.find(s => s.id === id);
    await ensureAllUsers();
    const authorUid = answered && ((state.allUsers||{})[answered.studentId]||{}).uid;
    if(authorUid && answered.studentId !== state.user.studentId){
      enqueuePush({ audience:'user', gateKey:null, targetUid:authorUid, title:'건의사항에 답변이 달렸어요', body:answer, category:'suggestion' });
    }
    saveResultToast(true, '답변이 등록되었습니다');
  } finally {
    if(btn) btn.disabled = false;
  }
}

async function deleteSuggestion(id){
  const latest = await loadSuggestions();
  const target = latest.find(s => s.id === id);
  if(!target) return;
  if(!isCouncil() && target.studentId !== state.user.studentId) return;
  if(!await showConfirm('이 건의사항을 삭제할까요?')) return;
  // 트랜잭션으로 다시 최신 목록을 읽어와서 지운다 — 그 사이 누가 답변을 남기는 등 다른
  // 저장을 했어도 그 변경을 덮어쓰지 않고 그 위에 삭제 표시만 얹는다(삭제가 도로 살아나는
  // 문제 방지).
  const next = await mutateSharedList('suggestions', 'list', (list)=>
    list.map(x => x.id === id ? { ...x, deleted: true, updatedAt: now() } : x)
  );
  if(next) state.suggestions = next;
  renderMain();
  saveResultToast(!!next, '삭제되었습니다');
  logAudit('삭제', '건의사항', target.title || target.content);
}

/* ===== 구인글 ===== */
async function handleRecruitmentSubmit(fd){
  const id = (fd.get('itemId') || '').trim();
  const title = (fd.get('title') || '').trim();
  const content = (fd.get('content') || '').trim();
  const closed = fd.get('closed') === 'on';
  const pollEnabled = fd.get('pollEnabled') === 'on';
  const expireHours = parseInt(fd.get('expireHours') || '24', 10);
  if(!title || !content){ toast('제목과 내용을 입력해주세요'); return; }
  const latest = await loadRecruitments();
  let next;
  if(id && latest.some(r => r.id === id)){
    // 이미 투표에 참여한 사람이 있으면(votes), 수정 중에도 그 응답을 그대로 유지한다 —
    // 체크박스를 껐다 켠다고 그동안 모인 응답이 날아가면 안 되므로.
    next = latest.map(r => r.id === id ? {
      ...r, title, content, closed, expireHours, updatedAt: now(),
      poll: { enabled: pollEnabled, votes: (r.poll && r.poll.votes) || {} },
    } : r);
  } else {
    next = [{
      id: uid(),
      title,
      content,
      closed,
      expireHours,
      poll: { enabled: pollEnabled, votes: {} },
      authorName: state.user.name,
      authorId: state.user.studentId,
      authorRole: myRole(),
      date: todayStr(),
      likes: {},
      createdAt: now(),
      updatedAt: now()
    }, ...latest];
  }
  const isNew = !(id && latest.some(r => r.id === id));
  const ok = await saveRecruitments(next);
  state.recruitmentPosts = next;
  closeModal();
  renderMain();
  // 구인글은 공지·투표와 달리 작성자가 켜는 스위치가 없다 — 받는 쪽 알림 설정
  // (notif_recruit, 기본 꺼짐)이 원하는 사람만 받게 걸러준다.
  if(ok && isNew){
    enqueuePush({ audience:'recruit', title:'새 구인글이 올라왔어요', body:`제목: ${title}` });
  }
  saveResultToast(ok, '구인글이 저장되었습니다');
}

async function deleteRecruitment(id){
  const latest = await loadRecruitments();
  const target = latest.find(r => r.id === id);
  if(!target) return;
  const mine = state.user && target.authorId === state.user.studentId;
  if(!mine && myLevel() < 3) return;
  if(!await showConfirm('이 구인글을 삭제할까요?')) return;
  const next = latest.map(r => r.id === id ? { ...r, deleted: true, updatedAt: now() } : r);
  const ok = await saveRecruitments(next);
  state.recruitmentPosts = next;
  renderMain();
  saveResultToast(ok, '구인글이 삭제되었습니다');
  logAudit('삭제', '구인글', target.title);
}

/* ===== 학생회 게시판 ===== */
/* ===== 투표 ===== */
async function handlePollSubmit(fd){
  const question = (fd.get('question') || '').trim();
  const options = fd.getAll('option').map(v => String(v || '').trim()).filter(Boolean);
  const unique = [...new Set(options)];
  if(!question || unique.length < 2){ toast('질문과 서로 다른 선택지를 2개 이상 입력해주세요'); return; }
  const deadlineOn = document.getElementById('poll-deadline-check')?.checked;
  const endDateTime = deadlineOn ? `${fd.get('poll_deadline_date')}T${fd.get('poll_deadline_time')}` : '';
  const latest = await loadPolls();
  const next = [{
    id: uid(),
    question,
    options: unique,
    multi: fd.get('multi') === 'on',
    endDateTime,
    endDate: endDateTime ? endDateTime.slice(0, 10) : '',
    votes: {},
    createdBy: state.user.name,
    createdById: state.user.studentId,
    authorRole: myRole(),
    createdDate: todayStr(),
    closed: false,
    // 공지와 동일하게, 작성자가 체크했을 때만 알림이 나간다(기본 꺼짐).
    // 이 값이 false면 시작·마감임박·저녁 리마인더 알림 모두 이 투표를 건너뛴다.
    notifyPush: fd.get('sendPush') === 'on',
    updatedAt: now()
  }, ...latest];
  const ok = await savePolls(next);
  state.polls = next;
  closeModal();
  renderMain();
  const pushed = fd.get('sendPush') === 'on';
  if(ok && pushed){
    enqueuePush({ audience:'poll', title:'새 투표가 시작됐어요', body:`제목: ${question}` });
  }
  saveResultToast(ok, pushed ? '투표가 게시되었습니다 (1분 안에 알림이 가요)' : '투표가 게시되었습니다');
}

async function handlePollVoteSubmit(fd){
  const pollId = fd.get('pollId');
  const selected = fd.getAll('opt').map(v => parseInt(v, 10)).filter(n => !isNaN(n));
  const latest = await loadPolls();
  const poll = latest.find(p => p.id === pollId);
  if(!poll || isPollEnded(poll)) return;
  const sid = state.user.studentId;
  const isModify = !!(poll.votes && poll.votes[sid]);

  if(selected.length === 0){
    if(isModify){
      await cancelPollVote(pollId);
      return;
    } else {
      toast('선택지를 1개 이상 골라주세요');
      return;
    }
  }

  // 동시에 투표한 다른 사람의 표가 지워지지 않도록 트랜잭션 안에서 다시 읽고 기록한다.
  const next = await mutateSharedList('polls', 'list', (cur)=>{
    const target = cur.find(p => p && p.id === pollId);
    if(!target || isPollEnded(target)) return null;
    const votes = {
      ...(target.votes || {}),
      [sid]: { selected, name: state.user.name, studentId: sid, votedAt: new Date().toISOString() }
    };
    return cur.map(p => p.id === pollId ? { ...p, votes, updatedAt: now() } : p);
  });
  if(!next){ saveResultToast(false); return; }
  state.polls = next;
  state.editingPollVoteId = null;
  renderMain();
  saveResultToast(true, isModify ? '투표가 변경되었습니다' : '투표가 완료되었습니다');
}

async function cancelPollVote(pollId){
  const sid = state.user.studentId;
  const next = await mutateSharedList('polls', 'list', (cur)=>{
    const target = cur.find(p => p && p.id === pollId);
    if(!target || isPollEnded(target)) return null;
    const votes = { ...(target.votes || {}) };
    delete votes[sid];
    return cur.map(p => p.id === pollId ? { ...p, votes, updatedAt: now() } : p);
  });
  if(!next){ saveResultToast(false); return; }
  state.polls = next;
  state.editingPollVoteId = null;
  renderMain();
  saveResultToast(true, '투표가 취소되었습니다');
}

async function closePollNow(pollId){
  if(!await showConfirm('지금 즉시 이 투표를 종료할까요?')) return;

async function reopenPoll(pollId){

/* ===== 계정/로스터 ===== */
async function handleChangePasswordSubmit(fd){
  const cur = fd.get('currentPassword');
  const np = fd.get('newPassword');
  const np2 = fd.get('newPassword2');
  if(np.length < 6){ toast('새 비밀번호는 6자 이상이어야 합니다'); return; }
  if(np !== np2){ toast('새 비밀번호가 일치하지 않습니다'); return; }
  const btn = document.querySelector('#change-password-form button[type=submit]');
  if(btn) btn.disabled = true;
  try{
    const user = auth.currentUser;
    if(!user) return;
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, cur));
    await updatePassword(user, np);
    closeModal();
    toast('비밀번호가 변경되었습니다');
  }catch(err){
    if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') toast('현재 비밀번호가 올바르지 않습니다');
    else toast('비밀번호 변경 실패');
  }finally{
    if(btn) btn.disabled = false;
  }
}

function kickMemberModal(sid, name){
  return `
    <div class="modal-handle"></div>
    <div class="modal-title">회원 탈퇴 처리<button data-action="close-modal">${ICON.close}</button></div>
    <p style="font-size:11.5px; color:var(--text-dim); margin:0 0 14px; line-height:1.6;">
      <b style="color:var(--danger)">${escapeHtml(name)}(${escapeHtml(sid)})</b>님을 탈퇴 처리할까요?<br>
      이 학생의 프로필·시간표 정보가 삭제되고 학생 명단에서도 제외되어, 이후에는 재로그인해도 이용할 수 없습니다.<br>
      본인 확인을 위해 <b>학생회장 본인의 비밀번호</b>를 입력해주세요.
    </p>

      <input type="hidden" name="targetSid" value="${escapeHtml(sid)}">
      <div class="field"><label>내 비밀번호</label><input type="password" name="password" required placeholder="본인 비밀번호"></div>
      <div class="modal-actions"><button type="submit" class="btn btn-danger">탈퇴 처리</button></div>
    </form>`;

async function handleKickMemberSubmit(fd){
  const targetSid = fd.get('targetSid');
  const password = fd.get('password');
  if(!password){ toast('비밀번호를 입력해주세요'); return; }
  const btn = document.querySelector('#kick-member-form button[type=submit]');
  if(btn) btn.disabled = true;
  // 본인 확인과 그 뒤의 삭제를 따로 감싼다. 예전에는 하나로 묶여 있어서 권한 문제로
  // 삭제가 실패해도 "비밀번호가 올바르지 않습니다"가 떠서 원인을 알 수가 없었다.
  try{
    const user = auth.currentUser;
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, password));
  }catch(err){
    toast('비밀번호가 올바르지 않습니다');
    if(btn) btn.disabled = false;
    return;
  }

  try{
    const allUsers = await loadAllUsersList().catch(()=>({}));
    const target = allUsers[targetSid];
    if(target && target.uid){
      await deleteDoc(doc(db,'timetables',target.uid)).catch(()=>{});
      await deleteDoc(doc(db,'userMeta',target.uid)).catch(()=>{});
      // users/{uid}가 목록의 원본이라 이게 지워져야 실제로 빠진다. 실패를 삼키면 화면에서만
      // 사라지고 다음 새로고침 때 되살아나므로, 여기서는 오류를 그대로 올려보낸다.
      await deleteDoc(doc(db,'users',target.uid));

      // Firebase Auth 계정은 클라이언트가 남의 것을 지울 수 없다(Admin SDK만 가능).
      // 대기열에 넣어두면 서버 작업이 약 5분 안에 대신 지운다. 그때까지도 명단·프로필이
      // 없어서 로그인은 이미 막힌 상태다.
      await mutateSharedList('pendingAuthDeletes', 'list', (list)=>[
        ...list.filter(x=>x && x.uid !== target.uid),
        { uid: target.uid, studentId: targetSid, name: target.name || '', ts: now() },
      ].slice(-200));
    }
    delete allUsers[targetSid];
    state.allUsers = allUsers;

    const roster = await loadRoster().catch(()=>({}));
    if(roster[targetSid]){ delete roster[targetSid]; await saveRoster(roster); state.roster = roster; }

    logAudit('탈퇴', '계정', `${(target && target.name) || ''} (${targetSid})`);
    closeModal();
    toast('탈퇴 처리되었습니다 · 로그인 계정은 약 5분 안에 삭제돼요');
    openModal(usersListModal());
  }catch(err){
    console.error('[kick]', err);
    toast('탈퇴 처리에 실패했습니다 (' + ((err && err.code) || '알 수 없음') + ')');
  }finally{
    if(btn) btn.disabled = false;
  }
}

// 1년 이상 미접속으로 자동 잠긴(withdrawn) 계정을 다시 풀어준다. 클라이언트는 Firebase Auth
// 계정을 남 대신 못 풀어서(Admin SDK 전용), pendingAuthDeletes와 같은 방식으로 대기열에
// 넣어두면 서버(notify 크론)가 몇 분 안에 대신 처리한다. 정보는 애초에 안 지웠으니 그대로 남는다.
async function reactivateUser(uid, sid, name){
  if(!isPresident()){ toast('학생회장만 할 수 있어요'); return; }
  if(!uid){ toast('대상을 찾을 수 없어요'); return; }
  if(!await showConfirm(`${name||sid}님의 계정 잠금을 해제할까요?`, {danger:false, okLabel:'해제 신청'})) return;
  try{
    await mutateSharedList('pendingAuthReactivations', 'list', (list)=>[
      ...list.filter(x=>x && x.uid !== uid),
      { uid, studentId: sid, name: name||'', ts: now() },
    ].slice(-200));
    toast('잠금 해제를 신청했어요. 몇 분 안에 반영돼요.');
  }catch(e){
    console.error('[reactivateUser]', e);
    toast('신청에 실패했어요');
  }
}

async function handleDeleteAccountSubmit(fd){
  const password = fd.get('password');
  if(!password){ toast('비밀번호를 입력해주세요'); return; }
  const btn = document.querySelector('#delete-account-form button[type=submit]');
  if(btn) btn.disabled = true;
  // 본인 확인과 그 뒤의 삭제를 따로 감싼다. 예전에는 하나로 묶여 있어서 users 문서 삭제가
  // 권한 문제로 실패해도(.catch로 삼켜짐) "비밀번호가 올바르지 않습니다"만 뜨고, Auth 계정만
  // 지워진 채 Firestore에 유령 프로필이 남았다. 이제 users 문서 삭제 실패는 그대로 올려보내
  // Auth 계정을 지우기 전에 멈춘다(둘 다 지워지거나, 둘 다 남거나).
  const user = auth.currentUser;

  try{

    // "친구 추가" 검색이 되는 유령 학번 문제가 생긴다.
    await deleteDoc(doc(db, 'studentDirectory', uidStr)).catch(() => {});
    await deleteDoc(doc(db, 'users', uidStr));

    closeModal();

    toast('탈퇴 처리에 실패했습니다 (' + ((err && err.code) || '알 수 없음') + ')');
  }finally{
    if(btn) btn.disabled = false;
  }
}

async function handleRosterSubmit(fd){
  const text = fd.get('rosterText') || '';
  const map = {};
  text.split('\n').forEach(line => {
    line = line.trim();
    if(!line) return;
    const parts = line.includes(',') ? line.split(',') : line.split(/\s+/);
    if(parts.length >= 2){
      const sid = parts[0].trim();
      const nm = parts[1].trim();
      const by = (parts[2]||'').trim();
      if(sid && nm) map[sid] = by ? { name: nm, birthYear: by } : { name: nm };
    }
  });
  const ok = await saveRoster(map);
  state.roster = map;
  closeModal();
  saveResultToast(ok, `학생 명단 ${Object.keys(map).length}명이 저장되었습니다`);
}

async function handleGeminiKeysSubmit(fd){
  const keys = String(fd.get('keysText')||'')
    .split('\n').map(k=>k.trim()).filter(Boolean);
  let ok = false;
  LAST_SAVE_ERROR = '';
  try{
    // saveShared를 쓰지 않는 이유: 그쪽은 값을 localStorage에도 캐시하는데, 키를 브라우저
    // 저장소에까지 남길 이유가 없다. 여기서는 메모리 캐시만 갱신한다.
    await setDoc(doc(db,'shared','geminiKeys'), { keys });
    GEMINI_KEYS_CACHE = keys;
    GEMINI_KEYS_ERROR = '';
    ok = true;
  }catch(e){

    LAST_SAVE_ERROR = (e && e.code) || 'unknown';

/* ===== 게시판 전체 삭제 (상위 직급 글 보호 & 종료된 투표만 삭제) ===== */
async function clearAllBoard(type){
  if(myLevel() < 2) return;
  const nameMap = { notice: '공지사항', suggestion: '건의사항', recruitment: '구인글', poll: '종료된 투표' };
  if(!await showConfirm(`[확인] 삭제 가능한 모든 ${nameMap[type]}을(를) 삭제하시겠습니까?\n(상위 직급이 작성한 글은 유지됩니다)`)) return;

  let beforeCount = 0;
  let remaining = [];

  if(type === 'notice'){
    const list = await loadNotices();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'council') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveNotices(remaining);
    state.notices = remaining;
  }
  else if(type === 'suggestion'){
    const list = await loadSuggestions();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'student') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveSuggestions(remaining);
    state.suggestions = remaining;
  }
  else if(type === 'recruitment'){
    const list = await loadRecruitments();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'student') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveRecruitments(remaining);
    state.recruitmentPosts = remaining;
  }
  else if(type === 'poll'){
    const list = await loadPolls();
    const endedList = live(list).filter(p => isPollEnded(p));
    beforeCount = endedList.length;
    if(beforeCount === 0){
      toast('삭제할 수 있는 종료된 투표가 없습니다');
      return;
    }
    remaining = list.map(p => {
      if(p.deleted) return p;
      if(!isPollEnded(p)) return p;
      if(roleLevel(p.authorRole || 'council') > myLevel()) return p;
      return { ...p, deleted: true, updatedAt: now() };
    });
    await savePolls(remaining);
    state.polls = remaining;
  }

  renderMain();
  const afterCount = (type === 'poll') ? live(remaining).filter(p => isPollEnded(p)).length : live(remaining).length;
  const deletedCount = beforeCount - afterCount;

  if(afterCount > 0){
    toast(`${deletedCount}개 삭제 완료 (상위 직급 항목 ${afterCount}개 제외)`);
  } else {
    toast(`${nameMap[type]} 전체 삭제가 완료되었습니다`);
  }
  if(deletedCount > 0) logAudit('전체 삭제', nameMap[type], `${deletedCount}개`);
}

        s.classList.remove('selected'); s.innerHTML = (s.dataset.action === 'toggle-inline-color') ? '+' : '';
        if(s.dataset.action === 'toggle-inline-color') s.style.background = 'var(--surface-2)';
      });
      el.classList.add('selected'); el.innerHTML = '✓';
      const inp = document.getElementById('schedule-color-input');
      if(inp) inp.value = el.dataset.hex;
    }
    else if(a === 'pick-text-color'){
      document.querySelectorAll('#class-text-swatches-wrap .text-swatch').forEach(s => { s.classList.remove('selected'); s.innerHTML = (s.dataset.action === 'toggle-inline-color') ? '+' : ''; });
      el.classList.add('selected'); el.innerHTML = '✓';
      const inp = document.getElementById('class-text-color-input');
      if(inp) inp.value = el.dataset.color;
    }
    else if(a==='del-slot'){
      const idx=parseInt(el.dataset.idx,10);
      const c=document.getElementById('slots-container');
      if(!c) return;
      const slots=readCurrentFormSlots();
      if(slots.length<=1){ toast('최소 1개 이상의 시간대가 필요합니다'); return; }
      slots.splice(idx,1);
      const rerender = ()=>{ c.innerHTML = slots.map((s,i)=>renderSlotHtml(s,i,slots.length)).join(''); };
      const card = el.closest('.slot-item-card');
      if(card) popOutEl(card, rerender); else rerender();
    }
    else if(a==='cal-month-prev'){ state.calendarMonth=addMonths(state.calendarMonth,-1); renderMain(); }
    else if(a==='cal-month-next'){ state.calendarMonth=addMonths(state.calendarMonth,1); renderMain(); }
    else if(a==='toggle-council-filter'){
      state.showCouncilEvents = !state.showCouncilEvents;
      localSet('cal_show_council', state.showCouncilEvents);
      renderMain();
      toast(state.showCouncilEvents ? '학생회 일정이 표시됩니다' : '학생회 일정이 숨겨졌습니다');
    }
    else if(a==='toggle-academic-filter'){
      state.showAcademicEvents = !state.showAcademicEvents;
      localSet('cal_show_academic', state.showAcademicEvents);
      renderMain();
      toast(state.showAcademicEvents ? '학사일정이 표시됩니다' : '학사일정이 숨겨졌습니다');
    }
    else if(a==='select-exam-date'){
      state.selectedExamDate = el.dataset.date;
      renderMain();
    }
    else if(a==='add-event'){ openModal(eventModal(null, null)); }
    // "알림 받기" 스위치 — 꺼져 있으면 날짜·시각 입력을 아예 감춘다.
    // (회색으로 죽여두면 쓰지도 않을 입력칸이 자리만 차지해서 폼이 길어 보인다)
    else if(a==='toggle-remind'){
      smoothToggleBox(document.getElementById('remind-fields'), el.checked);
    }
    // 일정 목록 항목의 시간·장소·메모를 접었다 펴는 토글. 눌러서 펼치면 그 안에
    // 수정·삭제 버튼도 같이 나온다.
    else if(a==='toggle-event-detail'){
      const id = el.dataset.id;
      const box = document.getElementById('ev-detail-'+id);
      const chev = document.getElementById('ev-chev-'+id);
      if(!box) return;
      const open = box.style.display === 'none';
      box.style.display = open ? '' : 'none';
      if(chev) chev.style.transform = open ? 'rotate(90deg)' : '';
    }
    else if(a==='edit-personal-event'){
      const ev = live(state.calendar).find(x=>x.id===el.dataset.id);
      if(!ev) return;
      const reminder = await loadScheduleReminder(ev.id);
      if(ev.category==='exam'){
        openModal(examScheduleModal(null, ev, reminder));
        setupExamModalListeners();
      } else {
        openModal(scheduleModal(null, ev.category==='council', ev, reminder));
      }
    }
    // 반복 요일 칩 — 여러 개를 켜고 끌 수 있어서 seg-picker(하나만 선택)를 못 쓴다.
    else if(a==='toggle-remind-day'){
      const wrap = document.getElementById('remind-weekdays');
      const hidden = wrap && wrap.querySelector('input[type=hidden]');
      if(!hidden) return;
      const day = el.dataset.day;
      const cur = hidden.value.split(',').filter(Boolean);
      const idx = cur.indexOf(day);
      if(idx >= 0) cur.splice(idx, 1); else cur.push(day);
      // 전부 끄면 "매주"인데 보낼 요일이 없어져서 알림이 영영 안 간다 — 마지막 하나는 남긴다.
      if(!cur.length){ toast('요일을 최소 하나는 골라주세요'); return; }
      hidden.value = cur.sort().join(',');
      el.classList.toggle('btn-primary', idx < 0);
      el.classList.toggle('btn-ghost', idx >= 0);
    }
    else if(a==='delete-all-calendar'){ await deleteAllCalendarEvents(); }
    else if(a==='ocr-calendar'){ openModal(calendarOcrModal()); setupCalendarOcrModalListeners(); }
    else if(a==='open-official-schedule'){ openModal(officialScheduleModal()); setupOfficialScheduleModalListeners(); }
    else if(a==='add-student-event'){ openModal(scheduleModal(el.dataset.date || state.selectedExamDate, false)); }
    else if(a==='add-council-event'){ openModal(scheduleModal(el.dataset.date || state.selectedExamDate, true)); }
    else if(a==='add-exam-event'){ openModal(examScheduleModal(el.dataset.date || state.selectedExamDate)); setupExamModalListeners(); }
    else if(a==='settings-tab'){ state.settingsTab = el.dataset.tab; renderMain(); }
    // 위젯 설정은 지금 고른 위젯(state.widgetFontScaleTarget) 하나에만 적용된다
    else if(a==='set-widget-bg'){ setWidgetSetting(state.widgetFontScaleTarget, { bg: el.dataset.bg }); renderMain(); }
    else if(a==='set-widget-accent'){
      setWidgetSetting(state.widgetFontScaleTarget, { accent: el.dataset.hex });
      document.querySelectorAll('#widget-accent-swatches-wrap .swatch').forEach(s=>{
        const isPicker = s.dataset.action === 'toggle-inline-color';
        s.classList.remove('selected'); s.innerHTML = (s.dataset.action === 'toggle-inline-color') ? '+' : '';
        if(isPicker) s.style.background = 'var(--surface-2)';
      });
      el.classList.add('selected'); el.innerHTML = '✓';
    }
    else if(a==='open-color-modal'){
      const target = el.dataset.target;
      const wkey = state.widgetFontScaleTarget;
      const w = getWidgetSettings(wkey);
      const hex = target==='bg' ? w.customBg : w.accent;
      const label = target==='bg' ? '배경 색' : '강조 색';
      openModal(colorPickerModal(target, isValidHexColor(hex)?hex:WIDGET_ACCENTS[0], label));
      setupColorPicker(target, (newHex)=>{
        if(target==='bg') setWidgetSetting(wkey, { bg:'custom', customBg:newHex });
        else setWidgetSetting(wkey, { accent:newHex });
      });
    }
    else if(a==='close-color-modal'){ closeModal(); renderMain(); }
    // 모달 안 색상 선택기 — 접었다 펴기. 열 때 한 번만 연결하면 되므로 여기서 setup을 부른다.
    else if(a==='toggle-inline-color'){
      const id = el.dataset.id;
      const wrap = document.getElementById('cp-wrap-'+id);
      if(!wrap) return;
      const show = wrap.style.display === 'none';
      if(show){
        // 배경 색상 · 줄 색상 · 선 색상처럼 같은 창의 다른 색상판이 열려 있으면 먼저 접는다
        document.querySelectorAll('.modal-sheet [id^="cp-wrap-"]').forEach(o=>{ if(o !== wrap && o.style.display !== 'none') smoothToggleBox(o, false); });
      }
      if(show) setupColorPicker(id, (hex)=>{ const fn = INLINE_COLOR_HANDLERS[id]; if(fn) fn(hex); });
      // 색상판은 안이 무거워서 높이를 늘리는 애니메이션이 끊겨 보였다 — 창을 통째로 미끄러뜨리고 내용은 서서히 나타나게(닫을 땐 흐려진 뒤 접힘)
      smoothToggleBox(wrap, show);
      if(show){
        // 색상판이 펼쳐지다가 창이 더 커질 수 없으면(화면 높이의 88%), 늘어나는 동안 창 안을 같이 부드럽게 스크롤해서
        // 색상판이 끝까지 보이게 한다(예전엔 아래가 잘린 채로 늘어나다 멈춰서 어색했다)
        requestAnimationFrame(()=>{
          const sheet = wrap.closest('.modal-sheet');
          if(!sheet) return;
          const wr = wrap.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
          const need = (wr.top + wrap.scrollHeight) - (sr.bottom - 18);
          if(need > 0) sheet.scrollBy({ top: need, behavior:'smooth' });
        });
      }
    }
    else if(a==='pick-widget-font-target'){ state.widgetFontScaleTarget = el.dataset.key; renderMain(); }
    else if(a==='toggle-widget-date-events'){ setWidgetSetting('date', { dateShowEvents: !getWidgetSettings('date').dateShowEvents }); renderMain(); }
    else if(a==='toggle-widget-calendar-memo'){
      const k = state.widgetFontScaleTarget === 'calendarWide' ? 'calendarWide' : 'calendar';
      setWidgetSetting(k, { calendarShowMemo: !getWidgetSettings(k).calendarShowMemo }); renderMain();
    }
    else if(a==='toggle-widget-calendar-official'){ setWidgetSetting('calendarWide', { calendarShowOfficial: !getWidgetSettings('calendarWide').calendarShowOfficial }); renderMain(); }
    else if(a==='toggle-widget-calendar-council'){ setWidgetSetting('calendarWide', { calendarShowCouncil: !getWidgetSettings('calendarWide').calendarShowCouncil }); renderMain(); }
    else if(a==='toggle-widget-week-time'){ setWidgetSetting('week', { weekShowTime: !getWidgetSettings('week').weekShowTime }); renderMain(); }
    else if(a==='toggle-widget-meal-jinri'){ setWidgetSetting('meal', { mealShowJinri: !getWidgetSettings('meal').mealShowJinri }); renderMain(); }
    else if(a==='toggle-widget-meal-mirae'){ setWidgetSetting('meal', { mealShowMirae: !getWidgetSettings('meal').mealShowMirae }); renderMain(); }
    else if(a==='toggle-widget-week-room'){ setWidgetSetting('week', { weekShowRoom: !getWidgetSettings('week').weekShowRoom }); renderMain(); }
    else if(a==='open-primary-timetable'){ openModal(primaryTimetableModal()); }
    else if(a==='pick-primary-variant'){
      if(el.dataset.idx === '-1') clearWidgetPrimaryTimetable();
      else setWidgetPrimaryTimetable(el.dataset.key, parseInt(el.dataset.idx,10));
      closeModal(); renderMain();
    }
    else if(a==='edit-memo'){
      const d = el.dataset.date || state.selectedExamDate;
      openModal(memoModal(d, await loadScheduleReminder(memoReminderId(d))));
      setupMemoModalListeners();
    }
    else if(a==='delete-memo'){ await deleteMemo(el.dataset.date || state.selectedExamDate); }
    else if(a==='edit-event'){
      const ev=live(state.calendar).find(x=>x.id===el.dataset.id);
      if(ev) openModal(eventModal(ev, await loadScheduleReminder(ev.id)));
    }
    else if(a === 'delete-event'){ await deleteEvent(el.dataset.id); }
    else if(a === 'select-meal-date'){ state.mealDate = el.dataset.date; renderMain(); }
    // 학식은 평일에만 운영해서 주말 날짜엔 보여줄 게 없다. 화살표로 하루씩 넘길 때
    // 토·일은 건너뛰고 바로 다음(이전) 평일로 이동한다.
    else if(a === 'edit-meal'){ openModal(mealModal(el.dataset.date)); }
    else if(a === 'fetch-meal-page'){ await fetchMealFromSource(false); }
    else if(a === 'add-notice'){ openModal(noticeModal(null)); setupNoticeModalListeners(); }
    else if(a === 'edit-notice'){
      const n = live(state.notices).find(x => x.id === el.dataset.id);
      if(n && canModify(n)){ openModal(noticeModal(n)); setupNoticeModalListeners(); }
    }
    else if(a === 'delete-notice'){ await deleteNotice(el.dataset.id); }
    else if(a === 'toggle-pin'){ await togglePin(el.dataset.id); }
    else if(a === 'add-suggestion'){ openModal(suggestionModal()); }
    else if(a === 'reply-suggestion'){ const s = live(state.suggestions).find(x => x.id === el.dataset.id); if(s) openModal(replyModal(s)); }
    else if(a === 'delete-suggestion'){ await deleteSuggestion(el.dataset.id); }
    else if(a === 'cancel-suggestion-answer'){ await cancelSuggestionAnswer(el.dataset.id); }
    else if(a === 'add-poll'){ openModal(pollModal()); updatePollOptionUI(); }
    else if(a === 'add-poll-option'){
      const wrap = document.getElementById('poll-options-wrap');
      if(!wrap) return;
      const div = document.createElement('div');
      div.className = 'field poll-option-field';
      div.style.marginBottom = '8px';
      div.innerHTML = `<div style="display:flex; gap:6px;"><input type="text" name="option" required style="font-family:var(--font-display)"><button type="button" class="btn btn-danger btn-sm" data-action="remove-poll-option" style="width:auto;">삭제</button></div>`;
      wrap.appendChild(div);
      updatePollOptionUI();
      // 새 선택지가 "뿅" 하고 나타난다: 높이가 부드럽게 열리면서 안쪽이 살짝 커졌다 자리를 잡는다
      try{
        div.dataset.noAnim = '1';
        const h = div.getBoundingClientRect().height;
        div.animate([{ height:'0px', opacity:0, marginBottom:'0px' }, { height:h + 'px', opacity:1, marginBottom:'8px' }], { duration:360, easing:'cubic-bezier(.22,1,.36,1)' });
        const inner = div.firstElementChild;
        if(inner) inner.animate([
          { transform:'scale(.78)', opacity:0, offset:0 },
          { transform:'scale(1.05)', opacity:1, offset:.6 },
          { transform:'scale(1)', opacity:1, offset:1 }
        ], { duration:480, easing:'ease-out' });
        const inp = div.querySelector('input'); if(inp) inp.focus({ preventScroll:true });
        div.scrollIntoView({ behavior:'smooth', block:'nearest' });
      }catch(_){}
    }
    else if(a === 'remove-poll-option'){
      const f = el.closest('.poll-option-field');
      if(!f) return;
      // 지울 때는 살짝 작아지며 흐려진 뒤 높이가 접힌다
      try{
        f.dataset.noAnim = '1';
        const h = f.getBoundingClientRect().height;
        const inner = f.firstElementChild;
        if(inner) inner.animate([{ transform:'scale(1)', opacity:1 }, { transform:'scale(.85)', opacity:0 }], { duration:180, easing:'ease-in', fill:'forwards' });
        const col = f.animate([{ height:h + 'px', marginBottom:'8px', overflow:'hidden' }, { height:'0px', marginBottom:'0px', overflow:'hidden' }], { duration:260, delay:120, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
        col.onfinish = ()=>{ f.remove(); updatePollOptionUI(); };
      }catch(_){ f.remove(); updatePollOptionUI(); }
    }
    else if(a === 'close-poll'){ await closePollNow(el.dataset.id); }
    else if(a === 'reopen-poll'){ await reopenPoll(el.dataset.id); }
    else if(a === 'delete-poll'){ await deletePoll(el.dataset.id); }
    else if(a === 'edit-poll-vote'){ state.editingPollVoteId = el.dataset.id; renderMain(); }
    else if(a === 'cancel-edit-poll-vote'){ state.editingPollVoteId = null; renderMain(); }
    else if(a === 'cancel-poll-vote'){ await cancelPollVote(el.dataset.id); }
    else if(a === 'export-poll-csv'){ await exportPollResultsCSV(el.dataset.id); }
    else if(a === 'add-recruitment'){ openModal(recruitmentModal(null)); }
    else if(a === 'open-recruitment'){
      const r = live(state.recruitmentPosts).find(x => x.id === el.dataset.id);
      if(r){
        const mine = state.user && r.authorId === state.user.studentId;
        if(mine || myLevel() >= 3) openModal(recruitmentModal(r));
      }
    }
    else if(a === 'delete-recruitment'){ await deleteRecruitment(el.dataset.id); }
    else if(a === 'vote-recruitment-poll'){ await voteRecruitmentPoll(el.dataset.id, el.dataset.choice); }
    else if(a === 'save-recruitment-org-message'){
      const id = el.dataset.id;
      const input = document.querySelector(`.rec-org-msg-input[data-id="${id}"]`);
      await saveRecruitmentOrgMessage(id, (input && input.value || '').trim());
    }
    else if(a === 'delete-recruitment-org-message'){ await deleteRecruitmentOrgMessage(el.dataset.id, el.dataset.msgId); }
    else if(a === 'notify-recruitment-org-message'){
      if(el.disabled) return;
      el.disabled = true;
      await notifyRecruitmentOrgMessage(el.dataset.id, el.dataset.msgId);
    }
    else if(a === 'clear-all-board'){ await clearAllBoard(el.dataset.type); }
    else if(a === 'toggle-like'){ await handleToggleLike(el.dataset.type, el.dataset.id); }
  }catch(err){
    console.error(err);
  }
});

boot();

// 네이티브 앱(APK)은 파일이 이미 APK 안에 통째로 들어있어서 서비스워커 캐시가 필요 없고,
// 오히려 새 버전을 설치해도 예전 index.html(예전 API 키 등)을 캐시에서 계속 물고 있을 수 있어
// 실제로 그 문제가 있었다. 그래서 웹(브라우저 PWA)에서만 등록한다.
const isNativeApp = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
// 새 버전 확인은 로그인 여부와 상관없이 돌아야 한다. 로그인 화면에 머물러 있는
// 사람도 예전 코드를 쓰고 있는 건 마찬가지다.
if(!isNativeApp){
  checkForUpdate();
  setInterval(checkForUpdate, 10*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
}
if(isNativeApp) document.documentElement.classList.add('is-native-app'); // 상단바 글씨 크기 등 APK 전용 스타일 스위치
if(isIOSDevice()) document.documentElement.classList.add('is-ios'); // 하단탭 safe-area 여백 보정용
if(isNativeApp && 'serviceWorker' in navigator){
  // 예전 버전(네이티브에서도 등록하던 시절)에 이미 깔린 서비스워커·캐시가 남아있을 수 있으니 정리한다.
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(()=>{});
} else if(!isNativeApp && 'serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
