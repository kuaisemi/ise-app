function renderHome(){
  const di = todayDayIndex();
  const todays = di>=0 ? state.timetable.filter(c=>c.day===di).sort((a,b)=>a.start-b.start) : [];
  // 홈 학식 카드: 밤 12시(00:00)를 기준으로 날짜가 바뀌어 그날의 식단을 보여준다. 중간에 "운영 종료"로
  // 사라지는 구간이 없고(석식은 홈에서 뺐다), 진리관·미래관 모두 같은 날짜 기준이다.
  const mealDate = todayStr();
  const mealDay = state.meals[mealDate] || {};
  const studentMeal = mealDay.student || null;
  const staffMeal = mealDay.staff || null;

  // "다가오는 학사일정"이라는 이름 그대로 학교 공식·학생회 일정만 담는다. visibleCalendar()는
  // 개인 일정도 본인 것이면 그대로 포함시키는데, 그걸 여기 섞으면 "내가 적은 메모"가 학사일정
  // 인 것처럼 보인다 — 개인 일정은 따로 "다가오는 내 일정" 섹션으로 분리한다.
  const upcomingAll = visibleCalendar().filter(ev=>ev.endDate>=todayStr())
    .sort((a,b)=>a.startDate.localeCompare(b.startDate));
  const upcoming = upcomingAll.filter(ev=>!isPersonalEvent(ev)).slice(0,3);
  const upcomingMine = upcomingAll.filter(ev=>isPersonalEvent(ev)).slice(0,3);
  const recentNotices = visibleNotices()
    .sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||String(b.date).localeCompare(String(a.date))).slice(0,5);
  
  const nowTs = now();
  const activePolls = live(state.polls).filter(p=>{
    if(isPollEnded(p)){
      const dt = p.endDateTime || p.endDate;
      if(dt){
        const endTs = new Date(dt.includes('T') ? dt : dt + 'T23:59:59').getTime();
        if(nowTs - endTs > 7 * 24 * 60 * 60 * 1000) return false;
      }
    }
    return true;
  }).sort((a,b)=>pollDeadlineSortValue(a)-pollDeadlineSortValue(b));
  
  const openPolls = activePolls.filter(p=>!isPollEnded(p));
  const unvoted = openPolls.filter(p=>!hasUserVoted(p));

  const hp = getHomePrefs();

  const validRecruits = live(state.recruitmentPosts).filter(r=>{
    if(r.closed) return false;
    if(r.expireHours && r.expireHours>0 && (now() - (r.createdAt||0)) > r.expireHours*3600000) return false;
    return true;
  }).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,2);

  // 순서를 바꿀 수 있는 각 항목의 렌더 결과를 미리 만들어두고, 마지막에 hp.order 순서대로 이어붙인다.
  // "진행 중인 투표"와 "학생회 공지"는 순서 조정 대상이 아니라 각각 맨 위/맨 아래에 고정으로 붙는다.
  const sectionHtml = {
    timetable: !hp.hideTodayTimetable ? `
    <div class="section-title">오늘의 시간표</div>
    <div class="card" style="padding:8px 14px;">
      ${todays.length ? todays.map(c=>`
        <div class="class-mini">
          <div class="bar" style="background:${c.color||COLORS[0].hex}"></div>
          <div class="info"><b>${escapeHtml(c.subject)}</b><span>${minutesToLabel(c.start)}–${minutesToLabel(c.end)} · ${escapeHtml(c.room||'-')}</span></div>
        </div>`).join('') : `<p style="font-size:11.5px; color:var(--text-faint); margin:4px 0;">${di>=0?'등록된 수업이 없습니다.':'주말에는 수업 정보가 표시되지 않아요.'}</p>`}
    </div>` : '',

    recruits: (!hp.hideRecruits && validRecruits.length) ? `
    <div class="section-title">구인글</div>
    <div class="card" style="padding:10px 14px;">
      ${validRecruits.map(r=>`
        <div class="list-item" data-action="go-recruitment-tab" style="cursor:pointer; padding:8px 0;">
          <div class="row-between" style="gap:8px;">
            <div style="display:flex; align-items:center; gap:5px; min-width:0;">
              <b class="one-line" style="font-size:12px;">${escapeHtml(r.title)}</b>
              ${r.poll && r.poll.enabled ? `<span class="tag tag-teal" style="font-size:9px; flex-shrink:0;">투표 있음</span>` : ''}
            </div>
            <span style="color:var(--text-faint); flex-shrink:0;">${ICON.chevR}</span>
          </div>
          <div class="meta" style="margin-top:2px;">${fmtAuthorBadge(r.authorName, r.authorId, r.authorRole, true)} · ${fmtDateShort(r.date)}</div>
        </div>`).join('')}
    </div>` : '',

    meal: hp.hideTodayMeal ? '' : (()=>{
      // 주말은 식당을 안 하니 카드를 숨긴다.
      const wd = new Date(mealDate+'T00:00:00').getDay();
      if(wd===0 || wd===6) return '';
      // 공휴일에는 식당을 안 하니 카드를 숨긴다.
      if(isHolidayDate(mealDate)) return '';
      // 진리관은 시간 루틴대로 항상 한 끼만 보여준다(끼니가 동시에 나오지 않는다):
      //   00:00~09:00 조식 / 09:00~14:30 중식 / 14:30~24:00 석식
      // 미래관 교직원식당(중식만 운영)은 하루 종일(00~24시) 계속 보여준다.
      const nowMins = new Date().getHours() * 60 + new Date().getMinutes();
      const showBreakfast = nowMins < 9 * 60;
      const showLunch = nowMins >= 9 * 60 && nowMins < 14 * 60 + 30;
      const showDinner = nowMins >= 14 * 60 + 30;
      const row = (icon, title, color, text, hoursKey, stripPlus, divider) => `
        <div class="meal-block"${divider ? ' style="margin-top:0; padding-top:10px; border-top:1px solid var(--border);"' : ''}>
          <div class="m-label" style="color:${color}">${icon} ${title}${mealHoursSpan(hoursKey)}</div>
          ${text
            ? `<div class="m-text" style="font-size:11.5px">${formatMealHtml(stripPlus ? stripPlusMealLines(text) : text)}</div>`
            : `<div class="m-text" style="font-size:11.5px; color:var(--text-faint);">정보가 없습니다.</div>`}
        </div>`;
      // 그날 식단이 통째로 아직 안 올라온 경우(예: 일요일 낮에 보는 월요일 식단은 월요일 10시 이후에 올라온다)
      // 세 줄 다 "정보가 없습니다"로 채우지 않고 한 줄로 안내한다.
      const hasAnyMeal = !!(studentMeal && ((showBreakfast && studentMeal.breakfast) || (showLunch && studentMeal.lunch) || (showDinner && studentMeal.dinner))) || !!(staffMeal && staffMeal.lunch);
      if(!hasAnyMeal){
        return `
    <div class="section-title">오늘의 학식</div>
    <div class="card" data-action="go-meal-tab" style="cursor:pointer;">
      <div class="m-text" style="font-size:11.5px; color:var(--text-faint);">식단 정보가 아직 올라오지 않았어요.</div>
    </div>`;
      }
      return `
    <div class="section-title">오늘의 학식</div>
    <div class="card home-meal" data-action="go-meal-tab" style="cursor:pointer;">
      ${showBreakfast ? row(ICON.capHat, '진리관 학생식당 조식', 'var(--teal)', studentMeal && studentMeal.breakfast, 'student_breakfast', false, false) : ''}
      ${showLunch ? row(ICON.capHat, '진리관 학생식당 중식', 'var(--teal)', studentMeal && studentMeal.lunch, 'student_lunch', true, false) : ''}
      ${showDinner ? row(ICON.capHat, '진리관 학생식당 석식', 'var(--teal)', studentMeal && studentMeal.dinner, 'student_dinner', false, false) : ''}
      ${row(ICON.tie, '미래관 교직원식당 중식', 'var(--amber)', staffMeal && staffMeal.lunch, 'staff_lunch', true, true)}
    </div>`;
    })(),

    shuttle: !hp.hideShuttle ? `
    <div class="section-title">셔틀버스</div>
    ${shuttleHomeMiniCard()}` : '',

    // "다가오는 학사일정"(calendar)과 "다가오는 내 일정"(mine)은 숨김도 순서도 각각 따로다.
    calendar: (!hp.hideUpcomingCalendar ? `
    <div class="section-title">다가오는 학사일정</div>
    <div class="card" style="padding:8px 14px;">
      ${upcoming.length ? upcoming.map(ev=>`
        <div class="row-between upcoming-row" style="padding:6px 0; gap:8px; min-width:0;">
          <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1; flex-wrap:nowrap;">
            <span class="tag ${catTag(ev.category)}">${catLabel(ev.category)}</span>
            <b class="one-line" style="font-size:12px;">${escapeHtml(ev.title)}</b>
          </div>
          <span style="font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); flex-shrink:0;">${fmtDateShort(ev.startDate)}${ev.endDate!==ev.startDate?'~'+fmtDateShort(ev.endDate):''}</span>
        </div>`).join('') : `<p style="font-size:11.5px; color:var(--text-faint); margin:4px 0;">등록된 일정이 없습니다.</p>`}
    </div>` : ''),

    mine: ((!hp.hideUpcomingMine && upcomingMine.length) ? `
    <div class="section-title">다가오는 내 일정</div>
    <div class="card" style="padding:8px 14px;">
      ${upcomingMine.map(ev=>`
        <div class="row-between upcoming-row" data-action="go-my-event" data-date="${ev.startDate > todayStr() ? ev.startDate : todayStr()}" style="padding:6px 0; gap:8px; min-width:0; cursor:pointer;">
          <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1; flex-wrap:nowrap;">
            <span style="width:9px; height:9px; border-radius:50%; background:${ev.color||'var(--blue)'}; display:inline-block; flex-shrink:0;"></span>
            <b class="one-line" style="font-size:12px;">${escapeHtml(ev.title)}</b>
          </div>
          <span style="font-size:11.5px; color:var(--text-dim); font-family:var(--font-mono); flex-shrink:0;">${fmtDateShort(ev.startDate)}${ev.endDate!==ev.startDate?'~'+fmtDateShort(ev.endDate):''}</span>
        </div>`).join('')}
    </div>` : ''),
  };

  return `
    <div class="hero-greet">
      <div class="hero-trace">${ICON.trace}</div>
      <p class="greet-name"><span data-action="go-my-tab" style="cursor:pointer;">${escapeHtml(getNickname() || state.user.name)}</span>님, 안녕하세요</p>
      <p class="greet-sub">${di>=0 ? `오늘은 ${DAYS[di]}요일, 수업 ${todays.length}개가 있어요` : '오늘은 주말이에요, 편안한 하루 보내세요'}</p>
    </div>

    ${(openPolls.length && !(hp.hideVotedPolls && unvoted.length===0)) ? `
    <div class="section-title">진행 중인 투표 <span class="count">총 ${openPolls.length}개</span></div>
    <div class="card" style="padding:10px 14px;">
      ${unvoted.length ? unvoted.map(p=>`
        <div class="list-item" data-action="go-poll-page" style="cursor:pointer; padding:8px 0;">
          <div class="row-between" style="gap:8px;">
            <b class="one-line" style="font-size:11.5px;">${escapeHtml(p.question)}</b>
            <span style="color:var(--text-faint); flex-shrink:0;">${ICON.chevR}</span>
          </div>
          <div class="meta" style="margin-top:2px;">${fmtPollDeadline(p)}</div>
        </div>`).join('')
      : `<p style="font-size:11.5px; color:var(--teal); margin:3px 0; font-weight:600;">✓ 진행 중인 투표에 모두 참여하셨습니다.</p>`}
    </div>` : ''}

    ${hp.order.map(key=>sectionHtml[key]||'').join('')}

    ${recentNotices.length ? `
    <div class="section-title">학생회 공지</div>
    <div class="card">
      ${recentNotices.map(n=>`
        <div class="row-between home-notice" data-action="go-notice-tab" style="padding:4px 0; gap:8px; min-width:0;">
          <div style="display:flex; align-items:center; gap:6px; min-width:0; flex:1; flex-wrap:nowrap;">
            ${n.pinned?`<span style="color:var(--amber); flex-shrink:0;">${ICON.thumbtack}</span>`:''}
            <b class="one-line" style="font-size:12.5px; font-weight:700;">${escapeHtml(n.title)}</b>
          </div>
          <span style="font-size:11px; color:var(--text-dim); font-family:var(--font-mono); flex-shrink:0;">${fmtDateTime(n.createdAt || n.date)}</span>
        </div>`).join('')}

  `;
}

// 폰마다 화면 비율(세로/가로)이 달라서, 그 비율만큼 시간표 한 칸 높이를 키우거나 줄인다 —
// 화면이 길쭉한 폰일수록 칸이 더 커져서 화면을 더 꽉 채우고, 정사각형에 가까운 폰은 원래 크기를 유지.
// 기준값(1.9)은 흔한 20:9 근처 화면 비율.
function deviceRatioScale(min=0.85, max=1.4){
  const ratio = (typeof window!=='undefined' && window.innerWidth) ? window.innerHeight/window.innerWidth : 1.9;
  return Math.max(min, Math.min(max, ratio/1.9));
}
// deviceRatioScale()은 "화면 비율"만 보고 어림잡은 값이라, 기기마다 실제로 얼마나 꽉 차는지는
// 조금씩 어긋난다. 렌더링 직후 실제 화면에서 남는 공간을 재서 --tt-row-h를 다시 맞춰
// 스크롤 없이 딱 맞게 채운다(화면이 클수록 칸도 더 커진다).
function fitTimetableGrid(){
  if(state.view!=='timetable') return;
  const wrap = document.querySelector('.tt-wrap');
  const grid = document.querySelector('.tt-grid');
  const nav = document.querySelector('.bottomnav');
  if(!wrap || !grid || !nav) return;
  const wrapTop = wrap.getBoundingClientRect().top;
  // 일반 브라우저 탭에서는 주소창이 떠 있을 때 position:fixed 요소(bottomnav)가 실제
  // "지금 보이는 화면"이 아니라 주소창까지 합친 더 큰 레이아웃 뷰포트 기준으로 위치를
  // 잡는다 — 그래서 bottomnav의 getBoundingClientRect().top을 기준으로 삼으면, 주소창이
  // 보이는 동안은 실제보다 여유 공간이 있는 것처럼 잘못 계산돼서 화면 밖으로 넘친다.
  // PWA·APK는 주소창이 아예 없어서 이 차이가 안 생긴다. window.visualViewport.height는
  // "지금 실제로 보이는" 화면 높이를 정확히 알려주므로 그걸 기준으로 쓰고, bottomnav는
  // 자기 자신의 높이(위치가 아니라 크기)만 가져다 쓴다 — 크기는 이 문제와 무관하게 항상 정확하다.
  const viewportH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const navHeight = nav.getBoundingClientRect().height;
  const bottomMargin = 12;
  // 시간표 화면 여백이 넉넉해서 버전 표시("ISE · Beta…")가 tt-wrap 아래에 같이 떠 있을 때,
  // 그 표시가 차지할 자리(위쪽 여백 28px 포함)를 미리 빼두지 않으면 grid 높이를 계산할 때는
  // 자리가 있다고 봤다가 실제로는 그 아래로 밀려나면서 페이지 전체가 스크롤되는 원인이 된다.
  const footerEl = document.querySelector('#main-content > .app-version');
  const footerReserve = footerEl ? Math.ceil(footerEl.getBoundingClientRect().height) + 30 : 0;
  const available = viewportH - navHeight - wrapTop - bottomMargin - footerReserve;
  if(available <= 60) return; // 화면이 너무 작아 계산이 이상해지면 기본값(CSS 68vh)을 그대로 둔다
  const headerPx = 24;
  // 칸 높이는 "9시~21시" 기준(48칸)으로 계산한 값이 최대치다 — 수업이 21시 전에 끝나는
  // 날은 이 크기 그대로 쓰고(그래서 아래로 빈 공간이 남을 수 있다), 21시를 넘는 수업이
  // 있어서 칸이 48개보다 더 필요해지면 그만큼 칸을 더 촘촘하게(작게) 줄여서 스크롤 없이
  // 다 들어오게 한다 — 잘라내지 않고 압축한다.
  const baselineRows = Math.ceil((21*60 - TIME_START) / TIMETABLE_GRID_STEP);
  const actualRows = parseInt(grid.dataset.rows||'0', 10) || baselineRows;
  const effectiveRows = Math.max(baselineRows, actualRows);
  const maxSafeRowPx = Math.max(8, (available - headerPx) / effectiveRows);
  // "시간표 크기" 설정(화면 표시 설정)은 이 화면-꽉-채움 크기를 100%로 보고, 그보다
  // 작게(0.6~1.0배)만 줄일 수 있게 한다 — 100%가 이미 스크롤 없이 들어가는 최대치라,
  // 더 키우는 건 허용하지 않는다(스크롤 금지 원칙을 항상 지키기 위해).
  const userScale = Math.max(0.6, Math.min(1, (state.ttOpts && state.ttOpts.rowScale) || 1));
  const rowPx = Math.max(8, maxSafeRowPx * userScale);
  grid.style.setProperty('--tt-row-h', rowPx+'px');
  wrap.style.maxHeight = available+'px';
  // 칸 높이가 바뀌었으니 "지금" 표시하는 빨간 줄 위치도 새 칸 높이에 맞춰 다시 계산한다.
  const nowLine = grid.querySelector('.tt-now-line');
  if(nowLine){
    const t = new Date();
    const minsNow = t.getHours()*60 + t.getMinutes();
    if(minsNow>=TIME_START){
      const top = headerPx + ((minsNow-TIME_START)/TIMETABLE_GRID_STEP)*rowPx;
      nowLine.style.top = top+'px';
    }
  }
  // 안전장치: 계산이 기기별 안전영역(노치·제스처바 등)이나 반올림 오차로 조금 어긋나서
  // 그래도 페이지 전체가 스크롤되면, 넘친 만큼 한 번 더 줄여서 다시 맞춘다. "지금 보이는
  // 화면"과 비교해야 하므로 여기서도 visualViewport 기준으로 넘친 양을 잰다.
  requestAnimationFrame(()=>{
    if(state.view!=='timetable') return;
    const curViewportH = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const overflow = document.documentElement.scrollHeight - curViewportH;
    if(overflow > 1){
      const fixedRowPx = Math.max(8, rowPx - (overflow / effectiveRows) - 0.5);
      grid.style.setProperty('--tt-row-h', fixedRowPx+'px');
      wrap.style.maxHeight = Math.max(60, available - overflow - 4) + 'px';
    }
  });
}
// 오늘 시간표가 실제로 몇 시까지 표시되는지 — renderTimetable()과 똑같은 계산을
// 여기서도 써서(버전 푸터를 보여줄지 말지 결정하는 데 씀), 로직이 어긋나지 않게 한다.
function timetableVisibleEnd(){
  const latestEnd = state.timetable.reduce((m,c)=>Math.max(m, Number(c.end)||TIME_START), TIME_START);
  return Math.min(TIME_END, Math.max(TIMETABLE_VISIBLE_END, Math.ceil(latestEnd/60)*60));
}
function renderTimetable(isCapture=false){
  const latestEnd = state.timetable.reduce((m,c)=>Math.max(m, Number(c.end)||TIME_START), TIME_START);
  const visibleEnd = Math.min(TIME_END, Math.max(TIMETABLE_VISIBLE_END, Math.ceil(latestEnd/60)*60));
  const rows = Math.ceil((visibleEnd-TIME_START)/TIMETABLE_GRID_STEP);
  const di = todayDayIndex();

  let timeLabels='';
  for(let r=0;r<=rows;r++){
    const mins = TIME_START + r*TIMETABLE_GRID_STEP;
    if(mins>visibleEnd) break;
    if(mins%60===0) timeLabels += `<div class="tt-timelabel" style="grid-row:${r+2}">${Math.floor(mins/60)}</div>`;
  }
  let cells='';
  for(let d=0; d<5; d++){
    for(let r=0;r<rows;r++){
      const mins = TIME_START + r*TIMETABLE_GRID_STEP;
      cells += `<div class="tt-cell ${mins%60===0?'hour-cell':''} ${(state.ttOpts.todayDate && d===di && !isCapture)?'today-col':''}" style="grid-column:${d+2}; grid-row:${r+2};"></div>`;
    }
  }

  const o = state.ttOpts;
  let blocks='';
  state.timetable.forEach(c=>{
    const start = Math.max(TIME_START, Number(c.start)||TIME_START);
    const end = Math.min(visibleEnd, Number(c.end)||start+60);
    const startRow = 2 + Math.floor((start-TIME_START)/TIMETABLE_GRID_STEP);
    const endRow = Math.max(startRow+1, 2 + Math.ceil((end-TIME_START)/TIMETABLE_GRID_STEP));
    const textColor = c.textColor || '#FFFFFF';
    const actionAttr = isCapture ? '' : `data-action="edit-class" data-id="${c.id}"`;
    blocks += `<div class="tt-block" ${actionAttr}
      style="grid-column:${c.day+2}; grid-row:${startRow} / ${endRow}; background:${c.color||COLORS[0].hex}; color:${textColor};">
      ${o.subject ? `<b style="color:${textColor};">${escapeHtml(c.subject)}</b>` : ''}
      ${o.time ? `<span class="time-tag" style="color:${textColor}">${minutesToLabel(start)}–${minutesToLabel(end)}</span>` : ''}
      ${o.professor && c.professor ? `<span class="prof-tag" style="color:${textColor}">${escapeHtml(c.professor)}</span>` : ''}
      ${o.room && c.room ? `<span class="room-tag" style="color:${textColor}">${formatRoomForBlock(c.room)}</span>` : ''}
    </div>`;
  });

  const heads = DAYS.map((d,i)=>`
    <div class="tt-head ${(o.todayDate && i===di && !isCapture)?'today':''}" style="grid-column:${i+2}">
      <span>${d}</span>
    </div>`).join('');

  let nowLine='';
  if(o.currentTime && di>=0 && !isCapture){
    const t = new Date();
    const minsNow = t.getHours()*60 + t.getMinutes();
    if(minsNow>=TIME_START && minsNow<=visibleEnd){
      const top = 24 + ((minsNow-TIME_START)/TIMETABLE_GRID_STEP)*Math.round(TIMETABLE_ROW_PX*deviceRatioScale());
      nowLine = `<div class="tt-now-line" style="top:${top}px; background:${escapeHtml(o.currentTimeColor||'#FF6B6B')}; color:${escapeHtml(o.currentTimeColor||'#FF6B6B')};"></div>`;
    }
  }

  if(isCapture){
    const isLight = getTheme()==='light';
    const capBg = isLight ? '#FFFFFF' : '#000000';
    const capLine = isLight ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.08)';
    const capLineStrong = isLight ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.18)';
    const capBlockBorder = isLight ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.18)';
    return `
      <style>
        .capture-grid-scope .tt-cell{border-top:1px dashed ${capLine} !important; border-left:1px solid ${capLine} !important;}
        .capture-grid-scope .tt-cell.hour-cell{border-top:1px solid ${capLineStrong} !important;}
        .capture-grid-scope .tt-block{border-color:${capBlockBorder} !important;}
        /* 캡처는 움직이지 않는 한 장의 그림이라 요일 헤더가 따라다닐 이유가 없다.
           sticky를 풀어야 iOS에서 헤더가 오버레이 위로 떠올라 닫기 버튼을 가리는 일이 없어진다. */
        .capture-grid-scope .tt-head{background:${capBg} !important; position:static !important; z-index:auto !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important;}
      </style>
      <div class="tt-card-container capture-grid-scope" style="background:${capBg}; border:2px solid ${capBg}; box-shadow:none;">
        <div class="tt-wrap" style="max-height:none; background:${capBg};">
          <div class="tt-grid" style="grid-template-rows:24px repeat(${rows}, var(--tt-row-h)); position:relative; --tt-font-scale:${state.ttOpts.fontScale||1}; --tt-row-h:${Math.round(11*deviceRatioScale()*1.15)}px;">
            <div class="tt-head" style="grid-column:1; background:${capBg};"></div>
            ${heads}${timeLabels}${cells}${blocks}
          </div>
        </div>
      </div>`;
  }

  const ttBg = ttBgAttrs();
  return `
    ${renderSemesterTabs()}

    ${state.timetable.length===0 ? `
      <div class="card empty">
        <div style="color:var(--teal); margin-bottom:8px;">${ICON.grid}</div>
        <p>등록된 수업이 없습니다.<br>사진 인식이나 + 버튼으로 수업을 추가하세요.</p>
        <div style="display:flex; gap:8px; justify-content:center; max-width:320px; margin:0 auto;">
          <button class="btn btn-teal btn-sm" data-action="ocr-timetable">${ICON.camera} 시간표 인식</button>
          <button class="btn btn-primary btn-sm" data-action="add-class">${ICON.plus} 직접 추가</button>
        </div>
      </div>
    ` : `
      <div class="tt-card-container">
        <div class="tt-wrap ${ttBg.cls}" style="${ttBg.style}">
          <div class="tt-grid" data-rows="${rows}" style="grid-template-rows:24px repeat(${rows}, var(--tt-row-h)); position:relative; --tt-font-scale:${state.ttOpts.fontScale||1}; --tt-row-h:${Math.round(TIMETABLE_ROW_PX*deviceRatioScale())}px;">
            <div class="tt-head" style="grid-column:1"></div>
            ${heads}${timeLabels}${cells}${blocks}${nowLine}
          </div>
        </div>
      </div>
    `}
    <div class="tt-fab-wrap ${state.ttFabOpen?'open':''}${state.ttFabDocked?' docked':''}">
      ${state.ttFabOpen ? ttFabOptionsHtml() : ''}
      <button type="button" class="tt-fab" data-action="toggle-tt-fab">${ICON.plus}</button>
    </div>
  `;
}

// + 버튼 메뉴는 시간표 전체를 다시 그리지 않고 버튼 주변만 바꾼다.
// (다시 그리면 시간표가 잠깐 깜빡이고, 칸 크기를 다시 맞추느라 위아래로 출렁였다.)
// + 버튼을 오른쪽 가장자리로 밀어 넣으면 끄트머리만 남고(캡처할 때 시간표를 가리지 않게), 다시 끌어당기거나 눌러서 꺼낼 수 있다.
const TT_FAB_DOCK = 42;   // 버튼 폭(52) + 오른쪽 여백(18) - 남길 끄트머리(28). 너무 얇으면 안드로이드 가장자리 뒤로가기 제스처와 겹쳐 잡기 어렵다
function setTtFabDock(dock){
  state.ttFabDocked = !!dock;
  localSet('tt_fab_docked', state.ttFabDocked);
  if(state.ttFabDocked && state.ttFabOpen) setTtFab(false);

if(!window.__fabDragBound){
  window.__fabDragBound = true;
  let d = null;
  document.addEventListener('pointerdown', (e)=>{
    const b = e.target.closest && e.target.closest('.tt-fab'); if(!b) return;
    const wrap = b.closest('.tt-fab-wrap');
    const zoom = parseFloat(getComputedStyle(wrap).zoom) || 1;   // 글씨 크기 배율의 반대로 줄여 놓은 영역이라 손가락 이동량도 맞춰 준다
    d = { b, x:e.clientX, y:e.clientY, id:e.pointerId, moved:false, base: state.ttFabDocked ? TT_FAB_DOCK : 0, cur: state.ttFabDocked ? TT_FAB_DOCK : 0, zoom };
  }, true);
  document.addEventListener('pointermove', (e)=>{
    if(!d || e.pointerId !== d.id) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if(!d.moved){
      if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ d = null; return; }
      if(Math.abs(dx) > 8){ d.moved = true; d.b.style.transition = 'none'; }
    }
    if(d && d.moved){
      d.cur = Math.max(0, Math.min(TT_FAB_DOCK, d.base + dx / d.zoom));
      d.b.style.transform = 'translateX(' + d.cur + 'px)';
    }
  }, true);
  const endFab = (e)=>{
    if(!d || e.pointerId !== d.id) return;
    const { b, moved, cur } = d; d = null;
    if(!moved) return;
    b.style.transition = ''; b.style.transform = '';
    window.__suppressClick = { el: b, until: Date.now() + 500 };
    setTtFabDock(cur > TT_FAB_DOCK / 2);
  };
  document.addEventListener('pointerup', endFab, true);
  document.addEventListener('pointercancel', endFab, true);
}
function setTtFab(open){
  state.ttFabOpen = !!open;
  const wrap = document.querySelector('.tt-fab-wrap');
  if(!wrap){ renderMain(); return; }
  if(wrap.__fabTimer){ clearTimeout(wrap.__fabTimer); wrap.__fabTimer = null; }
  wrap.querySelectorAll('.tt-fab-backdrop').forEach(n=>n.remove());
  const opts = wrap.querySelectorAll('.tt-fab-option');
  if(state.ttFabOpen){
    opts.forEach(n=>n.remove());
    wrap.insertAdjacentHTML('afterbegin', ttFabOptionsHtml());
  } else if(opts.length){
    // 닫을 때도 열 때처럼 애니메이션: 메뉴 항목이 아래로 흐려지며 들어간 뒤에 없앤다
    opts.forEach(n=>{ n.classList.add('closing'); n.style.pointerEvents = 'none'; });
    wrap.__fabTimer = setTimeout(()=>{ wrap.querySelectorAll('.tt-fab-option.closing').forEach(n=>n.remove()); wrap.__fabTimer = null; }, 240);
  }
  wrap.classList.toggle('open', state.ttFabOpen);
}

// 시간표 뒷배경 색(설정에서 고른 값). 비어 있으면 테마 기본색을 그대로 쓴다.
// 고른 색이 밝은지 어두운지에 따라 글자·줄 색도 함께 맞춰서, 흰 배경에서도 시간표가 읽히게 한다.
function ttBgAttrs(){
  const o = state.ttOpts || {};
  const bg = String(o.bgColor || '').trim(), ln = String(o.gridColor || '').trim();
  const hex = /^#[0-9a-fA-F]{6}$/;
  const cls = [], style = [];
  if(hex.test(bg)){
    const r = parseInt(bg.slice(1,3),16), g = parseInt(bg.slice(3,5),16), b = parseInt(bg.slice(5,7),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    cls.push(lum > 0.6 ? 'bg-light' : 'bg-dark');
    style.push('--grid-b:' + bg + '; --grid-b-rgb:' + r + ',' + g + ',' + b + '; background:' + bg + ';');
  }
  if(hex.test(ln)){
    const r = parseInt(ln.slice(1,3),16), g = parseInt(ln.slice(3,5),16), b = parseInt(ln.slice(5,7),16);
    cls.push('has-line');
    style.push('--tt-line:rgba(' + r + ',' + g + ',' + b + ',.3); --tt-line-strong:rgba(' + r + ',' + g + ',' + b + ',.6);');
  }
  return { cls: cls.join(' '), style: style.join(' ') };
}

      panel.querySelectorAll('#tt-now-color-swatches .swatch').forEach(b=>{ b.classList.remove('selected'); b.innerHTML = (b.dataset.action === 'toggle-inline-color') ? '+' : ''; if(b.dataset.action === 'toggle-inline-color') b.style.background = 'var(--surface-2)'; });
      btn.classList.add('selected'); btn.innerHTML='✓';
      if(swatchWrap) swatchWrap.dataset.selected = btn.dataset.hex;
    };
  });
  const fontSlider = document.getElementById('tt-font-scale-slider');
  const fontLabel = document.getElementById('tt-font-scale-label');
  if(fontSlider && fontLabel){
    fontSlider.oninput = ()=>{ fontLabel.value = Math.round(parseFloat(fontSlider.value)*100); };
    fontLabel.onchange = ()=>{
      let v = parseInt(fontLabel.value, 10); if(isNaN(v)) v = Math.round(parseFloat(fontSlider.value)*100);
      v = Math.max(70, Math.min(160, v)); fontLabel.value = v; fontSlider.value = v/100;
      fontSlider.dispatchEvent(new Event('input', { bubbles:true }));
    };
    fontLabel.onkeydown = (e)=>{ if(e.key === 'Enter') fontLabel.blur(); };
  }
  const rowSlider = document.getElementById('tt-row-scale-slider');
  const rowLabel = document.getElementById('tt-row-scale-label');
  const rowWarn = document.getElementById('tt-row-scale-warn');
  if(rowSlider && rowLabel){
    rowSlider.oninput = ()=>{
      const v = parseFloat(rowSlider.value);
      rowLabel.value = Math.round(v*100);
      if(rowWarn) rowWarn.style.display = v<=0.8 ? '' : 'none';
    };
    rowLabel.onchange = ()=>{
      let v = parseInt(rowLabel.value, 10); if(isNaN(v)) v = Math.round(parseFloat(rowSlider.value)*100);
      v = Math.max(60, Math.min(100, v)); rowLabel.value = v; rowSlider.value = v/100;
      rowSlider.dispatchEvent(new Event('input', { bubbles:true }));
    };
    rowLabel.onkeydown = (e)=>{ if(e.key === 'Enter') rowLabel.blur(); };
  }
}

async function parseCalendarWithGeminiVision(file){
  const base64 = await new Promise(res=>{
    const r=new FileReader();
    r.onloadend=()=>{ const v=r.result; res(v.includes(',')?v.split(',')[1]:v); };
    r.readAsDataURL(file);
  });
  const prompt = `이 한국 대학교 학사일정표 이미지(표 형식)에서 모든 항목을 찾아 JSON 배열로만 반환하세요.
각 항목: 제목(title), 시작일(startDate, YYYY-MM-DD), 종료일(endDate, YYYY-MM-DD, 하루짜리면 startDate와 동일), 분류(category: academic=학사, exam=시험, event=행사, vacation=방학, holiday=공휴일, etc=기타 중 하나).
이미지에 연도가 안 보이면 이미지 문맥(예: "2026학년도")을 참고해서 연도를 정확히 추론하세요.
예시: [{"title":"제1학기 개강","startDate":"2026-03-03","endDate":"2026-03-03","category":"event"}]
설명 없이 JSON 배열만 반환하세요.`;

  const models = await getGeminiFlashModels();
  let lastErr=null;
  // 시간표 인식과 동일하게, 빠른 설정으로 먼저 시도하고 아무것도 못 읽었을 때만 다시 시도한다.
  const attempts = [{ thinkingLevel:'low' }, null];
  const geminiKeys = await getGeminiKeys();
  if(!geminiKeys.length) throw new Error(geminiNoKeyMessage());
  ocr:
  for(const thinkingConfig of attempts){
    for(const apiKey of geminiKeys){
      for(const model of models){
        try{
          const generationConfig = { responseMimeType:'application/json' };
          if(thinkingConfig) generationConfig.thinkingConfig = thinkingConfig;
          const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey.trim() },
            body:JSON.stringify({
              contents:[{ parts:[ {text:prompt}, {inlineData:{ mimeType:file.type||'image/jpeg', data:base64 }} ] }],
              generationConfig
            })
          });
          const data=await res.json();
          if(data.error || !res.ok) throw geminiError(res, data);
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const parsed = JSON.parse(raw.replace(/```(?:json)?/gi,'').trim());
          const result = parsed.filter(it=>it.title && it.startDate).map(it=>({
            title: it.title,
            startDate: it.startDate,
            endDate: it.endDate || it.startDate,
            category: CATS.find(c=>c.key===it.category) ? it.category : 'academic'
          }));
          if(result.length) return result;
          lastErr = lastErr || new Error('인식된 일정이 없습니다');
          break;
        }catch(err){ lastErr=err; if(err && err.geminiAuth) break ocr; }
      }
    }
  }
  throw lastErr || new Error('학사일정 인식에 실패했습니다.');
}

function setupCalendarOcrModalListeners(){
  const dropzone=document.getElementById('cal-ocr-dropzone');
  const fileInput=document.getElementById('cal-ocr-file-input');
  const previewWrap=document.getElementById('cal-ocr-preview-wrap');
  const imgPreview=document.getElementById('cal-ocr-img-preview');
  const reselectBtn=document.getElementById('cal-ocr-reselect-btn');
  const statusBox=document.getElementById('cal-ocr-status-box');
  const resultsWrap=document.getElementById('cal-ocr-results-wrap');
  const itemsList=document.getElementById('cal-ocr-items-list');
  const countEl=document.getElementById('cal-ocr-count');
  const btnSave=document.getElementById('btn-save-ocr-calendar');
  if(!dropzone) return;

  let selectedFile=null;
  dropzone.onclick=()=>fileInput.click();
  reselectBtn.onclick=(e)=>{ e.stopPropagation(); fileInput.click(); };

  fileInput.onchange=async ()=>{
    const file=fileInput.files[0];
    if(!file) return;
    selectedFile=file;
    dropzone.style.display='none';
    previewWrap.style.display='block';
    imgPreview.src=URL.createObjectURL(file);
    resultsWrap.style.display='none';

    statusBox.style.display='block';
    statusBox.textContent='학사일정을 인식하는 중입니다… (최대 30초 소요)';
    try{
      const items=await parseCalendarWithGeminiVision(selectedFile);
      if(items.length===0){ statusBox.innerHTML='<span style="color:var(--danger)">일정을 인식하지 못했습니다. 더 선명한 사진으로 다시 시도해주세요.</span>'; return; }
      state.ocrParsedCalendar=items;
      statusBox.style.display='none';
      itemsList.innerHTML=items.map((it,i)=>`
        <label style="display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:11.5px; cursor:pointer;">
          <span class="ck"><input type="checkbox" class="cal-ocr-check-item" data-idx="${i}" checked><span class="ck-box"></span></span>
          <span><span class="tag ${catTag(it.category)}" style="margin-right:5px;">${catLabel(it.category)}</span><b>${escapeHtml(it.title)}</b><br><span style="color:var(--text-faint); font-family:var(--font-mono); font-size:10.5px;">${it.startDate}${it.endDate!==it.startDate?' ~ '+it.endDate:''}</span></span>
        </label>`).join('');
      countEl.textContent=items.length;
      resultsWrap.style.display='block';
    }catch(err){
      statusBox.innerHTML=`<span style="color:var(--danger)">인식 실패: ${escapeHtml(err.message||'')}</span>`;
    }
  };

  if(btnSave){
    btnSave.onclick=async ()=>{
      const idxs=Array.from(document.querySelectorAll('.cal-ocr-check-item:checked')).map(cb=>parseInt(cb.dataset.idx,10));
      const list=(state.ocrParsedCalendar||[]).filter((_,i)=>idxs.includes(i));
      if(list.length===0){ toast('선택된 일정이 없습니다'); return; }
      const latest = await loadCalendar();
      const existingKeys = new Set(live(latest).map(e=>e.title+'|'+e.startDate));
      const additions=[];
      list.forEach(it=>{
        const key=it.title+'|'+it.startDate;
        if(existingKeys.has(key)) return;
        additions.push({ id:uid(), title:it.title, startDate:it.startDate, endDate:it.endDate, category:it.category, source:'official', color:'', description:'', authorId:state.user.studentId, authorRole:myRole(), updatedAt:now() });
      });
      const next=[...latest, ...additions];
      const ok=await saveCalendar(next);
      state.calendar=next;
      closeModal(); renderMain();
      saveResultToast(ok, `${additions.length}건의 학사일정이 등록되었습니다`);
    };
  }
}

// 학사일정(공식 포함) / 학생회 일정 중 무엇을 지울지 고르는 팝업. 취소하면 null.
function chooseCalendarDeleteKind(){
  return new Promise((resolve)=>{
    const wrap=document.createElement('div');
    wrap.className='confirm-overlay';
    wrap.innerHTML=`
      <div class="confirm-box">
        <p class="confirm-msg">어떤 일정을 전부 삭제할까요?</p>
        <div class="confirm-actions" style="flex-direction:column; gap:8px;">
          <button type="button" class="btn btn-danger" data-act="academic">학사일정 삭제</button>
          <button type="button" class="btn btn-danger" data-act="council">학생회 일정 삭제</button>
          <button type="button" class="btn btn-ghost" data-act="cancel">취소</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(()=>wrap.classList.add('open'));
    const cleanup=(result)=>{
      wrap.classList.remove('open');
      setTimeout(()=>wrap.remove(),160);
      resolve(result);
    };
    wrap.addEventListener('click', e=>{
      const act = e.target.dataset.act;
      if(act==='academic' || act==='council') cleanup(act);
      else if(act==='cancel' || e.target===wrap) cleanup(null);
    });
  });
}
async function deleteAllCalendarEvents(){
  if(!isDirectorPlus()){ toast('국장 이상 권한이 필요한 기능입니다'); return; }
  const kind = await chooseCalendarDeleteKind();
  if(!kind) return;
  const label = kind==='council' ? '학생회 일정' : '학사일정';
  if(!await showConfirm(`${label}을 전부 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)) return;
  const latest = await loadCalendar();
  // 개인 시험 일정(exam)은 어느 쪽에서도 건드리지 않는다. 학생회 일정은 category==='council',
  // 학사일정은 그 외 나머지(공식 학사일정 포함).
  const inScope = (e) => e.category !== 'exam' && ((e.category==='council') === (kind==='council'));
  const next = latest.map(e => (!e.deleted && inScope(e)) ? { ...e, deleted: true, updatedAt: now() } : e);
  const ok = await saveCalendar(next);
  state.calendar = next;
  renderMain();
  saveResultToast(ok, `${label}이 모두 삭제되었습니다`);
}

function renderExamCalTab(){
  const calMonth = state.calendarMonth || todayStr().slice(0,7);
  const [ms, me] = monthBounds(calMonth);
  const [y, m] = calMonth.split('-').map(Number);
  if(!state.selectedExamDate) state.selectedExamDate = todayStr();

  const firstDayIndex = new Date(y, m - 1, 1).getDay();
  const totalDays = new Date(y, m, 0).getDate();
  const prevTotalDays = new Date(y, m - 1, 0).getDate();

  const pollDeadlineEvents = live(state.polls)
    .filter(p => p.endDate)
    .map(p => ({
      id: 'poll-deadline-' + p.id,
      title: `투표 마감: ${p.question}`,
      startDate: p.endDate,
      endDate: p.endDate,
      category: 'council',
      color: 'var(--amber)',
      description: '',
      isPollDeadline: true,
    }));

  const allEvents = [
    ...visibleCalendar().filter(ev => {
      if(!state.showCouncilEvents && ev.category==='council') return false;
      const isOfficial = ev.source==='official' || (!ev.source && ev.category!=='council');
      if(isOfficial) return false; // 학사 달력에는 학사일정을 항상 숨김 (학사일정 탭에서만 확인)
      // 개인 일정은 만든 사람에게만 보인다. 모두가 한 문서(shared/calendarEvents)를 같이 쓰다
      // 보니 걸러내지 않으면 49명의 개인 일정이 서로의 달력에 전부 떠버린다.
      if(isPersonalEvent(ev) && !isMyEvent(ev)) return false;
      return true;
    }),
    ...(state.showCouncilEvents ? pollDeadlineEvents : []),
  ];

  // 공휴일 날짜 숫자는 일·토처럼 항상 빨갛게 보여준다(학사일정 숨김 필터와 무관하게).
  // 판정은 공용 isHolidayDate()가 하며, 학사일정에 없는 공휴일(공공데이터포털 목록)까지
  // 같이 잡히므로 예전보다 빠지는 날이 없다.

  let calCells = '';
  const weekdays = [
    { label:'일', cls:'sun' }, { label:'월', cls:'' }, { label:'화', cls:'' },
    { label:'수', cls:'' }, { label:'목', cls:'' }, { label:'금', cls:'' }, { label:'토', cls:'sat' }
  ];
  const headHtml = weekdays.map(w => `<div class="cal-head ${w.cls}">${w.label}</div>`).join('');

  for(let i = firstDayIndex - 1; i >= 0; i--){
    calCells += `<div class="cal-day other-month"><span class="day-num">${prevTotalDays - i}</span></div>`;
  }
  for(let d = 1; d <= totalDays; d++){
    const curDateStr = `${y}-${pad(m)}-${pad(d)}`;
    const dayOfWeek = new Date(y, m - 1, d).getDay();
    const dayEvents = allEvents.filter(ev => ev.startDate <= curDateStr && ev.endDate >= curDateStr);
    const isToday = curDateStr === todayStr();
    const isSelected = curDateStr === state.selectedExamDate;

    let dayCls = '';
    if(dayOfWeek === 0) dayCls = 'sun';
    else if(dayOfWeek === 6) dayCls = 'sat';
    if(isHolidayDate(curDateStr)) dayCls = (dayCls + ' holiday').trim();

    const hasMemo = !!(state.memos && (state.memos[curDateStr]||'').trim());
    let dots = '';
    if(dayEvents.length > 0 || hasMemo){
      dots = `<div class="cal-dots">${dayEvents.map(e => `<span class="cal-dot" style="background:${e.color || (e.category==='council'?'var(--crimson)':'var(--blue)')}"></span>`).join('')}${hasMemo?`<span class="cal-dot memo-dot" style="background:var(--teal)"></span>`:''}</div>`;
    }
    calCells += `
      <div class="cal-day ${dayCls} ${isToday?'today':''} ${isSelected?'selected-day':''}" data-action="select-exam-date" data-date="${curDateStr}">
        <span class="day-num">${d}</span>
        ${dots}
      </div>`;
  }
  const remaining = (7 - ((firstDayIndex + totalDays) % 7)) % 7;
  for(let i = 1; i <= remaining; i++){
    calCells += `<div class="cal-day other-month"><span class="day-num">${i}</span></div>`;
  }

  const selectedEvents = allEvents.filter(ev => ev.startDate <= state.selectedExamDate && ev.endDate >= state.selectedExamDate);
  const council = isCouncil();

  return `
    <div class="meal-nav">
      <button data-action="cal-month-prev">${ICON.chevL}</button>
      <span class="meal-date">${fmtMonthLabel(calMonth)}</span>
      <button data-action="cal-month-next">${ICON.chevR}</button>
    </div>

    <div class="card" style="padding:10px 8px; margin-bottom:12px;">
      <div class="cal-grid" style="margin-bottom:0;">
        ${headHtml}
        ${calCells}
      </div>
    </div>

    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <button class="btn btn-teal btn-sm" data-action="add-student-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 일정 추가</button>
      <button class="btn btn-primary btn-sm" data-action="add-exam-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 시험 추가</button>
      ${council ? `<button class="btn btn-blue btn-sm" data-action="add-council-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 학생회 일정</button>` : ''}
    </div>

    ${(()=>{
      const memoText = (state.memos && state.memos[state.selectedExamDate]) || '';
      return `
      <div class="card" style="margin-bottom:12px;">
        <div class="row-between" style="margin-bottom:8px;">
          <div class="section-title" style="margin:0; color:var(--teal);">${ICON.clipboard} 내 메모</div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="edit-memo" data-date="${state.selectedExamDate}" style="width:auto; padding:3px 10px; font-size:10.5px;">${memoText ? `${ICON.pencil} 수정` : `${ICON.plus} 작성`}</button>
        </div>
        ${memoText
          ? `<div class="memo-text" data-action="edit-memo" data-date="${state.selectedExamDate}">${escapeHtml(memoText)}</div>`
          : `<p class="memo-empty" data-action="edit-memo" data-date="${state.selectedExamDate}">과제 · 준비물 등 이 날 기억할 것을 적어두세요. 나만 볼 수 있어요.</p>`}
      </div>`;
    })()}

    <div class="card">
      <div class="section-title" style="margin:2px 0 10px; color:var(--teal);">${ICON.calendar} ${fmtDateLabel(state.selectedExamDate)} 일정 목록</div>
      ${selectedEvents.length ? selectedEvents.map(ev => {
        // isPollDeadline(투표 마감 안내로 자동 생기는 항목)은 실체가 없는 일정이라
        // 수정·삭제 둘 다 못 한다.
        const canManage = !ev.isPollDeadline && ((state.user && ev.authorId === state.user.studentId) || myLevel() >= 2);
        const parsed = parseEventDetails(ev.description);
        const hasDetail = parsed.time || parsed.room || parsed.description;
        return `
        <div class="list-item" style="padding:10px 0;">
          <div class="row-between" style="${hasDetail || canManage ? 'cursor:pointer;' : ''}" ${hasDetail || canManage ? `data-action="toggle-event-detail" data-id="${ev.id}"` : ''}>
            <div style="display:flex; align-items:center; gap:8px; min-width:0;">
              <span style="width:10px; height:10px; border-radius:50%; background:${ev.color || (ev.category==='council'?'var(--crimson)':'var(--blue)')}; display:inline-block; flex-shrink:0;"></span>
              <b style="font-size:13px;">${escapeHtml(ev.title)}</b>
              ${(()=>{
                // 개인 일정은 저장할 때 분류를 'academic'으로 넣는데(폼에 분류 선택이 없어서
                // 기본값이 그렇게 박혀 있다), 그 값을 그대로 표시하면 내가 만든 "스터디"에

                const isPersonalPlain = ev.source === 'personal' && ev.category === 'academic';

            </div>
            ${(hasDetail || canManage) ? `<span class="sub ev-detail-chev" id="ev-chev-${ev.id}" style="transition:transform .15s; display:inline-flex; flex-shrink:0;">${ICON.chevR}</span>` : ''}

          <!-- 시간·장소·메모·수정·삭제는 평소엔 접어두고, 위 줄을 눌러야 펼쳐진다 — 목록이
               한 줄씩 짧게 보이게 하려는 것. 수정·삭제는 실수로 안 눌리게 펼친 안쪽에,

          ${(hasDetail || canManage) ? `
          <div id="ev-detail-${ev.id}" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">

                ${parsed.time ? `<span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-dim);">${ICON.clock} ${escapeHtml(parsed.time)}</span>` : ''}
                ${parsed.room ? `<span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-dim);">${ICON.pin} ${escapeHtml(parsed.room)}</span>` : ''}

// 날짜별 개인 메모 편집 — 남에게 보이지 않는 내 메모라 별도 권한 확인이 필요 없다.

function memoReminderId(dateStr){ return `memo_${dateStr}`; }
// reminder: 모달을 열기 전에 미리 읽어둔 기존 알림 예약(없으면 null).

        <p style="font-size:10.5px; color:var(--text-faint); margin:6px 2px 0;"><span id="memo-count">${text.length}</span> / ${MEMO_MAX_CHARS}자</p>
      </div>
      ${reminderFieldsHtml({

        enabled: !!reminder,
        dateStr: remindAt ? fmtDateStr(remindAt) : dateStr,
        timeStr: (reminder && reminder.repeatTime) || (remindAt ? `${pad(remindAt.getHours())}:${pad(remindAt.getMinutes())}` : '09:00'),
        repeatKind: (reminder && reminder.repeat && reminder.repeat.kind) || 'none',
        repeatDays: (reminder && reminder.repeat && reminder.repeat.days) || [],
      })}
      <div class="modal-actions" style="display:flex; gap:8px;">
        ${text ? `<button type="button" class="btn btn-danger" data-action="delete-memo" data-date="${dateStr}" style="flex:1;">삭제</button>` : ''}
        <button type="submit" class="btn btn-primary" style="flex:1.6;">저장</button>

function setupMemoModalListeners(){
  const ta = document.getElementById('memo-content');
  const counter = document.getElementById('memo-count');
  if(ta && counter) ta.oninput = ()=>{ counter.textContent = ta.value.length; };
  if(ta) ta.focus();
}
async function handleMemoSubmit(fd){
  if(!state.user) return;
  const date = fd.get('date');
  const content = (fd.get('content')||'').trim();
  const next = { ...(state.memos||{}) };
  if(content) next[date] = content;
  else delete next[date]; // 내용을 비우면 그 날 메모는 지운다
  const ok = await saveMemos(state.user.uid, next);
  if(ok){ state.memos = next; pushWidgetData(); }
  if(ok){
    // 메모를 비워서 지운 경우엔 알림도 같이 없앤다 — 없는 메모의 알림이 올 이유가 없다.
    if(!content) await deleteScheduleReminder(memoReminderId(date));
    else await syncScheduleReminder(fd, {
      id: memoReminderId(date),
      title: `${fmtDateLabel(date)} 메모`,
      startDate: date,
    }, false);
  }
  closeModal();
  renderMain();
  if(ok) toast(content ? '메모를 저장했어요' : '메모를 지웠어요');
  else if(LAST_SAVE_ERROR !== 'memo-too-large') saveResultToast(false);
}
async function deleteMemo(dateStr){
  if(!state.user) return;
  if(!await showConfirm('이 날 메모를 지울까요?', { danger:true, okLabel:'삭제' })) return;
  const next = { ...(state.memos||{}) };
  delete next[dateStr];
  const ok = await saveMemos(state.user.uid, next);
  if(ok) state.memos = next;
  if(ok) await deleteScheduleReminder(memoReminderId(dateStr));
  closeModal();
  renderMain();
  toast(ok ? '메모를 지웠어요' : '삭제에 실패했어요');
}

function setupExamModalListeners(){
  // 예전에는 <select>였고 지금은 팝업이 값을 넣는 hidden input이다. 둘 다 change를 쏘므로
  // 이 아래 로직(과목을 고르면 시험명·장소·시간 자동 채우기)은 그대로 쓴다.
  const select = document.getElementById('exam-class-select');
  if(!select) return;
  select.onchange = ()=>{
    const subject = select.value;
    const titleInp = document.getElementById('exam-title-input');
    const roomInp = document.getElementById('exam-room-input');
    const timeInp = document.getElementById('exam-time-input');
    if(!subject) return;
    const cls = state.timetable.find(c=>c.subject===subject);
    if(titleInp && !titleInp.value) titleInp.value = `${subject} 시험`;
    if(cls){
      if(roomInp) roomInp.value = cls.room || '';
      if(timeInp) timeInp.value = `${minutesToLabel(cls.start)} ~ ${minutesToLabel(cls.end)}`;
    }
  };
}

async function handleExamSubmit(fd){
  const startDate = fd.get('startDate');
  const eventRoom = (fd.get('event_room')||'').trim();
  const eventTime = (fd.get('event_time')||'').trim();
  const linkedClass = (document.getElementById('exam-class-select')?.value || '').trim();
  let description = (fd.get('description')||'').trim();
  const details = [];
  if(linkedClass) details.push(`연동 수업: ${linkedClass}`);
  if(eventTime) details.push(`시험 시간: ${eventTime}`);
  if(eventRoom) details.push(`시험 장소: ${eventRoom}`);
  if(description) details.push(description);
  description = details.join('\n');

  const id = (fd.get('itemId')||'').trim();
  const latest = await loadCalendar();
  const existing = latest.find(x=>x.id===id);
  const obj = {
    id: id || uid(),
    title: (fd.get('title')||'').trim(),
    startDate, endDate: startDate,
    category: 'exam', source: 'personal',
    color: fd.get('color') || COLORS[2].hex,
    linkedClassSubject: linkedClass || '',
    description,
    // 수정일 때는 원래 작성자를 유지한다(handleEventSubmit과 같은 이유).
    authorId: existing ? existing.authorId : state.user.studentId,
    authorRole: existing ? existing.authorRole : myRole(),
    updatedAt: now()
  };
  const next = existing ? latest.map(x=>x.id===obj.id ? {...x, ...obj} : x) : [...latest, obj];
  const ok = await saveCalendar(next);
  state.calendar = next;
  // 시험 일정은 개인 일정이라 전교생 발송은 없고 본인에게만 간다.
  if(ok) await syncScheduleReminder(fd, obj, false);
  closeModal();
  renderMain();
  saveResultToast(ok, id ? '시험 일정이 수정되었습니다' : '시험 일정이 등록되었습니다');
}

/* ===== 셔틀버스 ===== */
// 기본 골격: 토요일은 운행 없음, 일요일은 별도 표, 평일(월~금) 중 금요일만 특정 회차(NO)가
// 운휴한다. fridayOffNos는 서버가 안내문에서 파싱해둔 값.
//
// 여기에 공휴일 규칙이 얹힌다. 학교는 "쉬는 구간"(= 주말과 공휴일이 끊기지 않고 이어진 묶음)
// 단위로 셔틀을 돌린다:
//   - 쉬는 날에는 기본적으로 운행하지 않는다.
//   - 쉬는 구간이 시작되기 직전의 마지막 평일은 금요일 시간표로 돈다.
//     (금요일이 공휴일이면 그 금요일은 쉬는 구간에 들어가므로, 목요일이 금요일 시간표가 된다)
//   - 쉬는 구간의 마지막 날 하루만 일요일 시간표로 돈다.
//     (월요일이 공휴일이면 토·일·월이 한 구간이라 일요일은 미운행이고 월요일이 일요일 시간표)
// 원래 금·일요일이던 날이 이 규칙 때문에 바뀌는 경우가 있어, 화면에 "공휴일 시간표"라고
// 따로 표시할 수 있도록 판정 결과에 label을 같이 실어 보낸다.
function isShuttleFridayOff(no){ return (state.shuttle.fridayOffNos||[]).includes(String(no)); }
// 쉬는 구간이 아무리 길어도 이 정도면 충분하다(연휴+주말 최장 10일 남짓). 공휴일 데이터가
// 깨져서 "전부 쉬는 날"로 보이는 사고가 나도 무한 루프에 빠지지 않게 하는 상한이기도 하다.
const SHUTTLE_REST_RUN_MAX = 14;
function shiftDateStr(dateStr, days){
  const d = parseDateStr(dateStr); d.setDate(d.getDate()+days); return fmtDateStr(d);
}
// dateStr을 포함하는 연속된 쉬는 날 묶음의 마지막 날을 돌려준다. 쉬는 날이 아니면 null.
function shuttleRestRunEnd(dateStr){
  if(!isRestDay(dateStr)) return null;
  let end = dateStr;
  for(let i=0;i<SHUTTLE_REST_RUN_MAX;i++){
    const next = shiftDateStr(end, 1);
    if(!isRestDay(next)) break;
    end = next;
  }
  return end;
}
function shuttleRowsForDate(d){
  const dateStr = d instanceof Date ? fmtDateStr(d) : String(d);
  const day = parseDateStr(dateStr).getDay(); // 0=일 ... 6=토
  const weekdayRows = state.shuttle.weekday||[];
  const fridayRows = weekdayRows.filter(r=>!isShuttleFridayOff(r.no));
  const sundayRows = state.shuttle.sunday||[];

  if(isRestDay(dateStr)){
    // 쉬는 구간의 마지막 날만 일요일 시간표로 운행하고, 나머지 쉬는 날은 미운행.
    const isRunEnd = shuttleRestRunEnd(dateStr) === dateStr;
    if(!isRunEnd) return { type:'none', rows: [], label: day===6 ? '' : '공휴일 · 운행 없음' };
    // 원래 일요일이면 평소와 같은 것이라 굳이 "공휴일 시간표"라고 알릴 필요가 없다.
    return { type:'sunday', rows: sundayRows, label: day===0 ? '' : '공휴일 시간표 (일요일 시간표)' };
  }

  // 평일 — 내일부터 쉬는 구간이 시작되면 금요일 시간표를 쓴다.
  if(isRestDay(shiftDateStr(dateStr, 1))){
    return { type:'weekday', rows: fridayRows, label: day===5 ? '' : '공휴일 시간표 (금요일 시간표)' };
  }
  return { type:'weekday', rows: weekdayRows, label:'' };
}
function shuttleParseMinutes(str){
  const m = String(str||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
// 학교 페이지 안내에 따르면 실제 "타는 곳"은 학교(학술정보원 앞)와 조치원역(뒷편) 두 곳뿐이고,
// 표의 각 칸(학교/조치원역 뒤/오송역)은 서로 이어지는 한 버스의 경로가 아니라 그 지점에서
// 각각 독립적으로 출발하는 시각이다 — 그래서 화살표로 잇지 않고 지점별로 따로 목록·카운트다운을 만든다.
// 일요일 표의 "역뒤" 칸도 같은 조치원역 정류장이라 동일하게 다룬다.
function shuttlePointList(rows, field){
  const items = rows.map(r=>({ no:r.no, time:r[field] })).filter(x=>x.time && /\d{1,2}:\d{2}/.test(x.time));
  // "08:45(2대 운행)"처럼 같은 시각에 버스가 2대 뜨는 회차는 표에 줄이 두 개로 나뉘어 있어서
  // 목록에 똑같은 칸이 두 번 찍힌다 — 표시용 목록에서는 하나로 합친다(카운트다운은 원본 행을
  // 그대로 쓰기 때문에 여기서 합쳐도 다음 출발 계산에는 영향이 없다).
  const seen = new Set();
  return items.filter(x=>{
    if(seen.has(x.time)) return false;
    seen.add(x.time);
    return true;
  });
}
// 지금부터 가장 가까운 출발 시각을 찾는다. point는 'school'(학교) 또는 'mid'(조치원역/역뒤).
// 오늘 남은 회차가 없으면 최대 7일 뒤까지 다음 운행일을 넘겨가며 찾는다.
function nextShuttleDeparture(point, from){
  from = from || new Date();
  for(let add=0; add<8; add++){
    const d = new Date(from); d.setDate(d.getDate()+add); d.setHours(0,0,0,0);
    const { type, rows } = shuttleRowsForDate(d);
    if(type==='none') continue;
    const field = point==='school' ? 'school' : (type==='sunday' ? 'station' : 'jochiwon');
    for(const r of rows){
      const mins = shuttleParseMinutes(r[field]);
      if(mins==null) continue;
      const dep = new Date(d); dep.setMinutes(mins);
      if(dep.getTime() > from.getTime()) return { dep, no:r.no };
    }
  }
  return null;
}
function fmtShuttleCountdown(ms){
  if(ms<=0) return '곧 출발';
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  if(h>0) return `${h}시간 ${pad(m)}분 ${pad(s)}초`;
  return `${pad(m)}분 ${pad(s)}초`;
}
// 오늘 그 지점(학교/조치원역)의 첫차 시각을 찾는다. 토요일처럼 아예 운행이 없는 날은 null.
function shuttleFirstDepartureToday(point){
  const d = new Date(); d.setHours(0,0,0,0);
  const { type, rows } = shuttleRowsForDate(d);
  if(type==='none') return null;
  const field = point==='school' ? 'school' : (type==='sunday' ? 'station' : 'jochiwon');
  let earliest = null;
  for(const r of rows){
    const mins = shuttleParseMinutes(r[field]);
    if(mins==null) continue;
    if(earliest==null || mins<earliest) earliest = mins;
  }
  if(earliest==null) return null;
  const dep = new Date(d); dep.setMinutes(earliest);
  return dep;
}
// 첫차 1시간 전부터는 카운트다운이 이미 돌고 있어야 한다("7시 30분부터 카운트다운
// 시작"이 아니라, 첫차가 8시 30분이면 그 1시간 전인 7시 30분부터 그 8시 30분을 향해
// 세는 것). 그 전엔 몇 시부터 시작하는지만 알려주고, 막차가 지났으면(다음 차가 내일
// 것으로 넘어가면) 오늘은 끝난 걸로 본다.
// 오늘 어떤 시간표로 도는지 한 줄로 알려주는 문구. 평소(평일은 평일표, 일요일은 일요일표)엔
// 빈 문자열이고, 공휴일 규칙 때문에 평소와 다른 표가 적용될 때만 값이 있다.
function shuttleTodayLabel(){ return shuttleRowsForDate(new Date()).label || ''; }
function shuttlePointState(point){
  const now = new Date();
  const first = shuttleFirstDepartureToday(point);
  if(!first) return { kind:'none', label: shuttleTodayLabel() };
  if(now.getTime() < first.getTime() - 3600000) return { kind:'before', first };
  const next = nextShuttleDeparture(point, now);
  if(!next || next.dep.toDateString() !== now.toDateString()) return { kind:'after' };
  return { kind:'live', next };
}
function shuttleCountdownCard(point, label){
  const labelHtml = `<b style="color:var(--teal);">${label}</b>에서 출발까지`;
  const st = shuttlePointState(point);
  if(st.kind==='none') return `
    <div class="card" style="text-align:center; padding:11px 10px;">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">${labelHtml}</div>
      <div style="font-size:19px; font-weight:800; color:var(--text-faint); font-family:var(--font-mono);">--:--</div>
      <div style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">${st.label ? '공휴일이라 운행하지 않아요' : '오늘은 운행하지 않아요'}</div>
    </div>`;
  if(st.kind==='before') return `
    <div class="card" style="text-align:center; padding:11px 10px;">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">${labelHtml}</div>
      <div style="font-size:19px; font-weight:800; color:var(--text-faint); font-family:var(--font-mono);">--:--</div>
      <div style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">${pad(st.first.getHours())}:${pad(st.first.getMinutes())}부터 운행을 시작해요</div>
    </div>`;
  if(st.kind==='after') return `
    <div class="card" style="text-align:center; padding:11px 10px;">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">${labelHtml}</div>
      <div style="font-size:19px; font-weight:800; color:var(--text-faint);">운행 종료</div>
      <div style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">오늘 운행이 모두 끝났어요</div>
    </div>`;
  const next = st.next;
  const ms = next.dep.getTime() - Date.now();
  return `
    <div class="card" style="text-align:center; padding:11px 10px;">
      <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">${labelHtml}</div>
      <div class="shuttle-countdown-val" data-point="${point}" style="font-size:19px; font-weight:800; color:var(--crimson);">${fmtShuttleCountdown(ms)}</div>
      <div style="font-size:10.5px; color:var(--text-faint); margin-top:3px;">${pad(next.dep.getHours())}:${pad(next.dep.getMinutes())} 출발</div>
    </div>`;
}
// 홈 화면용 한 줄짜리 축약 카드. 전체 카운트다운 카드(shuttleCountdownCard)와 달리 한 줄에
// "지점에서 출발까지" + 남은 시간만 보여주고, 누르면 셔틀버스 탭(전체 카운트다운·시간표)으로 이동한다.
// 실시간 갱신은 shuttleCountdownCard와 같은 .shuttle-countdown-val 클래스를 공유해서 setupShuttleTimer가 그대로 처리한다.
// 학교·조치원역 두 지점을 한 박스 안에 줄만 나눠서 보여준다(각 줄이 따로 카드가 아님).
// 두 줄 다 같은 셔틀버스 탭으로 이동하고, 실시간 갱신은 여전히 .shuttle-countdown-val + data-point로 처리된다.
function shuttleHomeMiniRow(point, label){
  const st = shuttlePointState(point);
  let valHtml;
  if(st.kind==='none') valHtml = `<span style="color:var(--text-faint);">${st.label ? '공휴일 운휴' : '오늘은 운행하지 않아요'}</span>`;
  else if(st.kind==='before') valHtml = `<span style="color:var(--text-faint);">${pad(st.first.getHours())}:${pad(st.first.getMinutes())}부터 운행</span>`;
  else if(st.kind==='after') valHtml = `<span style="color:var(--text-faint);">운행 종료</span>`;
  else {
    const ms = st.next.dep.getTime() - Date.now();
    valHtml = `<span class="shuttle-countdown-val" data-point="${point}" style="font-weight:800; color:var(--crimson); font-family:var(--font-mono);">${fmtShuttleCountdown(ms)}</span>`;
  }
  return `
    <span style="font-size:11.5px; color:var(--text-dim);"><b style="color:var(--teal);">${label}</b>에서 출발까지</span>
    <span style="font-size:12.5px;">${valHtml}</span>`;
}
function shuttleHomeMiniCard(){
  return `
    <div class="card" data-action="go-shuttle-tab" style="cursor:pointer; padding:4px 14px;">
      <div class="row-between" style="gap:8px; padding:3px 0;">${shuttleHomeMiniRow('school', '학교')}</div>
      <div class="row-between" style="gap:8px; padding:3px 0; border-top:1px solid var(--border);">${shuttleHomeMiniRow('mid', '조치원역')}</div>
    </div>`;
}
// 오송역 방면 회차는 표에서 두 가지 형태로 섞여 있다 — ①오송역 칸에 시각이 바로 적힌
// 회차(오송역에서 출발)와 ②학교 칸에 시각이 있고 조치원역·오송역 칸엔 "경유"/"도착"이라는
// 글자만 있는 회차(학교에서 출발해 오송역까지 가는 연장 노선). 시각만 나열하면 어디서
// 타는 버스인지 구분이 안 가서, 출발지 이름표를 붙인 칩으로 따로 보여준다.
function shuttleOsongEntries(weekdayRows){
  const entries = [];
  weekdayRows.forEach(r=>{
    if(r.osong && /\d{1,2}:\d{2}/.test(r.osong)){
      entries.push({ time: r.osong.match(/\d{1,2}:\d{2}/)[0], label:'오송역 출발' });
    } else if(r.osong && !/\d{1,2}:\d{2}/.test(r.osong) && r.school && /\d{1,2}:\d{2}/.test(r.school)){
      entries.push({ time: r.school.match(/\d{1,2}:\d{2}/)[0], label:'학교 출발' });
    }
  });
  return entries;
}
// 오송역 목록은 학교·조치원역처럼 항상 "다음 회차"를 강조하면 출발이 몇 시간 남았어도
// 빨갛게 보여서 눈에 안 띄는 표시가 된다 — 그래서 출발 15분 전부터만 빨갛게 강조한다.
function shuttleOsongDueSoonTime(entries){
  const nowD = new Date();
  for(const e of entries){
    const [h,m] = e.time.split(':').map(Number);
    const dep = new Date(nowD); dep.setHours(h,m,0,0);
    const diffMin = (dep.getTime()-nowD.getTime())/60000;
    if(diffMin>=0 && diffMin<=15) return e.time;
  }
  return null;
}
// 카운트다운이 가리키는 바로 그 다음 출발 시각을, 아래 전체 목록에서도 같은 시각을 찾아
// 빨갛게 강조해준다 — 일요일로 넘어간 경우엔 일요일 목록 쪽이 강조되도록 요일까지 맞춰본다.
function shuttleNextHighlights(){
  const school = nextShuttleDeparture('school');
  const mid = nextShuttleDeparture('mid');
  const fmt = (n) => n ? { time: `${pad(n.dep.getHours())}:${pad(n.dep.getMinutes())}`, isSunday: n.dep.getDay()===0 } : null;
  return { school: fmt(school), mid: fmt(mid) };
}
function setupShuttleTimer(){
  if(state.shuttleTimer){ clearInterval(state.shuttleTimer); state.shuttleTimer=null; }
  // 셔틀버스 탭뿐 아니라, 홈 화면의 축약 카운트다운 카드(shuttleHomeMiniCard)가 보일 때도 돌아가야 한다.
  const homeShuttleVisible = state.view==='home' && !getHomePrefs().hideShuttle;
  if(!((state.view==='info' && state.infoTab==='shuttle') || homeShuttleVisible)) return;
  let lastSvc = shuttlePointState('school').kind + shuttlePointState('mid').kind;
  state.shuttleTimer = setInterval(()=>{
    // 운행 전/운행 종료/운행 없음 같은 "상태"가 바뀌는 순간(첫차 1시간 전·막차 이후·자정 등)에는
    // 카운트다운 숫자만 고쳐서는 안 되고 카드 전체를 다시 그려야 한다.
    const svc = shuttlePointState('school').kind + shuttlePointState('mid').kind;
    if(svc !== lastSvc){ lastSvc = svc; renderMain(); return; }
    let needsRerender = false;
    document.querySelectorAll('.shuttle-countdown-val').forEach(el=>{
      const point = el.dataset.point;
      const next = nextShuttleDeparture(point);
      if(!next){ needsRerender = true; return; }
      const ms = next.dep.getTime() - Date.now();
      if(ms<=0){ needsRerender = true; return; }
      el.textContent = fmtShuttleCountdown(ms);
    });
    if(needsRerender) renderMain();
  }, 1000);
}

/* ===== 학식 파싱 ===== */
function cellMenuText(td){
  if(!td) return '';
  const target = td.querySelector('p.offTxt') || td.querySelector('p') || td;
  const clone = target.cloneNode(true);
  clone.querySelectorAll('br').forEach(br=>br.replaceWith(document.createTextNode('\n')));
  const rawLines = clone.textContent.replace(/\u00a0/g,' ')
    .split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);

  // "kcal" 표기와 그 바로 뒤에 오는 칼로리 숫자 줄은 가독성을 위해 함께 제거
  const lines = [];
  for(let i=0;i<rawLines.length;i++){
    const line = rawLines[i];
    if(/^kcal$/i.test(line)){
      if(i+1<rawLines.length && /^\d+$/.test(rawLines[i+1])) i++; // 다음 줄(칼로리 숫자)도 같이 건너뜀
      continue;
    }
    lines.push(line);
  }

  return lines.join(', ')
    // 알레르기 유발성분 번호 괄호(예: (1,2,4,5,6))는 화면에 필요 없으므로 제거
    .replace(/\s*\(\s*\d+(?:\s*,\s*\d+)*\s*\)/g, '')
    // 혹시 한 줄에 "kcal 1001"처럼 붙어 나오는 경우까지 대비한 안전망
    .replace(/,?\s*kcal,?\s*\d+/gi, '')
    // 위 과정에서 생길 수 있는 중복/끝자락 콤마 정리
    .replace(/\s*,\s*,/g, ',').replace(/^\s*,\s*|\s*,\s*$/g, '');
}
// <thead> 태그가 명시적으로 없는 표(첫 <tr>이 헤더 역할만 하는 경우)도 인식하도록,
// thead가 있으면 그 안의 th/td를, 없으면 표의 첫 번째 행을 헤더로 사용한다.
function getTableHeaderCells(table){
  const theadCells = Array.from(table.querySelectorAll('thead th, thead td'));
  if(theadCells.length) return theadCells;
  const firstRow = table.querySelector('tr');
  return firstRow ? Array.from(firstRow.children) : [];
}
// 표 하나의 날짜별 조/중/석식 데이터를 뽑아낸다 (어느 식단인지는 여기서 정하지 않음)
function extractDietData(table, baseYear, baseMonth){
  const headCells = getTableHeaderCells(table);
  if(headCells.length < 2) return null;
  const dateCols = headCells.slice(1).map(th=>{
    const m=(th.textContent||'').match(/(\d{1,2})\s*\.\s*(\d{1,2})/);
    if(!m) return null;
    const mm=parseInt(m[1],10), dd=parseInt(m[2],10);
    const year = (baseMonth===12 && mm===1) ? baseYear+1 : baseYear;
    return `${year}-${pad(mm)}-${pad(dd)}`;
  });
  if(dateCols.every(d=>!d)) return null;

  const data={};
  dateCols.forEach(d=>{ if(d) data[d]={breakfast:'',lunch:'',dinner:'',note:''}; });

  // thead가 없어 헤더 행이 tbody(또는 브라우저가 자동 삽입한 암묵적 tbody)에 섞여 들어온 경우에도
  // 대비해, 실제 메뉴 행만 걸러서 처리한다(헤더 행은 조식/중식/석식으로 시작하지 않으므로 자연히 걸러짐).
  Array.from(table.querySelectorAll('tbody tr, tr')).forEach(row=>{
    const cells = Array.from(row.children);
    if(cells.length < 2) return;
    let labelTxt = (cells[0].textContent||'').replace(/\u00a0/g,' ').trim();
    // 괄호 안 시간 표기(예: (11:30~13:30))는 메뉴 데이터가 아니므로 파싱 대상에서 제외
    labelTxt = labelTxt.replace(/\(\s*\d{1,2}:\d{2}\s*[~\-]\s*\d{1,2}:\d{2}\s*\)/g,'').trim();

    // "중식 - 한식" / "중식-일품" / "중식 분식" 처럼 식사명 뒤에 붙는 서브카테고리(한식/일품/분식/plus 등)를 분리
    const mealMatch = labelTxt.match(/^(조식|아침|중식|점심|석식|저녁)\s*[-–·:]?\s*(.*)$/);
    if(!mealMatch) return;
    const mealWord = mealMatch[1];
    const subCategory = (mealMatch[2]||'').trim();

    let key=null;
    if(mealWord==='조식'||mealWord==='아침') key='breakfast';
    else if(mealWord==='중식'||mealWord==='점심') key='lunch';
    else if(mealWord==='석식'||mealWord==='저녁') key='dinner';
    if(!key) return;

    cells.slice(1).forEach((td,i)=>{
      const date = dateCols[i];
      if(!date || !data[date]) return;
      const text = cellMenuText(td);
      if(!text) return;
      if(/휴무|공휴일|미운영|휴일|대체공휴일/.test(text) && text.length<40){ data[date].note=text; return; }
      // 서브카테고리가 있으면 (한식/일품/분식/plus 등) 메뉴 앞에 표시해 구분되게 저장
      const entry = subCategory ? `[${subCategory}] ${text}` : text;
      data[date][key] = data[date][key] ? data[date][key] + '\n' + entry : entry;
    });
  });
  return data;
}
// 표가 실제 DOM에서 "형제 요소"로 라벨과 붙어있지 않아도(감싸는 div 구조가 달라도) 항상 맞게 매칭되도록,
// 페이지 전체 텍스트에서 "교직원 식단표"/"학생 식단표"가 나오는 순서와 실제 날짜표가 나오는 순서를 그대로 짝짓는다.
function parseMealTables(dom){
  const bodyText = (dom.body && dom.body.textContent) || '';
  const rawLabels = [...bodyText.matchAll(/(교직원|학생)\s*식단표/g)].map(m=>m[1]);
  const labels = rawLabels.filter((v,i)=> i===0 || v!==rawLabels[i-1]); // 같은 라벨이 문단+캡션으로 연달아 나오는 것 정리

  const tables = Array.from(dom.querySelectorAll('table')).filter(t=>{
    const headCells = getTableHeaderCells(t);
    const headText = headCells.map(c=>c.textContent||'').join(' ');
    return /\d{1,2}\s*\.\s*\d{1,2}/.test(headText);
  });

  const ym = bodyText.match(/(\d{4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
  const baseYear = ym ? parseInt(ym[1],10) : new Date().getFullYear();
  const baseMonth = ym ? parseInt(ym[2],10) : (new Date().getMonth()+1);

  const results = [];
  tables.forEach((table,i)=>{
    const kind = labels[i]==='교직원' ? 'staff' : (labels[i]==='학생' ? 'student' : null);
    if(!kind) return;
    const data = extractDietData(table, baseYear, baseMonth);
    if(data) results.push({ kind, data });
  });
  return results;
}

async function fetchMealFromSource(silent=false){
  const statusEl = document.getElementById('fetch-meal-status');
  const btn = document.getElementById('fetch-meal-btn');

  const proxies = [
    u => 'https://proxy.cors.sh/' + u,
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
  ];
  const PROXY_TIMEOUT_MS = 7000; // 프록시 하나가 응답이 없을 때 다음으로 빨리 넘어가도록 제한(특히 모바일 네트워크 대비)
  const fetchWithTimeout = (url)=>{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), PROXY_TIMEOUT_MS);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(()=>clearTimeout(t));
  };

  const fail = (msg)=>{
    if(btn) btn.disabled=false;
    if(!silent){
      if(statusEl) statusEl.innerHTML = `<span style="color:var(--danger);">${escapeHtml(msg)}</span><br><span style="color:var(--text-faint);">공식 페이지에서 확인하시거나 직접 입력해주세요.</span>`;
      toast('식단을 불러오지 못했습니다');
    }
  };

  let html=null;
  for(const gen of proxies){
    try{
      const res = await fetchWithTimeout(gen(MEAL_SOURCE_URL));
      if(!res.ok) continue;
      let t = await res.text();
      try{ const j=JSON.parse(t); if(j && j.contents) t=j.contents; }catch(_){}
      if(t && t.length>500 && /<table/i.test(t) && /식단|offTxt|dietMa/.test(t)){ html=t; break; }
    }catch(e){}
  }
  if(!html){ fail('식단 페이지에 접근하지 못했습니다 (프록시 응답 없음).'); return; }

  try{
    const dom = new DOMParser().parseFromString(html,'text/html');
    const results = parseMealTables(dom);
    if(results.length===0){ fail('식단표 구조를 인식하지 못했습니다.'); return; }

    const next = { ...state.meals };
    let dayCount=0;
    results.forEach(({kind,data})=>{
      Object.entries(data).forEach(([date,v])=>{
        const prev = next[date] || {};
        if(kind==='student'){
          next[date] = { ...prev, student:(v.breakfast||v.lunch||v.dinner||v.note)?{ breakfast:v.breakfast, lunch:v.lunch, dinner:v.dinner, note:v.note||'' }:null, updatedAt:now() };
        } else {
          next[date] = { ...prev, staff:(v.lunch||v.note)?{ lunch:v.lunch, note:v.note||'' }:null, updatedAt:now() };
        }
        if(v.breakfast||v.lunch||v.dinner||v.note) dayCount++;
      });
    });

    state.meals = next;
    const ok = await saveMeals(next);
    if(!silent){
      renderMain();
      saveResultToast(ok, '최신 식단을 동기화했습니다');
    } else if(state.view==='info' && state.infoTab==='meal'){
      renderMain();
    }
  }catch(err){
    fail('식단표 파싱 중 오류가 발생했습니다.');
    return;
  }
  if(btn) btn.disabled=false;
}

/* ===== 학과 공지 실시간 파싱 ===== */
function parseDeptNoticeTable(dom){
  const table = dom.querySelector('table.board-table') || Array.from(dom.querySelectorAll('table')).find(t=>t.querySelector('a[href*="artclView.do"]'));
  if(!table) return [];
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  return rows.map(tr=>{
    const link = tr.querySelector('a[href*="artclView.do"]');
    if(!link) return null;
    let title = (link.textContent||'').replace(/\s+/g,' ').trim();
    if(!title) return null;
    let href = link.getAttribute('href') || '';
    if(href && !/^https?:\/\//.test(href)){
      href = 'https://aisemi.korea.ac.kr' + (href.startsWith('/') ? href : '/'+href);
    }
    const dateEl = tr.querySelector('.td-date, td.date, td:last-child');
    let date = dateEl ? dateEl.textContent.trim() : '';
    if(!/^\d{4}[.\-]\d{2}[.\-]\d{2}$/.test(date)) date = '';
    return { title, href, date };
  }).filter(Boolean).slice(0,8);
}

async function fetchDeptNoticesFromSource(silent=false){
  const statusEl = document.getElementById('dept-notice-status');
  const setBtnDisabled = (v)=>{ const b = document.getElementById('dept-notice-refresh-btn'); if(b) b.disabled = v; };
  setBtnDisabled(true);
  if(statusEl && !silent){ statusEl.style.display='block'; statusEl.innerHTML = '<span style="color:var(--teal);">학과 게시판에서 공지를 불러오는 중…</span>'; }

  const proxies = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    u => 'https://proxy.cors.sh/' + u,
  ];
  const PROXY_TIMEOUT_MS = 7000; // 프록시 하나가 응답이 없을 때 다음으로 빨리 넘어가도록 제한
  const fetchWithTimeout = (url)=>{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), PROXY_TIMEOUT_MS);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(()=>clearTimeout(t));
  };

  const fail = (msg)=>{
    if(statusEl){
      if(!silent){ statusEl.style.display='block'; statusEl.innerHTML = `<span style="color:var(--danger);">${escapeHtml(msg)}</span>`; }
      else statusEl.style.display='none';
    }
    if(!silent) toast('학과 공지를 불러오지 못했습니다');
  };

  // 새로고침 버튼은 어떤 경로로 함수가 끝나든(성공/실패/예외/타임아웃) 항상 다시 눌러줄 수 있도록
  // finally에서 한 번에 풀어준다 (DOM이 중간에 다시 그려져도 그 시점의 실제 버튼을 다시 찾아서 처리)
  try{
    let html=null;
    for(const gen of proxies){
      try{
        const res = await fetchWithTimeout(gen(DEPT_NOTICE_URL));
        if(!res.ok) continue;
        let t = await res.text();
        try{ const j=JSON.parse(t); if(j && j.contents) t=j.contents; }catch(_){}
        if(t && t.length>500 && /artclView\.do/.test(t)){ html=t; break; }
      }catch(e){}
    }
    if(!html){ fail('학과 게시판에 접근하지 못했습니다.'); return; }

    const dom = new DOMParser().parseFromString(html,'text/html');
    const items = parseDeptNoticeTable(dom);
    if(items.length===0){ fail('공지 목록 구조를 인식하지 못했습니다.'); return; }

    state.deptNotices = items;
    state.deptNoticesUpdatedAt = now();
    const ok = await saveShared('deptNotices', { items, updatedAt: state.deptNoticesUpdatedAt });
    if(statusEl) statusEl.style.display='none';
    if(state.view==='info' && state.infoTab==='calendar') renderMain();
    if(!silent) toast(ok ? '학과 공지를 새로 불러왔습니다' : '불러왔지만 공유 저장에는 실패했습니다');
  }catch(err){
    fail('공지 목록 파싱 중 오류가 발생했습니다.');
  }finally{
    setBtnDisabled(false);
  }
}

/* ===== 따봉(Like) UI 헬퍼 ===== */
function renderLikeUI(item, itemType){
  const likes = item.likes || {};
  const count = Object.keys(likes).length;
  const mySid = state.user ? state.user.studentId : '';
  const hasLiked = !!likes[mySid];
  const isDirectorOrHigher = myLevel() >= 2;

  const likersList = Object.entries(likes).map(([sid, info])=>{
    const name = typeof info==='object' ? info.name : info;
    return `${name} (${sid})`;
  });

  return `
    <div class="like-bar">
      <button type="button" class="btn-like ${hasLiked?'active':''}" data-action="toggle-like" data-type="${itemType}" data-id="${item.id}">
        ${ICON.thumbUp} <span>${count}</span>
      </button>
    </div>
    ${(isDirectorOrHigher && count > 0) ? `
      <details class="likers-accordion">
        <summary>따봉 누른 사람 (${count}명)</summary>
        <div style="margin-top:6px;">${likersList.map(name=>`<span class="voter-badge">${escapeHtml(name)}</span>`).join('')}</div>
      </details>
    ` : ''}`;
}

/* ===== 학생사회 ===== */
function renderCouncil(){
  const tabs = [['notice','공지사항'],['poll','투표'],['recruitment','구인글'],['suggestion','건의'],['social','소셜']];
  const valid = tabs.some(([k])=>k===state.councilTab);
  if(!valid) state.councilTab='notice';
  const labels = tabs.map(([k,l])=>`<div class="subtab ${state.councilTab===k?'active':''}" data-action="council-tab" data-tab="${k}">${l}</div>`).join('');
  let body='';
  if(state.councilTab==='notice') body=renderNoticeTab();
  else if(state.councilTab==='suggestion') body=renderSuggestionTab();
  else if(state.councilTab==='poll') body=renderPollTab();
  else if(state.councilTab==='recruitment') body=renderRecruitmentTab();
  else if(state.councilTab==='social') body=renderSocialTab();
  return `<div class="subtabs">${labels}</div>${body}`;
}

// 공지 사진은 여러 장(최대 3장)을 지원한다. 예전 공지는 imageUrl(단일) 필드로 저장돼 있어서
// 그것도 배열처럼 다룰 수 있게 여기서 한 곳으로 모은다.
function noticeImageList(n){
  if(!n) return [];
  if(Array.isArray(n.imageUrls) && n.imageUrls.length) return n.imageUrls;
  if(n.imageUrl) return [n.imageUrl];
  return [];
}
function noticeImagesHtml(n){
  const imgs = noticeImageList(n);
  if(!imgs.length) return '';
  if(imgs.length===1) return `<div style="margin-top:8px;"><img src="${escapeHtml(imgs[0])}" style="max-width:100%; max-height:240px; border-radius:8px; border:1px solid var(--border); display:block;"></div>`;
  return `<div style="margin-top:8px; display:grid; grid-template-columns:repeat(${imgs.length}, 1fr); gap:6px;">
    ${imgs.map(u=>`<img src="${escapeHtml(u)}" style="width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block;">`).join('')}
  </div>`;
}
// 공지 작성/수정 모달의 미리보기 썸네일 — × 버튼을 누르면 그 장만 빼고 다시 그린다.

}

// 안드로이드 앱이거나 안드로이드 기기의 브라우저·PWA인가(아이폰·PC는 아님).
function isAndroidClient(){ return !!isNativeApp || /Android/i.test(navigator.userAgent || ''); }
// 공지 중 "안드로이드 사용자에게만"으로 올린 것은 안드로이드에서만 보인다. 이 표시를 모르는 옛 앱(APK)은
// 그냥 다 보여주는데, 옛 앱은 어차피 전부 안드로이드라 의도한 대상과 같다.
function visibleNotices(){ return live(state.notices).filter(n => !n.androidOnly || isAndroidClient()); }
// 이름 비공개로 올린 공지: 학생에게는 "학생회"만 보이고, 학생회 안에서는 실제 작성자 이름을 함께 보여준다.
function noticeAuthorHtml(n){
  if(n.displayAs === 'developer') return '개발자';
  if(n.displayAs === 'real') return fmtAuthorBadge(n.author||'', n.authorId, n.authorRole);
  if(!n.anonymous) return fmtAuthorBadge(n.author||'학생회', n.authorId, n.authorRole);
  if(!isCouncil()) return '학생회';
  const u = state.allUsers && state.allUsers[n.authorId];
  // 개발자가 올린 비공개 공지는 학생회 안에서도 이름을 보여주지 않는다(이미 올라간 글도 작성자 직급으로 판단).
  if(n.hideRealName || (u && u.role === 'developer')) return '학생회';
  const real = (u && u.name) || '';
  return real ? `학생회 <span style="color:var(--text-faint);">(${escapeHtml(real)})</span>` : '학생회';
}

async function voteRecruitmentPoll(id, choice){
  if(!state.user) return;
  const next = await mutateSharedList('recruitments', 'list', (cur)=>{
    const post = cur.find(r=>r && r.id===id);
    if(!post || !post.poll || !post.poll.enabled) return null;
    const votes = { ...(post.poll.votes||{}) };
    const mine = votes[state.user.studentId];
    // 이미 고른 것과 같은 걸 다시 누르면 취소(투표 안 한 상태로).
    if(mine && mine.choice===choice) delete votes[state.user.studentId];
    else votes[state.user.studentId] = { name: state.user.name, choice, time: now() };
    return cur.map(r=>r.id===id ? { ...r, poll: { ...r.poll, votes } } : r);
  });
  if(!next){ saveResultToast(false); return; }
  state.recruitmentPosts = next;
  renderMain();
  refreshRecruitmentModal(id);
}
// 구인자가 "참여" 누른 사람들에게 남기는 공지. 하나를 계속 덮어쓰지 않고 게시판처럼
// 쌓이도록 배열에 추가한다 — 나중에 바뀐 안내(장소 변경 등)도 지난 공지와 함께 남는다.
// 남기기만 해서는 푸시가 안 나가고, 그 메시지를 "공지하기"로 따로 눌러야만 발송된다
// (그냥 메모만 남기고 싶을 때도 있어서, 남기는 것과 알리는 것을 분리했다).
async function saveRecruitmentOrgMessage(id, msg){
  if(!state.user || !msg) return;
  const next = await mutateSharedList('recruitments', 'list', (cur)=>{
    const post = cur.find(r=>r && r.id===id);
    if(!post || !post.poll || post.authorId!==state.user.studentId) return null;
    const orgMessages = [...(post.poll.orgMessages||[]), { id: uid(), text: msg, time: now(), notify: false }].slice(-50);
    return cur.map(r=>r.id===id ? { ...r, poll: { ...r.poll, orgMessages } } : r);
  });
  if(!next){ saveResultToast(false); return; }
  state.recruitmentPosts = next;
  renderMain();
  refreshRecruitmentModal(id);
  toast('참여자 공지에 남겼어요');
}
async function deleteRecruitmentOrgMessage(id, msgId){
  if(!state.user) return;
  const next = await mutateSharedList('recruitments', 'list', (cur)=>{
    const post = cur.find(r=>r && r.id===id);
    if(!post || !post.poll || post.authorId!==state.user.studentId) return null;
    const orgMessages = (post.poll.orgMessages||[]).filter((m,i)=>(m.id||('idx'+i))!==msgId);
    return cur.map(r=>r.id===id ? { ...r, poll: { ...r.poll, orgMessages } } : r);
  });
  if(!next){ saveResultToast(false); return; }
  state.recruitmentPosts = next;
  renderMain();
  refreshRecruitmentModal(id);
}
// "공지하기"를 누른 메시지만 서버(5분 크론)가 참여자에게 푸시로 보낸다. 한 번 보낸 메시지는
// notify:true로 표시돼 버튼이 "이미 보냈어요"로 바뀌고 다시 누를 수 없다(되돌릴 수 없는
// 발송이라 토글이 아니라 한 방향으로만 바뀜).
async function notifyRecruitmentOrgMessage(id, msgId){
  if(!state.user) return;
  const next = await mutateSharedList('recruitments', 'list', (cur)=>{
    const post = cur.find(r=>r && r.id===id);
    if(!post || !post.poll || post.authorId!==state.user.studentId) return null;
    const orgMessages = (post.poll.orgMessages||[]).map((m,i)=>(m.id||('idx'+i))===msgId ? { ...m, notify:true } : m);
    return cur.map(r=>r.id===id ? { ...r, poll: { ...r.poll, orgMessages } } : r);
  });
  if(!next){ saveResultToast(false); return; }
  state.recruitmentPosts = next;
  renderMain();
  refreshRecruitmentModal(id);
  // "참여(yes)" 누른 사람에게만 즉시 보낸다. studentId로만 알고 있어서 uid가 필요한
  // notifyQueue에는 state.allUsers에서 찾아 넘긴다 — 탈퇴 등으로 명단에 없으면 건너뛴다.
  const post = next.find(r=>r.id===id);
  const msg = (post && post.poll && post.poll.orgMessages || []).find(m=>(m.id||'')===msgId) || {};
  const yesIds = Object.keys((post && post.poll && post.poll.votes) || {}).filter(sid=>post.poll.votes[sid].choice==='yes' && sid!==post.authorId);
  await ensureAllUsers();
  yesIds.forEach(sid=>{
    const targetUid = ((state.allUsers||{})[sid]||{}).uid;
    if(targetUid) enqueuePush({ audience:'user', targetUid, category:'recruit', title:`${post.title} 참여자 공지`, body:msg.text||'' });
  });
  toast('참여자에게 공지 알림을 보냈어요 (1분 안에 도착해요)');
}

// renderMain()만으로는 안 바뀐다 — 최신 상태로 모달을 다시 그려서 버튼 비활성화 등이

}
