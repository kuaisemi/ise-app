  APP.innerHTML = `
    <div class="shell">
      <div class="topbar" style="${state.view==='timetable' ? 'padding-top:calc(6px + var(--safe-top)); padding-bottom:6px;' : ''}">
        <div class="topbar-row" style="${state.view==='timetable' ? 'justify-content:flex-end;' : ''}">
          ${state.view!=='timetable' ? `
          <div class="brand-mini"><span class="mark">${ICON.chipMini}</span><b>ISE</b>
            <span class="role-badge ${myRole()}">${roleLabel(myRole())}</span>
          </div>` : ''}
          <div class="top-actions" style="display:flex; align-items:center; gap:6px;">
            <button type="button" class="btn-top-refresh" data-action="global-refresh" title="새로고침">${ICON.refresh}</button>
            <button type="button" class="btn-top-refresh btn-top-bell" data-action="open-notif-feed" title="알림">${ICON.bell}${hasUnseenNotifications() ? '<span class="bell-dot"></span>' : ''}</button>
            <span class="date-pill" data-action="go-calendar-tab">${dateLabel}</span>
          </div>
        </div>
      </div>
      <main id="main-content"></main>
      <div class="bottomnav">
        ${navBtn('home', ICON.home, '홈')}
        ${navBtn('timetable', ICON.grid, '시간표')}
        ${navBtn('info', ICON.calendar, '학사정보')}
        ${navBtn('council', ICON.megaphone, '학생사회')}
        ${navBtn('mypage', ICON.chip, 'MY')}
      </div>
      <div id="modal-root"></div>
      <div id="toast" class="toast"></div>
    </div>`;
  renderMain();
}
function navBtn(view, icon, label){
  return `<button class="navbtn ${state.view===view?'active':''}" data-action="nav" data-view="${view}">${icon}<span>${label}</span></button>`;
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(!el) return;
  let html='';
  if(state.view==='home') html=renderHome();
  else if(state.view==='timetable') html=renderTimetable();
  else if(state.view==='info') html=renderInfo();
  else if(state.view==='council') html=renderCouncil();
  else if(state.view==='mypage') html=renderMypage();
  el.innerHTML = html + (state.view==='mypage' ? '' : versionFooter());
  setupNowTimer();
  setupWidgetOpacitySlider();
  setupWidgetFontScaleSlider();
}

// 위젯 투명도 슬라이더는 화면을 다시 그릴 때마다 새로 만들어지므로 여기서 매번 연결한다.
// 드래그 중에는 숫자만 갱신하고, 손을 뗐을 때(change) 저장 + 위젯 갱신을 한 번만 한다.
function setupWidgetOpacitySlider(){
  const slider = document.getElementById('widget-opacity');
  if(!slider) return;
  const label = document.getElementById('widget-opacity-val');
  slider.oninput = ()=>{ if(label) label.textContent = slider.value + '%'; };
  slider.onchange = ()=>{ setWidgetSetting(state.widgetFontScaleTarget, { opacity: parseInt(slider.value,10) }); };
}

function setupWidgetFontScaleSlider(){
  const slider = document.getElementById('widget-font-scale');
  if(!slider) return;
  const label = document.getElementById('widget-font-scale-val');
  slider.oninput = ()=>{ if(label) label.textContent = slider.value + '%'; };
  slider.onchange = ()=>{ setWidgetSetting(state.widgetFontScaleTarget, { fontScale: parseInt(slider.value,10)/100 }); };
}

function setupNowTimer(){
  if(state.nowTimer){ clearInterval(state.nowTimer); state.nowTimer=null; }
  state.nowTimer = setInterval(()=>{
    if(state.view==='timetable' || state.view==='home') renderMain();
  }, 60000);
}

/* ===== 홈 ===== */
function renderHome(){
  const di = todayDayIndex();
  const todays = di>=0 ? state.timetable.filter(c=>c.day===di).sort((a,b)=>a.start-b.start) : [];
  // 진리관은 홈 화면에서만 시간대별로 조식/중식/석식을 자동으로 바꿔 보여준다.
  // 21시 이후엔 "내일 날짜"를 보게 되는데, 미래관(중식만 운영)을 계속 오늘 날짜로 고정해두면
  // 진리관은 이미 내일(주말 등)을 보고 있는데 미래관만 지나간 오늘 메뉴를 붙들고 있어 화면이 어긋나 보인다.
  // 그래서 미래관도 같은 기준 날짜(studentSlot.date)를 보게 해 21시를 기점으로 함께 넘어가게 한다.
  const studentSlot = homeStudentMealSlot();
  const studentMeal = (state.meals[studentSlot.date] || {}).student || null;
  const studentSlotText = studentMeal ? studentMeal[studentSlot.key] : '';
  const staffMeal = (state.meals[studentSlot.date] || {}).staff || null;

  const upcoming = live(state.calendar).filter(ev=>ev.endDate>=todayStr())
    .sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,3);
  const recentNotices = live(state.notices)
    .sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||String(b.date).localeCompare(String(a.date))).slice(0,5);
  
  const nowTs = now();
  const activePolls = live(state.polls).filter(p=>{
    if(isPollEnded(p)){
      const dt = p.endDateTime || p.endDate;
      if(dt){
        const endTs = new Date(dt.includes('T') ? dt : dt + 'T23:59:59').getTime();
        if(nowTs - endTs > 7 * 24 * 60 * 60 * 1000) return false;
      }
    }
    return true;
  }).sort((a,b)=>pollDeadlineSortValue(a)-pollDeadlineSortValue(b));
  
  const unvoted = activePolls.filter(p=>!isPollEnded(p) && !hasUserVoted(p));

  const validRecruits = live(state.recruitmentPosts).filter(r=>{
    if(r.closed) return false;
    if(r.expireHours && r.expireHours>0 && (now() - (r.createdAt||0)) > r.expireHours*3600000) return false;
    return true;
  }).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).slice(0,2);

  return `
    <div class="hero-greet">
      <div class="hero-trace">${ICON.trace}</div>
      <p class="greet-name">${escapeHtml(state.user.name)}님, 안녕하세요</p>
      <p class="greet-sub">${di>=0 ? `오늘은 ${DAYS[di]}요일, 수업 ${todays.length}개가 있어요` : '오늘은 주말이에요, 편안한 하루 보내세요'}</p>
    </div>

    ${activePolls.length ? `
    <div class="section-title">진행 중인 투표 <span class="count">총 ${activePolls.filter(p=>!isPollEnded(p)).length}개</span></div>
    <div class="card" style="padding:10px 14px;">
      ${unvoted.length ? unvoted.map(p=>`
        <div class="list-item" data-action="go-poll-page" style="cursor:pointer; padding:8px 0;">

// 폰마다 화면 비율(세로/가로)이 달라서, 그 비율만큼 시간표 한 칸 높이를 키우거나 줄인다 —
// 화면이 길쭉한 폰일수록 칸이 더 커져서 화면을 더 꽉 채우고, 정사각형에 가까운 폰은 원래 크기를 유지.
// 기준값(1.9)은 흔한 20:9 근처 화면 비율.
function deviceRatioScale(min=0.85, max=1.4){
  const ratio = (typeof window!=='undefined' && window.innerWidth) ? window.innerHeight/window.innerWidth : 1.9;
  return Math.max(min, Math.min(max, ratio/1.9));
}
function renderTimetable(isCapture=false){
  const latestEnd = state.timetable.reduce((m,c)=>Math.max(m, Number(c.end)||TIME_START), TIME_START);
  const visibleEnd = Math.min(TIME_END, Math.max(TIMETABLE_VISIBLE_END, Math.ceil(latestEnd/60)*60));
  const rows = Math.ceil((visibleEnd-TIME_START)/TIMETABLE_GRID_STEP);
  const di = todayDayIndex();

  let timeLabels='';
  for(let r=0;r<=rows;r++){
    const mins = TIME_START + r*TIMETABLE_GRID_STEP;
    if(mins>visibleEnd) break;
    if(mins%60===0) timeLabels += `<div class="tt-timelabel" style="grid-row:${r+2}">${Math.floor(mins/60)}</div>`;
  }
  let cells='';
  for(let d=0; d<5; d++){
    for(let r=0;r<rows;r++){
      const mins = TIME_START + r*TIMETABLE_GRID_STEP;
      cells += `<div class="tt-cell ${mins%60===0?'hour-cell':''} ${(state.ttOpts.todayDate && d===di && !isCapture)?'today-col':''}" style="grid-column:${d+2}; grid-row:${r+2};"></div>`;
    }
  }

  const o = state.ttOpts;
  let blocks='';
  state.timetable.forEach(c=>{
    const start = Math.max(TIME_START, Number(c.start)||TIME_START);
    const end = Math.min(visibleEnd, Number(c.end)||start+60);
    const startRow = 2 + Math.floor((start-TIME_START)/TIMETABLE_GRID_STEP);
    const endRow = Math.max(startRow+1, 2 + Math.ceil((end-TIME_START)/TIMETABLE_GRID_STEP));
    const textColor = c.textColor || '#FFFFFF';
    const actionAttr = isCapture ? '' : `data-action="edit-class" data-id="${c.id}"`;
    blocks += `<div class="tt-block" ${actionAttr}
      style="grid-column:${c.day+2}; grid-row:${startRow} / ${endRow}; background:${c.color||COLORS[0].hex}; color:${textColor};">
      ${o.subject ? `<b style="color:${textColor}; text-shadow:${textColor==='#000000'?'none':'0 1px 2px rgba(0,0,0,0.5)'}">${escapeHtml(c.subject)}</b>` : ''}
      ${o.time ? `<span class="time-tag" style="color:${textColor}">${minutesToLabel(start)}–${minutesToLabel(end)}</span>` : ''}
      ${o.professor && c.professor ? `<span class="prof-tag" style="color:${textColor}">${escapeHtml(c.professor)}</span>` : ''}
      ${o.room && c.room ? `<span class="room-tag" style="color:${textColor}">${formatRoomForBlock(c.room)}</span>` : ''}
    </div>`;
  });

  const heads = DAYS.map((d,i)=>`
    <div class="tt-head ${(o.todayDate && i===di && !isCapture)?'today':''}" style="grid-column:${i+2}">
      <span>${d}</span>
    </div>`).join('');

  let nowLine='';
  if(o.currentTime && di>=0 && !isCapture){
    const t = new Date();
    const minsNow = t.getHours()*60 + t.getMinutes();
    if(minsNow>=TIME_START && minsNow<=visibleEnd){
      const top = 24 + ((minsNow-TIME_START)/TIMETABLE_GRID_STEP)*Math.round(TIMETABLE_ROW_PX*deviceRatioScale());
      nowLine = `<div class="tt-now-line" style="top:${top}px; background:${escapeHtml(o.currentTimeColor||'#FF6B6B')}; color:${escapeHtml(o.currentTimeColor||'#FF6B6B')};"></div>`;
    }
  }

  if(isCapture){
    const isLight = getTheme()==='light';
    const capBg = isLight ? '#FFFFFF' : '#000000';
    const capLine = isLight ? 'rgba(0,0,0,0.09)' : 'rgba(255,255,255,0.08)';
    const capLineStrong = isLight ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.18)';
    const capBlockBorder = isLight ? 'rgba(0,0,0,0.18)' : 'rgba(255,255,255,0.18)';
    return `
      <style>
        .capture-grid-scope .tt-cell{border-top:1px dashed ${capLine} !important; border-left:1px solid ${capLine} !important;}
        .capture-grid-scope .tt-cell.hour-cell{border-top:1px solid ${capLineStrong} !important;}
        .capture-grid-scope .tt-block{border-color:${capBlockBorder} !important;}
        .capture-grid-scope .tt-head{background:${capBg} !important;}
      </style>
      <div class="tt-card-container capture-grid-scope" style="background:${capBg}; border:2px solid var(--capture-border); box-shadow:none;">
        <div class="tt-wrap" style="max-height:none; background:${capBg};">
          <div class="tt-grid" style="grid-template-rows:24px repeat(${rows}, var(--tt-row-h)); position:relative; --tt-font-scale:${state.ttOpts.fontScale||1}; --tt-row-h:${Math.round(11*deviceRatioScale()*1.15)}px;">
            <div class="tt-head" style="grid-column:1; background:${capBg};"></div>
            ${heads}${timeLabels}${cells}${blocks}
          </div>
        </div>
      </div>`;
  }

  return `
    ${renderSemesterTabs()}

    ${state.timetable.length===0 ? `
      <div class="card empty">
        <div style="color:var(--teal); margin-bottom:8px;">${ICON.grid}</div>
        <p>등록된 수업이 없습니다.<br>사진 인식이나 + 버튼으로 수업을 추가하세요.</p>
        <div style="display:flex; gap:8px; justify-content:center; max-width:320px; margin:0 auto;">
          <button class="btn btn-teal btn-sm" data-action="ocr-timetable">${ICON.camera} 시간표 인식</button>
          <button class="btn btn-primary btn-sm" data-action="add-class">${ICON.plus} 직접 추가</button>
        </div>
      </div>
    ` : `
      <div class="tt-card-container">
        <div class="tt-wrap">
          <div class="tt-grid" style="grid-template-rows:24px repeat(${rows}, var(--tt-row-h)); position:relative; --tt-font-scale:${state.ttOpts.fontScale||1}; --tt-row-h:${Math.round(13*deviceRatioScale())}px;">
            <div class="tt-head" style="grid-column:1"></div>
            ${heads}${timeLabels}${cells}${blocks}${nowLine}
          </div>
        </div>
      </div>
    `}
    <div class="tt-fab-wrap ${state.ttFabOpen?'open':''}">
      ${state.ttFabOpen ? `
      <div class="tt-fab-backdrop" data-action="close-tt-fab"></div>
      <button type="button" class="tt-fab-option" data-action="ocr-timetable" style="--i:0;">
        <span class="tt-fab-option-circle">${ICON.camera}</span>
        <span class="tt-fab-option-label">사진 인식</span>
      </button>
      <button type="button" class="tt-fab-option" data-action="add-class" style="--i:1;">
        <span class="tt-fab-option-circle">${ICON.pencil}</span>
        <span class="tt-fab-option-label">직접 추가</span>
      </button>
      ` : ''}
      <button type="button" class="tt-fab" data-action="toggle-tt-fab">${ICON.plus}</button>
    </div>
  `;
}

function setupTtOptionsModalListeners(){
  const panel = document.getElementById('tt-opts-panel');
  if(!panel) return;
  const colorSection = document.getElementById('tt-now-color-section');
  panel.querySelectorAll('.tt-opt-pending').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.dataset.opt==='currentTime' && colorSection){
        colorSection.style.opacity = cb.checked ? '1' : '.4';
        colorSection.style.pointerEvents = cb.checked ? 'auto' : 'none';
      }
    };
  });
  const swatchWrap = document.getElementById('tt-now-color-swatches');
  panel.querySelectorAll('.tt-color-pending').forEach(btn=>{
    btn.onclick = ()=>{
      // 프리셋을 고르면 "직접 선택" 스와치의 체크도 같이 풀어준다
      panel.querySelectorAll('#tt-now-color-swatches .swatch').forEach(b=>{ b.classList.remove('selected'); b.innerHTML=''; });
      btn.classList.add('selected'); btn.innerHTML='✓';
      if(swatchWrap) swatchWrap.dataset.selected = btn.dataset.hex;
    };
  });
  const fontSlider = document.getElementById('tt-font-scale-slider');
  const fontLabel = document.getElementById('tt-font-scale-label');
  if(fontSlider && fontLabel){
    fontSlider.oninput = ()=>{ fontLabel.textContent = Math.round(parseFloat(fontSlider.value)*100)+'%'; };
  }
}
function applyTtOptions(){
  const panel = document.getElementById('tt-opts-panel');
  if(!panel) return;
  const next = { ...state.ttOpts };
  panel.querySelectorAll('.tt-opt-pending').forEach(cb=>{ next[cb.dataset.opt] = cb.checked; });
  const swatchWrap = document.getElementById('tt-now-color-swatches');
  if(swatchWrap) next.currentTimeColor = swatchWrap.dataset.selected || next.currentTimeColor;
  const fontSlider = document.getElementById('tt-font-scale-slider');
  if(fontSlider) next.fontScale = parseFloat(fontSlider.value) || 1;
  state.ttOpts = next;
  localSet('tt_display_opts', state.ttOpts);
  closeModal();
  renderMain();
  toast('시간표 표시 설정이 적용되었습니다');
}

async function parseCalendarWithGeminiVision(file){
  const base64 = await new Promise(res=>{
    const r=new FileReader();
    r.onloadend=()=>{ const v=r.result; res(v.includes(',')?v.split(',')[1]:v); };
    r.readAsDataURL(file);
  });
  const prompt = `이 한국 대학교 학사일정표 이미지(표 형식)에서 모든 항목을 찾아 JSON 배열로만 반환하세요.
각 항목: 제목(title), 시작일(startDate, YYYY-MM-DD), 종료일(endDate, YYYY-MM-DD, 하루짜리면 startDate와 동일), 분류(category: academic=학사, exam=시험, event=행사, vacation=방학, holiday=공휴일, etc=기타 중 하나).
이미지에 연도가 안 보이면 이미지 문맥(예: "2026학년도")을 참고해서 연도를 정확히 추론하세요.
예시: [{"title":"제1학기 개강","startDate":"2026-03-03","endDate":"2026-03-03","category":"event"}]
설명 없이 JSON 배열만 반환하세요.`;

  const models=['gemini-3.6-flash','gemini-flash-latest','gemini-3.5-flash'];
  let lastErr=null;
  // 시간표 인식과 동일하게, 빠른 설정으로 먼저 시도하고 아무것도 못 읽었을 때만 다시 시도한다.
  const attempts = [{ thinkingLevel:'low' }, null];
  ocr:
  for(const thinkingConfig of attempts){
    for(const apiKey of GEMINI_API_KEYS){
      for(const model of models){
        try{
          const generationConfig = { responseMimeType:'application/json' };
          if(thinkingConfig) generationConfig.thinkingConfig = thinkingConfig;
          const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey.trim() },
            body:JSON.stringify({
              contents:[{ parts:[ {text:prompt}, {inlineData:{ mimeType:file.type||'image/jpeg', data:base64 }} ] }],
              generationConfig
            })
          });
          const data=await res.json();
          if(data.error || !res.ok) throw geminiError(res, data);
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const parsed = JSON.parse(raw.replace(/```(?:json)?/gi,'').trim());
          const result = parsed.filter(it=>it.title && it.startDate).map(it=>({
            title: it.title,
            startDate: it.startDate,
            endDate: it.endDate || it.startDate,
            category: CATS.find(c=>c.key===it.category) ? it.category : 'academic'
          }));
          if(result.length) return result;
          lastErr = lastErr || new Error('인식된 일정이 없습니다');
          break;
        }catch(err){ lastErr=err; if(err && err.geminiAuth) break ocr; }
      }
    }
  }
  throw lastErr || new Error('학사일정 인식에 실패했습니다.');
}

function setupCalendarOcrModalListeners(){

        const key=it.title+'|'+it.startDate;
        if(existingKeys.has(key)) return;
        additions.push({ id:uid(), title:it.title, startDate:it.startDate, endDate:it.endDate, category:it.category, source:'official', color:'', description:'', authorId:state.user.studentId, authorRole:myRole(), updatedAt:now() });
      });
      const next=[...latest, ...additions];
      const ok=await saveCalendar(next);

      closeModal(); renderMain();
      saveResultToast(ok, `${additions.length}건의 학사일정이 등록되었습니다`);
    };
  }
}

function parseOfficialScheduleHTML(html){
  const dom = new DOMParser().parseFromString(html, 'text/html');
  const bodyText = dom.body ? dom.body.textContent : html;
  const semMatches = [...bodyText.matchAll(/(\d{4})학년도\s*(\d)학기/g)];
  if(semMatches.length===0) throw new Error('학기 정보를 찾지 못했습니다.');
  const lastSem = semMatches[semMatches.length-1];
  const academicYear = parseInt(lastSem[1],10);
  const term = parseInt(lastSem[2],10);

  const tables = Array.from(dom.querySelectorAll('table'));
  const table = tables.find(t => /\d{1,2}\([월화수목금토일]\)/.test(t.textContent)) || tables[0];
  if(!table) throw new Error('일정표를 찾지 못했습니다.');
  const rows = Array.from(table.querySelectorAll('tr')).filter(tr => tr.querySelectorAll('td').length>=2);

  let curMonth=null, prevMonth=0, year=academicYear;
  const items=[];
  for(const tr of rows){
    const tds = Array.from(tr.querySelectorAll('td'));
    let monthCell, dateCell, titleCell;
    if(tds.length>=3){ monthCell=tds[0]; dateCell=tds[1]; titleCell=tds[2]; }
    else { dateCell=tds[0]; titleCell=tds[1]; }
    if(monthCell){
      const mm=(monthCell.textContent||'').replace(/[^0-9]/g,'');
      if(mm) curMonth=parseInt(mm,10);
    }
    if(!curMonth) continue;
    if(curMonth < prevMonth) year++;
    prevMonth = curMonth;

    const dateText = (dateCell.textContent||'').trim();
    const m = dateText.match(/(\d{1,2})\([^)]*\)(?:\s*[~\-]\s*(\d{1,2})\([^)]*\))?/);
    if(!m) continue;
    const d1=parseInt(m[1],10), d2=m[2]?parseInt(m[2],10):d1;
    const title=(titleCell.textContent||'').trim();
    if(!title) continue;

    let category='academic';
    if(/공휴일|대체휴일/.test(title)) category='holiday';
    else if(/고사|시험/.test(title)) category='exam';
    else if(/방학/.test(title)) category='vacation';
    else if(/개강|종강|축제|고·연전|고연전/.test(title)) category='event';

    items.push({ title, startDate:`${year}-${pad(curMonth)}-${pad(d1)}`, endDate:`${year}-${pad(curMonth)}-${pad(d2)}`, category });
  }
  if(items.length===0) throw new Error('일정 항목을 찾지 못했습니다.');
  return { items, academicYear, term };
}

async function fetchOfficialScheduleHTML(){
  const proxies = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    u => 'https://proxy.cors.sh/' + u,
  ];
  const PROXY_TIMEOUT_MS = 8000;
  for(const gen of proxies){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(), PROXY_TIMEOUT_MS);
      const res=await fetch(gen(OFFICIAL_SCHEDULE_URL), {cache:'no-store', signal:ctrl.signal}).finally(()=>clearTimeout(t));
      if(!res.ok) continue;
      let text=await res.text();
      try{ const j=JSON.parse(text); if(j && j.contents) text=j.contents; }catch(_){}
      if(text && text.length>1000 && /학사일정/.test(text)) return text;
    }catch(e){}
  }
  throw new Error('학사일정 페이지에 접근하지 못했습니다.');
}

function setupOfficialScheduleModalListeners(){
  const btnFetch=document.getElementById('btn-fetch-official-schedule');
  const statusBox=document.getElementById('official-sch-status-box');
  const resultsWrap=document.getElementById('official-sch-results-wrap');
  const itemsList=document.getElementById('official-sch-items-list');
  const countEl=document.getElementById('official-sch-count');
  const btnSave=document.getElementById('btn-save-official-schedule');
  if(!btnFetch) return;

  btnFetch.onclick=async ()=>{
    btnFetch.disabled=true;
    statusBox.style.display='block'; statusBox.textContent='공식 학사일정을 불러오는 중…';
    resultsWrap.style.display='none';
    try{
      const html=await fetchOfficialScheduleHTML();
      const { items, academicYear, term } = parseOfficialScheduleHTML(html);
      state.officialParsedSchedule=items;
      statusBox.innerHTML=`<span style="color:var(--teal);">${academicYear}학년도 ${term}학기 기준 · ${items.length}건 발견</span>`;
      itemsList.innerHTML=items.map((it,i)=>`
        <label style="display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:11.5px; cursor:pointer;">
          <input type="checkbox" class="official-sch-check-item" data-idx="${i}" checked style="margin-top:2px;">
          <span><span class="tag ${catTag(it.category)}" style="margin-right:5px;">${catLabel(it.category)}</span><b>${escapeHtml(it.title)}</b><br><span style="color:var(--text-faint); font-family:var(--font-mono); font-size:10.5px;">${it.startDate}${it.endDate!==it.startDate?' ~ '+it.endDate:''}</span></span>
        </label>`).join('');
      countEl.textContent=items.length;
      resultsWrap.style.display='block';
    }catch(err){
      statusBox.innerHTML=`<span style="color:var(--danger);">${escapeHtml(err.message||'불러오기에 실패했습니다.')}</span>`;
    }finally{
      btnFetch.disabled=false;
    }
  };

  if(btnSave){
    btnSave.onclick=async ()=>{
      const idxs=Array.from(document.querySelectorAll('.official-sch-check-item:checked')).map(cb=>parseInt(cb.dataset.idx,10));
      const list=(state.officialParsedSchedule||[]).filter((_,i)=>idxs.includes(i));
      if(list.length===0){ toast('선택된 일정이 없습니다'); return; }
      const latest = await loadCalendar();
      const existingKeys = new Set(live(latest).map(e=>e.title+'|'+e.startDate));
      const additions=[];
      list.forEach(it=>{
        const key=it.title+'|'+it.startDate;
        if(existingKeys.has(key)) return;
        additions.push({ id:uid(), title:it.title, startDate:it.startDate, endDate:it.endDate, category:it.category, source:'official', color:'', description:'', authorId:state.user.studentId, authorRole:myRole(), updatedAt:now() });
      });
      const next=[...latest, ...additions];
      const ok=await saveCalendar(next);
      state.calendar=next;
      closeModal(); renderMain();
      saveResultToast(ok, `${additions.length}건의 학사일정이 등록되었습니다`);
    };
  }
}

function renderExamCalTab(){
  const calMonth = state.calendarMonth || todayStr().slice(0,7);
  const [ms, me] = monthBounds(calMonth);
  const [y, m] = calMonth.split('-').map(Number);
  if(!state.selectedExamDate) state.selectedExamDate = todayStr();

  const firstDayIndex = new Date(y, m - 1, 1).getDay();
  const totalDays = new Date(y, m, 0).getDate();
  const prevTotalDays = new Date(y, m - 1, 0).getDate();

  const pollDeadlineEvents = live(state.polls)
    .filter(p => p.endDate)
    .map(p => ({
      id: 'poll-deadline-' + p.id,
      title: `투표 마감: ${p.question}`,
      startDate: p.endDate,
      endDate: p.endDate,
      category: 'council',
      color: 'var(--amber)',
      description: '',
      isPollDeadline: true,
    }));

  const allEvents = [
    ...live(state.calendar).filter(ev => {
      if(!state.showCouncilEvents && ev.category==='council') return false;
      const isOfficial = ev.source==='official' || (!ev.source && ev.category!=='council');
      if(isOfficial) return false; // 학사 달력에는 학사일정을 항상 숨김 (학사일정 탭에서만 확인)
      return true;
    }),
    ...(state.showCouncilEvents ? pollDeadlineEvents : []),
  ];

  // 공휴일은 위에서 숨긴 "학사일정"에 포함돼 있지만, 날짜 숫자 색만큼은 일·토처럼 항상
  // 빨갛게 보여주고 싶어서, 숨김 필터와 무관하게 전체 일정에서 따로 걸러낸다.
  const isHolidayDate = (dateStr) => live(state.calendar).some(ev =>
    ev.category === 'holiday' && ev.startDate <= dateStr && ev.endDate >= dateStr);

  let calCells = '';
  const weekdays = [
    { label:'일', cls:'sun' }, { label:'월', cls:'' }, { label:'화', cls:'' },
    { label:'수', cls:'' }, { label:'목', cls:'' }, { label:'금', cls:'' }, { label:'토', cls:'sat' }
  ];
  const headHtml = weekdays.map(w => `<div class="cal-head ${w.cls}">${w.label}</div>`).join('');

  for(let i = firstDayIndex - 1; i >= 0; i--){
    calCells += `<div class="cal-day other-month"><span class="day-num">${prevTotalDays - i}</span></div>`;
  }
  for(let d = 1; d <= totalDays; d++){
    const curDateStr = `${y}-${pad(m)}-${pad(d)}`;
    const dayOfWeek = new Date(y, m - 1, d).getDay();
    const dayEvents = allEvents.filter(ev => ev.startDate <= curDateStr && ev.endDate >= curDateStr);
    const isToday = curDateStr === todayStr();
    const isSelected = curDateStr === state.selectedExamDate;

    let dayCls = '';
    if(dayOfWeek === 0) dayCls = 'sun';
    else if(dayOfWeek === 6) dayCls = 'sat';
    if(isHolidayDate(curDateStr)) dayCls = (dayCls + ' holiday').trim();

    const hasMemo = !!(state.memos && (state.memos[curDateStr]||'').trim());
    let dots = '';
    if(dayEvents.length > 0 || hasMemo){
      dots = `<div class="cal-dots">${dayEvents.map(e => `<span class="cal-dot" style="background:${e.color || (e.category==='council'?'var(--crimson)':'var(--blue)')}"></span>`).join('')}${hasMemo?`<span class="cal-dot memo-dot" style="background:var(--teal)"></span>`:''}</div>`;
    }
    calCells += `
      <div class="cal-day ${dayCls} ${isToday?'today':''} ${isSelected?'selected-day':''}" data-action="select-exam-date" data-date="${curDateStr}">
        <span class="day-num">${d}</span>
        ${dots}
      </div>`;
  }
  const remaining = (7 - ((firstDayIndex + totalDays) % 7)) % 7;
  for(let i = 1; i <= remaining; i++){
    calCells += `<div class="cal-day other-month"><span class="day-num">${i}</span></div>`;
  }

  const selectedEvents = allEvents.filter(ev => ev.startDate <= state.selectedExamDate && ev.endDate >= state.selectedExamDate);
  const council = isCouncil();

  return `
    <div class="meal-nav">
      <button data-action="cal-month-prev">${ICON.chevL}</button>
      <span class="meal-date">${fmtMonthLabel(calMonth)}</span>
      <button data-action="cal-month-next">${ICON.chevR}</button>
    </div>

    <div class="row-between" style="margin-bottom:8px; padding:0 2px; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
      <button type="button" class="btn btn-ghost btn-sm" data-action="toggle-council-filter" style="width:auto; padding:3px 8px; font-size:10.5px;">
        ${state.showCouncilEvents ? `${ICON.eye} 학생회 일정: ON` : `${ICON.eyeOff} 학생회 일정: OFF`}
      </button>
    </div>

    <div class="card" style="padding:10px 8px; margin-bottom:12px;">
      <div class="cal-grid" style="margin-bottom:0;">
        ${headHtml}
        ${calCells}
      </div>
    </div>

    <div style="display:flex; gap:6px; margin-bottom:12px;">
      <button class="btn btn-teal btn-sm" data-action="add-student-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 일정 추가</button>
      <button class="btn btn-danger btn-sm" data-action="add-exam-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 시험 추가</button>
      ${council ? `<button class="btn btn-primary btn-sm" data-action="add-council-event" data-date="${state.selectedExamDate}" style="flex:1;">+ 학생회 일정</button>` : ''}
    </div>

    ${(()=>{
      const memoText = (state.memos && state.memos[state.selectedExamDate]) || '';
      return `
      <div class="card" style="margin-bottom:12px;">
        <div class="row-between" style="margin-bottom:8px;">
          <div class="section-title" style="margin:0; color:var(--teal);">${ICON.clipboard} 내 메모</div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="edit-memo" data-date="${state.selectedExamDate}" style="width:auto; padding:3px 10px; font-size:10.5px;">${memoText ? `${ICON.pencil} 수정` : `${ICON.plus} 작성`}</button>
        </div>
        ${memoText
          ? `<div class="memo-text" data-action="edit-memo" data-date="${state.selectedExamDate}">${escapeHtml(memoText)}</div>`
          : `<p class="memo-empty" data-action="edit-memo" data-date="${state.selectedExamDate}">과제 · 준비물 등 이 날 기억할 것을 적어두세요. 나만 볼 수 있어요.</p>`}
      </div>`;
    })()}

    <div class="card">
      <div class="section-title" style="margin:2px 0 10px; color:var(--teal);">${ICON.calendar} ${fmtDateLabel(state.selectedExamDate)} 일정 목록</div>
      ${selectedEvents.length ? selectedEvents.map(ev => {
        const canDel = !ev.isPollDeadline && ((state.user && ev.authorId === state.user.studentId) || myLevel() >= 2);
        return `
        <div class="list-item" style="padding:10px 0;">
          <div class="row-between">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="width:10px; height:10px; border-radius:50%; background:${ev.color || (ev.category==='council'?'var(--crimson)':'var(--blue)')}; display:inline-block; flex-shrink:0;"></span>
              <b style="font-size:13px;">${escapeHtml(ev.title)}</b>
              <span class="tag ${catTag(ev.category)}">${catLabel(ev.category)}</span>
            </div>
            ${canDel ? `<button class="btn btn-danger btn-sm" data-action="delete-event" data-id="${ev.id}" style="width:auto; padding:3px 8px; font-size:10.5px;">삭제</button>` : ''}
          </div>
          ${ev.description ? `<div class="body" style="margin-top:6px; font-size:11.5px; color:var(--text-dim);">${escapeHtml(ev.description)}</div>` : ''}
        </div>`;
      }).join('') : `<div class="empty" style="padding:18px 0;"><p>선택한 날짜에 등록된 일정이 없습니다.</p></div>`}
    </div>`;
}

/* ===== 학식 파싱 ===== */
function cellMenuText(td){
  if(!td) return '';
  const target = td.querySelector('p.offTxt') || td.querySelector('p') || td;
  const clone = target.cloneNode(true);
  clone.querySelectorAll('br').forEach(br=>br.replaceWith(document.createTextNode('\n')));
  const rawLines = clone.textContent.replace(/\u00a0/g,' ')
    .split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);

  // "kcal" 표기와 그 바로 뒤에 오는 칼로리 숫자 줄은 가독성을 위해 함께 제거
  const lines = [];
  for(let i=0;i<rawLines.length;i++){
    const line = rawLines[i];
    if(/^kcal$/i.test(line)){
      if(i+1<rawLines.length && /^\d+$/.test(rawLines[i+1])) i++; // 다음 줄(칼로리 숫자)도 같이 건너뜀
      continue;
    }
    lines.push(line);
  }

  return lines.join(', ')
    // 알레르기 유발성분 번호 괄호(예: (1,2,4,5,6))는 화면에 필요 없으므로 제거
    .replace(/\s*\(\s*\d+(?:\s*,\s*\d+)*\s*\)/g, '')
    // 혹시 한 줄에 "kcal 1001"처럼 붙어 나오는 경우까지 대비한 안전망
    .replace(/,?\s*kcal,?\s*\d+/gi, '')
    // 위 과정에서 생길 수 있는 중복/끝자락 콤마 정리
    .replace(/\s*,\s*,/g, ',').replace(/^\s*,\s*|\s*,\s*$/g, '');
}
// <thead> 태그가 명시적으로 없는 표(첫 <tr>이 헤더 역할만 하는 경우)도 인식하도록,
// thead가 있으면 그 안의 th/td를, 없으면 표의 첫 번째 행을 헤더로 사용한다.
function getTableHeaderCells(table){
  const theadCells = Array.from(table.querySelectorAll('thead th, thead td'));
  if(theadCells.length) return theadCells;
  const firstRow = table.querySelector('tr');
  return firstRow ? Array.from(firstRow.children) : [];
}
// 표 하나의 날짜별 조/중/석식 데이터를 뽑아낸다 (어느 식단인지는 여기서 정하지 않음)
function extractDietData(table, baseYear, baseMonth){
  const headCells = getTableHeaderCells(table);
  if(headCells.length < 2) return null;
  const dateCols = headCells.slice(1).map(th=>{
    const m=(th.textContent||'').match(/(\d{1,2})\s*\.\s*(\d{1,2})/);
    if(!m) return null;
    const mm=parseInt(m[1],10), dd=parseInt(m[2],10);
    const year = (baseMonth===12 && mm===1) ? baseYear+1 : baseYear;
    return `${year}-${pad(mm)}-${pad(dd)}`;
  });
  if(dateCols.every(d=>!d)) return null;

  const data={};
  dateCols.forEach(d=>{ if(d) data[d]={breakfast:'',lunch:'',dinner:'',note:''}; });

  // thead가 없어 헤더 행이 tbody(또는 브라우저가 자동 삽입한 암묵적 tbody)에 섞여 들어온 경우에도
  // 대비해, 실제 메뉴 행만 걸러서 처리한다(헤더 행은 조식/중식/석식으로 시작하지 않으므로 자연히 걸러짐).
  Array.from(table.querySelectorAll('tbody tr, tr')).forEach(row=>{
    const cells = Array.from(row.children);
    if(cells.length < 2) return;
    let labelTxt = (cells[0].textContent||'').replace(/\u00a0/g,' ').trim();
    // 괄호 안 시간 표기(예: (11:30~13:30))는 메뉴 데이터가 아니므로 파싱 대상에서 제외
    labelTxt = labelTxt.replace(/\(\s*\d{1,2}:\d{2}\s*[~\-]\s*\d{1,2}:\d{2}\s*\)/g,'').trim();

    // "중식 - 한식" / "중식-일품" / "중식 분식" 처럼 식사명 뒤에 붙는 서브카테고리(한식/일품/분식/plus 등)를 분리
    const mealMatch = labelTxt.match(/^(조식|아침|중식|점심|석식|저녁)\s*[-–·:]?\s*(.*)$/);
    if(!mealMatch) return;
    const mealWord = mealMatch[1];
    const subCategory = (mealMatch[2]||'').trim();

    let key=null;
    if(mealWord==='조식'||mealWord==='아침') key='breakfast';
    else if(mealWord==='중식'||mealWord==='점심') key='lunch';
    else if(mealWord==='석식'||mealWord==='저녁') key='dinner';
    if(!key) return;

    cells.slice(1).forEach((td,i)=>{
      const date = dateCols[i];
      if(!date || !data[date]) return;
      const text = cellMenuText(td);
      if(!text) return;
      if(/휴무|공휴일|미운영|휴일|대체공휴일/.test(text) && text.length<40){ data[date].note=text; return; }
      // 서브카테고리가 있으면 (한식/일품/분식/plus 등) 메뉴 앞에 표시해 구분되게 저장
      const entry = subCategory ? `[${subCategory}] ${text}` : text;
      data[date][key] = data[date][key] ? data[date][key] + '\n' + entry : entry;
    });
  });
  return data;
}
// 표가 실제 DOM에서 "형제 요소"로 라벨과 붙어있지 않아도(감싸는 div 구조가 달라도) 항상 맞게 매칭되도록,
// 페이지 전체 텍스트에서 "교직원 식단표"/"학생 식단표"가 나오는 순서와 실제 날짜표가 나오는 순서를 그대로 짝짓는다.
function parseMealTables(dom){
  const bodyText = (dom.body && dom.body.textContent) || '';
  const rawLabels = [...bodyText.matchAll(/(교직원|학생)\s*식단표/g)].map(m=>m[1]);
  const labels = rawLabels.filter((v,i)=> i===0 || v!==rawLabels[i-1]); // 같은 라벨이 문단+캡션으로 연달아 나오는 것 정리

  const tables = Array.from(dom.querySelectorAll('table')).filter(t=>{
    const headCells = getTableHeaderCells(t);
    const headText = headCells.map(c=>c.textContent||'').join(' ');
    return /\d{1,2}\s*\.\s*\d{1,2}/.test(headText);
  });

  const ym = bodyText.match(/(\d{4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
  const baseYear = ym ? parseInt(ym[1],10) : new Date().getFullYear();
  const baseMonth = ym ? parseInt(ym[2],10) : (new Date().getMonth()+1);

  const results = [];
  tables.forEach((table,i)=>{
    const kind = labels[i]==='교직원' ? 'staff' : (labels[i]==='학생' ? 'student' : null);
    if(!kind) return;
    const data = extractDietData(table, baseYear, baseMonth);
    if(data) results.push({ kind, data });
  });
  return results;
}

async function fetchMealFromSource(silent=false){
  const statusEl = document.getElementById('fetch-meal-status');
  const btn = document.getElementById('fetch-meal-btn');
  if(btn) btn.disabled = true;
  if(statusEl && !silent) statusEl.innerHTML = '<span style="color:var(--teal);">학교 서버에서 식단표를 불러오는 중…</span>';

  const proxies = [
    u => 'https://proxy.cors.sh/' + u,
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
  ];
  const PROXY_TIMEOUT_MS = 7000; // 프록시 하나가 응답이 없을 때 다음으로 빨리 넘어가도록 제한(특히 모바일 네트워크 대비)
  const fetchWithTimeout = (url)=>{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), PROXY_TIMEOUT_MS);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(()=>clearTimeout(t));
  };

  const fail = (msg)=>{
    if(btn) btn.disabled=false;
    if(!silent){
      if(statusEl) statusEl.innerHTML = `<span style="color:var(--danger);">${escapeHtml(msg)}</span><br><span style="color:var(--text-faint);">공식 페이지에서 확인하시거나 직접 입력해주세요.</span>`;
      toast('식단을 불러오지 못했습니다');
    }
  };

  let html=null;
  for(const gen of proxies){
    try{
      const res = await fetchWithTimeout(gen(MEAL_SOURCE_URL));
      if(!res.ok) continue;
      let t = await res.text();
      try{ const j=JSON.parse(t); if(j && j.contents) t=j.contents; }catch(_){}
      if(t && t.length>500 && /<table/i.test(t) && /식단|offTxt|dietMa/.test(t)){ html=t; break; }
    }catch(e){}
  }
  if(!html){ fail('식단 페이지에 접근하지 못했습니다 (프록시 응답 없음).'); return; }

  try{
    const dom = new DOMParser().parseFromString(html,'text/html');
    const results = parseMealTables(dom);
    if(results.length===0){ fail('식단표 구조를 인식하지 못했습니다.'); return; }

    const next = { ...state.meals };
    let dayCount=0;
    results.forEach(({kind,data})=>{
      Object.entries(data).forEach(([date,v])=>{
        const prev = next[date] || {};
        if(kind==='student'){
          next[date] = { ...prev, student:(v.breakfast||v.lunch||v.dinner||v.note)?{ breakfast:v.breakfast, lunch:v.lunch, dinner:v.dinner, note:v.note||'' }:null, updatedAt:now() };
        } else {
          next[date] = { ...prev, staff:(v.lunch||v.note)?{ lunch:v.lunch, note:v.note||'' }:null, updatedAt:now() };
        }
        if(v.breakfast||v.lunch||v.dinner||v.note) dayCount++;
      });
    });

    state.meals = next;
    const ok = await saveMeals(next);
    if(!silent){
      renderMain();
      saveResultToast(ok, '최신 식단을 동기화했습니다');
    } else if(state.view==='info' && state.infoTab==='meal'){
      renderMain();
    }
  }catch(err){
    fail('식단표 파싱 중 오류가 발생했습니다.');
    return;
  }
  if(btn) btn.disabled=false;
}

/* ===== 학과 공지 실시간 파싱 ===== */
function parseDeptNoticeTable(dom){
  const table = dom.querySelector('table.board-table') || Array.from(dom.querySelectorAll('table')).find(t=>t.querySelector('a[href*="artclView.do"]'));
  if(!table) return [];
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  return rows.map(tr=>{
    const link = tr.querySelector('a[href*="artclView.do"]');
    if(!link) return null;
    let title = (link.textContent||'').replace(/\s+/g,' ').trim();
    if(!title) return null;
    let href = link.getAttribute('href') || '';
    if(href && !/^https?:\/\//.test(href)){
      href = 'https://aisemi.korea.ac.kr' + (href.startsWith('/') ? href : '/'+href);
    }
    const dateEl = tr.querySelector('.td-date, td.date, td:last-child');
    let date = dateEl ? dateEl.textContent.trim() : '';
    if(!/^\d{4}[.\-]\d{2}[.\-]\d{2}$/.test(date)) date = '';
    return { title, href, date };
  }).filter(Boolean).slice(0,8);
}

async function fetchDeptNoticesFromSource(silent=false){
  const statusEl = document.getElementById('dept-notice-status');
  const setBtnDisabled = (v)=>{ const b = document.getElementById('dept-notice-refresh-btn'); if(b) b.disabled = v; };
  setBtnDisabled(true);
  if(statusEl && !silent){ statusEl.style.display='block'; statusEl.innerHTML = '<span style="color:var(--teal);">학과 게시판에서 공지를 불러오는 중…</span>'; }

  const proxies = [
    u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
    u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    u => 'https://proxy.cors.sh/' + u,
  ];
  const PROXY_TIMEOUT_MS = 7000; // 프록시 하나가 응답이 없을 때 다음으로 빨리 넘어가도록 제한
  const fetchWithTimeout = (url)=>{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), PROXY_TIMEOUT_MS);
    return fetch(url, { cache:'no-store', signal: ctrl.signal }).finally(()=>clearTimeout(t));
  };

  const fail = (msg)=>{
    if(statusEl){
      if(!silent){ statusEl.style.display='block'; statusEl.innerHTML = `<span style="color:var(--danger);">${escapeHtml(msg)}</span>`; }
      else statusEl.style.display='none';
    }
    if(!silent) toast('학과 공지를 불러오지 못했습니다');
  };

  // 새로고침 버튼은 어떤 경로로 함수가 끝나든(성공/실패/예외/타임아웃) 항상 다시 눌러줄 수 있도록
  // finally에서 한 번에 풀어준다 (DOM이 중간에 다시 그려져도 그 시점의 실제 버튼을 다시 찾아서 처리)
  try{
    let html=null;
    for(const gen of proxies){
      try{
        const res = await fetchWithTimeout(gen(DEPT_NOTICE_URL));
        if(!res.ok) continue;
        let t = await res.text();
        try{ const j=JSON.parse(t); if(j && j.contents) t=j.contents; }catch(_){}
        if(t && t.length>500 && /artclView\.do/.test(t)){ html=t; break; }
      }catch(e){}
    }
    if(!html){ fail('학과 게시판에 접근하지 못했습니다.'); return; }

    const dom = new DOMParser().parseFromString(html,'text/html');
    const items = parseDeptNoticeTable(dom);
    if(items.length===0){ fail('공지 목록 구조를 인식하지 못했습니다.'); return; }

    state.deptNotices = items;
    state.deptNoticesUpdatedAt = now();
    const ok = await saveShared('deptNotices', { items, updatedAt: state.deptNoticesUpdatedAt });
    if(statusEl) statusEl.style.display='none';
    if(state.view==='info' && state.infoTab==='calendar') renderMain();
    if(!silent) toast(ok ? '학과 공지를 새로 불러왔습니다' : '불러왔지만 공유 저장에는 실패했습니다');
  }catch(err){
    fail('공지 목록 파싱 중 오류가 발생했습니다.');
  }finally{
    setBtnDisabled(false);
  }
}

  const labels = tabs.map(([k,l])=>`<div class="subtab ${state.councilTab===k?'active':''}" data-action="council-tab" data-tab="${k}">${l}</div>`).join('');

        const maxLikes = Math.max(0, ...rawComments.map(c=>Object.keys(c.likes||{}).length));
        const sortedComments = [...rawComments].sort((a,b)=>{
          const la = Object.keys(a.likes||{}).length;
          const lb = Object.keys(b.likes||{}).length;
          if(la >= 5 && la === maxLikes && lb < la) return -1;
          if(lb >= 5 && lb === maxLikes && la < lb) return 1;
          return Number(a.createdAt||0) - Number(b.createdAt||0);
        });

        const isExpanded = !!state.expandedComments[p.id];
        const displayComments = (rawComments.length > 2 && !isExpanded) ? sortedComments.slice(0,2) : sortedComments;

            return `
            <div class="comment-box ${isBest?'best-comment':''}">

                <div>
                  <b>${fmtAuthorBadge(c.authorName, c.authorId, c.authorRole)}</b>
                  ${isBest ? `<span class="tag tag-amber" style="font-size:9px; padding:1px 5px; margin-left:4px;">BEST</span>` : ''}
                  <span style="font-size:9.5px; color:var(--text-faint); margin-left:5px;">· ${fmtDateTime(c.createdAt || c.date)}</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <button type="button" class="btn-comment-like ${cHasLiked?'active':''}" data-action="toggle-comment-like" data-post-id="${p.id}" data-comment-id="${c.id}">
                    ${ICON.thumbUp} <span>${cCount}</span>
                  </button>
                  ${canDelComment ? `
                  <button type="button" class="btn-del-comment" data-action="delete-council-comment" data-post-id="${p.id}" data-comment-id="${c.id}" title="댓글 삭제">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/></svg>
                  </button>` : ''}
                </div>
              </div>
              <div class="c-body">${escapeHtml(c.content)}</div>
            </div>`;
          }).join('')}
          ${rawComments.length > 2 ? `
            <button type="button" class="btn-more-comments" data-action="toggle-more-comments" data-post-id="${p.id}">
              ${isExpanded ? '댓글 접기 ▴' : `댓글 ${rawComments.length - 2}개 더보기 ▾`}
            </button>
          ` : ''}
          <form class="comment-form council-comment-form" data-post-id="${p.id}">
            <input name="content" placeholder="댓글 작성..." required autocomplete="off">
            <button class="btn btn-primary btn-sm" type="submit" style="width:auto;">등록</button>
          </form>

      }).join('') : `<div class="empty"><p>학생회 게시글이 없습니다.</p></div>`}
    </div>`;
}

function csvField(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvField).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' }); // BOM 포함 (엑셀 한글 깨짐 방지)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportPollResultsCSV(pollId){
  if(myLevel() < 2){ toast('국장 이상만 내보내기 가능합니다'); return; }
  const p = live(state.polls).find(x=>x.id===pollId);
  if(!p){ toast('투표를 찾을 수 없습니다'); return; }
  const votes = p.votes || {};
  const rows = [['학번','이름','선택 항목','투표 시각']];
  Object.entries(votes).forEach(([sid,v])=>{
    let sel=[], name='', ts='';
    if(Array.isArray(v)) sel=v;
    else if(v && typeof v==='object'){ sel=v.selected||[]; name=v.name||''; ts=v.updatedAt?new Date(v.updatedAt).toLocaleString('ko-KR'):''; }
    const optLabels = sel.map(i=>p.options[i]).filter(Boolean).join('; ');
    rows.push([sid, name || (state.allUsers?.[sid]?.name||''), optLabels, ts]);
  });
  const safeName = p.question.replace(/[\\/:*?"<>|]/g,'').slice(0,30);
  downloadCSV(`투표결과_${safeName}_${todayStr()}.csv`, rows);
  toast('CSV 파일을 다운로드했습니다');
}

function renderPollTab(){
  const nowTs = now();
  const canClearAll = myLevel() >= 2;
  const sorted = live(state.polls).filter(p=>{
    if(isPollEnded(p)){
      const dt = p.endDateTime || p.endDate;
      if(dt){
        const endTs = new Date(dt.includes('T') ? dt : dt + 'T23:59:59').getTime();
        if(nowTs - endTs > 7 * 24 * 60 * 60 * 1000) return false;
      }
    }
    return true;
  }).sort((a,b)=>pollDeadlineSortValue(a)-pollDeadlineSortValue(b));

  return `
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      ${canPoll() ? `<button class="btn btn-primary btn-sm" data-action="add-poll" style="flex:1;">${ICON.plus} 투표 만들기</button>` : ''}

function renderPollItem(p){
  const manage = canPoll();
  const isDirectorOrHigher = myLevel() >= 2;
  const votes = p.votes || {};
  let myVotes=null;
  if(state.user){
    const raw = votes[state.user.studentId];
    if(Array.isArray(raw)) myVotes=raw;
    else if(raw && typeof raw==='object') myVotes=raw.selected||[];
  }
  const ended = isPollEnded(p);
  const editing = state.editingPollVoteId===p.id;
  const showResults = (!!myVotes || ended) && !editing;
  const totalVoters = Object.keys(votes).length;

  const votedSids = new Set(Object.keys(votes));
  const unvoted = Object.values(state.allUsers||{}).filter(u=>u&&u.studentId&&!votedSids.has(u.studentId)).map(u=>`${u.name}(${u.studentId})`);

  let body='';
  if(showResults){
    body = p.options.map((opt,i)=>{
      const voters=[];
      Object.entries(votes).forEach(([sid,v])=>{
        let sel=[], name='';
        if(Array.isArray(v)) sel=v;
        else if(v&&typeof v==='object'){ sel=v.selected||[]; name=v.name||''; }
        if(sel.includes(i)) voters.push(name?`${name}(${sid})`:sid);
      });
      const count=voters.length;
      const pct = totalVoters ? Math.round(count/totalVoters*100) : 0;
      const mine = myVotes && myVotes.includes(i);
      return `
        <div style="margin-bottom:10px;">
          <div class="row-between" style="font-size:11.5px; margin-bottom:3px;">
            <span style="${mine?'color:var(--teal); font-weight:700;':''}">${escapeHtml(opt)}${mine?' ✓':''}</span>
            <span style="color:var(--text-faint)">${count}표 · ${pct}%</span>
          </div>
          <div style="height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden;">
            <div style="height:100%; width:${pct}%; background:${mine?'var(--teal)':'var(--surface-3)'};"></div>
          </div>
          ${(isDirectorOrHigher && count>0) ? `
            <details class="voters-accordion">
              <summary>투표자 명단 (${count}명)</summary>
              <div style="margin-top:6px;">${voters.map(v=>`<span class="voter-badge">${escapeHtml(v)}</span>`).join('')}</div>
            </details>` : ''}
        </div>`;
    }).join('');

    if(isDirectorOrHigher && unvoted.length>0){
      body += `
        <details class="voters-accordion" style="margin-top:8px; border-color:rgba(var(--danger-rgb),0.3); background:rgba(var(--danger-rgb),0.05);">
          <summary style="color:var(--danger);">미투표자 (${unvoted.length}명)</summary>
          <div style="margin-top:6px;">${unvoted.map(u=>`<span class="voter-badge unvoted">${escapeHtml(u)}</span>`).join('')}</div>
        </details>`;
    }
    body += `<div class="row-between" style="font-size:10.5px; color:var(--text-faint); margin-top:6px;"><span>총 참여 ${totalVoters}명${ended?' · 마감됨':''}</span><span>${fmtPollDeadline(p)}</span></div>`;
    if(isDirectorOrHigher && totalVoters>0){
      body += `<button class="btn btn-ghost btn-sm" data-action="export-poll-csv" data-id="${p.id}" style="width:100%; margin-top:8px;">${ICON.doc} 투표자 명단 CSV 내보내기</button>`;
    }
    if(!ended && myVotes){
      body += `<div style="display:flex; gap:6px; margin-top:8px;">
        <button class="btn btn-ghost btn-sm" data-action="edit-poll-vote" data-id="${p.id}" style="flex:1;">투표 변경</button>
        <button class="btn btn-danger btn-sm" data-action="cancel-poll-vote" data-id="${p.id}" style="flex:1;">투표 취소</button>
      </div>`;
    }
  } else {
    const inputType = p.multi ? 'checkbox' : 'radio';
    const pre = myVotes||[];
    body = `
      <form id="poll-vote-form">
        <input type="hidden" name="pollId" value="${p.id}">
        ${p.options.map((opt,i)=>`
          <label style="display:flex; align-items:center; gap:7px; padding:6px 0; font-size:11.5px; cursor:pointer;">
            <input type="${inputType}" name="opt" value="${i}" ${pre.includes(i)?'checked':''} style="width:15px; height:15px; flex-shrink:0;">
            ${escapeHtml(opt)}
          </label>`).join('')}
        <div class="row-between" style="font-size:10.5px; color:var(--text-faint); margin:4px 0 8px;">
          <span>${p.multi?'복수 선택 가능':'단일 선택'}</span><span>${fmtPollDeadline(p)}</span>
        </div>
        <div style="display:flex; gap:6px;">
          ${editing ? `<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-edit-poll-vote" style="flex:1;">취소</button>` : ''}
          <button type="submit" class="btn btn-primary btn-sm" style="flex:1.5;">${editing?'투표 수정 완료':'투표하기'}</button>
        </div>
      </form>`;
  }

  return `
    <div class="list-item">
      <div class="title-line" style="justify-content:space-between;">
        <b>${escapeHtml(p.question)}</b>
        ${ended ? `<span class="tag tag-dim">마감</span>` : `<span class="tag tag-teal">진행중</span>`}
      </div>
      <div class="meta">${p.multi?'복수선택 · ':''}${fmtPollDeadline(p)} · ${fmtAuthorBadge(p.createdBy||'학생회', p.createdById, p.authorRole)}</div>
      <div style="margin-top:8px;">${body}</div>
      ${manage ? `
      <div style="display:flex; gap:5px; margin-top:8px;">
        ${!ended ? `<button class="btn btn-danger btn-sm" data-action="close-poll" data-id="${p.id}" style="flex:1;">${ICON.stopCircle} 즉시 종료</button>` : `<button class="btn btn-ghost btn-sm" data-action="reopen-poll" data-id="${p.id}" style="flex:1;">${ICON.playCircle} 다시 열기</button>`}
        <button class="btn btn-ghost btn-sm" data-action="delete-poll" data-id="${p.id}" style="width:auto;">삭제</button>
      </div>` : ''}
    </div>`;
}

function setupBugReportModalListeners(){
  const btnPick=document.getElementById('btn-pick-bug-img');
  const fileInput=document.getElementById('bug-file-input');
  const btnDel=document.getElementById('btn-del-bug-img');
  const box=document.getElementById('bug-img-preview-box');
  const img=document.getElementById('bug-img-preview');
  let imageData='';
  if(btnPick && fileInput){
    btnPick.onclick=()=>fileInput.click();
    fileInput.onchange=async (e)=>{
      const file=e.target.files[0];
      if(!file) return;
      try{
        imageData=await compressImage(file,900,0.7);
        if(img) img.src=imageData;
        if(box) box.style.display='block';
      }catch(err){ toast('이미지 처리에 실패했습니다'); }
    };
  }
  if(btnDel){
    btnDel.onclick=()=>{ imageData=''; if(fileInput) fileInput.value=''; if(box) box.style.display='none'; };
  }
  const form=document.getElementById('bug-report-form');
  if(form){
    form.onsubmit=async (e)=>{
      e.preventDefault();
      const fd=new FormData(form);
      const title=(fd.get('title')||'').trim();
      const content=(fd.get('content')||'').trim();
      if(!title||!content){ toast('제목과 내용을 입력해주세요'); return; }
      const latest=await loadBugReports();
      const report={
        id:uid(), title, content, imageUrl:imageData,
        studentId:state.user.studentId, name:state.user.name,
        appVersion:APP_VERSION, page:state.view,
        createdAt:now(), status:'접수'
      };
      const next=[report, ...latest];
      const ok=await saveBugReports(next);
      state.bugReports=next;
      closeModal();
      saveResultToast(ok, '제보가 접수되었습니다. 확인해볼게요!');
    };
  }
}

async function toggleBugStatus(id){
  const latest=await loadBugReports();
  const r=latest.find(x=>x.id===id);
  if(!r) return;
  const next=latest.map(x=>x.id===id?{...x, status: x.status==='해결'?'접수':'해결'}:x);
  const ok=await saveBugReports(next);
  state.bugReports=next;
  renderMain(); if(document.querySelector('.modal-sheet')) openModal(bugReportInboxModal());
  saveResultToast(ok, '상태가 변경되었습니다');
}
async function deleteBugReport(id){
  if(!await showConfirm('이 제보를 삭제할까요?')) return;
  const latest=await loadBugReports();
  const next=latest.filter(x=>x.id!==id);
  const ok=await saveBugReports(next);
  state.bugReports=next;
  openModal(bugReportInboxModal());
  saveResultToast(ok, '삭제되었습니다');
}

/* ===== 모달/토스트 ===== */
function openModal(html){
  const root=document.getElementById('modal-root');
  if(!root) return;
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal-sheet">${html}</div></div>`;
  const ov=document.getElementById('modal-overlay');
  if(ov){
    ov.addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
    requestAnimationFrame(()=>ov.classList.add('open'));
    setupModalDragToDismiss(ov);
  }
}
// 모달 위쪽의 손잡이(막대)가 잡고 내릴 수 있을 것처럼 생겼는데 실제로는 장식이던 문제.
// 손잡이를 아래로 끌면 시트가 손가락을 따라오다가, 일정 이상 내리거나 빠르게 튕기면 닫힌다.
// 시트 안 스크롤 영역(폼 입력 등)과 겹치지 않도록 손잡이에서 시작한 드래그만 처리한다.
function setupModalDragToDismiss(overlay){
  const handle = overlay.querySelector('.modal-handle');
  const sheet = overlay.querySelector('.modal-sheet');
  if(!handle || !sheet) return;
  let startY = 0, dy = 0, dragging = false, startedAt = 0;

  const onMove = (e)=>{
    if(!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = Math.max(0, y - startY);
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    sheet.style.transition = '';
    const elapsed = Date.now() - startedAt;
    const fast = elapsed > 0 && dy / elapsed > 0.6; // 빠르게 튕기듯 내리면 짧게 끌어도 닫힘
    if(dy > 110 || fast){ closeModal(); }
    else { sheet.style.transform = ''; }
  };
  const onStart = (e)=>{
    dragging = true; startedAt = Date.now();
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = 0;
    document.addEventListener('touchmove', onMove, {passive:true});
    document.addEventListener('touchend', onEnd);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  };
  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('mousedown', onStart);
}
function closeModal(){
  const ov=document.getElementById('modal-overlay');
  if(!ov) return;
  ov.classList.remove('open');
  setTimeout(()=>{ const r=document.getElementById('modal-root'); if(r) r.innerHTML=''; },180);
}
// 브라우저 기본 confirm()은 "example.com의 내용:" 같은 시스템 문구가 강제로 붙어서
// 이걸 없애기 위해 앱 테마에 맞는 자체 확인창을 새로 만듦 (기존 confirm 자리에 그대로 대체)
function showConfirm(message, opts={}){
  return new Promise((resolve)=>{
    const okLabel = opts.okLabel || '확인';
    const cancelLabel = opts.cancelLabel || '취소';
    const danger = opts.danger !== false;
    const wrap=document.createElement('div');
    wrap.className='confirm-overlay';
    wrap.innerHTML=`
      <div class="confirm-box">
        <p class="confirm-msg">${escapeHtml(message).replace(/\n/g,'<br>')}</p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-ghost" data-act="cancel">${escapeHtml(cancelLabel)}</button>
          <button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${escapeHtml(okLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(()=>wrap.classList.add('open'));
    const cleanup=(result)=>{
      wrap.classList.remove('open');
      setTimeout(()=>wrap.remove(),160);
      resolve(result);
    };
    wrap.addEventListener('click', e=>{
      if(e.target.dataset.act==='ok') cleanup(true);
      else if(e.target.dataset.act==='cancel' || e.target===wrap) cleanup(false);
    });
  });
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  if(!t){ return; }
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

async function handleToggleLike(type, id){
  if(!state.user){ toast('로그인이 필요합니다'); return; }
  const sid = state.user.studentId;
  const uName = state.user.name;

  let list = [];
  let docName = '';

  if(type==='notice'){ list = await loadNotices(); docName = 'notices'; }
  else if(type==='councilPost'){ list = await loadCouncilPosts(); docName = 'councilPosts'; }
  else if(type==='recruitment'){ list = await loadRecruitments(); docName = 'recruitments'; }
  else if(type==='suggestion'){ list = await loadSuggestions(); docName = 'suggestions'; }
  if(!docName) return;

  const item = list.find(x=>x.id===id);
  if(!item) return;

  // 여러 명이 같은 글에 동시에 따봉을 눌러도 서로의 기록이 지워지지 않도록 트랜잭션으로 처리
  const next = await mutateSharedList(docName, 'list', (cur)=>{
    const target = cur.find(x=>x && x.id===id);
    if(!target) return null;
    const likes = { ...(target.likes||{}) };
    if(likes[sid]) delete likes[sid];
    else likes[sid] = { name: uName, studentId: sid, time: now() };
    return cur.map(x=>x.id===id ? { ...x, likes, updatedAt: now() } : x);
  });
  if(!next){ saveResultToast(false); return; }

  if(type==='notice') state.notices = next;
  else if(type==='councilPost') state.councilPosts = next;
  else if(type==='recruitment') state.recruitmentPosts = next;
  else if(type==='suggestion') state.suggestions = next;

  renderMain();
}

async function handleToggleCommentLike(postId, commentId){
  if(!state.user){ toast('로그인이 필요합니다'); return; }
  const sid = state.user.studentId;
  const uName = state.user.name;

  const next = await mutateSharedList('councilPosts', 'list', (cur)=>{
    const post = cur.find(p=>p && p.id===postId);
    if(!post) return null;
    const comments = (post.comments||[]).map(c=>{
      if(c.id!==commentId) return c;
      const likes = { ...(c.likes||{}) };
      if(likes[sid]) delete likes[sid];
      else likes[sid] = { name: uName, studentId: sid, time: now() };
      return { ...c, likes };
    });
    return cur.map(p=>p.id===postId ? { ...p, comments, updatedAt: now() } : p);
  });
  if(!next){ saveResultToast(false); return; }
  state.councilPosts = next;
  renderMain();
}

function compressImage(file, maxDim=720, quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height){ if(width>maxDim){ height=Math.round(height*(maxDim/width)); width=maxDim; } }
        else { if(height>maxDim){ width=Math.round(width*(maxDim/height)); height=maxDim; } }
        const cv=document.createElement('canvas');
        cv.width=width; cv.height=height;
        cv.getContext('2d').drawImage(img,0,0,width,height);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

        <input type="checkbox" class="ocr-check-item" data-idx="${i}" checked style="width:16px; height:16px; flex-shrink:0;">

  if(dropzone && fileInput){
    dropzone.onclick=()=>fileInput.click();

      const file=e.target.files[0];
      if(!file) return;

      if(previewImg){
        const r=new FileReader();
        r.onload=ev=>{
          previewImg.src=ev.target.result;

          dropzone.style.display='none';
        };
        r.readAsDataURL(file);
      }

      if(statusBox){ statusBox.style.display='block'; statusBox.innerHTML='<span style="color:var(--teal);">시간표 사진을 분석 중입니다… (최대 30초 정도 걸릴 수 있어요)</span>'; }

      let recognized=[];
      try{
        recognized = await parseTimetableWithGeminiVision(file);
      }catch(err){
        if(statusBox) statusBox.innerHTML=`<span style="color:var(--danger);">인식 실패: ${escapeHtml(err.message||'오류')}</span>`;
        return;
      }
      state.ocrParsedClasses=recognized;
      if(recognized.length===0){
        if(statusBox) statusBox.innerHTML='<span style="color:var(--amber); font-weight:700;">인식된 수업이 없습니다.</span><br><span style="font-size:11.5px; color:var(--text-faint);">시간표 전체가 선명하게 보이는 캡처를 사용해주세요.</span>';
        if(resultsWrap) resultsWrap.style.display='none';
        return;
      }
      if(statusBox) statusBox.innerHTML=`<span style="color:var(--teal); font-weight:700;">✓ ${recognized.length}개 수업 인식 및 정각 단위 보정 완료</span>`;
      if(countEl) countEl.textContent=recognized.length;
      renderItems(recognized);
      if(resultsWrap) resultsWrap.style.display='block';
    };
  }

  if(btnSave){
    btnSave.onclick=async ()=>{
      const idxs=Array.from(document.querySelectorAll('.ocr-check-item:checked')).map(cb=>parseInt(cb.dataset.idx,10));
      const list=state.ocrParsedClasses.filter((_,i)=>idxs.includes(i));
      if(list.length===0){ toast('선택된 수업이 없습니다'); return; }
      const next=[]; const map=new Map(); let ci=0;
      list.forEach(c=>{
        const key=(c.subject||'').trim();
        if(!map.has(key)){ map.set(key,{ groupId:'grp_'+uid(), color:COLORS[ci%COLORS.length].hex }); ci++; }
        const g=map.get(key);
        next.push({ id:uid(), groupId:g.groupId, day:c.day, start:c.start, end:c.end, subject:c.subject, professor:c.professor||'', room:c.room||'', color:g.color, textColor:'#FFFFFF' });
      });
      const ok=await saveTimetable(state.user.uid, next);
      state.timetable=next;
      closeModal(); renderMain();
      saveResultToast(ok, `기존 시간표를 ${next.length}개 수업으로 교체했습니다`);
    };
  }
}

async function parseTimetableWithGeminiVision(file){
  const base64 = await new Promise(res=>{
    const r=new FileReader();
    r.onloadend=()=>{ const v=r.result; res(v.includes(',')?v.split(',')[1]:v); };
    r.readAsDataURL(file);
  });
  const prompt = `이 한국 대학교 주간 강의 시간표 이미지에서 모든 수업을 찾아 JSON 배열로만 반환하세요.
요일(0=월,1=화,2=수,3=목,4=금), 시작시각(HH:MM), 종료시각(HH:MM), 과목명, 교수명(있는 경우), 강의실.
한국 대학교 수업은 대부분 종료 시각이 정각(00분) 단위로 끝납니다 (예: 10:00, 11:00, 13:00). 이미지에서 종료 시각이 애매하거나 살짝 겹쳐 보이더라도, 특별히 다른 표시가 없다면 가장 가까운 정각(00분) 단위로 반올림해서 작성하세요. 시작 시각은 이미지에 보이는 그대로 정확히 기록하세요.
JSON으로만 작성하세요.
예시: [{"day":0,"startTime":"09:00","endTime":"10:00","subject":"반도체의 이해","professor":"김교수","room":"과학기술1관 301호"}]`;

  const models=[
    'gemini-3.6-flash',
    'gemini-flash-latest',
    'gemini-3.5-flash',
  ];
  let lastErr=null;
  // 'low'는 응답이 빠르지만 격자가 복잡한 시간표에서는 판단이 얕아질 수 있다.
  // 그래서 빠른 설정으로 먼저 시도하고, 인식 결과가 비어 있으면 기본 추론 강도로 한 번 더 시도한다.
  // (대부분의 사진은 1차에서 끝나서 빨라지고, 어려운 사진만 2차로 넘어간다)
  const attempts = [{ thinkingLevel:'low' }, null];
  ocr:
  for(const thinkingConfig of attempts){
    for(const apiKey of GEMINI_API_KEYS){
      for(const model of models){
        try{
          const generationConfig = { responseMimeType:'application/json' };
          if(thinkingConfig) generationConfig.thinkingConfig = thinkingConfig;
          const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey.trim() },
            body:JSON.stringify({
              contents:[{ parts:[ {text:prompt}, {inlineData:{ mimeType:file.type||'image/jpeg', data:base64 }} ] }],
              generationConfig
            })
          });
          const data=await res.json();
          if(data.error || !res.ok) throw geminiError(res, data);
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const parsed = JSON.parse(raw.replace(/```(?:json)?/gi,'').trim());
          const result = parsed.map(it=>{
            const rawStart = timeInputToMinutes(it.startTime);
            const rawEnd = timeInputToMinutes(it.endTime);
            return {
              day:Number(it.day),
              start:snapToSchoolPeriod(rawStart),
              end:snapToSchoolPeriod(rawEnd),
              subject:it.subject,
              professor:it.professor||'',
              room:it.room||''
            };
          }).filter(x=>x.day>=0 && x.day<=4 && x.start<x.end && x.subject);
          if(result.length) return result;
          // 한 과목도 못 읽었으면 다음 단계(더 깊은 추론)로 넘긴다
          lastErr = lastErr || new Error('인식된 수업이 없습니다');
          break;
        }catch(err){ lastErr=err; if(err && err.geminiAuth) break ocr; }
      }
    }
  }
  throw lastErr || new Error('시간표 인식에 실패했습니다.');
}

/* ===== 필수 입력 검증 =====
   input required 속성이 비어있으면 브라우저/웹뷰가 "입력란을 작성하세요" 같은 자체 말풍선을
   띄우면서 submit 이벤트 자체를 막아버린다. 안드로이드 기기마다 문구·모양이 제각각이라
   앱과 안 어울려서, 그 말풍선은 막고 대신 필드 아래에 우리 글씨로 빨간 안내를 띄운다. */
function fieldValidationMessage(el){
  const v = el.validity;
  if(v.valueMissing) return '이 항목을 입력해주세요.';
  if(v.typeMismatch || v.patternMismatch) return '형식을 확인해주세요.';
  if(v.tooShort) return `최소 ${el.minLength}자 이상 입력해주세요.`;
  if(v.tooLong) return `최대 ${el.maxLength}자까지 입력할 수 있어요.`;
  if(v.rangeUnderflow || v.rangeOverflow) return '입력 가능한 범위를 확인해주세요.';
  return el.validationMessage || '입력값을 확인해주세요.';
}
function showFieldError(el){
  const field = el.closest('.field') || el.parentElement;
  if(!field) return;
  field.classList.add('field-invalid');
  let msg = field.querySelector('.field-error');
  if(!msg){ msg = document.createElement('div'); msg.className = 'field-error'; field.appendChild(msg); }
  msg.textContent = fieldValidationMessage(el);
}
function clearFieldError(el){
  const field = el.closest('.field') || el.parentElement;
  if(!field) return;
  field.classList.remove('field-invalid');
  const msg = field.querySelector('.field-error');
  if(msg) msg.remove();
}
document.addEventListener('invalid', (e)=>{
  e.preventDefault(); // 기본 말풍선 억제
  showFieldError(e.target);
}, true);
document.addEventListener('input', (e)=>{
  if(e.target && e.target.willValidate && e.target.checkValidity()) clearFieldError(e.target);
}, true);
document.addEventListener('change', (e)=>{
  if(e.target && e.target.willValidate && e.target.checkValidity()) clearFieldError(e.target);
}, true);

function showAuthError(msg){
  const box=document.getElementById('auth-error');
  if(box) box.innerHTML=`<div class="error-msg">${escapeHtml(msg)}</div>`;
  else toast(msg);
}
function mapAuthError(err){
  const c = err && err.code;
  if(c==='auth/email-already-in-use') return '이미 가입된 학번입니다.';
  if(c==='auth/user-not-found') return '가입되지 않은 학번입니다. 회원가입을 먼저 진행해주세요.';
  if(c==='auth/wrong-password') return '비밀번호가 올바르지 않습니다.';
  if(c==='auth/invalid-credential') return '가입되지 않은 학번이거나 비밀번호가 올바르지 않습니다.';
  if(c==='auth/weak-password') return '비밀번호는 6자 이상이어야 합니다.';
  if(c==='auth/invalid-email') return '학번을 다시 확인해주세요.';
  if(c==='auth/too-many-requests') return '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.';
  return '오류가 발생했습니다: ' + (c || (err && err.message) || '알 수 없음');
}

async function handleLogin(fd){
  const studentId=(fd.get('studentId')||'').trim();
  const password=fd.get('password');
  const check=validateStudentId(studentId);
  if(!check.valid){ showAuthError(check.message); return; }

  const btn=document.querySelector('#login-form button[type=submit]');
  if(btn) btn.disabled=true;
  try{
    const roster = await loadRoster().catch(()=>({}));
    if(Object.keys(roster).length>0 && !roster[studentId]){
      showAuthError('학과 명단에 등록되지 않은 학번입니다. 학생회에 문의해주세요.');
      return;
    }
    let cred;
    try{
      cred = await signInWithEmailAndPassword(auth, studentId+STUDENT_EMAIL_DOMAIN, password);
    }catch(err1){
      if(err1.code==='auth/user-not-found' || err1.code==='auth/invalid-credential'){
        // 개명 이전(@ies.local)에 가입한 계정일 수 있으니 한 번 더 시도
        cred = await signInWithEmailAndPassword(auth, studentId+LEGACY_STUDENT_EMAIL_DOMAIN, password);
      } else {
        throw err1;
      }
    }
    if(Object.keys(roster).length>0){
      const udoc = await fetchUserDoc(cred.user.uid);
      const rEntry = rosterEntry(roster[studentId]);
      if(udoc && rEntry && String(rEntry.name).trim() !== String(udoc.name).trim()){
        await signOut(auth);
        showAuthError('명단에 등록된 이름과 계정 정보가 일치하지 않습니다. 학생회에 문의해주세요.');
      }
    }
  }catch(err){
    showAuthError(mapAuthError(err));
  }finally{ if(btn) btn.disabled=false; }
}

async function handleSignup(fd){
  const studentId=(fd.get('studentId')||'').trim();
  const name=(fd.get('name')||'').trim();
  const password=fd.get('password');
  const password2=fd.get('password2');
  let role = state.signupRole==='council' ? 'council' : 'student';

  if(!studentId||!name){ showAuthError('학번과 이름을 입력해주세요.'); return; }
  const check=validateStudentId(studentId);
  if(!check.valid){ showAuthError(check.message); return; }
  if(password.length<6){ showAuthError('비밀번호는 6자 이상이어야 합니다.'); return; }
  if(password!==password2){ showAuthError('비밀번호가 일치하지 않습니다.'); return; }

  // 개발자·학생회장 코드는 고정 문자열이라 여기서 바로 확인할 수 있지만, 일반 학생회
  // 인증코드는 Firestore에 저장된 "지금" 값과 대조해야 한다. 그 문서는 로그인한 사람만
  // 읽을 수 있게 막아뒀기 때문에(누구나 코드값을 그냥 읽어가지 못하도록), 계정을 먼저
  // 만들고 인증된 상태에서 확인한 뒤 — 명단 대조와 똑같이 — 틀리면 계정을 되돌린다.
  let needsLiveCouncilCheck = false;
  let councilCodeInput = '';
  if(state.signupRole==='council'){
    councilCodeInput=fd.get('councilCode');
    if(councilCodeInput===DEVELOPER_CODE) role='developer';
    else if(councilCodeInput===PRESIDENT_CODE) role='president';
    else needsLiveCouncilCheck = true;
  }

  const btn=document.querySelector('#signup-form button[type=submit]');
  if(btn) btn.disabled=true;
  let cred=null;
  try{
    // 명단 대조는 인증된 상태에서만 신뢰할 수 있어(Firestore 규칙), 계정을 먼저 만들고
    // 그 다음 명단을 확인한다. 명단에 없거나 조회 자체가 실패하면 방금 만든 계정을
    // 즉시 삭제해 되돌린다("조회 실패"를 "검증 통과"로 오인하지 않도록 fail-closed 처리).
    cred = await createUserWithEmailAndPassword(auth, studentId+STUDENT_EMAIL_DOMAIN, password);

    const rosterCheck = await loadRosterStrict();
    if(!rosterCheck.ok){
      await deleteUser(cred.user).catch(()=>{});
      showAuthError('학과 명단 확인에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해주세요.');
      return;
    }
    const roster = rosterCheck.map;
    if(Object.keys(roster).length>0){
      const rEntry = rosterEntry(roster[studentId]);
      if(!rEntry){
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('학과 명단에 등록되지 않은 학번입니다. 학생회에 문의해주세요.');
        return;
      }
      if(String(rEntry.name).trim()!==name){
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('명단에 등록된 이름과 일치하지 않습니다. 실명을 정확히 입력해주세요.');
        return;
      }
      if(rEntry.birthYear){
        const birthYear=(fd.get('birthYear')||'').trim();
        if(!birthYear){
          await deleteUser(cred.user).catch(()=>{});
          showAuthError('명단에 출생연도 확인이 필요합니다. 출생연도(4자리)를 입력해주세요.');
          return;
        }
        if(birthYear!==String(rEntry.birthYear).trim()){
          await deleteUser(cred.user).catch(()=>{});
          showAuthError('입력하신 출생연도가 명단과 일치하지 않습니다.');
          return;
        }
      }
    }

    if(needsLiveCouncilCheck){
      const liveCouncilCode = await loadCouncilCode().catch(()=>null);
      if(liveCouncilCode==null || councilCodeInput!==liveCouncilCode){
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('학생회 인증코드가 올바르지 않습니다.');
        return;
      }
      role = 'council';
    }

    const ok=await createUserDoc(cred.user.uid, { studentId, name, role, createdAt: now() });
    if(!ok) toast('프로필 저장에 실패했습니다.');
  }catch(err){
    if(cred){ await deleteUser(cred.user).catch(()=>{}); }
    showAuthError(mapAuthError(err));
  }finally{ if(btn) btn.disabled=false; }
}

/* ===== 시간표 저장 ===== */
async function handleClassSubmit(fd){
  const subject = (fd.get('subject') || '').trim();
  const professor = (fd.get('professor') || '').trim();
  const color = (fd.get('color') || '').trim() || COLORS[0].hex;
  const textColor = (fd.get('textColor') || '#FFFFFF').trim();
  const groupId = (fd.get('groupId') || '').trim() || ('grp_' + uid());
  if(!subject){ toast('과목명을 입력해주세요'); return; }

  const slots = readCurrentFormSlots();
  if(slots.length === 0){ toast('최소 1개 이상의 시간대를 입력해주세요'); return; }
  for(let i = 0; i < slots.length; i++){
    if(!(slots[i].end > slots[i].start)){ toast(`시간대 ${i+1}: 종료 시간은 시작 시간보다 늦어야 합니다`); return; }
  }
  for(let i = 0; i < slots.length; i++){
    for(let j = i + 1; j < slots.length; j++){
      if(slots[i].day === slots[j].day && Math.max(slots[i].start, slots[j].start) < Math.min(slots[i].end, slots[j].end)){
        toast(`입력한 시간대 ${i+1}과 ${j+1}이 서로 겹칩니다`);
        return;
      }
    }
  }
  const others = state.timetable.filter(c => (c.groupId ? c.groupId !== groupId : c.id !== groupId));
  for(const s of slots){
    for(const ex of others){
      if(s.day === ex.day && Math.max(s.start, ex.start) < Math.min(s.end, ex.end)){
        toast(`${DAYS[s.day]}요일 ${minutesToLabel(ex.start)}~${minutesToLabel(ex.end)}에 '${ex.subject}' 수업과 겹칩니다`);
        return;
      }
    }
  }

  const next = others.slice();
  slots.forEach(s => next.push({ id: uid(), groupId, day: s.day, start: s.start, end: s.end, subject, professor, room: s.room, color, textColor }));
  const ok = await saveTimetable(state.user.uid, next);
  state.timetable = next;
  closeModal();
  renderMain();
  saveResultToast(ok, '시간표가 저장되었습니다');
}

async function handlePollVoteSubmit(fd){
  const pollId = fd.get('pollId');
  const selected = fd.getAll('opt').map(v => parseInt(v, 10)).filter(n => !isNaN(n));
  const latest = await loadPolls();
  const poll = latest.find(p => p.id === pollId);
  if(!poll || isPollEnded(poll)) return;
  const sid = state.user.studentId;
  const isModify = !!(poll.votes && poll.votes[sid]);

  if(selected.length === 0){
    if(isModify){
      await cancelPollVote(pollId);
      return;
    } else {
      toast('선택지를 1개 이상 골라주세요');
      return;
    }
  }

  // 동시에 투표한 다른 사람의 표가 지워지지 않도록 트랜잭션 안에서 다시 읽고 기록한다.
  const next = await mutateSharedList('polls', 'list', (cur)=>{
    const target = cur.find(p => p && p.id === pollId);
    if(!target || isPollEnded(target)) return null;
    const votes = {
      ...(target.votes || {}),
      [sid]: { selected, name: state.user.name, studentId: sid, votedAt: new Date().toISOString() }
    };
    return cur.map(p => p.id === pollId ? { ...p, votes, updatedAt: now() } : p);
  });
  if(!next){ saveResultToast(false); return; }
  state.polls = next;
  state.editingPollVoteId = null;
  renderMain();
  saveResultToast(true, isModify ? '투표가 변경되었습니다' : '투표가 완료되었습니다');
}

async function cancelPollVote(pollId){
  const sid = state.user.studentId;
  const next = await mutateSharedList('polls', 'list', (cur)=>{
    const target = cur.find(p => p && p.id === pollId);
    if(!target || isPollEnded(target)) return null;
    const votes = { ...(target.votes || {}) };
    delete votes[sid];
    return cur.map(p => p.id === pollId ? { ...p, votes, updatedAt: now() } : p);
  });
  if(!next){ saveResultToast(false); return; }
  state.polls = next;
  state.editingPollVoteId = null;
  renderMain();
  saveResultToast(true, '투표가 취소되었습니다');
}

}

async function deletePoll(id){

async function handleRosterSubmit(fd){
  const text = fd.get('rosterText') || '';
  const map = {};
  text.split('\n').forEach(line => {
    line = line.trim();
    if(!line) return;
    const parts = line.includes(',') ? line.split(',') : line.split(/\s+/);
    if(parts.length >= 2){
      const sid = parts[0].trim();
      const nm = parts[1].trim();
      const by = (parts[2]||'').trim();
      if(sid && nm) map[sid] = by ? { name: nm, birthYear: by } : { name: nm };
    }
  });
  const ok = await saveRoster(map);
  state.roster = map;
  closeModal();
  saveResultToast(ok, `학생 명단 ${Object.keys(map).length}명이 저장되었습니다`);
}

/* ===== 게시판 전체 삭제 (상위 직급 글 보호 & 종료된 투표만 삭제) ===== */
async function clearAllBoard(type){
  if(myLevel() < 2) return;
  const nameMap = { notice: '공지사항', suggestion: '건의사항', recruitment: '구인글', councilPost: '학생회 게시글', poll: '종료된 투표' };
  if(!await showConfirm(`[확인] 삭제 가능한 모든 ${nameMap[type]}을(를) 삭제하시겠습니까?\n(상위 직급이 작성한 글은 유지됩니다)`)) return;

  let beforeCount = 0;
  let remaining = [];

  if(type === 'notice'){
    const list = await loadNotices();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'council') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveNotices(remaining);
    state.notices = remaining;
  }
  else if(type === 'suggestion'){
    const list = await loadSuggestions();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'student') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveSuggestions(remaining);
    state.suggestions = remaining;
  }
  else if(type === 'recruitment'){
    const list = await loadRecruitments();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'student') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveRecruitments(remaining);
    state.recruitmentPosts = remaining;
  }
  else if(type === 'councilPost'){
    const list = await loadCouncilPosts();
    beforeCount = live(list).length;
    remaining = list.map(item => (!item.deleted && roleLevel(item.authorRole || 'council') > myLevel()) ? item : { ...item, deleted: true, updatedAt: now() });
    await saveCouncilPosts(remaining);
    state.councilPosts = remaining;
  }
  else if(type === 'poll'){
    const list = await loadPolls();
    const endedList = live(list).filter(p => isPollEnded(p));
    beforeCount = endedList.length;
    if(beforeCount === 0){
      toast('삭제할 수 있는 종료된 투표가 없습니다');
      return;
    }
    remaining = list.map(p => {
      if(p.deleted) return p;
      if(!isPollEnded(p)) return p;
      if(roleLevel(p.authorRole || 'council') > myLevel()) return p;
      return { ...p, deleted: true, updatedAt: now() };
    });
    await savePolls(remaining);
    state.polls = remaining;
  }

  renderMain();
  const afterCount = (type === 'poll') ? live(remaining).filter(p => isPollEnded(p)).length : live(remaining).length;
  const deletedCount = beforeCount - afterCount;

  if(afterCount > 0){
    toast(`${deletedCount}개 삭제 완료 (상위 직급 항목 ${afterCount}개 제외)`);
  } else {
    toast(`${nameMap[type]} 전체 삭제가 완료되었습니다`);
  }
  if(deletedCount > 0) logAudit('전체 삭제', nameMap[type], `${deletedCount}개`);
}
