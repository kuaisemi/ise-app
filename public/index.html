  if(!force && Date.now() - presenceWrittenAt < 30 * 60 * 1000) return;
  presenceWrittenAt = Date.now();
  try{
    // 본인 문서만 건드리므로 학생 계정도 규칙을 통과한다(직급을 바꾸지 않는 한 수정 허용).
    // 예전에는 학생회 전용 문서에 쓰려다 조용히 거부돼서, 학생회가 아닌 사람의 접속 기록이
    // 아예 남지 않았다.
    const ts = now();
    const platform = currentPlatform();
    // 낮 12시에 업데이트 미완료자에게 한 번만 안내 푸시를 보내려면(notify/send-notifications.mjs),
    // 서버가 "이 사람이 지금 몇 버전을 쓰고 있는지" 알아야 한다. 네이티브 앱일 때만 의미가 있다.
    // cohortYear(학번 앞 두 자리)는 firestore.rules가 학번별 채팅방 접근을 판단하는 기준이라
    // 문자열 자르기 같은 걸 규칙 안에서 하지 않고 여기서 미리 필드로 남겨둔다.
    await setDoc(doc(db,'users',u.uid), {
      lastSeen: ts, platform,
      // 숫자(build 167)만 있으면 관리 화면에서 그 사람이 어느 버전인지 한눈에 안 들어와서,
      // 읽을 수 있는 이름('Beta 0.3.0')도 같이 남긴다.
      ...(isNativeApp ? { androidVersionCode: ANDROID_VERSION_CODE, appVersion: APP_VERSION } : {}),
      ...(myCohortYear() ? { cohortYear: myCohortYear() } : {}),
    }, { merge:true });
    if(state.allUsers && state.allUsers[u.studentId]){
      state.allUsers[u.studentId] = { ...state.allUsers[u.studentId], lastSeen: ts, platform };
    }
  }catch(e){ console.warn('[presence] 갱신 실패', e && e.code); }
}
let presenceHeartbeatStarted = false;
// "현재 접속자" 통계(getTrafficStats)가 로그인/재접속 시점의 lastSeen에만 의존하면
// 앱을 오래 켜둔 사용자가 금방 "접속 종료"로 잡혀버리므로, 몇 분마다 조용히 lastSeen만 갱신한다.
// 웹/PWA는 앱을 켜 둔 채로 새 버전이 배포되면 예전 코드가 계속 돈다. 사용자는 뭐가
// 바뀐 줄도 모르고 이미 고친 버그를 계속 겪는다. 그래서 빌드 식별자를 비교해 새 버전이
// 올라왔으면 새로고침을 권한다.
//
// 서비스워커의 업데이트 감지를 쓰지 않는 이유: sw.js 파일 내용은 배포해도 그대로라서
// 브라우저가 "새 서비스워커"로 보지 않는다. 그래서 매 빌드마다 값이 바뀌는 version.json을
// 따로 둔다. APK는 index.html이 apk 안에 들어 있어 새로고침해도 그대로라 대상이 아니다.
/* ===== 웹 패치(OTA) =====
   이 앱은 웹 화면(index.html 묶음)을 APK 안에 넣어 두고 웹뷰로 연다. 그래서 화면만 고쳐도 매번 새 APK를
   받아 설치해야 했다. 여기서는 서버(Firebase 호스팅)에 올라간 새 화면 묶음을 앱이 알아서 내려받아 기기에
   저장하고, 웹뷰가 APK 안의 파일 대신 그 폴더를 열게 한다(Capacitor WebView.setServerBasePath).
   안드로이드 코드(위젯·권한·플러그인)를 바꾸는 변경만 여전히 새 APK가 필요하다.

   - 버전은 빌드 식별자(BUILD_ID, 14자리 숫자)로 비교한다. 서버 쪽 ota-manifest.json에 파일 목록과
     각 파일의 sha256이 들어 있고, 내려받은 뒤 해시가 다르면 그 패치는 버린다.
   - 이미 이 화면이 가진 파일(해시가 같은 것)은 서버에서 다시 받지 않고 지금 화면에서 복사한다.
   - 패치는 다 받아 둔 뒤 사용자가 "적용"을 눌렀을 때만 전환한다(입력 중 갑자기 새로고침되지 않게).
   - 새 패치가 깨져서 화면이 안 뜨면 네이티브(OtaPlugin)가 두 번째 시작에서 APK 원본으로 되돌린다.
     화면이 정상적으로 뜨고 오류가 없었을 때만 스스로 "확인됨"을 알린다.
   - OTA_BASE가 자리표시자 그대로(빌드를 거치지 않은 원본)면 통째로 꺼져 있다. */
const OTA_BASE = '__OTA_BASE__';
const otaBootErrors = [];
window.addEventListener('error', (e) => { otaBootErrors.push(String((e && e.message) || 'error')); });
function otaPlugins(){
  const P = (typeof Capacitor !== 'undefined' && Capacitor.Plugins) ? Capacitor.Plugins : null;
  return P && P.Ota && P.Filesystem && P.WebView ? P : null;
}
function otaEnabled(){
  return isNativePlatformNow() && OTA_BASE.indexOf('__OTA') !== 0 && BUILD_ID.indexOf('__BUILD') !== 0 && !!otaPlugins();
}
function otaToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}
async function otaSha256(buf){
  const d = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
}
// 화면이 실제로 그려졌고 시작 직후 오류가 없었을 때만 이 패치를 "정상"으로 확인한다.
async function otaConfirmBoot(){
  if(!otaEnabled()) return;
  try{
    const P = otaPlugins();
    const st = await P.Ota.state();
    if(!st.pending){ await otaCleanup(P); return; }   // 확인할 게 없으면 지난 패치 폴더만 정리
    if(st.pending !== BUILD_ID) return;
    const drawn = APP && APP.innerHTML.length > 500;
    if(!drawn || otaBootErrors.length){
      console.warn('[ota] 확인 보류 — 화면 그려짐:', drawn, '오류:', otaBootErrors.slice(0, 3));
      return;
    }
    await P.Ota.confirm({ version: BUILD_ID });
    await otaCleanup(P);
  }catch(e){ console.warn('[ota] confirm', e); }
}
// 지난 패치 폴더 정리 — 지금 쓰는 것만 남긴다(앱을 새로 설치해 원본으로 돌아간 뒤 남은 폴더 포함).
async function otaCleanup(P){
  try{
    const list = await P.Filesystem.readdir({ path: 'ota', directory: 'DATA' });
    for(const f of (list.files || [])){
      const name = f.name || f;
      if(name && name !== BUILD_ID) await P.Filesystem.rmdir({ path: 'ota/' + name, directory: 'DATA', recursive: true }).catch(()=>{});
    }
  }catch(e){ /* 폴더가 없으면 그냥 넘어간다 */ }
}
let otaChecking = false;
// "화면 업데이트 확인" 버튼은 한 번 누르면 10초 동안 다시 못 누른다. 남은 초는 버튼 옆에 보여준다.
let otaManualUntil = 0, otaCooldownTimer = null;
const OTA_MANUAL_COOLDOWN_MS = 10000;
function otaCooldownLeft(){ return Math.max(0, Math.ceil((otaManualUntil - Date.now()) / 1000)); }
function otaCooldownTick(){
  const left = otaCooldownLeft();
  const btn = document.getElementById('ota-check-btn'), cd = document.getElementById('ota-check-cd');
  if(btn){ if(left > 0) btn.setAttribute('disabled', ''); else btn.removeAttribute('disabled'); }
  if(cd) cd.textContent = left > 0 ? '(' + left + '초)' : '';
  if(left <= 0 && otaCooldownTimer){ clearInterval(otaCooldownTimer); otaCooldownTimer = null; }
}
function startOtaCooldown(){
  otaManualUntil = Date.now() + OTA_MANUAL_COOLDOWN_MS;
  otaCooldownTick();
  if(!otaCooldownTimer) otaCooldownTimer = setInterval(otaCooldownTick, 250);
}
let otaTryingBuild = '';
let otaFailBuild = '', otaFailUntil = 0; // 받다가 실패한 버전과 다시 시도해도 되는 시각
let otaReady = null; // { build, path } — 다 받아 둔, 적용만 남은 패치
// 새 패치가 있으면 내려받아 저장해 둔다(적용은 사용자가 누를 때). 결과를 문자열로 돌려준다.
async function otaCheck(opts){
  if(!otaEnabled()) return 'off';
  if(otaChecking) return 'busy';
  if(otaReady) return 'ready';
  otaChecking = true;
  try{
    const P = otaPlugins();
    const st = await P.Ota.state();
    if(st.pending) return 'pending';   // 확인 안 된 패치가 있는 동안엔 새 패치를 받지 않는다
    const res = await fetch(OTA_BASE + 'ota-manifest.json', { cache: 'no-cache' });   // 변경이 없으면 본문 없이 304
    if(!res.ok) return 'fail';
    const m = await res.json();
    if(!m || !m.build || !Array.isArray(m.files) || !m.files.length) return 'fail';
    if(String(m.build) <= String(BUILD_ID)) return 'latest';
    if(String(m.build) === String(st.failed)) return 'failed-before';
    if(String(m.build) === otaFailBuild && Date.now() < otaFailUntil) return 'fail';
    if(Number(m.minApk || 0) > ANDROID_VERSION_CODE){ state.otaNeedsApk = true; return 'need-apk'; }

    // 이 화면이 이미 가진 파일의 해시 — 같으면 서버 대신 지금 화면에서 복사한다.
    const have = {};
    try{
      const cr = await fetch('./ota-manifest.json?t=' + Date.now(), { cache: 'no-store' });
      if(cr.ok){ ((await cr.json()).files || []).forEach(f => { have[f.path] = f.sha256; }); }
    }catch(e){ /* 없으면 전부 서버에서 받는다 */ }

    otaTryingBuild = String(m.build);
    const dir = 'ota/' + m.build;
    await P.Filesystem.rmdir({ path: dir, directory: 'DATA', recursive: true }).catch(()=>{});
    for(const f of m.files){
      // f.src가 있으면 그 위치에서 받는다(파일 경로와 서버 위치가 다를 때 — 예: 되돌리기 시험용 패치를 웹 사이트 본체와 분리해 둘 때).
      const src = (have[f.path] === f.sha256) ? ('./' + f.path) : (OTA_BASE + (f.src || f.path) + '?v=' + m.build);
      const r = await fetch(src, { cache: 'no-store' });
      if(!r.ok) throw new Error('다운로드 실패 ' + f.path + ' ' + r.status);
      const buf = await r.arrayBuffer();
      if(await otaSha256(buf) !== f.sha256) throw new Error('해시 불일치 ' + f.path);
      await P.Filesystem.writeFile({ path: dir + '/' + f.path, directory: 'DATA', data: otaToBase64(buf), recursive: true });
    }
    await P.Filesystem.writeFile({ path: dir + '/ota-manifest.json', directory: 'DATA', data: btoa(unescape(encodeURIComponent(JSON.stringify(m)))), recursive: true });
    const uri = await P.Filesystem.getUri({ path: dir, directory: 'DATA' });
    otaReady = { build: String(m.build), path: String(uri.uri).replace(/^file:\/\//, '') };
    if(opts && opts.auto){
      // 사용자가 누르지 않아도 되게: 받아 둔 패치를 "다음 시작 때 열 화면"으로 미리 등록해 두고,
      // 앱이 화면 밖에 나가 있는 중이면 지금 바로 전환한다(보고 있는 화면이 갑자기 새로고침되지 않게).
      // 보고 있는 중이라면 앱을 나갔다 들어올 때(아래 visibilitychange) 또는 다음 시작 때 새 화면이 열린다.
      await P.Ota.arm({ version: otaReady.build, path: otaReady.path });
      otaTrySwitch();
    }
    return 'ready';
  }catch(e){
    console.warn('[ota] check', e);
    if(otaTryingBuild){ otaFailBuild = otaTryingBuild; otaFailUntil = Date.now() + 10 * 60 * 1000; }
    return 'fail';
  }finally{ otaChecking = false; otaTryingBuild = ''; }
}
async function otaApply(){
  if(!otaReady || !otaEnabled()) return;
  const P = otaPlugins();
  try{
    await P.Ota.arm({ version: otaReady.build, path: otaReady.path });   // 대기 표시 + 다음 시작에도 이 폴더를 쓰도록 저장
    await P.WebView.setServerBasePath({ path: otaReady.path });           // 웹뷰가 새 폴더로 다시 열린다
  }catch(e){
    console.warn('[ota] apply', e);
    toast('업데이트를 적용하지 못했어요');
  }
}
// 지금 화면을 바꿔도 되는 순간인가 — 글자 입력 중이거나 창(모달)이 열려 있으면 작성 중인 내용을 잃을 수
// 있으니 기다린다. 앱이 화면 밖에 있으면 언제든 된다.
function otaSafeToSwitch(){
  if(document.hidden) return true;
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return false;
  return !document.getElementById('modal-overlay');
}
let otaSwitchTimer = null;
function otaTrySwitch(){
  if(!otaReady) return;
  if(otaSafeToSwitch()){
    otaSwitchTimer = null;
    if(!document.hidden) toast('새 화면으로 업데이트합니다');
    setTimeout(otaApply, document.hidden ? 0 : 900);
    return;
  }
  if(!otaSwitchTimer) otaSwitchTimer = setTimeout(() => { otaSwitchTimer = null; otaTrySwitch(); }, 4000);
}
if(isNativePlatformNow()){
  setTimeout(otaConfirmBoot, 4000);
  // 화면이 보이는 동안 15초마다 새 패치를 확인한다. 목록 파일(ETag가 같으면 본문 없이 304)만 받으므로
  // Firestore 할당량은 전혀 쓰지 않는다. 이미 받아 둔 패치가 있거나 적용 확인 중이면 서버에 묻지 않는다.
  setTimeout(() => {
    otaCheck({ auto: true });
    setInterval(() => { if(!document.hidden) otaCheck({ auto: true }); }, 15000);
  }, 15000);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ if(otaReady) otaTrySwitch(); return; }   // 화면 밖으로 나가는 순간 받아 둔 패치로 전환
    otaCheck({ auto: true });
  });
}

let updateBannerShown = false;
function isNativePlatformNow(){
  return typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
}
async function checkForUpdate(){
  if(updateBannerShown || isNativePlatformNow()) return;
  if(BUILD_ID.indexOf('__BUILD') === 0) return;   // 빌드를 거치지 않은 원본
  try{
    const res = await fetch('./version.json?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) return;
    const j = await res.json();
    if(j && j.build && j.build !== BUILD_ID) showUpdateBanner();
  }catch(e){ /* 오프라인이면 그냥 넘어간다 */ }

function showUpdateBanner(){
  if(updateBannerShown) return;
  updateBannerShown = true;
  const bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.innerHTML = '<span>새 버전이 나왔어요</span><button type="button" class="update-bar-btn" data-action="reload-app">새로고침</button>';

}
async function reloadForUpdate(){
  // 캐시를 비우고 새로 받는다. 안 비우면 서비스워커가 들고 있던 예전 index.html이
  // 그대로 다시 뜰 수 있다.
  try{
    if(window.caches){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }

function setupPresenceHeartbeat(){
  if(presenceHeartbeatStarted) return;
  presenceHeartbeatStarted = true;
  setInterval(()=>{
    // 화면이 안 보이는 탭·앱(백그라운드 PWA, 열어만 둔 PC 탭)은 3분마다 접속 기록 쓰기와 친구 목록·
    // 관리자 배지 조회를 계속 돌려서 Firestore 무료 할당량을 조용히 먹는다. 다시 보이는 순간
    // 아래 visibilitychange 핸들러가 바로 맞추므로 안 보이는 동안은 건너뛴다.
    if(document.hidden) return;
    // 접속 기록 쓰기는 하지 않는다(앱을 켤 때와 백그라운드에서 오래 있다 돌아올 때만 쓴다).
    // 직급은 실시간 리스너(startRoleRealtimeListener)가 이미 따라가므로 여기서 다시 읽지 않는다.
    checkForUpdate();
  }, 10*60*1000);
  checkForUpdate();
  // 앱을 다시 열었을 때는 3분을 기다리지 않고 바로 맞춘다. 직급이 바뀌었다는 연락을 받고
  // 앱을 켜보는 게 보통이라 이쪽이 실제로 더 자주 걸린다.
  let resumeRefreshAt = 0;
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      checkForUpdate();
      // 돌아올 때마다 다시 읽지 않고 2분에 한 번까지만. 접속 기록은 30분 넘게 나가 있었을 때만 쓴다.
      if(state.user && Date.now() - resumeRefreshAt > 2 * 60 * 1000){
        resumeRefreshAt = Date.now();
        trackUserPresence(state.user);
        syncMyRole();
      }
    }
  });
}

// 내 직급을 서버 기준으로 다시 맞춘다.
// state.user.role은 로그인할 때 한 번만 채워져서, 회장이 직급을 바꿔도 그 사람이 앱을
// 껐다 켜기 전까지는 예전 권한이 그대로 남아 있었다. 바꾼 쪽에서는 "안 내려간다"로 보인다.
async function syncMyRole(){
  if(!state.user || !state.user.uid) return;
  try{
    const udoc = await fetchUserDoc(state.user.uid);
    if(!udoc || !udoc.role) return;
    const fresh = ROLES[udoc.role] ? udoc.role : 'student';
    if(fresh === state.user.role) return;
    state.user.role = fresh;
    localSet('user_'+state.user.uid, state.user);
    renderApp();
    toast(`직급이 ${roleLabel(fresh)}(으)로 변경되었습니다`);
  }catch(e){ console.warn('[syncMyRole] 실패', e && e.code); }
}

// syncMyRole은 3분 폴링/화면 복귀 때만 도는 방식이라 최대 3분까지 지연될 수 있었다.
// 실시간 리스너를 붙여서 회장이 직급을 바꾸는 순간 그 사람 화면에 바로 반영되게 한다.
// (친구 채팅과 같은 onSnapshot 방식 — 문서 하나짜리 리스너라 부담은 거의 없다)
let myRoleUnsub = null;
function startRoleRealtimeListener(){
  if(myRoleUnsub || !state.user || !state.user.uid) return;
  myRoleUnsub = onSnapshot(doc(db,'users',state.user.uid), (snap)=>{
    if(!snap.exists() || !state.user) return;
    const data = snap.data();
    const fresh = ROLES[data.role] ? data.role : 'student';
    if(fresh === state.user.role) return;
    state.user.role = fresh;
    localSet('user_'+state.user.uid, state.user);
    renderApp();
    toast(`직급이 ${roleLabel(fresh)}(으)로 변경되었습니다`);
  }, (err)=>{ console.warn('[roleRealtime]', err && err.code); });
}

/* ===== 알림 설정 ===== */
// 공지/투표 알림은 "누구에게 보낼지"를 서버(무료 GitHub Actions 크론)가 판단해야 하므로
// Firestore 사용자 문서에도 함께 저장. 시간표 알림은 기기 로컬 알림이라 서버가 알 필요 없어
// localStorage에만 둠.
function getNotifyPrefs(){

// 시간표 알림은 기기 로컬 알림이라 서버가 알 필요 없음.
const SERVER_NOTIFY_KEYS = ['notice', 'poll', 'mealJinri', 'mealMirae', 'mealBreakfast', 'mealLunch', 'mealDinner', 'recruit', 'friendRequest', 'night', 'chat'];

// getNotifyPrefs()의 기본값(예: chat:true)은 토글을 한 번도 안 건드린 기기에서는 localStorage에만
// 있고 Firestore(서버가 발송 대상을 판단하는 곳)에는 올라간 적이 없다 — 그래서 "설정은 켜짐인데
// 실제로는 알림이 안 오는" 문제가 생긴다. 로그인할 때마다 현재 로컬 설정을 그대로 merge해서
// 서버 쪽 값이 항상 로컬 표시와 일치하도록 맞춘다.
async function syncNotifyPrefsToServer(np){

  const sig = state.user.uid + '|' + JSON.stringify(prefs);

// 홈 화면에 뭘 보여줄지는 순전히 이 기기에서만 보이는 표시 설정이라, 알림 설정과 달리
// 서버(Firestore)에 동기화할 필요가 없어 localStorage에만 저장한다.
function getHomePrefs(){
  const savedOrder = localGet('home_order', null);
  // 예전에 저장된 순서에 새로 추가된 항목(셔틀버스 등)이 빠져 있거나, 반대로 없어진 항목이 남아
  // 있을 수 있어서 — 기본 순서를 기준으로 알려진 항목만 걸러내고 빠진 항목은 뒤에 채워 넣는다.
  let order = Array.isArray(savedOrder) ? savedOrder.filter(k=>DEFAULT_HOME_ORDER.includes(k)) : [];
  DEFAULT_HOME_ORDER.forEach(k=>{ if(!order.includes(k)) order.push(k); });
  // 예전에 저장된 순서에는 '다가오는 내 일정'(mine) 자리가 없다 — 그 경우 예전처럼 학사일정 바로 아래에 둔다.
  if(Array.isArray(savedOrder) && !savedOrder.includes('mine')){
    order = order.filter(k=>k!=='mine');
    order.splice(order.indexOf('calendar')+1, 0, 'mine');
  }
  return {
    hideVotedPolls: localGet('home_hideVotedPolls', false),
    hideTodayTimetable: localGet('home_hideTodayTimetable', false),
    hideTodayMeal: localGet('home_hideTodayMeal', false),
    hideUpcomingCalendar: localGet('home_hideUpcomingCalendar', false),
    hideUpcomingMine: localGet('home_hideUpcomingMine', false),
    hideRecruits: localGet('home_hideRecruits', false),
    hideShuttle: localGet('home_hideShuttle', true), // 셔틀버스는 새 항목이라 기본은 숨김
    order,
  };
}
function setHomePref(key, value){ localSet('home_'+key, value); }
// 순서 조정 목록에서 항목 하나를 위/아래로 한 칸 옮긴다. 맨 위·맨 아래에서는 그 방향으로 더 못 움직인다.
function moveHomeOrderItem(key, dir){
  const hp = getHomePrefs();
  const idx = hp.order.indexOf(key);
  if(idx<0) return;
  const swapWith = dir==='up' ? idx-1 : idx+1;
  if(swapWith<0 || swapWith>=hp.order.length) return;
  const order = hp.order.slice();
  [order[idx], order[swapWith]] = [order[swapWith], order[idx]];
  localSet('home_order', order);
}
// 켜짐/꺼짐처럼 "지금 상태"를 보여주는 토글 버튼 하나는, 표시/숨김처럼 둘 다 동사로 읽히는
// 라벨에서는 "이 버튼을 누르면 뭐가 될까"로 헷갈린다는 피드백을 받아, 버튼 자체가 곧 그
// 동작을 뜻하는 두 개짜리 선택형(표시 버튼=표시로 전환, 숨김 버튼=숨김으로 전환)으로 바꿨다.
function homePrefToggleHtml(key, hidden){
    // 알림 탭과 같은 슬라이드 스위치: 켜짐 = 홈 화면에 표시, 꺼짐 = 숨김
  return `<button type="button" class="tgl ${!hidden?'on':''}" data-action="toggle-home-pref" data-key="${key}" role="switch" aria-checked="${!hidden}" title="홈 화면에 표시"></button>`;
}
// 순서 변경 모드에서는 표시/숨김 버튼 대신 위/아래 화살표 두 개가 그 자리를 대신한다.
// 맨 위 항목은 위로, 맨 아래 항목은 아래로 더 못 가게 그 화살표를 비활성화한다.
function homeOrderMoveHtml(key){
  return `<span class="home-drag-handle" data-key="${key}" title="끌어서 순서 변경">${ICON.grip}</span>`;
}
// 순서 변경 모드: 손잡이를 잡고 위아래로 끌면 그 줄이 손가락을 따라오고, 다른 줄들은 자리를 비켜준다.
// 손을 떼면 그 자리로 순서가 저장된다. 줄 높이가 거의 같아서 "한 칸 높이"(slot) 단위로 계산한다.
// 알약 선택기(.seg-group)는 화면을 다시 그리면 미끄러지는 모습이 끊긴다. 그래서 다른 칸을 누르면
// 먼저 선택 칸(.seg-thumb)만 옮겨서 애니메이션을 보여 주고, 끝난 뒤에 같은 클릭을 한 번 더 보내 원래 동작을 실행한다.
if(!window.__segSlideBound){
  window.__segSlideBound = true;
  // 새로 손을 대는 순간 이전 밀기의 클릭 차단은 끝낸다(연달아 빠르게 누르거나 밀어도 다음 동작이 먹히도록)
  document.addEventListener('pointerdown', ()=>{ window.__suppressClick = null; }, true);
  document.addEventListener('click', (e)=>{
    // 손으로 밀어서 바꾼 직후에 뒤따라오는 진짜 클릭은 버린다(이미 바꿨으므로 또 바꾸면 되돌아간다)
    const sp = window.__suppressClick;
    // 우리가 코드로 보낸 클릭(isTrusted=false)은 절대 막지 않는다. 막으면 선택 칸은 움직였는데 실제 설정은 안 바뀐다.
    if(e.isTrusted && sp && Date.now() < sp.until && sp.el && sp.el.contains(e.target)){ e.stopPropagation(); e.preventDefault(); return; }
    // 위젯 설정의 켜짐/꺼짐 스위치: 먼저 미끄러뜨리고 0.24초 뒤에 원래 동작을 실행한다
    const tg = e.target.closest && e.target.closest('.tgl[data-action^="toggle-widget-"]');
    if(tg){
      if(tg.dataset.slid){ delete tg.dataset.slid; return; }
      e.stopPropagation(); e.preventDefault();
      tg.classList.toggle('on');
      setTimeout(()=>{ tg.dataset.slid = '1'; tg.click(); }, 240);
      return;
    }
    const btn = e.target.closest && e.target.closest('.seg-group button');
    if(!btn) return;
    if(btn.dataset.slid){ delete btn.dataset.slid; return; }   // 애니메이션 뒤에 다시 보낸 클릭 — 그대로 통과
    const group = btn.closest('.seg-group');
    const thumb = group && group.querySelector('.seg-thumb');
    if(!thumb || btn.classList.contains('on')) return;
    e.stopPropagation(); e.preventDefault();
    const btns = Array.from(group.querySelectorAll('button'));
    thumb.style.setProperty('--i', String(btns.indexOf(btn)));
    btns.forEach(x=>x.classList.toggle('on', x === btn));
    setTimeout(()=>{ btn.dataset.slid = '1'; btn.click(); }, 260);
  }, true);
}
// 스위치·알약 선택기를 손으로 잡고 좌우로 밀어서 바꾼다. 살짝 누르기(탭)는 위의 클릭 처리가 그대로 맡는다.
if(!window.__swipeBound){
  window.__swipeBound = true;
  let st = null;
  const segIndexAt = (c, x)=>{
    const r = c.getBoundingClientRect(), n = c.querySelectorAll('button').length;
    return Math.max(0, Math.min(n-1, Math.floor((x - r.left - 3) / ((r.width - 6) / n))));
  };
  document.addEventListener('pointerdown', (e)=>{
    const c = e.target.closest && e.target.closest('.seg-vis, .tgl, .seg-group, .switch');

      if(dx > 10 && dx > dy * 1.5) st.moved = true;
    }
    if(st) st.lastX = e.clientX;
    if(st && st.moved && st.c.classList.contains('seg-group')){
      st.idx = segIndexAt(st.c, e.clientX);
      const thumb = st.c.querySelector('.seg-thumb');
      if(thumb) thumb.style.setProperty('--i', String(st.idx));   // 선택 칸이 손가락을 따라 칸 단위로 미끄러진다

    const endX = (!cancel && typeof e.clientX === 'number') ? e.clientX : lastX;
    if(c.classList.contains('seg-group') && !cancel){ const i2 = segIndexAt(c, endX); if(i2 >= 0) idx = i2; }

    if(c.classList.contains('seg-group')){

    } else if(c.classList.contains('tgl')){
      const wantOn = dx > 0;
      if(wantOn !== c.classList.contains('on')) c.click();

// 슬라이더의 채워진 구간(--fill) 계산. 색 고르는 색상바(.cp-hue)는 제외한다.

  window.__rangeFillBound = true;
  const sync = (el)=>{ const mn = parseFloat(el.min) || 0, mx = parseFloat(el.max) || 100; el.style.setProperty('--fill', (((parseFloat(el.value) - mn) / (mx - mn)) * 100) + '%'); };
  document.addEventListener('input', (e)=>{ const t = e.target; if(t && t.type === 'range' && !t.classList.contains('cp-hue')) sync(t); }, true);
  // 잡고 있는 동안 옆의 퍼센트 숫자도 커진다
  const bigOn = (e)=>{ const t = e.target; if(t && t.type === 'range'){ const v = t.parentElement && t.parentElement.querySelector('.range-val'); if(v) v.classList.add('big'); } };
  const bigOff = ()=>{ document.querySelectorAll('.range-val.big').forEach(v=>v.classList.remove('big')); };
  document.addEventListener('pointerdown', bigOn, true);
  document.addEventListener('pointerup', bigOff, true);
  document.addEventListener('pointercancel', bigOff, true);
  const syncAll = ()=>document.querySelectorAll('input[type=range]:not(.cp-hue)').forEach(sync);
  const start = ()=>{ syncAll(); new MutationObserver(syncAll).observe(document.body, { childList:true, subtree:true }); };

// 위쪽 탭 줄(.subtabs)마다 선택 칸(.subtab-thumb)을 하나 두고 선택된 탭 위치에 맞춘다.
// 화면이 새로 그려질 때마다(탭을 눌러 이동할 때 포함) 처음 한 번은 애니메이션 없이 제자리에 놓는다.
if(!window.__subtabBound){
  window.__subtabBound = true;
  const place = (bar, tab, anim)=>{
    let th = bar.querySelector(':scope > .subtab-thumb');
    if(!th){ th = document.createElement('span'); th.className = 'subtab-thumb'; bar.insertBefore(th, bar.firstChild); anim = false; }
    if(!anim){ th.style.transition = 'none'; }
    th.style.width = tab.offsetWidth + 'px';
    th.style.transform = 'translateX(' + tab.offsetLeft + 'px)';
    if(!anim){ void th.offsetWidth; th.style.transition = ''; }
    bar.classList.add('has-thumb');
  };
  const syncAll = ()=>{
    document.querySelectorAll('.subtabs').forEach(bar=>{
      const tab = bar.querySelector('.subtab.active'); if(!tab) return;
      const th = bar.querySelector(':scope > .subtab-thumb');
      const w = tab.offsetWidth + 'px', x = 'translateX(' + tab.offsetLeft + 'px)';
      if(!th || th.style.width !== w || th.style.transform !== x) place(bar, tab, false);
    });
  };
  let raf = 0;
  const schedule = ()=>{ if(raf) return; raf = requestAnimationFrame(()=>{ raf = 0; syncAll(); }); };
  new MutationObserver(schedule).observe(document.body, { childList:true, subtree:true });
  window.addEventListener('resize', schedule);
  // 잡고 좌우로 끌면 선택 칸이 손가락 아래의 탭으로 따라오고, 놓으면 그 탭으로 이동한다.
  let sd = null;
  const tabAt = (bar, x)=>{
    const tabs = Array.from(bar.querySelectorAll('.subtab'));
    let best = tabs[0], bd = Infinity;
    tabs.forEach(t=>{ const r = t.getBoundingClientRect(); const d = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0); if(d < bd){ bd = d; best = t; } });
    return best;
  };
  document.addEventListener('pointerdown', (e)=>{
    const bar = e.target.closest && e.target.closest('.subtabs.has-thumb'); if(!bar) return;
    sd = { bar, x:e.clientX, y:e.clientY, id:e.pointerId, moved:false, tab:null };
  }, true);
  document.addEventListener('pointermove', (e)=>{
    if(!sd || e.pointerId !== sd.id) return;
    if(!sd.moved){
      const dx = Math.abs(e.clientX - sd.x), dy = Math.abs(e.clientY - sd.y);
      if(dy > 10 && dy > dx){ sd = null; return; }          // 세로 스크롤 — 탭을 바꾸지 않는다
      if(dx > 10 && dx > dy * 1.5) sd.moved = true;
    }
    if(sd && sd.moved){ const t = tabAt(sd.bar, e.clientX); if(t !== sd.tab){ sd.tab = t; place(sd.bar, t, true); } }
  }, true);

    const cancel = e.type === 'pointercancel';
    if(cancel){
      const th = bar.querySelector(':scope > .subtab-thumb');
      if(th){
        const m = /translateX\(([-\d.]+)px\)/.exec(th.style.transform || '');
        if(m){
          const center = parseFloat(m[1]) + (parseFloat(th.style.width) || 0) / 2;
          const hit = Array.from(bar.querySelectorAll('.subtab')).find(t=> center >= t.offsetLeft && center < t.offsetLeft + t.offsetWidth);
          if(hit) tab = hit;
        }
      }
    } else if(typeof e.clientX === 'number'){
      tab = tabAt(bar, e.clientX);
    }
    if(tab.classList.contains('active')){
      const cur = bar.querySelector('.subtab.active'); if(cur) place(bar, cur, true);
      if(!cancel) window.__suppressClick = { el: bar, until: Date.now() + 500 };
      return;
    }

    tab.dataset.slid = '1'; tab.click();
    // 손을 뗀 뒤 따라오는 진짜 클릭은 버린다. 반드시 위의 tab.click() 다음에 걸어야 한다
    // (먼저 걸면 우리가 보낸 클릭까지 막혀서 탭이 바뀌어도 화면이 안 넘어간다).
    window.__suppressClick = { el: bar, until: Date.now() + 500 };
  };
  document.addEventListener('pointerup', endDrag, true);
  document.addEventListener('pointercancel', endDrag, true);
  document.addEventListener('click', (e)=>{
    const tab = e.target.closest && e.target.closest('.subtabs .subtab');
    if(!tab) return;
    if(tab.dataset.slid){ delete tab.dataset.slid; return; }

    if(!bar || !bar.classList.contains('has-thumb') || tab.classList.contains('active')) return;
    e.stopPropagation(); e.preventDefault();

    place(bar, tab, true);
    setTimeout(()=>{ tab.dataset.slid = '1'; tab.click(); }, 240);
  }, true);
}
// 친구 목록 순서 변경: 편집 모드에서 오른쪽 손잡이를 잡고 위아래로 끌면 그 줄이 손가락을 따라오고,
// 다른 줄은 자리를 비켜준다. 놓으면 그 자리로 저장한다. 줄마다 높이가 달라도(별명이 있는 줄 등) 실제 위치로 계산한다.
if(!window.__friendDragBound){
  window.__friendDragBound = true;
  document.addEventListener('pointerdown', (e)=>{
    const h = e.target.closest && e.target.closest('.friend-drag-handle'); if(!h) return;
    const row = h.closest('.friend-row'); if(!row) return;
    const rows = Array.from(row.parentElement.querySelectorAll(':scope > .friend-row'));
    const from = rows.indexOf(row); if(from < 0) return;
    e.preventDefault();
    const rects = rows.map(r=>r.getBoundingClientRect());
    const hs = rects.map(r=>r.height);
    const step = hs[from] + (rows.length > 1 ? Math.max(0, (rects[1].top - rects[0].bottom)) : 0);
    const startY = e.clientY;
    const minDy = rects[0].top - rects[from].top, maxDy = rects[rows.length-1].top - rects[from].top;
    let to = from;
    try{ h.setPointerCapture(e.pointerId); }catch(_){}
    row.classList.add('dragging');
    const move = (ev)=>{
      const dy = Math.max(minDy, Math.min(maxDy, ev.clientY - startY));
      row.style.transform = 'translateY(' + dy + 'px)';
      const center = rects[from].top + hs[from]/2 + dy;
      to = 0;
      rows.forEach((r,i)=>{ if(i !== from && rects[i].top + hs[i]/2 < center) to++; });
      rows.forEach((r,i)=>{
        if(i === from) return;
        let shift = 0;
        if(from < to && i > from && i <= to) shift = -step;
        if(from > to && i < from && i >= to) shift = step;

    };
    const end = ()=>{
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', end);
      h.removeEventListener('pointercancel', end);
      if(to !== from){
        const ids = rows.map(r=>r.dataset.pair);
        const [k] = ids.splice(from, 1);
        ids.splice(to, 0, k);
        localSet('friend_order', ids);
      }
      refreshFriendsModalBody();
    };
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  }, true);
}
// display:none 이던 것이 나타날 때(펼치기·달력 선택창·색상판 등) 갑자기 확 뜨지 않고 천천히 펼쳐지며 나타난다.
// 이미 사라진 뒤라 숨기는 쪽은 애니메이션할 수 없고, 나타나는 쪽만 다룬다.
if(!window.__revealBound){
  window.__revealBound = true;
  const isNone = v => /display\s*:\s*none/.test(v || '');
  const reveal = (el)=>{
    try{
      if(!el.isConnected || el.dataset.noAnim !== undefined) return;
      const cs = getComputedStyle(el);
      if(cs.display === 'none') return;
      const floating = cs.position === 'fixed' || cs.position === 'absolute';
      const h = parseFloat(cs.height);
      const easing = 'cubic-bezier(.22,1,.36,1)';
      // 위에서 살짝 내려오며 높이가 부드럽게 늘고, 내용은 조금 늦게 서서히 나타난다(표시 설정의 선 색상 줄과 같은 움직임)
      if(!floating && h > 0 && cs.display !== 'inline'){
        el.animate([
          { height:'0px', opacity:0, transform:'translateY(-12px)', overflow:'hidden', offset:0 },
          { opacity:0, overflow:'hidden', offset:.14 },
          { height:h + 'px', opacity:1, transform:'none', overflow:'hidden', offset:1 }
        ], { duration:500, easing });
      } else {
        el.animate([{ opacity:0, transform:'translateY(-10px)' }, { opacity:1, transform:'none' }], { duration:380, easing });
      }
    }catch(_){}
  };
  // 사라질 때: display:none이 걸린 직후(화면에 그려지기 전) 잠깐 되돌려 놓고, 높이를 줄이며 흐려지는 애니메이션이 끝나면 숨긴다.
  const hideAnimated = (el, oldStyle)=>{
    el.__fx = true;

    try{
      el.setAttribute('style', oldStyle || '');
      const cs = getComputedStyle(el);
      const h = parseFloat(cs.height);
      const floating = cs.position === 'fixed' || cs.position === 'absolute';
      if(cs.display === 'none' || !(h > 0) || el.dataset.noAnim !== undefined){
        el.setAttribute('style', newStyle); settle(); return;
      }
      const frames = floating
        ? [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-10px)' }]
        : [
            { height:h + 'px', opacity:1, transform:'none', overflow:'hidden', offset:0 },
            { opacity:0, overflow:'hidden', offset:.5 },
            { height:'0px', opacity:0, transform:'translateY(-12px)', overflow:'hidden', offset:1 }
          ];
      const a = el.animate(frames, { duration:380, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });

        try{ a.cancel(); }catch(_){}

        if((el.getAttribute('style') || '') === (oldStyle || '')) el.setAttribute('style', newStyle);

    }catch(_){ try{ el.setAttribute('style', newStyle); }catch(__){} settle(); }

}
function setupHomeReorderDrag(){
  document.querySelectorAll('.home-drag-handle').forEach(h=>{
    h.onpointerdown = (e)=>{
      const row = h.closest('.home-order-row'); if(!row) return;
      e.preventDefault();
      const rows = Array.from(document.querySelectorAll('.home-order-row'));
      const from = rows.indexOf(row);
      const tops = rows.map(r=>r.getBoundingClientRect().top);
      const slot = rows.length > 1 ? (tops[tops.length-1] - tops[0]) / (rows.length-1) : row.getBoundingClientRect().height;
      const startY = e.clientY;
      let to = from;
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      row.classList.add('dragging');
      const move = (ev)=>{
        let dy = ev.clientY - startY;
        dy = Math.max(-from*slot, Math.min((rows.length-1-from)*slot, dy));
        row.style.transform = 'translateY(' + dy + 'px)';
        to = Math.max(0, Math.min(rows.length-1, from + Math.round(dy/slot)));
        rows.forEach((r,i)=>{
          if(r === row) return;
          let shift = 0;
          if(from < to && i > from && i <= to) shift = -slot;
          if(from > to && i < from && i >= to) shift = slot;
          r.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
        });
      };
      const end = ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', end);
        h.removeEventListener('pointercancel', end);
        if(to !== from){
          const order = getHomePrefs().order.slice();
          const [k] = order.splice(from, 1);
          order.splice(to, 0, k);
          localSet('home_order', order);
        }
        renderMain();
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
    };
  });
}
// 앱을 처음 켰을 때 아무 설명 없이 OS 권한창부터 띄우면 반사적으로 거부당하기 쉽다.
// OS 권한창은 한 번 거부되면 앱에서 다시 띄울 수 없으므로(설정 앱에 직접 들어가야 함),
// 먼저 앱 안에서 무엇을 보내는지 설명하고 동의한 사람만 실제 권한창으로 넘긴다.
async function runNotificationOnboarding(){
  if(!state.user) return;
  if(localGet('notif_onboarded', false)) return;

  const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  const ok = await showConfirm(
    '알림을 받아보시겠어요?\n\n· 새로운 공지\n· 투표 시작 · 마감 알림\n· 오늘의 학식 (조식 / 중식 / 석식)' + (isNative ? '\n· 오늘의 시간표 (평일 아침)' : '') + '\n\n필요한 항목만 MY 탭 환경설정에서 따로 켜고 끌 수 있어요.',
    { okLabel:'알림 받기', cancelLabel:'나중에', danger:false }
  );
  localSet('notif_onboarded', true);

  if(!ok){
    // "나중에"를 고르면 서버 발송 대상에서 빼둔다. 설정에서 언제든 다시 켤 수 있음.
    await setNotifyPref('notice', false);
    await setNotifyPref('poll', false);
    await setNotifyPref('meal', false);
    return;
  }

  // 안드로이드 13+는 알림을 보내려면 POST_NOTIFICATIONS 런타임 권한이 필요한데,
  // 이 권한창은 로컬 알림 플러그인의 requestPermissions()로 띄울 수 있다.
  if(isNative){
    const LN = Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;
    if(LN){ try{ await LN.requestPermissions(); }catch(e){} }
  }

  await setNotifyPref('notice', true);
  await setNotifyPref('poll', true);
  await setNotifyPref('meal', true);
  if(isNative) await setNotifyPref('timetable', true);
}

// 토글 여러 개를 한꺼번에 켜면 그만큼 중복 호출되므로, 진행 중이거나 이미 성공한 등록은 재사용한다.
// 실패한 경우엔 캐시를 비워서, 나중에 권한을 허용하고 다시 켰을 때 재시도할 수 있게 한다.
let pushTokenPromise = null;
function ensurePushToken(){
  if(!pushTokenPromise){
    pushTokenPromise = registerPushToken().then((okResult)=>{
      if(!okResult) pushTokenPromise = null;
      return okResult;
    }, (err)=>{ pushTokenPromise = null; throw err; });
  }
  return pushTokenPromise;
}
// 한 사람이 폰 앱과 PC 브라우저를 같이 쓸 수 있으므로 토큰을 배열로 모아둔다.

// 브라우저 토큰이 계속 남아있어서 알림이 두 군데(브라우저+앱)로 다 가고, 브라우저 쪽 알림을
// 누르면 앱이 아니라 브라우저가 열려버린다. 그래서 네이티브 앱 토큰이 등록되면 그 시점부터는
// 그 기기의 알림 창구를 앱 하나로 좁히기 위해 이전 토큰들을 정리하고 새 토큰으로 교체한다.
// 이 토큰이 어느 창구인지. 한 사람이 폰 브라우저·PWA·앱·PC 브라우저를 다 쓰면 전부 울리므로,
// 서버가 우선순위(mobileWeb > pwa > apk > desktop)로 하나만 골라 보낼 때 이 값을 본다.
function pushTokenKind(){
  const native = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  if(native) return 'apk';
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  if(!mobile) return 'desktop';
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  return standalone ? 'pwa' : 'mobileWeb';
}
async function saveFcmToken(token, opts={}){
  if(!token || !state.user) return false;
  try{
    // fcmTokenUpdatedAt: 같은 기기에서 계정을 바꿔 로그인하면 토큰이 두 계정 문서에 다 남을 수 있다.
    // 서버가 그중 "마지막에 등록한 계정"을 골라 그 계정 설정대로만 보내도록 등록 시각을 같이 남긴다.
    const stamp = { fcmTokenUpdatedAt: Date.now(), fcmTokenKinds: { [token]: pushTokenKind() } };
    const data = opts.replaceAll
      ? { fcmTokens: [token], fcmToken: token, ...stamp }
      : { fcmTokens: arrayUnion(token), fcmToken: token, ...stamp };
    await setDoc(doc(db,'users',state.user.uid), data, { merge:true });
    localSet('fcm_token_local', token); // 로그아웃 때 이 기기 토큰만 정확히 빼기 위해 기억
    return true;
  }catch(e){ console.warn('[fcm-save]', e); return false; }
}
// 로그아웃하는 계정에서 이 기기 토큰을 뺀다. 안 빼면 이 폰이 계속 그 계정의 알림 설정대로
// (예: 로그아웃한 계정이 켜둔 조식 알림) 알림을 받는다. signOut 전에 불러야 쓰기 권한이 있다.
async function releasePushTokenForLogout(uid){
  pushTokenPromise = null; // 다음에 로그인한 계정이 새로 토큰을 등록할 수 있게 캐시를 비운다
  const token = localGet('fcm_token_local', null);
  if(!uid || !token) return;
  try{
    const ref = doc(db,'users',uid);
    const snap = await getDoc(ref);
    const update = { fcmTokens: arrayRemove(token) };
    if(snap.exists() && snap.data().fcmToken === token) update.fcmToken = deleteField();
    await updateDoc(ref, update);
  }catch(e){ console.warn('[fcm-release]', e); }
}

async function registerPushToken(){
  if(!state.user) return false;
  const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  // 안드로이드 WebView에는 웹 푸시(Notification/Push API)가 없어서, 앱에서는 네이티브 FCM을 써야 한다.
  if(isNative) return registerNativePushToken();
  return registerWebPushToken();
}

async function registerWebPushToken(){
  if(!('Notification' in window) || !('serviceWorker' in navigator)) return false;
  if(!FCM_VAPID_KEY) return false; // 콘솔에서 VAPID 키를 아직 안 채운 경우 조용히 스킵
  try{
    let perm = Notification.permission;
    if(perm === 'default') perm = await Notification.requestPermission();
    if(perm !== 'granted') return false;
    const messaging = await getMessagingInstance();
    if(!messaging) return false;
    const reg = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token) return false;
    return await saveFcmToken(token);
  }catch(e){ console.warn('[push-token:web]', e); return false; }
}

// 알림(푸시·기기 로컬 알림)을 눌렀을 때 종류별로 바로 이동할 화면. 로그인 전에 눌려서
// 들어온 경우엔 state.user가 아직 없어 라우팅할 화면 자체가 없으므로, 로그인이 끝난
// 뒤(boot()의 renderApp() 직후)에 적용하도록 잠깐 담아둔다.
state.pendingNotifRoute = null;
function routeNotificationTap(category, data){
  if(!state.user){ state.pendingNotifRoute = { category, data }; return; }
  if(category==='notice'){ state.view='council'; state.councilTab='notice'; renderShell(); }
  else if(category==='poll'){ state.view='council'; state.councilTab='poll'; renderShell(); }
  else if(category==='recruit'){ state.view='council'; state.councilTab='recruitment'; renderShell(); }
  else if(category==='meal'){ state.view='info'; state.infoTab='meal'; renderShell(); }
  else if(category==='timetable'){ state.view='timetable'; renderShell(); }
  else if(category==='chat'){ openSocialTab(); }
  else if(category==='friend' || category==='friendRequest'){ openSocialTab(); }
  else if(category==='suggestion'){ state.view='council'; state.councilTab='suggestion'; renderShell(); }
}
// 포그라운드(앱을 보고 있는 중)로 온 알림은 OS가 알아서 소리·진동을 내주지 않으므로,
// 기기 로컬 알림을 즉시(0초 뒤) 예약해 실제 알림처럼 소리/진동/배너가 뜨게 만든다.
let fgAlertSeq = 900000;
async function fireForegroundAlert(title, body, category, data){
  try{
    const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
    if(isNative){
      const LN = Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;
      if(!LN) return;
      let perm = await LN.checkPermissions();
      if(perm.display !== 'granted'){
        perm = await LN.requestPermissions();
        if(perm.display !== 'granted') return;
      }
      await LN.schedule({ notifications: [{
        id: fgAlertSeq++,
        title: title || '알림',
        body: body || '',
        channelId: 'ku_ise_default',
        schedule: { at: new Date(Date.now() + 300) },
      }] });
    }else if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      new Notification(title || '알림', { body: body || '' });
      if(navigator.vibrate) navigator.vibrate(200);
    }
  }catch(e){ console.warn('[fg-alert]', e); }
}
let nativePushListenersBound = false;
function registerNativePushToken(){
  const PN = (typeof Capacitor !== 'undefined' && Capacitor.Plugins) ? Capacitor.Plugins.PushNotifications : null;
  if(!PN) return Promise.resolve(false);
  return new Promise(async (resolve)=>{
    try{
      let perm = await PN.checkPermissions();
      if(perm.receive !== 'granted') perm = await PN.requestPermissions();
      if(perm.receive !== 'granted'){ resolve(false); return; }

      // registration 이벤트로 토큰이 비동기 전달된다. 리스너는 한 번만 등록.
      if(!nativePushListenersBound){
        nativePushListenersBound = true;
        PN.addListener('registration', (t)=>{ saveFcmToken(t && t.value, { replaceAll:true }); });
        PN.addListener('registrationError', (e)=>{ console.warn('[push-token:native]', e); });
        // 앱이 열려 있을 때 온 알림은 OS가 자동으로 띄우지 않으므로 앱 안에서 토스트로 보여준다.
        PN.addListener('pushNotificationReceived', (n)=>{
          const title = (n && n.title) || '알림';
          const body = (n && n.body) || '';
          const data = (n && n.data) || {};
          toast(`${title}${body ? ' — ' + body : ''}`);
          // 토스트는 몇 초 뒤 사라지므로, 나중에 다시 볼 수 있게 알림 목록에도 남긴다.
          recordReceivedNotif(title, body, data.category || '');
          fireForegroundAlert(title, body, data.category, data);
        });
        // 백그라운드·종료 상태에서 시스템 알림을 눌러서 들어왔을 때, 알림 종류에 맞는
        // 화면으로 바로 이동한다 (메시지→그 채팅방, 공지→공지, 투표→투표, 식단→학식탭).
        PN.addListener('pushNotificationActionPerformed', (action)=>{
          const data = (action && action.notification && action.notification.data) || {};
          routeNotificationTap(data.category, data);
        });
      }
      await PN.register();
      resolve(true);
    }catch(e){ console.warn('[push-token:native]', e); resolve(false); }
  });
}
async function setupForegroundMessageListener(){
  try{
    const messaging = await getMessagingInstance();
    if(!messaging) return;
    onMessage(messaging, (payload)=>{
      const n = payload.notification || {};
      const data = payload.data || {};
      if(n.title || n.body){
        toast(`${n.title||'알림'}${n.body ? ' — '+n.body : ''}`);
        recordReceivedNotif(n.title||'알림', n.body||'', data.category || '');
        if(isCouncil()) refreshAdminBadgeCounts().then(refreshBellDot); // 새 제보·신청 알림이 오면 그때 배지를 다시 센다
        fireForegroundAlert(n.title||'알림', n.body||'', data.category, data);
      }
    });
  }catch(e){}
}

/* ===== 홈 화면 위젯 모양 설정 =====
   투명도·배경·강조색은 기기마다 취향이 다르고 홈 화면 배경에 따라 어울리는 값이 달라서
   사용자가 직접 고르게 한다. 기기에만 저장하면 되는 값이라 localStorage에 둔다. */
const WIDGET_BGS = [
  { key:'system',  label:'기기 설정' },
  { key:'light',   label:'라이트' },
  { key:'dark',    label:'다크' },
  { key:'custom',  label:'사용자 지정' },
];
const WIDGET_BG_DEFAULT_CUSTOM = '#8C1D2B';
const WIDGET_ACCENTS = ['#F5C563','#4ECDC4','#B20923','#5B8DEF','#3DDC97','#C77DFF'];
function isWidgetPresetAccent(hex){ return WIDGET_ACCENTS.some(h=>h.toLowerCase()===String(hex||'').toLowerCase()); }
function isValidHexColor(s){ return /^#[0-9a-fA-F]{6}$/.test(s); }

/* ===== HSV <-> HEX 변환 (직접 만든 색상 선택기용) ===== */
function hsvToHex(h,s,v){
  s/=100; v/=100;
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const toHex=(n)=>Math.round((n+m)*255).toString(16).padStart(2,'0');
  return '#'+toHex(r)+toHex(g)+toHex(b);
}
function hexToHsv(hex){
  const m = /^#([0-9a-fA-F]{2})([0-9a-fA-F]{2})([0-9a-fA-F]{2})$/.exec(hex);
  if(!m) return {h:0,s:0,v:100};
  const r=parseInt(m[1],16)/255, g=parseInt(m[2],16)/255, b=parseInt(m[3],16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=60*(((g-b)/d)%6);
    else if(max===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0 ? 0 : d/max;
  return { h, s: s*100, v: max*100 };
}
// 위젯 7종 각각 따로 글씨 크기를 키우거나 줄일 수 있게 한다 (예: 달력은 칸이 작아서 크게,
// 다음 수업은 이미 커서 그대로 두는 식). 목록/키는 네이티브(WidgetTheme.java)와 맞춰야 한다.
const WIDGET_TYPES = [
  // 시간표류
  ['timetable','오늘의 시간표'], ['week','주간 시간표'], ['nextClass','다음 수업'],
  // 학식
  ['meal','오늘의 학식'],
  // 일정 · 달력류
  ['schedule','일정 · 메모'], ['calendar','달력'], ['calendarWide','달력 (가로형)'], ['date','오늘 날짜'],
];
// 위젯 설정은 위젯 종류마다 따로 저장한다 — 달력은 라이트로, 시간표는 다크로 쓰고 싶을 수
// 있어서. opts.per[위젯키]에 그 위젯의 값만 담고, 없는 값은 예전 전역 설정을 그대로 물려받는다
// (이미 설정해둔 사람이 업데이트해도 그대로 유지되도록).
function getWidgetSettings(key){
  const o = getWidgetOpts();
  const p = (o.per && o.per[key]) || {};
  const fs = typeof p.fontScale === 'number' ? p.fontScale : (o.fontScale||{})[key];
  return {
    bg: WIDGET_BGS.some(b=>b.key===p.bg) ? p.bg : o.bg,
    customBg: isValidHexColor(p.customBg) ? p.customBg : o.customBg,
    accent: p.accent || o.accent,
    opacity: typeof p.opacity === 'number' ? p.opacity : o.opacity,
    fontScale: (typeof fs === 'number' && fs>=0.7 && fs<=1.6) ? fs : 1,
    dateShowEvents: typeof p.dateShowEvents === 'boolean' ? p.dateShowEvents : o.dateShowEvents,
    weekShowTime: typeof p.weekShowTime === 'boolean' ? p.weekShowTime : true,
    weekShowRoom: typeof p.weekShowRoom === 'boolean' ? p.weekShowRoom : false,
    mealShowJinri: typeof p.mealShowJinri === 'boolean' ? p.mealShowJinri : true,
    mealShowMirae: typeof p.mealShowMirae === 'boolean' ? p.mealShowMirae : true,
    calendarShowMemo: typeof p.calendarShowMemo === 'boolean' ? p.calendarShowMemo : o.calendarShowMemo,
    calendarShowOfficial: typeof p.calendarShowOfficial === 'boolean' ? p.calendarShowOfficial : true,
    calendarShowCouncil: typeof p.calendarShowCouncil === 'boolean' ? p.calendarShowCouncil : true,
  };
}
function setWidgetSetting(key, patch){
  const o = getWidgetOpts();
  const per = { ...(o.per||{}) };
  per[key] = { ...getWidgetSettings(key), ...per[key], ...patch };
  setWidgetOpts({ per });
}
function getWidgetOpts(){
  const o = localGet('widget_opts', null) || {};
  return {
    opacity: typeof o.opacity === 'number' ? o.opacity : 92,
    bg: WIDGET_BGS.some(b=>b.key===o.bg) ? o.bg : 'system',
    accent: o.accent || WIDGET_ACCENTS[0],
    customBg: isValidHexColor(o.customBg) ? o.customBg : WIDGET_BG_DEFAULT_CUSTOM,
    dateShowEvents: o.dateShowEvents !== false,
    calendarShowMemo: o.calendarShowMemo !== false,
    fontScale: (o.fontScale && typeof o.fontScale === 'object') ? o.fontScale : {},
    per: (o.per && typeof o.per === 'object') ? o.per : {},
  };
}
function setWidgetOpts(patch){
  const next = { ...getWidgetOpts(), ...patch };
  localSet('widget_opts', next);
  pushWidgetData();
  return next;
}

// 대표 시간표 — 위젯은 앱을 안 켠 사이에도 계속 떠 있어야 하는데, "지금 앱에서 보고 있는
// 시간표"를 그대로 따라가면 예전 학기를 잠깐 훑어보기만 해도 위젯이 그 학기로 바뀌어버린다.
// 그래서 위젯 전용으로 "이 학기의 이 시간표"를 하나 지정해두고, 없으면(처음 쓰는 경우)
// 지금 활성 시간표를 그대로 쓴다.
function getWidgetPrimaryTimetable(){ return localGet('widget_primary_tt', null); }
function setWidgetPrimaryTimetable(sem, idx){
  localSet('widget_primary_tt', { sem, idx });
  pushWidgetData();
}
function clearWidgetPrimaryTimetable(){
  localSet('widget_primary_tt', null);
  pushWidgetData();
}
// 지금 실제로 다니고 있는 학기 — 노출 규칙(semesterRevealDate)을 지난 학기 중 가장 최근 것.
// 앱 화면에서 지금 들여다보고 있는(활성) 학기와는 다를 수 있다 — 예전 학기 시간표를
// 잠깐 열어봐도 이 값은 안 바뀐다. 학기가 바뀌는 시점(1/25, 5/1, 7/25, 11/1)이 지나면
// 자동으로 다음 학기로 넘어간다.
function currentRevealedSemesterKey(){
  const revealed = sortedSemesterKeys().filter(k=>isSemesterRevealed(k) && semesterVariants(k).length);
  return revealed[0] || sortedSemesterKeys()[0] || null;
}
function widgetPrimaryLabel(){
  const p = getWidgetPrimaryTimetable();
  if(!p || !state.timetablesBySemester[p.sem]) return '자동 (가장 최근 학기)';
  const variants = semesterVariants(p.sem);
  const v = variants[p.idx];
  return v ? `${semesterLabel(p.sem)} · ${v.name}` : '자동 (가장 최근 학기)';
}
// 위젯이 실제로 그릴 수업 목록 — 대표 시간표가 지정돼 있으면 그걸, 아니면 지금 다니고 있는
// 학기(currentSemesterKey)의 첫 시간표를 쓴다. 예전엔 "앱에서 지금 보고 있는 시간표"를
// 따라갔는데, 그러면 다른 학기를 잠깐 들여다보기만 해도 위젯이 같이 바뀌어버렸다.
function widgetTimetableSlots(){
  const p = getWidgetPrimaryTimetable();
  if(p && state.timetablesBySemester[p.sem]){
    const variants = semesterVariants(p.sem);
    const v = variants[p.idx];
    if(v) return v.slots;
  }
  const key = currentRevealedSemesterKey();
  const variants = key ? semesterVariants(key) : [];
  return (variants[0] && variants[0].slots) || [];
}
function widgetSemesterLabel(){
  const p = getWidgetPrimaryTimetable();
  if(p && state.timetablesBySemester[p.sem]) return semesterLabel(p.sem);
  const key = currentRevealedSemesterKey();
  return key ? semesterLabel(key) : '';
}

// 직접 만든 색상 선택기 한 판(채도/명도 사각형 + 색상 띠 + 미리보기 + 코드 입력).
// id는 'accent' 또는 'bg'처럼 어떤 값을 고르는 중인지 구분하는 이름.
function renderColorPickerPanel(id, hex){
  const {h,s,v} = hexToHsv(hex);
  return `
    <div class="cp-panel" id="cp-panel-${id}" data-hue="${h}" data-sat="${s}" data-val="${v}">

        <div class="cp-square-black"></div>
        <div class="cp-cursor" id="cp-cursor-${id}" style="left:${s}%; top:${100-v}%;"></div>
      </div>
      <input type="range" class="cp-hue" id="cp-hue-${id}" min="0" max="359" value="${Math.round(h)}">
      <div class="cp-row">
        <span class="cp-preview" id="cp-preview-${id}" style="background:${hex};"></span>
        <div class="cp-hex-wrap"><span class="cp-hash">#</span><input type="text" id="cp-hex-${id}" maxlength="6" value="${hex.replace('#','').toUpperCase()}" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="RRGGBB"></div>
      </div>
    </div>`;
}
// 사각형/띠를 실제로 손가락으로 움직일 수 있게 연결한다. onChange(hex)는 값이 확정될 때마다 불린다
// (드래그 중에도 계속) — 위젯 미리보기가 아니라 저장까지 바로 하고 싶어서, 여기서는 매 변경마다 저장한다.
function setupColorPicker(id, onChange){
  const panel = document.getElementById('cp-panel-'+id);
  const square = document.getElementById('cp-square-'+id);
  const hueSlider = document.getElementById('cp-hue-'+id);
  if(!panel || !square || !hueSlider) return;
  const cursor = document.getElementById('cp-cursor-'+id);
  const preview = document.getElementById('cp-preview-'+id);
  const hexInput = document.getElementById('cp-hex-'+id);

  let hue = parseFloat(panel.dataset.hue) || 0;
  let sat = parseFloat(panel.dataset.sat) || 0;
  let val = parseFloat(panel.dataset.val) || 100;

  function apply(save){
    const hex = hsvToHex(hue, sat, val);
    if(preview) preview.style.background = hex;
    if(hexInput){ hexInput.value = hex.replace('#','').toUpperCase(); const wrapEl = hexInput.closest('.cp-hex-wrap'); if(wrapEl) wrapEl.classList.remove('bad'); }
    square.style.background = `linear-gradient(to right,#fff,hsl(${Math.round(hue)},100%,50%))`;
    if(cursor){ cursor.style.left = sat+'%'; cursor.style.top = (100-val)+'%'; }
    if(save) onChange(hex);
  }

  function pickFromSquare(clientX, clientY){
    const rect = square.getBoundingClientRect();
    let x = (clientX - rect.left) / rect.width;
    let y = (clientY - rect.top) / rect.height;
    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));
    sat = x*100;
    val = (1-y)*100;
    apply(true);
  }

  let dragging = false;
  square.onpointerdown = (e)=>{ dragging=true; square.setPointerCapture(e.pointerId); pickFromSquare(e.clientX, e.clientY); };
  square.onpointermove = (e)=>{ if(dragging) pickFromSquare(e.clientX, e.clientY); };
  square.onpointerup = ()=>{ dragging=false; };
  square.onpointercancel = ()=>{ dragging=false; };

  hueSlider.oninput = ()=>{ hue = parseFloat(hueSlider.value); apply(true); };

  // 색 코드: 0-9 A-F만 받고, 6자리(또는 3자리)가 되는 순간 바로 색에 반영한다. 틀린 코드는 테두리가 붉게 변한다.
  const hexWrap = hexInput.closest('.cp-hex-wrap');
  if(hexWrap) hexWrap.onclick = ()=>hexInput.focus();
  const parseHex = (raw)=>{
    const t = String(raw || '').replace(/[^0-9a-fA-F]/g, '').toUpperCase();
    if(t.length === 6) return '#' + t;
    if(t.length === 3) return '#' + t.split('').map(c=>c + c).join('');
    return null;
  };
  hexInput.oninput = ()=>{
    const cleaned = hexInput.value.replace(/[^0-9a-fA-F]/g, '').toUpperCase().slice(0, 6);
    if(hexInput.value !== cleaned) hexInput.value = cleaned;
    if(hexWrap) hexWrap.classList.remove('bad');
    if(cleaned.length === 6){
      const v2 = '#' + cleaned;
      const hsv = hexToHsv(v2);
      hue = hsv.h; sat = hsv.s; val = hsv.v;
      hueSlider.value = Math.round(hue);
      apply(true);
    }
  };
  hexInput.onblur = ()=>{
    if(!hexInput.value) { apply(false); return; }
    const v2 = parseHex(hexInput.value);
    if(v2){ const hsv = hexToHsv(v2); hue = hsv.h; sat = hsv.s; val = hsv.v; hueSlider.value = Math.round(hue); apply(true); }
    else { if(hexWrap) hexWrap.classList.add('bad'); toast('색 코드는 6자리로 입력해 주세요 (예: FF6B6B)'); }
  };
  hexInput.onkeydown = (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); hexInput.blur(); } };
}

/* ===== 홈 화면 위젯 데이터 전달 =====
   위젯은 앱과 별개 프로세스에서 잠깐 깨어나 그림만 그리는 구조라 Firestore나 웹 저장소를
   직접 못 읽는다. 그래서 앱이 켜지거나 데이터가 바뀔 때마다 위젯이 필요한 값만 추려서
   네이티브(WidgetBridge)에 넘겨주고, 위젯은 그걸 읽어서 그린다.
   시간대에 따라 달라지는 판단(다음 수업이 뭔지, 지금이 조식인지 석식인지)은 위젯 쪽에서
   직접 하므로, 여기서는 하루치 재료를 통째로 넘긴다. */
async function pushWidgetData(){
  const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  if(!isNative) return;
  const WB = Capacitor.Plugins && Capacitor.Plugins.WidgetBridge;
  if(!WB) return;
  try{
    const ttSlots = widgetTimetableSlots();
    const di = todayDayIndex();
    const classes = (di>=0 ? ttSlots.filter(c=>c.day===di) : [])
      .sort((a,b)=>a.start-b.start)
      .map(c=>({
        subject: c.subject || '',
        room: c.room || '',
        color: c.color || COLORS[0].hex,
        start: c.start, end: c.end,
        time: `${minutesToLabel(c.start)}–${minutesToLabel(c.end)}`,
      }));

    const today = todayStr();
    const tomorrow = addDays(today, 1);
    const studentOf = (d)=> ((state.meals[d]||{}).student) || {};
    const staffOf = (d)=> ((state.meals[d]||{}).staff) || {};
    const st = studentOf(today), stTom = studentOf(tomorrow);
    const staff = staffOf(today), staffTom = staffOf(tomorrow);

    // 위젯 칸이 좁아 구분 섹션을 못 두니, 학사일정 자리에는 공식·학생회 일정만 넣는다
    // (개인 일정을 섞으면 위젯에서도 "내 메모"가 학사일정처럼 보인다).
    const upcoming = visibleCalendar()
      .filter(ev=>ev.endDate >= today && !isPersonalEvent(ev))
      .sort((a,b)=>a.startDate.localeCompare(b.startDate));
    const events = upcoming.slice(0,3).map(ev=>({
      title: ev.title || '',
      date: fmtDateShort(ev.startDate) + (ev.endDate!==ev.startDate ? '~'+fmtDateShort(ev.endDate) : ''),
    }));

    // 주간 시간표 위젯용 — 월~금 다섯 칸.
    // 위젯이 앱 화면처럼 "시간축 위 제자리"에 수업을 그리려면 시작/끝 시각(분 단위)이 필요하다.
    const weekClasses = [0,1,2,3,4].map(d =>
      ttSlots.filter(c=>c.day===d).sort((a,b)=>a.start-b.start).map(c=>({
        subject: c.subject || '',
        room: c.room || '',
        color: c.color || COLORS[0].hex,
        textColor: c.textColor || '#FFFFFF',
        start: c.start, end: c.end,
        startLabel: minutesToLabel(c.start),
        endLabel: minutesToLabel(c.end),
      }))
    );

    // 달력 위젯에 점을 찍을 날짜 — 이번 달의 "내가 추가한" 일정(개인/시험/학생회)과 메모가 있는 날.
    // 시작일에만 찍는다. "수강포기 신청 9.21~9.23"처럼 며칠씩 걸치는 학사일정이 많다 보니,
    // 걸치는 날마다 다 찍으면 거의 매일 점이 찍혀 정작 무슨 날인지 구분이 안 갔다.
    // 그리고 학사정보>학사 달력 탭(examCal)과 똑같이, 학교 공식 학사일정(source==='official')은
    // 여기서도 제외한다 — 안 그러면 앱 화면에는 안 뜨던 점이 위젯에만 잔뜩 찍혀 헷갈린다.
    const markedDates = {};
    const ym = today.slice(0,7);
    visibleCalendar().forEach(ev=>{
      if(!ev.startDate) return;
      const isOfficial = ev.source==='official' || (!ev.source && ev.category!=='council');
      if(isOfficial) return;
      if(ev.startDate.slice(0,7) === ym) markedDates[ev.startDate] = true;
    });
    Object.keys(state.memos || {}).forEach(d=>{
      if(d.slice(0,7) === ym && (state.memos[d]||'').trim()) markedDates[d] = true;
    });

    // "오늘 날짜"/"달력(가로형)" 위젯용 — 오늘에 실제로 걸쳐있는 일정.
    // 학사일정(official)과 학생회 일정(council)을 구분해서 넘겨줘야, 위젯 쪽에서 각각 따로
    // 켜고 끌 수 있다 (markedDates에 점 찍을 때 쓰는 기준과 동일).
    const todayEvents = visibleCalendar()
      .filter(ev=>ev.startDate<=today && ev.endDate>=today)
      .sort((a,b)=>a.startDate.localeCompare(b.startDate))
      .map(ev=>({
        title: ev.title || '',
        official: ev.source==='official' || (!ev.source && ev.category!=='council'),
      }))
      .filter(e=>e.title)
      .slice(0,10);

    const payload = {
      updatedAt: now(),
      todayLabel: fmtDateLabel(today),
      todayDay: String(new Date().getDate()),
      todayWeekday: ['일','월','화','수','목','금','토'][new Date().getDay()],
      todayEvents,
      semester: widgetSemesterLabel(),
      classes,
      weekClasses,
      meals: {
        today: { breakfast: mealParen(st.breakfast||''), lunch: mealParen(st.lunch||''), dinner: mealParen(st.dinner||''), staffLunch: mealParen(staff.lunch||'') },
        tomorrow: { breakfast: mealParen(stTom.breakfast||''), lunch: mealParen(stTom.lunch||''), dinner: mealParen(stTom.dinner||''), staffLunch: mealParen(staffTom.lunch||'') },
      },
      events,
      markedDates,
      memo: (state.memos && state.memos[today]) || '',
      opts: getWidgetOpts(),
    };
    await WB.update({ payload: JSON.stringify(payload) });
  }catch(e){ console.warn('[widget]', e); }
}

// 위젯을 누르면 앱의 특정 화면으로 바로 이동한다 (지금은 달력 위젯 → 학사 달력).
// 콜드 스타트(앱이 꺼져있다 위젯 클릭으로 켜짐)와 웜 스타트(앱이 이미 떠 있는데 다시 누름)
// 두 경로 모두 있어서, 부팅 시 한 번 consumeDeepLink로 확인 + 실시간 'deepLink' 이벤트 둘 다 듣는다.
let widgetDeepLinkBound = false;
function setupWidgetDeepLink(){
  const isNative = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
  if(!isNative) return;
  const WB = Capacitor.Plugins && Capacitor.Plugins.WidgetBridge;
  if(!WB) return;
  if(!widgetDeepLinkBound){
    widgetDeepLinkBound = true;
    WB.addListener('deepLink', (data)=>{ applyWidgetDeepLink(data && data.target); });
  }
  WB.consumeDeepLink().then(r=>{ if(r && r.target) applyWidgetDeepLink(r.target); }).catch(()=>{});
}
function applyWidgetDeepLink(target){
  if(target === 'examCal'){
    state.view = 'info';
    state.infoTab = 'examCal';
    renderShell();
  } else if(target === 'timetable'){
    state.view = 'timetable';
    // renderShell()로 상단바까지 다시 그리면 시간표 전용 상단바(ISE 로고 없음)로 굳어져서
    // 다른 탭으로 옮겨도 로고가 없는 채로 남는다. 하단 탭을 누른 것과 똑같이 본문만 바꾼다.
    if(document.getElementById('main-content')){
      if(typeof closeModal === 'function') closeModal();
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
      renderMain();
    } else {
      renderShell();
    }
  } else if(target === 'meal'){
    state.view = 'info';
    state.infoTab = 'meal';
    renderShell();
  } else if(target === 'schedule'){
    state.view = 'info';
    state.infoTab = 'calendar';
    renderShell();
  }
}

/* ===== 상단 알림 벨 — 최근 48시간 알림 모음 =====
   실제 푸시는 GitHub Actions 크론(notify/send-notifications.mjs)이 서버에서 보내고 앱은
   모른다. 그래서 여기서는 "그 크론이 보냈을 법한 것"을 이 기기가 이미 갖고 있는 데이터
   (공지·투표 createdAt)로 다시 추려서 보여준다 — 새 서버 저장소 없이 개인별 최근 알림
   내역을 훑어볼 수 있게 하는 목적. */
const NOTIF_FEED_WINDOW_MS = 48*60*60*1000;

// 학생회용 "처리할 게 있어요" 배지. 개인 알림(공지·투표)과 달리 이건 "몇 건 밀려있는지"가
// 중요해서 읽음 처리 없이, 큐가 비면(전부 처리하면) 저절로 사라진다.
state.adminBadge = { bugReports:0, chatReports:0, signupInquiries:0 };
let adminBadgeAt = 0;
async function refreshAdminBadgeCounts(){
  if(!state.user) return;
  adminBadgeAt = Date.now();
  try{
    if(isCouncil()){
      const [br, cr] = await Promise.all([
        loadShared('bugReports', {list:[]}),
        Promise.resolve({list:[]}),
      ]);
      state.adminBadge.bugReports = (br.list||[]).filter(r=>r.status!=='해결').length;
      state.adminBadge.chatReports = (cr.list||[]).filter(r=>r.status!=='해결').length;
    }
    if(isDirectorPlus()){
      const q = query(collection(db,'signupInquiries'), where('status','==','pending'));
      const snap = await getDocs(q);
      state.adminBadge.signupInquiries = snap.size;
    }
  }catch(e){ console.warn('[adminBadge]', e); }
}

// 모든 사용자용 "안 읽은 채팅 있음" 표시. friendLinks에 남겨둔 마지막 메시지 시각·보낸
// 사람만 보고 판단한다(메시지 내용을 따로 또 안 읽어도 됨) — 그 친구 화면을 마지막으로
// 연 시각(로컬에 저장)보다 상대가 보낸 마지막 메시지가 더 최근이면 "안 읽음"으로 본다.
state.latestAndroidVersionCode = null; // 네이티브 APK 업데이트 확인 결과 (아직 확인 전이면 null)
state.hasUnseenChat = false;
state.unseenChatPairIds = new Set(); // 친구 목록에서 "이 사람한테 새 채팅 왔음" 점 표시용
state.unseenChatDetails = []; // 알림 목록에 "OO님의 메시지"로 각각 띄우기 위한 정보 (pairId·보낸사람 이름·시각)
function getDismissedNotifIds(){ return localGet('notif_feed_dismissed', []); }
// 로그인할 때 한 번, 서버에 저장돼 있던 지난 지움·읽음 기록을 이 기기 기록과 합친다.
// (기기 로컬 기록만 있던 예전 상태에서도 그냥 그대로 두면 되므로 마이너스가 되는 방향은 없다.)
function mergeNotifFeedStateFromServer(serverState){
  const s = serverState || {};
  const mergedDismissed = [...new Set([...getDismissedNotifIds(), ...(s.dismissedIds||[])])].slice(-200);
  localSet('notif_feed_dismissed', mergedDismissed);
  const mergedSeenAt = Math.max(localGet('notif_feed_seen_at', 0), s.seenAt||0);
  localSet('notif_feed_seen_at', mergedSeenAt);
  syncNotifFeedStateToServer();
}
// 알림 확인 시각·지운 알림 목록을 서버에 남긴다(다른 기기에서도 같게 보이게). 벨을 여닫거나 알림을 연달아 지울 때마다 쓰지 않도록
// 마지막 변경 3초 뒤에 한 번만 쓴다.
let notifSyncTimer = null;
function syncNotifFeedStateToServer(){
  if(!state.user) return;
  clearTimeout(notifSyncTimer);
  notifSyncTimer = setTimeout(()=>{
    if(!state.user) return;
    setDoc(doc(db,'users',state.user.uid), {
      notifFeedState: { dismissedIds: getDismissedNotifIds(), seenAt: localGet('notif_feed_seen_at', 0) }
    }, { merge:true }).catch(()=>{});
  }, 3000);
}
function dismissNotification(id){
  const cur = getDismissedNotifIds();
  if(!cur.includes(id)) localSet('notif_feed_dismissed', [...cur, id].slice(-200));
  syncNotifFeedStateToServer();
}
function clearAllNotifications(){
  const ids = getNotificationFeed().map(it=>it.id);
  localSet('notif_feed_dismissed', [...new Set([...getDismissedNotifIds(), ...ids])].slice(-200));
  syncNotifFeedStateToServer();
}
/* ===== 받은 알림 기록 =====
   알림 목록(오른쪽 위 종 아이콘)은 원래 공지·투표·채팅처럼 "앱이 이미 들고 있는 데이터"에서
   역산해 만들었다. 그런데 일정 알림처럼 서버가 보내주기만 하는 알림은 앱 안에 근거가 될
   데이터가 없어서 목록에 아무것도 안 남았다 — 푸시는 왔는데 나중에 "뭐가 왔었지?" 하면
   확인할 방법이 없는 상태.
   그래서 두 갈래로 모은다:
     1) 앱이 켜져 있을 때 도착한 푸시 → 이 기기에 바로 기록(아래 recordReceivedNotif)
     2) 앱이 꺼져 있는 동안 발송된 예약 알림 → 로그인할 때 내 notifyQueue에서 "보냄" 표시가
        붙은 것들을 읽어와 채운다(loadSentReminders). 기기를 바꿔도 남는다. */
const RECEIVED_NOTIF_MAX = 50;
function getReceivedNotifs(){ return localGet('notif_received', []); }
function recordReceivedNotif(title, body, category){
  if(!title && !body) return;
  const list = getReceivedNotifs();
  const ts = now();
  // 같은 알림이 포그라운드 수신(1)과 서버 기록(2) 양쪽으로 들어와 두 줄로 보이는 걸 막는다.
  if(list.some(x => x.title===title && x.body===body && ts - (x.ts||0) < 120000)) return;
  const id = `recv_${ts}_${Math.random().toString(36).slice(2,7)}`;
  localSet('notif_received', [...list, { id, ts, title, body, category }].slice(-RECEIVED_NOTIF_MAX));
  refreshBellDot();
}
// 내가 건 예약 알림 중 이미 발송된 것. 규칙상 uid가 나인 문서만 읽히므로 남의 것은 안 온다.
async function loadSentReminders(){
  if(!state.user) return [];
  try{
    const snap = await getDocs(query(collection(db,'notifyQueue'), where('uid','==',state.user.uid)));
    const cutoff = now() - NOTIF_FEED_WINDOW_MS;
    return snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(x=>x.sent && (x.sentAt||0) >= cutoff);
  }catch(e){ return null; }
}
// 알림 목록(벨)에 채울 "내 예약 알림 중 이미 발송된 것"은 하루 한 번(새벽 3시 이후 첫 실행)과 벨을 열 때(마지막 조회 10분 뒤부터)만 서버에서 읽는다.
// 알림 자체는 서버(워커)가 푸시로 보내므로 이 조회와 무관하다.
async function loadSentRemindersCached(force){
  if(!state.user) return [];
  const u = state.user.uid;
  const cached = localGet('sent_reminders_'+u, null);
  if(!force && cached && ownSyncFresh('remind', u)) return cached;
  const list = await loadSentReminders();
  if(list === null) return cached || [];
  localSet('sent_reminders_'+u, list); localSet('sent_reminders_at_'+u, Date.now()); ownSyncMark('remind', u);
  return list;
}
function notifCategoryAction(category){
  if(category==='notice') return 'go-notice-tab';
  if(category==='poll') return 'go-poll-page';
  if(category==='meal') return 'go-meal-tab';
  if(category==='schedule') return 'go-calendar-tab';
  return '';
}
function getNotificationFeed(){
  const cutoff = now() - NOTIF_FEED_WINDOW_MS;
  const dismissed = new Set(getDismissedNotifIds());
  const items = [];
  const b = state.adminBadge || {};
  const nowTs = now();
  if(isDirectorPlus() && b.signupInquiries>0) items.push({ id:'admin_signup_'+b.signupInquiries, ts:nowTs, icon:ICON.person, title:'가입 승인 대기', body:`${b.signupInquiries}건 확인이 필요해요`, action:'open-signup-inquiries' });
  if(isPresident() && b.bugReports>0) items.push({ id:'admin_bug_'+b.bugReports, ts:nowTs-1, icon:ICON.bug, title:'버그 제보', body:`처리 안 된 제보 ${b.bugReports}건`, action:'open-bug-report-inbox' });
  visibleNotices().forEach(n=>{
    const ts = n.createdAt || (n.date ? new Date(n.date+'T00:00:00').getTime() : 0);
    const id = 'notice_'+n.id;
    if(ts && ts >= cutoff && !dismissed.has(id)) items.push({ id, ts, icon:ICON.megaphone, title:'새 공지', body:n.title||'', action:'go-notice-tab' });
  });
  live(state.polls).forEach(p=>{
    const ts = p.createdAt || (p.date ? new Date(p.date+'T00:00:00').getTime() : 0);
    const id = 'poll_'+p.id;
    if(ts && ts >= cutoff && !dismissed.has(id)) items.push({ id, ts, icon:ICON.ballot, title:'새 투표', body:p.question||'', action:'go-poll-page' });
  });
  // 서버가 보낸 예약 알림(일정 알림 등) — 앱이 꺼져 있을 때 도착한 것까지 여기서 채워진다.
  (state.sentReminders||[]).forEach(r=>{
    const ts = r.sentAt || 0;
    const id = 'remind_'+r.id+'_'+ts;
    if(!ts || ts < cutoff || dismissed.has(id)) return;
    items.push({ id, ts, icon:ICON.bell, title:r.title||'일정 알림', body:r.body||'', action:'go-calendar-tab' });
  });
  // 앱이 켜져 있는 동안 도착한 푸시(종류 무관).
  getReceivedNotifs().forEach(r=>{
    if(!r.ts || r.ts < cutoff || dismissed.has(r.id)) return;
    items.push({ id:r.id, ts:r.ts, icon:ICON.bell, title:r.title||'알림', body:r.body||'', action:notifCategoryAction(r.category) });
  });
  return items.sort((a,b)=>b.ts-a.ts);
}
// 배지 개수는 3분 하트비트 등 백그라운드에서도 갱신되는데, renderMain()은 #main-content만
// 다시 그려서 상단바 벨(topbar, renderShell에서만 그림)까지는 안 닿는다. 그렇다고 매번
// renderShell()을 부르면 열려 있던 모달(#modal-root도 통째로 다시 그려짐)까지 닫혀버리므로,
// 벨 아이콘의 점만 직접 붙이거나 뗀다.
function refreshBellDot(){
  const btn = document.querySelector('.btn-top-bell');
  if(!btn) return;
  const existing = btn.querySelector('.bell-dot');
  const should = hasUnseenNotifications();
  if(should && !existing) btn.insertAdjacentHTML('beforeend', '<span class="bell-dot"></span>');
  else if(!should && existing) existing.remove();
}
function hasUnseenNotifications(){
  const b = state.adminBadge;
  if(b && (b.bugReports>0 || b.chatReports>0 || b.signupInquiries>0)) return true;
  if(state.hasUnseenChat) return true;
  const feed = getNotificationFeed();
  if(!feed.length) return false;
  const lastSeen = localGet('notif_feed_seen_at', 0);
  return feed[0].ts > lastSeen;
}
function markNotificationsSeen(){
  // 안 본 알림(빨간 점)이 있었을 때만 서버에 남긴다 — 점이 없는데 벨만 눌러 보는 경우는 쓰지 않는다
  const hadUnseen = hasUnseenNotifications();
  localSet('notif_feed_seen_at', now());
  if(hadUnseen) syncNotifFeedStateToServer();
}
// 깃허브 릴리즈 태그(v158 형태)에서 숫자만 뽑아 android/app/build.gradle의 versionCode와 비교한다.
// 앱을 켤 때 자동으로는 돌지 않는다 — 예전엔 켤 때마다 조용히 확인했는데, 그 네트워크 요청이
// 로그인·초기 데이터 로딩과 겹쳐 시작이 느려져 보이는 문제가 있었다. 그래서 새 버전이 나오면
// 공지(알림)로 먼저 안내하고, 사용자가 "업데이트 확인"을 직접 눌렀을 때만 서버에 물어본다.
async function checkNativeAppUpdate(){
  if(!isNativeApp) return;
  try{
    const res = await fetch('https://api.github.com/repos/kuaisemi/ise-app/releases/latest', {
      headers:{ 'Accept':'application/vnd.github+json' },
      signal: AbortSignal.timeout(8000), // 네트워크가 느리거나 안 되면 무한정 기다리지 않고 8초에서 포기
    });
    if(res.ok){
      const j = await res.json();
      const m = String(j.tag_name||'').match(/(\d+)/);
      if(m) state.latestAndroidVersionCode = parseInt(m[1], 10);
    }
  }catch(e){ /* 오프라인·타임아웃이면 그냥 넘어간다 */ }
}
function hasNativeUpdateAvailable(){
  return isNativeApp && !!state.latestAndroidVersionCode && state.latestAndroidVersionCode > ANDROID_VERSION_CODE;
}

// "오늘의 시간표" 알림은 앱(APK)에서만 동작하는 기기 로컬 알림. 브라우저/PWA에서는 건너뜀.
//
// 예전에는 월~금 5개를 "매주 이 요일 이 시각"으로 반복 예약했다(schedule.on.weekday). 그런데
// 반복 예약은 특정 날짜만 빼는 수단이 없어서, 공휴일에도 "오늘의 시간표"가 그대로 울렸다.
// 그래서 반복을 버리고 앞으로 TT_REMINDER_DAYS일치를 날짜 하나하나로 예약하면서 공휴일인
// 날만 건너뛴다. 앱을 열 때마다 다시 예약하므로 이 창은 계속 앞으로 밀린다.
const TT_REMINDER_DAYS = 60;
// 날짜별로 예약하려면 id도 그만큼 필요하다. 예전 5개(901~905)도 같이 취소해야 이미 깔려 있는
// 기기에 남아 있는 주간 반복 예약이 사라진다 — 안 그러면 새 예약과 겹쳐 두 번 울린다.
const TT_REMINDER_LEGACY_IDS = [901, 902, 903, 904, 905];
const TT_REMINDER_ID_BASE = 9100;
const TT_REMINDER_IDS = Array.from({length: TT_REMINDER_DAYS}, (_, i) => TT_REMINDER_ID_BASE + i);
let nativeLocalNotifListenerBound = false;
async function scheduleTimetableReminders(list){
  if(typeof Capacitor === 'undefined' || !Capacitor.isNativePlatform || !Capacitor.isNativePlatform()) return;
  const LN = Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;
  if(!LN) return;
  if(!nativeLocalNotifListenerBound){
    nativeLocalNotifListenerBound = true;
    // "오늘의 시간표" 알림(기기 로컬 알림)을 눌렀을 때 시간표 화면으로 바로 이동한다.
    LN.addListener('localNotificationActionPerformed', ()=>{ routeNotificationTap('timetable'); });
  }
  const source = list || state.timetable || [];
  try{
    await LN.cancel({ notifications: [...TT_REMINDER_LEGACY_IDS, ...TT_REMINDER_IDS].map(id=>({id})) });
    const prefs = getNotifyPrefs();
    if(!prefs.timetable) return;
    let perm = await LN.checkPermissions();
    if(perm.display !== 'granted'){
      perm = await LN.requestPermissions();
      if(perm.display !== 'granted') return;
    }
    // 요일별 수업 목록은 날짜마다 다시 만들 필요가 없으니 한 번만 만들어 재사용한다.
    const bodyByDay = {};
    for(let day=0; day<5; day++){
      const classes = source.filter(c=>c.day===day).sort((a,b)=>a.start-b.start);
      if(classes.length) bodyByDay[day] = classes.map(c=>`${minutesToLabel(c.start)} ${c.subject}`).join(', ');
    }
    if(!Object.keys(bodyByDay).length) return;

    const notifications = [];
    const now = new Date();
    for(let i=0; i<TT_REMINDER_DAYS; i++){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, prefs.timetableHour, 0, 0, 0);
      // 오늘치는 이미 그 시각이 지났으면 예약해봐야 곧바로 울리거나 무시된다.
      if(d.getTime() <= now.getTime()) continue;
      // ★ 공휴일(대체공휴일 포함)이면 건너뛴다 — 이게 이번에 고친 버그.
      if(!isSchoolWeekday(d)) continue;
      const day = d.getDay() - 1; // 월=0 ... 금=4 (isSchoolWeekday가 주말을 이미 걸렀다)
      const body = bodyByDay[day];
      if(!body) continue;
      notifications.push({
        id: TT_REMINDER_ID_BASE + i,
        title: `오늘의 시간표 (${DAYS[day]})`,
        body,
        schedule: { at: d, allowWhileIdle: true },
      });
    }
    if(notifications.length) await LN.schedule({ notifications });
  }catch(e){ console.warn('[tt-reminder]', e); }
}

// preloadedUsers: 로그인 직후 role 판별용으로 이미 users 컬렉션 전체를 한 번 받아온 게 있으면
// 그걸 그대로 쓰고, 여기서 또 통째로 다시 받아오지 않는다 (전체 가입자 목록은 꽤 무거운 조회라
// 로그인할 때마다 두 번 받아오면 그만큼 초기 로딩이 느려진다).
async function loadAllData(preloadedUsers){
  try{
    const [ttData,cal,meals,notices,sugg,polls,users,recruits,roster,deptN,memos,shuttle,holidays,sentReminders] = await Promise.all([
      (state.user ? loadTimetable(state.user.uid) : Promise.resolve({bySemester:{}, activeSemester:null})).catch(()=>({bySemester:{}, activeSemester:null})),
      loadCalendar().catch(()=>[]),
      loadMeals().catch(()=>({})),
      loadNotices().catch(()=>[]),
      loadSuggestions().catch(()=>[]),
      loadPolls().catch(()=>[]),
      Promise.resolve(preloadedUsers && Object.keys(preloadedUsers).length ? preloadedUsers : ((state.allUsers && Object.keys(state.allUsers).length) ? state.allUsers : cachedUsersMap())),
      loadRecruitments().catch(()=>[]),
      // 학생 명단은 학생회 이상만 읽을 수 있다(학생은 권한 오류로 두 번 읽기가 낭비됨) — 학생회가 아니면 읽지 않는다
      (isCouncil() ? loadRoster().catch(()=>({})) : Promise.resolve({})),
      loadDeptNotices().catch(()=>({items:[],updatedAt:0})),
      (state.user ? loadMemos(state.user.uid) : Promise.resolve({})).catch(()=>({})),
      loadShuttle().catch(()=>({weekday:[],sunday:[],fridayOffNos:[],updatedAt:0})),
      loadHolidays().catch(()=>({byYear:{},updatedAt:0})),
      loadSentRemindersCached().catch(()=>[]),
    ]);
    state.timetablesBySemester = (ttData && ttData.bySemester) || {};
    state.activeSemester = (ttData && ttData.activeSemester) || sortedSemesterKeys()[0] || null;
    state.activeVariant = 0;
    syncActiveTimetable();
    state.calendar=cal||[]; state.meals=meals||{};
    state.notices=notices||[]; state.suggestions=sugg||[]; state.polls=polls||[];
    state.allUsers=users||{}; state.recruitmentPosts=recruits||[];
    state.roster=roster||{};
    state.deptNotices = deptN.items || [];
    state.deptNoticesUpdatedAt = deptN.updatedAt || 0;
    state.memos = memos || {};
    state.shuttle = shuttle || {weekday:[],sunday:[],fridayOffNos:[]};
    state.holidays = holidays || {byYear:{},updatedAt:0};
    state.sentReminders = sentReminders || [];
  }catch(e){}
}

  }
}

function checkWeeklyAutoMealFetch(){
  // 학식은 보통 월요일 아침에 한 주치가 올라오지만, 월요일이 공휴일이거나 업로드가 늦어지면
  // 그 주 내내 식단이 비어 보였다. 그래서 요일을 가리지 않고 평일 9~12시에 매 시각 한 번씩
  // 시도한다 (시간대별 1회, 성공/실패 무관 — 이미 있는 주면 같은 값으로 덮어써도 무해).
  const nowD = new Date();
  const wd = nowD.getDay();
  if(wd === 0 || wd === 6) return; // 주말은 학식 운영을 안 해서 건너뜀
  const hour = nowD.getHours();
  if(![9,10,11,12].includes(hour)) return;
  const slotKey = 'last_meal_fetch_slot';
  const slotId = todayStr()+'-'+hour;
  if(localGet(slotKey,'') === slotId) return;
  localSet(slotKey, slotId);
  fetchMealFromSource(true);
}
function checkAutoDeptNoticeFetch(){
  // 자정(00시) 지나 그날 처음 접속했을 때 한 번만 자동으로 새로고침
  const lastDate = localGet('last_dept_notice_fetch_date','');
  const today = todayStr();
  if(lastDate!==today){
    localSet('last_dept_notice_fetch_date', today);
    fetchDeptNoticesFromSource(true);
  }
}

// 네이티브 앱(APK) 안이 아니면서, UA가 안드로이드인 브라우저(삼성 인터넷·크롬 등)에서만 true.
// PWA로 이미 설치해 standalone으로 떠 있으면 제외한다 — 설치 팝업/위젯탭 안내는
// "설치 안 한 사람"에게만 필요하니까.
function isAndroidWeb(){
  if(typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return false;
  if(isStandaloneDisplay()) return false;
  return /Android/i.test(navigator.userAgent || '');
}
// 상단바 다운로드 아이콘은 위와 달리 PWA(standalone)에서도 계속 보여준다 — PWA는
// 위젯·확실한 알림 같은 APK 전용 기능을 못 쓰므로, 이미 설치했어도 APK로 넘어갈 길을 남겨둔다.
function isAndroidBrowserOrPwa(){
  if(typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return false;
  return /Android/i.test(navigator.userAgent || '');
}
// iOS는 APK를 못 깔지만, 브라우저에서 "홈 화면에 추가"로 PWA를 설치할 수 있다.
// iPadOS 13+는 UA에 iPad가 안 남고 데스크톱 Mac처럼 보이는데, 터치 지원 여부로 구분한다.
function isIOSWeb(){
  if(typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return false;
  if(isStandaloneDisplay()) return false;
  const ua = navigator.userAgent || '';
  if(/iPad|iPhone|iPod/.test(ua)) return true;
  return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
}
// 이미 홈 화면에 설치되어 (안드로이드 PWA든 iOS PWA든) standalone으로 떠 있는 상태면
// 설치를 권할 이유가 없으므로 위 두 함수 모두 여기서 걸러진다.
// isIOSWeb()은 "홈 화면에 추가" 안내용이라 이미 PWA로 설치된 상태(standalone)를 일부러 제외한다.
// 위젯 탭 숨김이나 하단탭 여백 보정은 사파리로 열었든 PWA로 설치했든 iOS면 똑같이 필요해서
// standalone을 걸러내지 않는 별도 판별이 필요하다.
function isIOSDevice(){
  if(typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) return false;
  const ua = navigator.userAgent || '';
  if(/iPad|iPhone|iPod/.test(ua)) return true;
  return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
}
function isStandaloneDisplay(){
  try{
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }catch(e){ return false; }
}

// 페이지가 켜질 때(새로고침 포함) 안드로이드/iOS 브라우저면 한 번 설치를 권하는 팝업.
// 매번 뜨면 성가시니 "나중에"를 누르거나 그냥 닫아도 3일간은 다시 안 뜨고,
// "다신 보지 않기"를 누르면 영구히 안 뜬다(맨 위 다운로드/설치 아이콘은 항상 남아있으니 필요하면 거기서).
/* ===== 웹 접속자에게 패치내역 1회 안내 =====
   설치형 앱(APK)은 업데이트할 때 "업데이트 확인" 화면을 직접 거치니까 뭐가 바뀌었는지 볼
   계기가 있는데, 웹은 그냥 새로고침하면 조용히 새 버전이 돼서 바뀐 걸 알 방법이 없었다.
   그래서 마지막으로 본 버전을 기기에 적어두고, 지금 버전이 그보다 높을 때만 딱 한 번 띄운다. */
// 'Beta 0.3.0' → 30000 + 300 + 0 처럼 비교 가능한 숫자로. 자리당 100씩 두어 0.10.0 같은
// 두 자리 버전이 나와도 0.9.0보다 크게 나온다.
function versionSortValue(v){
  const m = String(v||'').match(/(\d+)\.(\d+)\.(\d+)/);
  if(!m) return 0;
  return Number(m[1])*10000 + Number(m[2])*100 + Number(m[3]);
}

// 펼치면 처음 보는 사람에게는 읽을 게 너무 많아서, 이번 버전에 뭐가 생겼는지 제목만

function showWebPatchPopup(){

  const root = document.body; // APK 설치 안내 팝업(showApkInstallPopup)과 같은 방식으로 붙인다
  const wrap = document.createElement('div');

  wrap.innerHTML = `
    <div class="apk-popup-sheet" style="text-align:left;">

      ${(()=>{
        const { features, fixes } = splitPatchItems(items);
        const row = (it)=>`<li style="margin-bottom:4px;">${escapeHtml(patchNoteItemTitle(it))}</li>`;
        return `
        ${features.length ? `<ul style="margin:0 0 4px; padding-left:18px; font-size:12px; color:var(--text-dim); line-height:1.7;">${features.map(row).join('')}</ul>` : ''}
        ${(features.length && fixes.length) ? `<div style="display:flex; align-items:center; gap:8px; margin:8px 0 6px;"><span style="font-size:9.5px; font-weight:700; color:var(--text-faint); letter-spacing:.02em;">버그 수정</span><span style="flex:1; height:1px; background:var(--border);"></span></div>` : ''}
        ${fixes.length ? `<ul style="margin:0 0 16px; padding-left:18px; font-size:12px; color:var(--text-dim); line-height:1.7;">${fixes.map(row).join('')}</ul>` : (features.length ? '<div style="margin-bottom:16px;"></div>' : '')}
        `;
      })()}
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="patch-popup-detail" style="flex:1;">자세히 보기</button>
        <button type="button" class="btn btn-primary btn-sm" data-action="patch-popup-close" style="flex:1;">확인</button>
      </div>
    </div>`;
  root.appendChild(wrap);
  requestAnimationFrame(()=>wrap.classList.add('open'));
  wrap.addEventListener('click', (e)=>{ if(e.target === wrap) closeWebPatchPopup(); });
}
function closeWebPatchPopup(){
  const el = document.getElementById('patch-popup-overlay');
  if(!el) return;
  el.classList.remove('open');
  setTimeout(()=>el.remove(), 200);
}
function maybeShowWebPatchNotes(){
  if(isNativeApp || patchPopupShownThisLoad) return;
  const seen = localGet('patch_seen_version', null);
  // 저장값이 없으면(이번 기능이 처음 들어간 시점) 이번 한 번은 보여주고 그 뒤로 조용해진다.
  if(seen && versionSortValue(seen) >= versionSortValue(APP_VERSION)){ return; }
  patchPopupShownThisLoad = true;
  localSet('patch_seen_version', APP_VERSION);
  showWebPatchPopup();
}
function maybeShowApkInstallPopup(){
  if(apkPopupShownThisLoad) return;
  const android = isAndroidWeb(), ios = !android && isIOSWeb();
  if(!android && !ios) return;
  try{ if(localStorage.getItem('apkPopupDismissedForever')==='1') return; }catch(e){}
  let last = 0;
  try{ last = parseInt(localStorage.getItem('apkPopupLastShown')||'0', 10) || 0; }catch(e){}
  if(Date.now() - last < 3*24*60*60*1000) return;
  apkPopupShownThisLoad = true;
  showApkInstallPopup(ios ? 'ios' : 'android');
}

// 위젯 투명도 슬라이더는 화면을 다시 그릴 때마다 새로 만들어지므로 여기서 매번 연결한다.
// 드래그 중에는 숫자만 갱신하고, 손을 뗐을 때(change) 저장 + 위젯 갱신을 한 번만 한다.
// 슬라이더와 옆의 숫자 칸을 서로 묶는다. 슬라이더를 움직이면 숫자가 따라가고, 숫자를 직접 적으면
// 범위 안으로 맞춰서 슬라이더도 같이 움직인다. 저장 + 위젯 갱신은 손을 떼거나 입력을 마쳤을 때 한 번만 한다.
function bindRangeAndNumber(slider, num, apply){
  slider.oninput = ()=>{ if(num) num.value = slider.value; };
  slider.onchange = ()=>apply(parseInt(slider.value, 10));
  if(!num) return;
  num.onchange = ()=>{
    const mn = parseInt(slider.min, 10), mx = parseInt(slider.max, 10);
    let v = parseInt(num.value, 10);
    if(isNaN(v)) v = parseInt(slider.value, 10);
    v = Math.max(mn, Math.min(mx, v));
    num.value = v; slider.value = v;
    slider.dispatchEvent(new Event('input', { bubbles:true }));   // 채워진 구간도 갱신
    apply(v);
  };
  num.onkeydown = (e)=>{ if(e.key === 'Enter') num.blur(); };
}
