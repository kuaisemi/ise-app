/* ===== 투표 ===== */
function csvField(v){
  const s = String(v==null?'':v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
async function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvField).join(',')).join(String.fromCharCode(13,10));
  const content = String.fromCharCode(0xFEFF)+csv; // BOM 포함 (엑셀 한글 깨짐 방지)

  // 안드로이드 앱(WebView) 안에서는 <a download> 클릭이 그냥 무시된다 — 진짜 브라우저가
  // 아니라 다운로드 매니저 연동이 없기 때문. 네이티브에서는 Filesystem으로 기기에 실제
  // 파일을 쓰고 Share 시트를 띄워 저장하거나 다른 앱으로 보낼 수 있게 한다.
  if(isNativePlatformNow() && typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.Filesystem){
    try{
      const FS = Capacitor.Plugins.Filesystem;
      await FS.writeFile({ path: filename, data: content, directory: 'CACHE', encoding: 'utf8' });
      const { uri } = await FS.getUri({ path: filename, directory: 'CACHE' });
      if(Capacitor.Plugins.Share){
        await Capacitor.Plugins.Share.share({ title: filename, url: uri, dialogTitle: 'CSV 저장/공유' });
      } else {
        toast('파일을 저장했어요 (기기 저장소)');
      }
    }catch(e){
      console.error('[downloadCSV] 네이티브 저장 실패', e);
      toast('CSV 저장에 실패했습니다 (' + ((e && e.message) || '알 수 없음') + ')');
    }
    return;
  }

  const blob = new Blob([content], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV 파일을 다운로드했습니다');
}
async function exportPollResultsCSV(pollId){
  if(myLevel() < 2){ toast('국장 이상만 내보내기 가능합니다'); return; }
  const p = live(state.polls).find(x=>x.id===pollId);
  if(!p){ toast('투표를 찾을 수 없습니다'); return; }
  const votes = p.votes || {};
  const rows = [['학번','이름','선택 항목','투표 시각']];
  Object.entries(votes).forEach(([sid,v])=>{
    let sel=[], name='', ts='';
    if(Array.isArray(v)) sel=v;
    else if(v && typeof v==='object'){ sel=v.selected||[]; name=v.name||''; ts=v.updatedAt?new Date(v.updatedAt).toLocaleString('ko-KR'):''; }
    const optLabels = sel.map(i=>p.options[i]).filter(Boolean).join('; ');
    rows.push([sid, name || (state.allUsers?.[sid]?.name||''), optLabels, ts]);
  });
  const safeName = p.question.replace(/[\\/:*?"<>|]/g,'').slice(0,30);
  await downloadCSV(`투표결과_${safeName}_${todayStr()}.csv`, rows);
}

function renderPollTab(){
  const nowTs = now();
  const canClearAll = myLevel() >= 2;
  const sorted = live(state.polls).filter(p=>{
    if(isPollEnded(p)){
      const dt = p.endDateTime || p.endDate;
      if(dt){
        const endTs = new Date(dt.includes('T') ? dt : dt + 'T23:59:59').getTime();
        if(nowTs - endTs > 7 * 24 * 60 * 60 * 1000) return false;
      }
    }
    return true;
  }).sort((a,b)=>pollDeadlineSortValue(a)-pollDeadlineSortValue(b));

  return `
    <div style="display:flex; gap:6px; margin-bottom:12px;">
      ${canPoll() ? `<button class="btn btn-primary btn-sm" data-action="add-poll" style="flex:1;">${ICON.plus} 투표 만들기</button>` : ''}
      ${canClearAll ? `<button class="btn btn-danger btn-sm" data-action="clear-all-board" data-type="poll" style="width:auto;">종료된 투표 삭제</button>` : ''}
    </div>
    <div class="card">
      ${sorted.length ? sorted.map(p=>renderPollItem(p)).join('') : `<div class="empty"><p>등록된 투표가 없습니다.</p></div>`}
    </div>`;
}

function renderPollItem(p){
  const manage = canPoll();
  const isDirectorOrHigher = myLevel() >= 2;
  const votes = p.votes || {};
  let myVotes=null;
  if(state.user){
    const raw = votes[state.user.studentId];
    if(Array.isArray(raw)) myVotes=raw;
    else if(raw && typeof raw==='object') myVotes=raw.selected||[];
  }
  const ended = isPollEnded(p);
  const editing = state.editingPollVoteId===p.id;
  const showResults = (!!myVotes || ended) && !editing;
  const totalVoters = Object.keys(votes).length;

  const votedSids = new Set(Object.keys(votes));
  const unvoted = Object.values(state.allUsers||{}).filter(u=>u&&u.studentId&&!votedSids.has(u.studentId)).map(u=>`${u.name}(${u.studentId})`);

  let body='';
  if(showResults){
    body = p.options.map((opt,i)=>{
      const voters=[];
      Object.entries(votes).forEach(([sid,v])=>{
        let sel=[], name='';
        if(Array.isArray(v)) sel=v;
        else if(v&&typeof v==='object'){ sel=v.selected||[]; name=v.name||''; }
        if(sel.includes(i)) voters.push(name?`${name}(${sid})`:sid);
      });
      const count=voters.length;
      const pct = totalVoters ? Math.round(count/totalVoters*100) : 0;
      const mine = myVotes && myVotes.includes(i);
      return `
        <div style="margin-bottom:10px;">
          <div class="row-between" style="font-size:11.5px; margin-bottom:3px;">
            <span style="${mine?'color:var(--teal); font-weight:700;':''}">${escapeHtml(opt)}${mine?' ✓':''}</span>
            <span style="color:var(--text-faint)">${count}표 · ${pct}%</span>
          </div>
          <div style="height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden;">
            <div style="height:100%; width:${pct}%; background:${mine?'var(--teal)':'var(--text-dim)'};"></div>
          </div>
          ${(isDirectorOrHigher && count>0) ? `
            <details class="voters-accordion">
              <summary>투표자 명단 (${count}명)</summary>
              <div style="margin-top:6px;">${voters.map(v=>`<span class="voter-badge">${escapeHtml(v)}</span>`).join('')}</div>
            </details>` : ''}
        </div>`;
    }).join('');

    if(isDirectorOrHigher && Object.keys(state.allUsers||{}).length === 0){
      body += `<button type="button" class="btn btn-ghost btn-sm" data-action="load-unvoted" style="width:100%; margin-top:8px;">미투표자 명단 불러오기</button>`;
    }
    if(isDirectorOrHigher && unvoted.length>0){
      body += `
        <details class="voters-accordion" style="margin-top:8px; border-color:rgba(var(--danger-rgb),0.3); background:rgba(var(--danger-rgb),0.05);">
          <summary style="color:var(--danger);">미투표자 (${unvoted.length}명)</summary>
          <div style="margin-top:6px;">${unvoted.map(u=>`<span class="voter-badge unvoted">${escapeHtml(u)}</span>`).join('')}</div>
        </details>`;
    }
    body += `<div class="row-between" style="font-size:10.5px; color:var(--text-faint); margin-top:6px;"><span>총 참여 ${totalVoters}명${ended?' · 마감됨':''}</span><span>${fmtPollDeadline(p)}</span></div>`;
    if(isDirectorOrHigher && totalVoters>0){
      body += `<button class="btn btn-ghost btn-sm" data-action="export-poll-csv" data-id="${p.id}" style="width:100%; margin-top:8px;">${ICON.doc} 투표자 명단 CSV 내보내기</button>`;
    }
    if(!ended && myVotes){
      body += `<div style="display:flex; gap:6px; margin-top:8px;">
        <button class="btn btn-ghost btn-sm" data-action="edit-poll-vote" data-id="${p.id}" style="flex:1;">투표 변경</button>
        <button class="btn btn-danger btn-sm" data-action="cancel-poll-vote" data-id="${p.id}" style="flex:1;">투표 취소</button>
      </div>`;
    }
  } else {
    const inputType = p.multi ? 'checkbox' : 'radio';
    const pre = myVotes||[];
    body = `
      <form id="poll-vote-form">
        <input type="hidden" name="pollId" value="${p.id}">
        ${p.options.map((opt,i)=>`
          <label style="display:flex; align-items:center; gap:9px; padding:7px 0; font-size:11.5px; cursor:pointer;">
            <span class="poll-check"><input type="${inputType}" name="opt" value="${i}" ${pre.includes(i)?'checked':''}><span class="box"></span></span>
            ${escapeHtml(opt)}
          </label>`).join('')}
        <div class="row-between" style="font-size:10.5px; color:var(--text-faint); margin:4px 0 8px;">
          <span>${p.multi?'복수 선택 가능':'단일 선택'}</span><span>${fmtPollDeadline(p)}</span>
        </div>
        <div style="display:flex; gap:6px;">
          ${editing ? `<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-edit-poll-vote" style="flex:1;">취소</button>` : ''}
          <button type="submit" class="btn btn-primary btn-sm" style="flex:1.5;">${editing?'투표 수정 완료':'투표하기'}</button>
        </div>
      </form>`;
  }

  return `
    <div class="list-item">
      <div class="title-line big-title" style="justify-content:space-between;">
        <b>${escapeHtml(p.question)}</b>
        ${ended ? `<span class="tag tag-dim">마감</span>` : `<span class="tag tag-teal">진행중</span>`}
      </div>
      <div class="meta">${p.multi?'복수선택 · ':''}${fmtPollDeadline(p)} · ${fmtAuthorBadge(p.createdBy||'학생회', p.createdById, p.authorRole)}</div>
      <div style="margin-top:8px;">${body}</div>
      ${manage ? `
      <div style="display:flex; gap:5px; margin-top:8px;">
        ${!ended ? `<button class="btn btn-danger btn-sm" data-action="close-poll" data-id="${p.id}" style="flex:1;">${ICON.stopCircle} 즉시 종료</button>` : `<button class="btn btn-ghost btn-sm" data-action="reopen-poll" data-id="${p.id}" style="flex:1;">${ICON.playCircle} 다시 열기</button>`}
        <button class="btn btn-ghost btn-sm" data-action="delete-poll" data-id="${p.id}" style="width:auto;">삭제</button>
      </div>` : ''}
    </div>`;
}

function pollModal(){

    <div class="modal-title">투표 만들기<button data-action="close-modal">${ICON.close}</button></div>
    <form id="poll-form">
      <div class="field"><label>질문</label><input type="text" name="question" style="font-family:var(--font-display)" required placeholder="예: 축제 부스 콘셉트 선호도 조사"></div>
      <label style="display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; font-weight:600;">선택지</label>
      <div id="poll-options-wrap">
        ${[1,2].map(i=>`
        <div class="field poll-option-field" style="margin-bottom:8px;">
          <div style="display:flex; gap:6px;">
            <input type="text" name="option" required placeholder="선택지 ${i} 입력" style="font-family:var(--font-display)">
            <button type="button" class="btn btn-danger btn-sm" data-action="remove-poll-option" style="width:auto; display:none;">삭제</button>
          </div>

      <div class="poll-opts" style="display:flex; gap:14px; margin-bottom:14px; position:relative;">
        <!-- 왼쪽 열: 마감 일시 설정 → 복수 선택 허용 → 알림 발송 -->
        <div style="flex:1; min-width:0;">
          <div class="row-between" style="gap:8px; margin-top:9px;">
            <label for="poll-deadline-check" style="margin:0; cursor:pointer; font-size:12px; color:var(--text);">마감 일시 설정</label>
            <label class="switch"><input type="checkbox" id="poll-deadline-check" data-action="toggle-poll-deadline"><span class="slider"></span></label>
          </div>
          <div class="row-between" style="gap:8px; margin-top:14px;">
            <label for="poll-multi-check" style="margin:0; cursor:pointer; font-size:12px; color:var(--text);">복수 선택 허용</label>
            <label class="switch"><input type="checkbox" name="multi" id="poll-multi-check"><span class="slider"></span></label>
          </div>
          <div class="row-between" style="gap:8px; margin-top:14px;">
            <label for="poll-push-check" style="margin:0; cursor:pointer; font-size:12px; color:var(--text);">알림 발송</label>
            <label class="switch"><input type="checkbox" name="sendPush" id="poll-push-check"><span class="slider"></span></label>
          </div>
          <p style="font-size:10px; color:var(--text-faint); margin:5px 0 0; line-height:1.5;">투표 시작 · 마감 30분 전 · 매일 저녁 8시 알림</p>
        </div>
        <!-- 오른쪽 열: 마감 날짜(마감 일시 설정과 같은 줄)·시간. 마감 일시 설정을 켜야 활성화. 달력은 날짜 바로 아래에서 펼쳐진다 -->
        <div style="flex:1; min-width:0; border-left:1px solid var(--border); padding-left:14px;">
          <div id="poll-deadline-inputs" style="display:flex; flex-direction:column; gap:6px; align-items:stretch; opacity:.4; pointer-events:none;">
            ${dateFieldHtml('poll_deadline_date', addDays(todayStr(),1))}
            ${renderTimePicker('poll_deadline_time', 23*60+59)}
          </div>
        </div>
      </div>
      <div class="modal-actions"><button type="submit" class="btn btn-primary">투표 게시</button></div>
    </form>`;
}

function updatePollOptionUI(){
  const fields = document.querySelectorAll('#poll-options-wrap .poll-option-field');
  fields.forEach((f,idx)=>{
    const input=f.querySelector('input[name="option"]');
    const btn=f.querySelector('[data-action="remove-poll-option"]');
    if(input) input.placeholder = `선택지 ${idx+1} 입력`;
    if(btn) btn.style.display = fields.length>2 ? 'inline-flex' : 'none';
  });
}

  if(nickHasBanned(v)) return { ok:false, msg:'쓸 수 없는 표현이 들어 있어요 (욕설·비하·성적인 표현 등은 안 돼요)' };
  return { ok:true, value:v };
}
if(!window.__nickInputBound){

    const t = e.target;
    if(!t || t.id !== 'av-nick') return;
    if(t.dataset.composing === '1') return;   // 한글 조합 중에는 건드리지 않는다
    const clean = t.value.replace(/[^A-Za-z0-9가-힣ㄱ-ㅎㅏ-ㅣ]/g, '');
    if(clean !== t.value) t.value = clean;
  }, true);
  document.addEventListener('compositionstart', (e)=>{ if(e.target && e.target.id === 'av-nick') e.target.dataset.composing = '1'; }, true);
  document.addEventListener('compositionend', (e)=>{
    const t = e.target; if(!t || t.id !== 'av-nick') return;

}
function avSlotOk(sl){
  return !!sl && typeof sl === 'object' && Array.isArray(sl.pal) && sl.pal.length <= 64 && sl.pal.every(c=>typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c))
    && typeof sl.rle === 'string' && sl.rle.length <= 7000 && /^[e0-9:,]+$/.test(sl.rle);
}
function profileSnapshot(){
  const av = getAvatar();

  const slots = [0,1,2].map(i => { const a = localGet('avatar_slots', []); return (Array.isArray(a) && avSlotOk(a[i])) ? { pal:a[i].pal, rle:a[i].rle } : null; });
  return {

let profileSyncTimer = null;
function syncProfileToServer(){
  if(!state.user) return;
  if(profileSyncTimer) clearTimeout(profileSyncTimer);
  profileSyncTimer = setTimeout(async ()=>{
    profileSyncTimer = null;
    const at = now();
    localSet('profile_at', at);
    try{ await setDoc(doc(db,'users',state.user.uid), { profile: { at, ...profileSnapshot() } }, { merge:true }); }
    catch(e){ console.warn('[profile sync]', e); }
  }, 800);
}
// 로그인할 때 서버 값이 더 최근이면 이 기기 값을 서버 값으로 맞추고, 서버에 아직 없으면 이 기기 값을 한 번 올린다.
// 서버에서 온 값은 남이 바꿔 놓았을 가능성까지 생각해서 화면에 쓰기 전에 전부 다시 검사한다.
function mergeProfileFromServer(pf){
  try{
    const localAt = Number(localGet('profile_at', 0)) || 0;
    if(pf && typeof pf === 'object' && Number(pf.at) > localAt){
      const nk = nickCheck(typeof pf.nick === 'string' ? pf.nick : '');
      localSet('nickname', nk.ok ? nk.value : '');
      if(typeof pf.avatar === 'string' && pf.avatar){
        let av = null; try{ av = avSanitize(JSON.parse(pf.avatar)); }catch(_){ av = null; }
        localSet('avatar', av || { ...AV_DEFAULT });
      } else { localSet('avatar', { ...AV_DEFAULT }); }
      let slots = [null, null, null];
      if(typeof pf.slots === 'string' && pf.slots){
        try{ const a = JSON.parse(pf.slots); if(Array.isArray(a)) slots = [0,1,2].map(i => avSlotOk(a[i]) ? { pal:a[i].pal, rle:a[i].rle } : null); }catch(_){}
      }
      localSet('avatar_slots', slots);
      localSet('profile_at', Number(pf.at));
    } else if(!pf){
      const sn = profileSnapshot();
      if(sn.nick || sn.avatar || sn.slots) syncProfileToServer();
    }
  }catch(e){ console.warn('[profile merge]', e); }
}
function getNickname(){ const v = localGet('nickname', ''); return (typeof v === 'string' && nickCheck(v).ok) ? v.trim() : ''; }
const AV_HEX = /^#[0-9a-fA-F]{6}$/;
function avSanitize(a){
  if(!a || typeof a !== 'object') return null;
  const bg = (typeof a.bg === 'string' && AV_HEX.test(a.bg)) ? a.bg : '';
  if(a.kind === 'emoji'){
    const e = typeof a.emoji === 'string' ? a.emoji.slice(0, 8) : '';
    return e ? { kind:'emoji', emoji:e.replace(/[<>&"']/g, ''), bg } : null;
  }
  if(a.kind === 'pixel'){
    if(!Array.isArray(a.pal) || a.pal.length > 64 || !a.pal.every(c=>typeof c === 'string' && AV_HEX.test(c))) return null;
    if(typeof a.rle !== 'string' || a.rle.length > 7000 || !/^[e0-9:,]+$/.test(a.rle)) return null;
    return { kind:'pixel', pal:a.pal, rle:a.rle, bg };
  }
  if(a.kind === 'preset'){
    const id = AV_ICONS.some(x=>x[0] === a.id) ? a.id : 'chip';
    return { kind:'preset', id, color:(typeof a.color === 'string' && AV_HEX.test(a.color)) ? a.color : '', bg };
  }
  return null;
}
function avatarForSync(){
  const av = getAvatar();
  if(av.kind === 'preset' && av.id === 'chip' && !av.color && !av.bg) return '';   // 기본이면 저장하지 않는다
  const j = JSON.stringify(av);
  return j.length <= 7500 ? j : '';
}
function getAvatar(){

function avIconSvg(id, size){
  const it = AV_ICONS.find(x=>x[0]===id) || AV_ICONS[0];
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+it[2]+'</svg>';
}
// 도트 그림: 색 목록(pal) + "번호:개수" 를 이어 붙인 문자열(rle). 번호 e 는 빈칸.
function pxEncode(px){
  const pal = [], out = [];
  let prev = null, n = 0;
  for(const c of px){
    let t = 'e';
    if(c){ let i = pal.indexOf(c); if(i < 0){ pal.push(c); i = pal.length - 1; } t = String(i); }
    if(t === prev) n++; else { if(prev !== null) out.push(prev + ':' + n); prev = t; n = 1; }
  }
  out.push(prev + ':' + n);
  return { pal, rle: out.join(',') };
}
function pxDecode(av){
  const px = [];
  String(av.rle || '').split(',').forEach(tok=>{
    const [t, n] = tok.split(':'); const c = t === 'e' ? '' : ((av.pal || [])[Number(t)] || '');
    for(let i = 0; i < Number(n); i++) px.push(c);
  });
  while(px.length < 1024) px.push('');
  return px.slice(0, 1024);
}
function pxSvg(av, size){
  const px = pxDecode(av); let rects = '';
  for(let y = 0; y < 32; y++){
    let x = 0;
    while(x < 32){
      const c = px[y*32 + x];
      if(!c){ x++; continue; }
      let e = x + 1; while(e < 32 && px[y*32 + e] === c) e++;
      rects += '<rect x="'+x+'" y="'+y+'" width="'+(e-x)+'" height="1" fill="'+c+'"/>';
      x = e;
    }
  }
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 32 32" shape-rendering="crispEdges" style="display:block;">'+rects+'</svg>';
}
function avInner(av, size){
  if(av.kind === 'emoji') return '<span style="font-size:'+Math.round(size*0.92)+'px; line-height:1;">'+(av.emoji || '😀')+'</span>';
  if(av.kind === 'pixel') return pxSvg(av, size + 6);
  return avIconSvg(av.id, size);
}
function avStyle(av){
  let st = '';
  if(av.bg) st += 'background:' + av.bg + ';';
  if(av.kind === 'preset' && av.color) st += 'color:' + av.color + ';';
  return st;
}

function avPxDraw(){
  const c = document.getElementById('av-canvas'); if(!c) return;
  const g = c.getContext('2d'); g.clearRect(0, 0, 32, 32);
  for(let i = 0; i < 1024; i++){ const col = avPx[i]; if(col){ g.fillStyle = col; g.fillRect(i % 32, (i / 32) | 0, 1, 1); } }
}
function avPxFlood(start, col){
  const target = avPx[start]; if(target === col) return;
  const stack = [start];
  while(stack.length){
    const i = stack.pop(); if(avPx[i] !== target) continue;
    avPx[i] = col;
    const x = i % 32, y = (i / 32) | 0;
    if(x > 0) stack.push(i - 1); if(x < 31) stack.push(i + 1); if(y > 0) stack.push(i - 32); if(y < 31) stack.push(i + 32);
  }
}
function setupAvCanvas(){
  const c = document.getElementById('av-canvas'); if(!c) return;
  avPxDraw();
  const br = document.getElementById('av-brush-range'), bv = document.getElementById('av-brush-val');
  if(br){ br.oninput = ()=>{ avBrush = Math.max(1, Math.min(8, parseInt(br.value, 10) || 1)); if(bv) bv.textContent = avBrush; }; }
  const at = (e)=>{
    const r = c.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * 32), y = Math.floor((e.clientY - r.top) / r.height * 32);
    return (x < 0 || y < 0 || x > 31 || y > 31) ? -1 : y * 32 + x;
  };
  const put = (i)=>{
    const v = avPxTool === 'erase' ? '' : avPxColor, n = avBrush, off = Math.floor((n - 1) / 2);
    const x = i % 32, y = (i / 32) | 0;
    for(let dy = 0; dy < n; dy++) for(let dx = 0; dx < n; dx++){
      const xx = x - off + dx, yy = y - off + dy;
      if(xx >= 0 && xx < 32 && yy >= 0 && yy < 32) avPx[yy * 32 + xx] = v;
    }
  };
  const line = (a, b)=>{   // 손가락이 빨리 움직여도 빈틈 없이 이어서 칠한다
    let x0 = a % 32, y0 = (a / 32) | 0; const x1 = b % 32, y1 = (b / 32) | 0;
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for(;;){ put(y0 * 32 + x0); if(x0 === x1 && y0 === y1) break; const e2 = 2 * err; if(e2 > -dy){ err -= dy; x0 += sx; } if(e2 < dx){ err += dx; y0 += sy; } }
  };
  let drawing = false, last = -1;
  c.onpointerdown = (e)=>{
    e.preventDefault(); const i = at(e); if(i < 0) return;
    avPxUndo.push(avPx.slice()); if(avPxUndo.length > 30) avPxUndo.shift();
    try{ c.setPointerCapture(e.pointerId); }catch(_){}
    if(avPxTool === 'fill'){ avPxFlood(i, avPxColor); avPxDraw(); updateAvPreview(); return; }
    drawing = true; last = i; put(i); avPxDraw(); updateAvPreview();
  };
  c.onpointermove = (e)=>{
    if(!drawing) return; const i = at(e); if(i < 0 || i === last) return;
    line(last, i); last = i; avPxDraw(); updateAvPreview();
  };
  const end = ()=>{ drawing = false; last = -1; };
  c.onpointerup = end; c.onpointercancel = end;
}

function avMarkSwatch(id, el, hex){
  document.querySelectorAll('#' + id + ' .swatch').forEach(s=>{

}

        <span style="font-size:10.5px; color:var(--text-faint);">${escapeHtml(entry.date || '')}</span>
      </div>
      ${(()=>{
        const { features, fixes } = splitPatchItems(items);
        const row = (it)=>`<li style="margin-bottom:5px;">${escapeHtml(patchNoteItemTitle(it))}</li>`;
        return `
        ${features.length ? `<ul style="margin:0; padding-left:16px; font-size:11.5px; color:var(--text-dim); line-height:1.65;">${features.map(row).join('')}</ul>` : ''}

function setupBugReportModalListeners(){
  const btnPick=document.getElementById('btn-pick-bug-img');
  const fileInput=document.getElementById('bug-file-input');
  const btnDel=document.getElementById('btn-del-bug-img');
  const box=document.getElementById('bug-img-preview-box');
  const img=document.getElementById('bug-img-preview');
  let imageData='';
  if(btnPick && fileInput){
    btnPick.onclick=()=>fileInput.click();
    fileInput.onchange=async (e)=>{
      const file=e.target.files[0];
      if(!file) return;
      try{
        imageData=await compressImage(file,900,0.7);
        if(img) img.src=imageData;
        if(box) box.style.display='block';
      }catch(err){ toast('이미지 처리에 실패했습니다'); }
    };
  }
  if(btnDel){
    btnDel.onclick=()=>{ imageData=''; if(fileInput) fileInput.value=''; if(box) box.style.display='none'; };
  }
  const form=document.getElementById('bug-report-form');
  if(form){
    form.onsubmit=async (e)=>{
      e.preventDefault();
      const fd=new FormData(form);
      const title=(fd.get('title')||'').trim();
      const content=(fd.get('content')||'').trim();
      if(!title||!content){ toast('제목과 내용을 입력해주세요'); return; }
      const latest=await loadBugReports();
      const kind = (fd.get('kind') === 'idea') ? 'idea' : 'bug';
      const report={
        id:uid(), kind, title, content, imageUrl:imageData,
        studentId:state.user.studentId, name:state.user.name,
        appVersion:APP_VERSION, page:state.view,
        createdAt:now(), status:'접수'
      };
      const next=[report, ...latest];
      const ok=await saveBugReports(next);
      state.bugReports=next;
      closeModal();
      if(ok) enqueuePush({ audience:'bugAlert', title: kind === 'idea' ? '새 기능 제안이 있어요' : '새 버그 제보가 있어요', body:`제목: ${title}` });
      saveResultToast(ok, kind === 'idea' ? '제안이 접수되었습니다. 소중한 의견 고마워요!' : '제보가 접수되었습니다. 확인해볼게요!');
    };
  }
}

// 누가 지웠는지(이름·학번·직급·IP)는 기본적으로 숨기고, 그 사람 줄을 눌러야만 펼쳐 보이게

// "전체 비우기" 밖에 없어 통째로만 지울 수 있던 것도 고쳤다.
const revealedAuditIds = new Set();

function auditLogItemsHtml(list){
  if(!list.length) return `<div class="empty"><p>기록이 없습니다.</p></div>`;
  return list.map(e=>{
    const open = revealedAuditIds.has(e.id);
    return `
    <div class="list-item">
      <div class="row-between" style="gap:8px; cursor:pointer;" data-action="toggle-audit-reveal" data-id="${escapeHtml(e.id)}">

      <div style="margin-top:6px; padding-top:6px; border-top:1px solid var(--border);">

function toggleAuditReveal(id){

/* ===== 친구 · 시간표 공유 · 실시간 채팅 =====
 * 학번으로 친구를 신청 → 상대가 수락하면 서로 시간표를 볼 수 있다(원하면 특정 친구에게만
 * 나중에 꺼둘 수 있음). 친구 사이에는 1:1 실시간 채팅도 된다.
 * 500명 이하·동시 100명 이하 규모라 Firestore 무료 티어(하루 읽기 5만/쓰기 2만) 안에서
 * onSnapshot 실시간 리스너를 그대로 써도 여유 있다고 보고 붙였다.
 * 친구 관계는 friendLinks/{두 uid를 사전순으로 이어붙인 키} 문서 하나로 표현하고(친구
 * 검색용 공개 명단은 studentDirectory/{uid}), 채팅은 그 같은 키를 chats/{pairId}/messages
 * 경로로 그대로 재사용해 "이 방이 그 두 사람 것"임을 증명한다 — 자세한 권한 검증은
 * firestore.rules 쪽에 있다.
 */
function friendPairKey(a, b){ return a < b ? `${a}_${b}` : `${b}_${a}`; }

// 채팅방을 열 때 처음 읽는 메시지 수. 예전엔 200개를 한꺼번에 읽어서 방을 열 때마다 읽기 할당량을
// 200씩 썼다(Firestore 무료 한도는 하루 5만 읽기). 최근 10개만 읽고, 더 보고 싶을 때만 20개씩
// 늘린다. 최신순(desc)으로 읽어서 화면에는 뒤집어 그린다.
// 소셜 탭을 벗어나면 실시간 리스너(친구 목록·1:1 채팅)를 전부 끊는다 —
// 안 보이는 화면을 위해 계속 Firestore 리스너를 띄워두지 않기 위함.
function teardownSocialTab(){
  stopFriendLinksListener();
}

// 친구 목록 순서는 기기에만 저장하는 개인 취향이라 서버 동기화 없이 로컬에만 둔다.
function getFriendOrderMap(){
  const arr = localGet('friend_order', []);
  const map = {};
  arr.forEach((pairId,i)=>{ map[pairId]=i; });
  return map;
}
function sortFriendsByOrder(friends){
  const orderMap = getFriendOrderMap();
  return [...friends].sort((a,b)=> (orderMap[a.pairId]??9999) - (orderMap[b.pairId]??9999));
}
function moveFriendOrder(pairId, dir){
  const ids = sortFriendsByOrder(state.friendsUI.data.friends).map(f=>f.pairId);
  const idx = ids.indexOf(pairId);
  const swapWith = idx + dir;
  if(idx<0 || swapWith<0 || swapWith>=ids.length) return;
  [ids[idx], ids[swapWith]] = [ids[swapWith], ids[idx]];
  localSet('friend_order', ids);
  refreshFriendsModalBody();
}

let friendLinksUnsub = null;

async function applyFriendLinksSnapshot(snap){
  const incoming=[], outgoing=[], friends=[];
  const unseenPairIds = new Set();
  snap.docs.forEach(d=>{
    const data = d.data();
    const otherUid = (data.uids||[]).find(u=>u!==state.user.uid);
    if(!otherUid) return;
    const entry = {
      pairId: d.id, uid: otherUid,
      name: (data.names&&data.names[otherUid]) || '(이름 없음)',
      studentId: (data.studentIds&&data.studentIds[otherUid]) || '',
      shareTimetable: (()=>{ const base = data.shareTimetable || {}; const sp = sharePendingGet(); return (sp && sp.map[d.id] !== undefined) ? { ...base, [state.user.uid]: sp.map[d.id] } : base; })(),
      shareServer: (data.shareTimetable || {})[state.user.uid] !== false,
      theirShare: (data.shareTimetable || {})[otherUid] !== false,
      ttVer: Number((data.ttVer || {})[otherUid] || 0),
      clearedAt: data.clearedAt || {},
      nickname: (data.nicknames && data.nicknames[state.user.uid]) || '',
      muted: !!(data.mutedBy && data.mutedBy[state.user.uid]),
      pokes: data.pokes || {},
      pokeStreak: Number(data.pokeStreak || 0),
      pokeWeek: Number(data.pokeWeek || 0),
    };
    if((data.status||'accepted') === 'pending'){
      if(data.requestedBy === state.user.uid) outgoing.push(entry); else incoming.push(entry);
    } else {
      friends.push(entry);
    }
  });
  state.friendsUI.data = { incoming, outgoing, friends };
  state.unseenChatPairIds = unseenPairIds;
  state.hasUnseenChat = false;
  refreshBellDot();
  // 친구 상세 화면은 이 리스너가 다시 그리지 않게 한다(보고 있던 화면이 튀지 않도록).
  if(state.friendsUI.screen !== 'detail') refreshFriendsModalBody();
}
function startFriendLinksListener(){
  stopFriendLinksListener();
  return new Promise((resolve) => {
    let settled = false;
    const q = query(collection(db,'friendLinks'), where('uids','array-contains', state.user.uid));
    friendLinksUnsub = onSnapshot(q, async (snap) => {
      await applyFriendLinksSnapshot(snap);
      if(!settled){ settled = true; resolve(); }
    }, (err) => {
      console.error('[friends] 실시간 조회 실패', err);
      if(!settled){ settled = true; resolve(); }
    });
  });
}
async function refreshFriendsData(){
  await startFriendLinksListener();

// 콕 찌르기(핑퐁): 처음에는 검지손가락을 펴고 있고 눌러서 찌를 수 있다. 찌르고 나면 주먹이 되고(흐리게), 상대가 찌를 때까지는
// 다시 못 찌른다. 상대가 나를 찔렀으면 검지손가락(빨간색)이 되어 눌러서 되찌를 수 있다. 실시간이 아니라 친구 목록을 열거나
// 새로고침할 때 반영되고, 푸시 알림은 보내지 않는다(토큰 절약).
function pokeState(f){
  const pk = f.pokes || {};
  const mine = Number(pk[state.user.uid] || 0), theirs = Number(pk[f.uid] || 0);
  if(theirs > mine) return 'pending';   // 상대가 찔렀고 나는 아직 답 안 함
  if(mine > theirs) return 'sent';      // 내가 이미 찔렀고 상대의 답을 기다리는 중
  return 'idle';
}
// 이 친구와 이번 주에 콕 찌른 횟수(서로 찌른 걸 합쳐서, 찌를 때마다 +1). 주(월요일 시작, 한국 시간)가 바뀌면 1부터 다시 센다.
// 서버에서 지우는 작업은 없다 — 값에 주 번호(pokeWeek)를 같이 적어 두고, 이번 주 번호와 다르면 옛 값으로 보고 무시한다.
function pokeWeekNow(){ return Math.floor((Math.floor((Date.now() + 9 * 3600 * 1000) / 86400000) + 3) / 7); }
function pokeStreakNow(f){ return (f.pokeWeek === pokeWeekNow()) ? Number(f.pokeStreak || 0) : 0; }
function pokeButtonHtml(f){
  const st = pokeState(f);
  const streak = pokeStreakNow(f);
  const title = st === 'pending' ? '나를 콕 찔렀어요 · 눌러서 되찌르기' : (st === 'sent' ? '이미 찔렀어요 · 상대가 찌르면 다시 찌를 수 있어요' : '콕 찌르기');
  return '<button type="button" class="poke-btn '+st+'" data-action="poke-friend" data-pair="'+escapeHtml(f.pairId)+'" data-uid="'+escapeHtml(f.uid)+'" title="'+title+(streak ? ' · 연속 '+streak+'회' : '')+'">'+(streak ? '<span class="poke-n">'+streak+'회</span>' : '')+(st === 'sent' ? ICON.pokeFist : ICON.pokeFinger)+'</button>';
}
const pokeCooldown = {};
async function pokeFriend(pairId, uid){
  if(!state.user) return;
  const f0 = (state.friendsUI.data.friends || []).find(x=>x.pairId === pairId);
  if(f0 && pokeState(f0) === 'sent'){ toast('이미 찔렀어요\n상대가 찌르면 다시 찌를 수 있어요'); return; }
  const last = pokeCooldown[pairId] || 0;
  if(Date.now() - last < 5000) return;
  pokeCooldown[pairId] = Date.now();
  const ts = now();
  const prev = (state.friendsUI.data.friends || []).find(x=>x.pairId === pairId);
  const streak = (prev ? pokeStreakNow(prev) : 0) + 1;
  const week = pokeWeekNow();
  try{
    await updateDoc(doc(db,'friendLinks',pairId), { ['pokes.'+state.user.uid]: ts, pokeStreak: streak, pokeWeek: week });
    const f = (state.friendsUI.data.friends || []).find(x=>x.pairId === pairId);
    if(f){ f.pokes = { ...(f.pokes || {}), [state.user.uid]: ts }; f.pokeStreak = streak; f.pokeWeek = week; }
    toast('콕 찔렀어요');
    if(state.friendsUI.screen !== 'detail') refreshFriendsModalBody();
  }catch(e){
    pokeCooldown[pairId] = 0;
    console.warn('[poke]', e);
    toast('콕 찌르기에 실패했어요');
  }
}

async function sendFriendRequest(){
  const input = document.getElementById('friend-add-input');
  const msgEl = document.getElementById('friend-add-msg');
  const sid = (input && input.value || '').trim();
  if(!msgEl) return;
  msgEl.style.color = 'var(--text-dim)'; msgEl.textContent = '';
  if(!sid){ msgEl.style.color='var(--danger)'; msgEl.textContent='학번을 입력해주세요.'; return; }
  if(sid === state.user.studentId){ msgEl.style.color='var(--danger)'; msgEl.textContent='본인은 추가할 수 없어요.'; return; }

  try{
    const q = query(collection(db,'studentDirectory'), where('studentId','==',sid));
    const snap = await getDocs(q);
    if(snap.empty){
      msgEl.style.color='var(--danger)';
      msgEl.textContent = '해당 학번을 찾을 수 없어요. 학번을 다시 확인해주세요.';
      return;
    }
    const targetDoc = snap.docs[0];
    const targetUid = targetDoc.id;
    const targetData = targetDoc.data();
    const pid = friendPairKey(state.user.uid, targetUid);

    const existing = await getDoc(doc(db,'friendLinks',pid));
    if(existing.exists()){
      const st = existing.data().status || 'accepted';
      msgEl.style.color='var(--danger)';
      msgEl.textContent = st === 'pending' ? '이미 요청을 보냈거나 받았어요.' : '이미 친구예요.';
      return;
    }

    await setDoc(doc(db,'friendLinks',pid), {
      uids: [state.user.uid, targetUid].sort(),
      names: { [state.user.uid]: state.user.name, [targetUid]: targetData.name },
      studentIds: { [state.user.uid]: state.user.studentId, [targetUid]: targetData.studentId },
      createdBy: state.user.uid,
      requestedBy: state.user.uid,
      status: 'pending',
      createdAt: Date.now(),
    });
    enqueuePush({ audience:'user', gateKey:'friendRequest', targetUid, category:'friendRequest', title:'새 친구 요청이 왔어요', body:`${state.user.name}님이 친구 요청을 보냈어요` });

    msgEl.style.color='var(--teal)';
    msgEl.textContent = `학번 ${sid}에게 요청을 보냈어요.`;
    if(input) input.value='';
    await refreshFriendsData();
  }catch(e){
    console.error(e);
    msgEl.style.color='var(--danger)';
    msgEl.textContent = '실패했어요 (' + (e.code||e.message||'알 수 없음') + ')';
  }
}

// 내가 시간표를 저장하면 10분 뒤 친구 연결 문서에 ttVer(변경 시각)를 남긴다. 친구는 실시간으로 이미 받고 있는 그 값이 바뀌었을 때만
// 내 시간표를 다시 읽고, 그 전에는 폰에 저장해 둔 것을 쓴다(그래서 친구 시간표를 열 때 읽기가 안 나간다).
let ttVerTimer = null;
function ttVerQueue(){
  if(!state.user) return;
  const p = localGet('tt_ver_pending', null);
  if(!p || p.uid !== state.user.uid) localSet('tt_ver_pending', { uid: state.user.uid, due: Date.now() + SHARE_DELAY });
  ttVerSchedule();
}
function ttVerSchedule(){
  clearTimeout(ttVerTimer);
  const p = localGet('tt_ver_pending', null);
  if(!p || !state.user || p.uid !== state.user.uid) return;
  ttVerTimer = setTimeout(ttVerFlush, Math.max(1000, p.due - Date.now()));
}
async function ttVerFlush(){
  const p = localGet('tt_ver_pending', null);
  if(!p || !state.user || p.uid !== state.user.uid) return;
  if(Date.now() < p.due){ ttVerSchedule(); return; }
  const fr = (state.friendsUI.data && state.friendsUI.data.friends) || [];
  localSet('tt_ver_pending', null);
  const ts = Date.now();
  try{ await Promise.all(fr.map(f=>updateDoc(doc(db,'friendLinks',f.pairId), { ['ttVer.'+state.user.uid]: ts }))); }
  catch(e){ console.warn('[ttVer]', e); localSet('tt_ver_pending', { uid: p.uid, due: Date.now() + 60000 }); ttVerSchedule(); }
}
// 시간표 공개 변경은 서버 쓰기를 아끼려고 10분 동안 모았다가 한 번에 저장한다(화면에는 바로 반영, 앱을 꺼도 다음에 켤 때 이어서 저장).
// 저장할 때 서버에 이미 있는 값과 같은 친구는 쓰지 않는다.
const SHARE_DELAY = 10 * 60 * 1000;
let sharePendingTimer = null;
function sharePendingGet(){
  const p = localGet('share_pending', null);
  return (p && state.user && p.uid === state.user.uid && p.map) ? p : null;
}
function shareQueue(pairId, on){
  const p = sharePendingGet() || { uid: state.user.uid, due: Date.now() + SHARE_DELAY, map: {} };
  const f = ((state.friendsUI.data && state.friendsUI.data.friends) || []).find(x=>x.pairId === pairId);
  // 서버에 이미 있는 값으로 되돌려 놓았으면 보낼 게 없으니 대기에서 뺀다(전부 빠지면 타이머도 끈다)
  if(f && f.shareServer === on) delete p.map[pairId]; else p.map[pairId] = on;
  if(!Object.keys(p.map).length){ localSet('share_pending', null); clearTimeout(sharePendingTimer); return; }
  localSet('share_pending', p);
  shareSchedule();
}
function shareSchedule(){
  clearTimeout(sharePendingTimer);
  const p = sharePendingGet();
  if(!p) return;
  sharePendingTimer = setTimeout(shareFlush, Math.max(1000, p.due - Date.now()));
}
async function shareFlush(){
  const p = sharePendingGet();
  if(!p || !state.user) return;
  if(Date.now() < p.due){ shareSchedule(); return; }
  localSet('share_pending', null);
  const fr = (state.friendsUI.data && state.friendsUI.data.friends) || [];
  const todo = Object.entries(p.map).filter(([pid, on])=>{ const f = fr.find(x=>x.pairId === pid); return !f || f.shareServer !== on; });
  try{
    await Promise.all(todo.map(([pid, on])=>updateDoc(doc(db,'friendLinks',pid), { ['shareTimetable.'+state.user.uid]: on })));
    todo.forEach(([pid, on])=>{ const f = fr.find(x=>x.pairId === pid); if(f) f.shareServer = on; });
  }catch(e){
    console.warn('[shareFlush]', e);
    localSet('share_pending', { uid: p.uid, due: Date.now() + 60000, map: p.map });
    shareSchedule();
  }
}
function toggleShareTimetable(on){
  const rec = state.friendsUI.data.friends.find(f=>f.pairId===state.friendsUI.activePairId);
  state.friendsUI.myShareOn = on;
  if(rec) rec.shareTimetable = { ...(rec.shareTimetable||{}), [state.user.uid]: on };
  shareQueue(state.friendsUI.activePairId, on);
  toast((on ? '이 친구에게 시간표를 공개해요' : '이 친구에게 시간표를 숨겨요') + '\n10분 뒤 반영돼요');
  return true;
}

async function loadFriendTimetableCard(uid){
  const card = document.getElementById('friend-tt-card');
  if(!card) return;
  const fr = (state.friendsUI.data.friends || []).find(x=>x.uid === uid) || {};
  // 친구가 공개를 꺼 뒀으면(친구 연결 문서에 이미 와 있는 값) 시간표를 읽지 않는다
  if(fr.theirShare === false){
    card.innerHTML = `<div class="empty"><p>이 친구가 시간표를 공개하지 않았어요.</p></div>`;
    return;
  }
  const ckey = 'friend_tt_' + uid;
  let data = null;
  const cached = localGet(ckey, null);
  // 폰에 저장해 둔 것은 친구가 시간표를 바꿔서 ttVer가 달라질 때까지 그대로 쓴다(ttVer를 아직 안 남긴 친구는 6시간)
  if(cached && cached.ver === (fr.ttVer || 0) && ((fr.ttVer || 0) > 0 || Date.now() - cached.at < 6 * 3600 * 1000)) data = cached.data;
  try{
    if(!data){
      const snap = await getDoc(doc(db,'timetables',uid));
      data = snap.exists() ? (snap.data() || {}) : {};
      const slim = { activeSemester: data.activeSemester, bySemester: data.bySemester ? Object.fromEntries(Object.entries(data.bySemester).map(([k,v])=>[k, [ (v && v[0]) ? { slots: v[0].slots || [] } : { slots: [] } ]])) : null };
      localSet(ckey, { ver: fr.ttVer || 0, at: Date.now(), data: slim });
      data = slim;
    }
    if(!data.bySemester){
      card.innerHTML = `<div class="empty"><p>아직 등록된 시간표가 없어요.</p></div>`;
      return;
    }
    const d = data;
    const semKey = d.activeSemester || Object.keys(d.bySemester)[0];
    const variants = d.bySemester[semKey];
    const slots = (variants && variants[0] && variants[0].slots) || [];
    if(!slots.length){
      card.innerHTML = `<div class="empty"><p>${escapeHtml(semKey||'')} 학기에 등록된 수업이 없어요.</p></div>`;
      return;
    }
    // 화면 크기에 맞춰 높이를 정한다: 카드 위쪽부터 화면 아래(하단 탭 위)까지를 시간표로 채운다.
    const topY = card.getBoundingClientRect().top;
    const nav = document.querySelector('.bottomnav');
    const bottomY = nav ? nav.getBoundingClientRect().top : window.innerHeight - 90;
    // 카드 안쪽 여백(위아래) + 학기 글자 줄 + 요일 머리 줄을 빼고 남은 높이가 곧 시간표 높이다
    const gridH = Math.max(300, Math.floor(bottomY - topY - 104));
    card.innerHTML = renderFriendTimetableGrid(slots, semKey, gridH);
  }catch(e){
    card.innerHTML = `<div class="empty"><p>이 친구가 시간표를 공개하지 않았어요.</p></div>`;
  }
}
function renderFriendTimetableGrid(slots, semKey, gridH){
  const GRID_H = gridH || 520;
  const minStart = 9*60, maxEnd = 21*60, totalMin = maxEnd-minStart, pxPerMin = GRID_H/totalMin;
  const hours = []; for(let h=9; h<=20; h++) hours.push(h);
  const hourLabels = hours.map(h => {
    const top = (h*60 - minStart) * pxPerMin;
    return `<div style="position:absolute; top:${top-5}px; right:4px; font-size:9px; color:var(--text-faint);">${h}</div>`;
  }).join('');
  const cols = DAYS.map((label, day) => {
    const blocks = slots.filter(s=>Number(s.day)===day).map(s=>{
      const top = Math.max(0, (s.start-minStart)*pxPerMin);
      const height = Math.max(14, (s.end-s.start)*pxPerMin);
      const color = s.color || 'var(--crimson)';
      const textColor = s.textColor || '#FFFFFF';
      return `<div style="position:absolute; left:2px; right:2px; top:${top}px; height:${height}px; border-radius:5px; padding:2px 4px; font-size:9px; color:${textColor}; overflow:hidden; line-height:1.25; white-space:normal; word-break:keep-all; overflow-wrap:break-word; background:${escapeHtml(color)};"><b>${escapeHtml(s.subject||'')}</b>${s.room?`<br>${escapeHtml(s.room)}`:''}</div>`;
    }).join('');
    return `<div style="position:relative; background:var(--surface-2); border-radius:4px; min-height:${GRID_H}px;">${blocks}</div>`;
  }).join('');
  return `
    <div style="font-size:10.5px; color:var(--text-faint); margin-bottom:6px;">${escapeHtml(semKey||'')}</div>
    <div style="display:grid; grid-template-columns:24px repeat(5,1fr); gap:2px; font-size:10px;">
      <div></div>
      ${DAYS.map(d=>`<div style="text-align:center; color:var(--text-dim); font-size:10.5px; padding:3px 0; font-weight:700;">${d}</div>`).join('')}
      <div style="position:relative;">${hourLabels}</div>
      ${cols}
    </div>`;
}

async function approveSignupInquiry(uid){

async function rejectSignupInquiry(uid){
  const inq = (state.signupInquiries||[]).find(r=>r.uid===uid);
  if(!inq) return;
  if(!await showConfirm(`${inq.name}(${inq.studentId})님의 가입 신청을 거절할까요?`)) return;
  try{
    await updateDoc(doc(db,'signupInquiries',uid), { status:'rejected', resolvedAt:now(), resolvedBy:state.user.studentId });
    // 거절하면 그 학번으로는 다시 가입할 수 없게(로그인 계정만 남는 유령 계정) 되므로,
    // 정리 대기열에 올려서 다음 크론에서 로그인 계정도 같이 지워지게 한다.

// 항목은 평문 문자열이거나 {text, admin:true} 형태일 수 있다.
// admin:true 항목은 학생회(council) 이상에게만 보인다 — 일반 학생에게는 의미 없는
// 관리 화면 변경사항까지 다 보여주면 패치노트가 TMI로 가득 차기 때문.
function patchNoteItemText(it){ return typeof it === 'string' ? it : it.text; }
// "업데이트 확인" 화면에서는 한 줄 제목만 보여준다 — 거기서까지 전문을 늘어놓으면 뭐가
// 바뀌었는지 훑어보기가 어렵다. 전문은 패치노트 화면에서 그대로 볼 수 있다.
// 항목에 title을 따로 적어두면 그걸 쓰고, 없으면 본문에서 설명이 시작되는 지점(" — " 또는
// 괄호) 앞까지만 잘라 쓴다.
function patchNoteItemTitle(it){
  if(it && typeof it === 'object' && it.title) return it.title;
  const text = patchNoteItemText(it) || '';
  const cut = text.split(/\s+—\s+|\s+\(/)[0].trim();
  return cut.replace(/[.,]$/, '');
}
function patchNoteItemVisible(it){ return typeof it === 'string' || !it.admin || isCouncil(); }
// 명시적으로 type:'fix'를 안 달아둔 옛 버전(문자열 항목뿐인 0.2.8 이전 등)은 제목 패턴으로
// 짐작한다 — "~문제/오류 수정"으로 끝나는 게 버그 수정 쪽 표현으로 가장 흔했다.
function patchNoteItemIsFix(it){
  if(typeof it === 'object' && it.type) return it.type === 'fix';
  const text = patchNoteItemTitle(it) || '';
  return /(문제|오류|버그)[^가-힣]{0,3}수정/.test(text);
}
// 한 버전의 항목을 "새 기능" 먼저, "버그 수정" 나중으로 순서만 바꾼다 — 원본 배열은 안 건드리고
// 화면에 뿌릴 때만 재배열해서, notifiedX 로직 등 다른 곳에서 원래 순서에 기대는 코드에 영향 없게 한다.
function splitPatchItems(items){
  const fixes = items.filter(patchNoteItemIsFix);
  const features = items.filter(it=>!patchNoteItemIsFix(it));
  return { features, fixes };
}
// 패치노트가 쌓일수록 한 화면에 다 펼쳐놓으면 스크롤이 너무 길어져서, 버전 계열(Beta/Alpha)
// 별로 묶어 아코디언으로 접었다 펼 수 있게 한다. 가장 최근 계열만 기본으로 펼쳐둔다.
let patchNoteOpenCat = null;
function patchNotesModal(){
  const council = isCouncil();
  const groups = [];
  PATCH_NOTES.forEach(p=>{
    const visible = p.items.filter(patchNoteItemVisible);
    if(!visible.length) return;
    const cat = p.version.split(' ')[0]; // 'Beta 0.0.0' → 'Beta', 'Alpha' → 'Alpha'
    let g = groups.find(g=>g.cat===cat);
    if(!g){ g = { cat, entries: [] }; groups.push(g); }
    g.entries.push({ ...p, visible });
  });
  if(patchNoteOpenCat === null && groups[0]) patchNoteOpenCat = groups[0].cat;
  return `
    <div class="modal-handle"></div>
    <div class="modal-title"><span class="modal-title-text">${ICON.clipboard} 패치노트</span><button data-action="close-modal">${ICON.close}</button></div>
    <div style="max-height:60vh; overflow-y:auto;">
      ${groups.map(g=>{
        const open = patchNoteOpenCat === g.cat;
        const noteCount = g.entries.reduce((n,p)=>n+p.visible.length, 0);
        return `
        <div class="card" style="margin-bottom:10px; padding:0;">
          <button type="button" class="row-between" style="width:100%; padding:14px; background:none; border:none; cursor:pointer; color:inherit; text-align:left;" data-action="toggle-patch-cat" data-cat="${g.cat}">
            <b style="font-size:13px;">${g.cat} <span style="color:var(--text-faint); font-weight:400; font-size:10.5px;">(${noteCount}개)</span></b>
            <span class="sub" style="transform:rotate(${open?90:0}deg); transition:transform .15s; display:inline-flex;">${ICON.chevR}</span>
          </button>
          ${open ? `<div style="padding:0 14px 14px;">
            ${g.entries.map(p=>`
              <div style="margin-bottom:12px;">
                <div class="row-between" style="margin-bottom:8px;">
                  <b style="color:var(--teal); font-family:var(--font-mono); font-size:12px;">${p.version}</b>
                  <span style="font-size:10.5px; color:var(--text-faint);">${p.date}</span>
                </div>
                ${(()=>{
                  const { features, fixes } = splitPatchItems(p.visible);
                  const row = (it)=>`<li>${escapeHtml(patchNoteItemText(it))}${(council && typeof it!=='string' && it.admin) ? ' <span class="tag tag-dim" style="font-size:9px; padding:1px 5px;">관리자</span>' : ''}</li>`;
                  return `
                  ${features.length ? `<ul style="margin:0; padding-left:18px; font-size:11.5px; color:var(--text-dim); line-height:1.7;">${features.map(row).join('')}</ul>` : ''}
                  ${(features.length && fixes.length) ? `<div style="display:flex; align-items:center; gap:8px; margin:10px 0 8px;"><span style="font-size:10px; font-weight:700; color:var(--text-faint); letter-spacing:.02em;">버그 수정</span><span style="flex:1; height:1px; background:var(--border);"></span></div>` : ''}
                  ${fixes.length ? `<ul style="margin:0; padding-left:18px; font-size:11.5px; color:var(--text-dim); line-height:1.7;">${fixes.map(row).join('')}</ul>` : ''}
                  `;
                })()}
              </div>`).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

function ttListSem(){

function ttChipLabel(k){ return semesterLabel(k).replace(/^20/, ''); }
const TT_LIST_LIMIT = 3;
function ttListBody(k){
  const variants = k ? semesterVariants(k) : [];
  const expanded = !!((state.ttListMore || {})[k]);
  // 접혀 있을 때는 앞의 3개만 보이는데, 지금 쓰는 시간표가 그 뒤에 있으면 3번째 자리에 함께 보여 준다
  let idxs = variants.map((_, i)=>i);
  if(!expanded && variants.length > TT_LIST_LIMIT){
    const actIdx = (k === state.activeSemester) ? (state.activeVariant || 0) : -1;
    idxs = idxs.slice(0, TT_LIST_LIMIT);
    if(actIdx >= TT_LIST_LIMIT) idxs[TT_LIST_LIMIT - 1] = actIdx;
  }
  const rows = idxs.map(i=>{
    const v = variants[i];
    const act = k === state.activeSemester && i === (state.activeVariant || 0);
    const dots = [...new Set((v.slots || []).map(c=>c.color).filter(Boolean))].slice(0, 4).map(c=>`<i style="background:${escapeHtml(c)};"></i>`).join('');
    return `
    <div class="ttl-row ${act ? 'active' : ''}" data-action="pick-variant" data-key="${k}" data-idx="${i}">
      <span class="ttl-radio">${act ? ICON.tick : ''}</span>
      <span class="ttl-row-main"><b>${escapeHtml(v.name)}</b><small>${(v.slots || []).length}개 수업</small></span>
      <span class="ttl-dots">${dots}</span>
      <button type="button" class="ttl-del" data-action="delete-variant" data-key="${k}" data-idx="${i}" title="삭제">${ICON.close}</button>
    </div>`;
  }).join('');
  const more = variants.length > TT_LIST_LIMIT
    ? `<div class="ttl-more" data-action="tt-list-more" data-key="${k}">${expanded ? '접기' : `더보기 · ${variants.length - TT_LIST_LIMIT}개`}<span class="ttl-more-chev" style="transform:rotate(${expanded ? 180 : 0}deg);">${ICON.chevDown}</span></div>`
    : '';
  return rows + more + `
    <div class="ttl-add" data-action="show-add-variant-input" data-key="${k}"><span class="ttl-add-ic">${ICON.plus}</span>새 시간표 만들기</div>`;
}

function filterUsersList(q){
  const norm = String(q||'').trim().toLowerCase().replace(/\s+/g,'');
  const body = document.getElementById('users-list-body');
  if(!body) return;
  let shown = 0;
  body.querySelectorAll('[data-search]').forEach(row=>{
    const hit = !norm || (row.dataset.search||'').includes(norm);
    row.style.display = hit ? '' : 'none';
    if(hit) shown++;
  });
  const noHit = document.getElementById('users-search-empty');
  if(noHit) noHit.style.display = (norm && shown===0) ? '' : 'none';
}

// 게시물에서 작성자로 추려낸다 — 새 수집 없이도 과거 글까지 전부 나온다.
function collectUserPosts(sid){
  const out = [];
  const push = (arr, type, titleOf) => {
    (arr||[]).forEach(it=>{
      if(!it || it.authorId !== sid || it.deleted) return;
      out.push({ type, title: String(titleOf(it)||'').slice(0,80), ts: it.createdAt || it.updatedAt || 0 });
    });
  };
  push(state.notices, '공지', it=>it.title);
  push(state.suggestions, '건의사항', it=>it.title || it.content);
  push(state.recruitmentPosts, '구인글', it=>it.title);
  push(state.polls, '투표', it=>it.question);
  push(state.calendar, '학사일정', it=>it.title);
  return out.sort((a,b)=>(b.ts||0)-(a.ts||0));
}

// 입력해 둔 검색어가 매번 날아간다. 그래서 바뀌는 부분만 따로 떼어내 이 안만 갈아끼운다.
// 가입자 목록 정렬 방식. 기본은 예전과 같은 직급순이라 쓰던 사람이 놀라지 않는다.
const USER_SORTS = [
  ['role',   '직급순'],
  ['sid',    '학번순'],
  ['name',   '이름순'],
  ['seen',   '접속순'],
];
function sortUsersBy(list, key){
  const arr = [...list];
  if(key === 'sid')  return arr.sort((a,b)=>String(a.studentId).localeCompare(String(b.studentId)));
  if(key === 'name') return arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  // 접속순은 최근에 본 사람이 위로. 접속 기록이 없는 사람은 맨 뒤로 보낸다.
  if(key === 'seen') return arr.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  return arr.sort((a,b)=>roleLevel(b.role)-roleLevel(a.role));
}

/* ===== 모달/토스트 ===== */
// 모달을 닫았다 다시 여는 게 아니라, 열려 있는 시트 안의 내용만 바꾼다(다시 열면 아래에서 올라오는 애니메이션이 또 돌아 "나갔다 들어오는" 것처럼 깜빡인다)
function swapModal(html){
  const sheet = document.querySelector('#modal-overlay .modal-sheet');
  if(!sheet){ openModal(html); return; }
  sheet.innerHTML = html;
}
function openModal(html){
  const root=document.getElementById('modal-root');
  if(!root) return;
  // 이미 열려 있는 모달 안에서 다른 내용으로 바뀔 때(목록 → 학기 선택 등)는 시트를 새로 만들지 않고 안쪽만 바꾼다 — 아래에서 다시 올라오는 깜빡임이 없다
  const openOv = document.getElementById('modal-overlay');
  if(openOv && openOv.classList.contains('open')){
    const sh = openOv.querySelector('.modal-sheet');
    if(sh){ sh.style.transform = ''; sh.style.transition = ''; sh.innerHTML = html; sh.scrollTop = 0; setupModalDragToDismiss(openOv); return; }
  }
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal-sheet">${html}</div></div>`;
  const ov=document.getElementById('modal-overlay');
  if(ov){
    ov.addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
    requestAnimationFrame(()=>ov.classList.add('open'));
    setupModalDragToDismiss(ov);
  }
}
// 모달 위쪽의 손잡이(막대)가 잡고 내릴 수 있을 것처럼 생겼는데 실제로는 장식이던 문제.
// 손잡이를 아래로 끌면 시트가 손가락을 따라오다가, 일정 이상 내리거나 빠르게 튕기면 닫힌다.
// 시트 안 스크롤 영역(폼 입력 등)과 겹치지 않도록 손잡이에서 시작한 드래그만 처리한다.
function setupModalDragToDismiss(overlay){
  const handle = overlay.querySelector('.modal-handle');
  const sheet = overlay.querySelector('.modal-sheet');
  if(!handle || !sheet) return;
  let startY = 0, dy = 0, dragging = false, startedAt = 0;

  const onMove = (e)=>{
    if(!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = Math.max(0, y - startY);
    sheet.style.transition = 'none';
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    sheet.style.transition = '';
    const elapsed = Date.now() - startedAt;
    const fast = elapsed > 0 && dy / elapsed > 0.6; // 빠르게 튕기듯 내리면 짧게 끌어도 닫힘
    if(dy > 110 || fast){ closeModal(); }
    else { sheet.style.transform = ''; }
  };
  const onStart = (e)=>{
    dragging = true; startedAt = Date.now();
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    dy = 0;
    document.addEventListener('touchmove', onMove, {passive:true});
    document.addEventListener('touchend', onEnd);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
  };
  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('mousedown', onStart);
}
function closeModal(){
  const ov=document.getElementById('modal-overlay');
  if(!ov) return;
  ov.classList.remove('open');
  setTimeout(()=>{ const cur=document.getElementById('modal-overlay'); if(cur && cur.classList.contains('open')) return; const r=document.getElementById('modal-root'); if(r) r.innerHTML=''; },290);
}
// 브라우저 기본 confirm()은 "example.com의 내용:" 같은 시스템 문구가 강제로 붙어서
// 이걸 없애기 위해 앱 테마에 맞는 자체 확인창을 새로 만듦 (기존 confirm 자리에 그대로 대체)
function showConfirm(message, opts={}){
  return new Promise((resolve)=>{
    const okLabel = opts.okLabel || '확인';
    const cancelLabel = opts.cancelLabel || '취소';
    const danger = opts.danger !== false;
    const wrap=document.createElement('div');
    wrap.className='confirm-overlay';
    wrap.innerHTML=`
      <div class="confirm-box">
        <p class="confirm-msg">${escapeHtml(message).replace(/\n/g,'<br>')}</p>
        <div class="confirm-actions">
          <button type="button" class="btn btn-ghost" data-act="cancel">${escapeHtml(cancelLabel)}</button>
          <button type="button" class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${escapeHtml(okLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(()=>wrap.classList.add('open'));
    const cleanup=(result)=>{
      wrap.classList.remove('open');
      setTimeout(()=>wrap.remove(),160);
      resolve(result);
    };
    wrap.addEventListener('click', e=>{
      if(e.target.dataset.act==='ok') cleanup(true);
      else if(e.target.dataset.act==='cancel' || e.target===wrap) cleanup(false);
    });
  });
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  if(!t){ return; }
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

async function handleToggleLike(type, id){
  if(!state.user){ toast('로그인이 필요합니다'); return; }
  const sid = state.user.studentId;
  const uName = state.user.name;

  let list = [];
  let docName = '';

  if(type==='notice'){ list = await loadNotices(); docName = 'notices'; }
  else if(type==='recruitment'){ list = await loadRecruitments(); docName = 'recruitments'; }
  else if(type==='suggestion'){ list = await loadSuggestions(); docName = 'suggestions'; }
  if(!docName) return;

  const item = list.find(x=>x.id===id);
  if(!item) return;

  // 여러 명이 같은 글에 동시에 따봉을 눌러도 서로의 기록이 지워지지 않도록 트랜잭션으로 처리
  const next = await mutateSharedList(docName, 'list', (cur)=>{
    const target = cur.find(x=>x && x.id===id);
    if(!target) return null;
    const likes = { ...(target.likes||{}) };
    if(likes[sid]) delete likes[sid];
    else likes[sid] = { name: uName, studentId: sid, time: now() };
    return cur.map(x=>x.id===id ? { ...x, likes, updatedAt: now() } : x);
  });
  if(!next){ saveResultToast(false); return; }

  if(type==='notice') state.notices = next;
  else if(type==='recruitment') state.recruitmentPosts = next;
  else if(type==='suggestion') state.suggestions = next;

  renderMain();
}

// input(JSON)을 매번 다시 그려서 폼 제출 시 handleNoticeSubmit이 그대로 읽어갈 수 있게 한다.
const NOTICE_MAX_IMAGES = 3;
function setupNoticeModalListeners(){
  const btnPick=document.getElementById('btn-pick-notice-img');
  const fileInput=document.getElementById('notice-file-input');
  const box=document.getElementById('notice-img-preview-box');
  const hidden=document.getElementById('notice-imgs-hidden');
  if(!hidden) return;
  let imgs=[];
  try{ imgs=JSON.parse(hidden.value||'[]'); }catch(e){ imgs=[]; }

  function redraw(){
    hidden.value=JSON.stringify(imgs);
    if(box){
      box.innerHTML=noticeImgThumbsHtml(imgs);
      box.style.display=imgs.length?'grid':'none';
    }
    if(btnPick) btnPick.disabled=imgs.length>=NOTICE_MAX_IMAGES;
  }
  redraw();

  if(btnPick && fileInput){
    btnPick.onclick=()=>{ if(imgs.length<NOTICE_MAX_IMAGES) fileInput.click(); };
    fileInput.onchange=async (e)=>{
      const files=Array.from(e.target.files||[]);
      fileInput.value='';
      if(!files.length) return;
      const room=NOTICE_MAX_IMAGES-imgs.length;
      if(files.length>room) toast(`사진은 최대 ${NOTICE_MAX_IMAGES}장까지 첨부할 수 있어요`);
      for(const file of files.slice(0,room)){
        try{
          const dataUrl=await compressImage(file,720,0.7);
          imgs.push(dataUrl);
        }catch(err){ toast('이미지 처리에 실패했습니다'); }
      }
      redraw();
    };
  }
  if(box){
    box.onclick=(e)=>{
      const btn=e.target.closest('button[data-idx]');
      if(!btn) return;
      imgs.splice(Number(btn.dataset.idx),1);
      redraw();
    };
  }
}

function compressImage(file, maxDim=720, quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height){ if(width>maxDim){ height=Math.round(height*(maxDim/width)); width=maxDim; } }
        else { if(height>maxDim){ width=Math.round(width*(maxDim/height)); height=maxDim; } }
        const cv=document.createElement('canvas');
        cv.width=width; cv.height=height;
        cv.getContext('2d').drawImage(img,0,0,width,height);
        resolve(cv.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

        if(statusBox) statusBox.innerHTML='<span style="color:var(--amber); font-weight:700;">인식된 수업이 없습니다.</span><br><span style="font-size:11.5px; color:var(--text-faint);">시간표 전체가 선명하게 보이는 캡처를 사용해주세요.</span>';
        if(resultsWrap) resultsWrap.style.display='none';
        return;
      }
      if(statusBox) statusBox.innerHTML=`<span style="color:var(--teal); font-weight:700;">✓ ${recognized.length}개 수업 인식 완료 (시작은 정각, 끝은 50분으로 맞췄어요)</span>`;
      if(countEl) countEl.textContent=recognized.length;
      renderItems(recognized);
      if(resultsWrap) resultsWrap.style.display='block';
    };

  if(btnSave){
    btnSave.onclick=async ()=>{

      const list=state.ocrParsedClasses.filter((_,i)=>idxs.includes(i));
      if(list.length===0){ toast('선택된 수업이 없습니다'); return; }
      const next=[]; const map=new Map(); let ci=0;
      list.forEach(c=>{
        const key=(c.subject||'').trim();

        const g=map.get(key);

      });

      saveResultToast(ok, `기존 시간표를 ${next.length}개 수업으로 교체했습니다`);

// Gemini Flash 모델은 코드에 이름을 박아 두지 않고, 이 키로 쓸 수 있는 모델 목록에서 가장 새 버전의 Flash를 골라 쓴다(12시간 동안 폰에 저장).
// 목록을 못 가져오면(오프라인·키 문제) 아래 예비 목록으로 동작한다. 새 버전이 나와도 앱을 고치지 않아도 자동으로 따라간다.
const GEMINI_FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-3.6-flash', 'gemini-3.5-flash'];
async function getGeminiFlashModels(){
  const cached = localGet('gemini_flash_models', null);
  if(cached && Array.isArray(cached.list) && cached.list.length && Date.now() - cached.at < 12 * 3600 * 1000) return cached.list;
  try{
    const keys = await getGeminiKeys();
    if(keys.length){
      const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers:{ 'x-goog-api-key': String(keys[0]).trim() }, signal: AbortSignal.timeout(7000) });
      if(res.ok){
        const data = await res.json();
        const found = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => String(m.name || '').replace(/^models\//, ''))
          .map(n => { const mt = n.match(/^gemini-(\d+(?:\.\d+)?)-flash(-[a-z0-9-]+)?$/); if(!mt) return null; const [ma, mi] = mt[1].split('.').map(Number); return { n, v: ma * 1000 + (mi || 0), suffix: mt[2] || '' }; })
          .filter(x => x && !/lite|image|tts|live|audio|thinking|embedding/.test(x.suffix))
          .sort((a, b) => b.v - a.v || ((/preview|exp/.test(a.suffix) ? 1 : 0) - (/preview|exp/.test(b.suffix) ? 1 : 0)) || a.suffix.length - b.suffix.length);
        const names = [...new Set(found.map(x => x.n))].slice(0, 3);
        if(names.length){
          const list = [...names, ...GEMINI_FALLBACK_MODELS.filter(x => !names.includes(x))];
          localSet('gemini_flash_models', { at: Date.now(), list });
          return list;
        }
      }
    }
  }catch(e){ /* 목록 조회에 실패하면 예비 목록을 쓴다 */ }
  return GEMINI_FALLBACK_MODELS;
}
async function parseTimetableWithGeminiVision(file){
  const base64 = await new Promise(res=>{
    const r=new FileReader();
    r.onloadend=()=>{ const v=r.result; res(v.includes(',')?v.split(',')[1]:v); };
    r.readAsDataURL(file);
  });
  const prompt = `이 한국 대학교 주간 강의 시간표 이미지에서 모든 수업을 찾아 JSON 배열로만 반환하세요.
요일(0=월,1=화,2=수,3=목,4=금), 시작시각(HH:MM), 종료시각(HH:MM), 과목명, 교수명(있는 경우), 강의실.
시간표의 가로로 그어진 시간선(왼쪽 시간축의 9, 10, 11… 눈금에서 이어지는 가로줄)을 위에서 아래로 꼼꼼히 따라가며 읽으세요. 각 수업 블록의 위쪽 가장자리가 닿은 가로 시간선이 시작 시각, 아래쪽 가장자리가 닿은 가로 시간선이 종료 시각입니다. 이 시간표의 수업은 30분에 시작하거나 끝나는 경우가 없으므로, 시작과 종료는 항상 정각(00분) 가로선의 시각으로만 기록하세요(예: 09:00, 10:00, 13:00). 블록이 여러 시간에 걸쳐 있으면 아래쪽 가장자리가 닿은 정각 가로선을 종료 시각으로 하세요. 서두르지 말고 시간축 눈금과 격자선을 하나씩 대조해서 확인하세요. 이후 앱이 종료 시각을 50분으로 보정합니다.
같은 요일의 두 수업이 시간적으로 겹치는 일은 실제로는 절대 없습니다(시간표 자체가 겹치지 않게 짜여 있음). 인식 결과에서 같은 요일의 두 수업이 겹친다면 그건 시작·종료 시각을 잘못 읽은 것이니, 겹치지 않도록 시각을 다시 확인해서 고치세요.
JSON으로만 작성하세요.
예시: [{"day":0,"startTime":"09:00","endTime":"10:00","subject":"반도체의 이해","professor":"김교수","room":"과학기술1관 301호"}]`;

  const models = await getGeminiFlashModels();
  let lastErr=null;
  // 'low'는 응답이 빠르지만 격자가 복잡한 시간표에서는 판단이 얕아질 수 있다.
  // 그래서 빠른 설정으로 먼저 시도하고, 인식 결과가 비어 있으면 기본 추론 강도로 한 번 더 시도한다.
  // (대부분의 사진은 1차에서 끝나서 빨라지고, 어려운 사진만 2차로 넘어간다)
  const attempts = [{ thinkingLevel:'low' }, null];
  const geminiKeys = await getGeminiKeys();
  if(!geminiKeys.length) throw new Error(geminiNoKeyMessage());
  ocr:
  for(const thinkingConfig of attempts){
    for(const apiKey of geminiKeys){
      for(const model of models){
        try{
          const generationConfig = { responseMimeType:'application/json' };
          if(thinkingConfig) generationConfig.thinkingConfig = thinkingConfig;
          const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'x-goog-api-key':apiKey.trim() },
            body:JSON.stringify({
              contents:[{ parts:[ {text:prompt}, {inlineData:{ mimeType:file.type||'image/jpeg', data:base64 }} ] }],
              generationConfig
            })
          });
          const data=await res.json();
          if(data.error || !res.ok) throw geminiError(res, data);
          const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
          const parsed = JSON.parse(raw.replace(/```(?:json)?/gi,'').trim());
          const result = parsed.map(it=>{
            const rawStart = timeInputToMinutes(it.startTime);
            const rawEnd = timeInputToMinutes(it.endTime);
            return {
              day:Number(it.day),
              start:snapClassStart(rawStart),
              end:snapClassEnd(snapClassStart(rawStart), rawEnd),
              subject:it.subject,
              professor:it.professor||'',
              room:it.room||''
            };
          }).filter(x=>x.day>=0 && x.day<=4 && x.start<x.end && x.subject);
          if(result.length) return result;
          // 한 과목도 못 읽었으면 다음 단계(더 깊은 추론)로 넘긴다
          lastErr = lastErr || new Error('인식된 수업이 없습니다');
          break;
        }catch(err){ lastErr=err; if(err && err.geminiAuth) break ocr; }
      }
    }
  }
  throw lastErr || new Error('시간표 인식에 실패했습니다.');
}

/* ===== 필수 입력 검증 =====
   input required 속성이 비어있으면 브라우저/웹뷰가 "입력란을 작성하세요" 같은 자체 말풍선을
   띄우면서 submit 이벤트 자체를 막아버린다. 안드로이드 기기마다 문구·모양이 제각각이라
   앱과 안 어울려서, 그 말풍선은 막고 대신 필드 아래에 우리 글씨로 빨간 안내를 띄운다. */
function fieldValidationMessage(el){
  const v = el.validity;
  if(v.valueMissing) return '이 항목을 입력해주세요.';
  if(v.typeMismatch || v.patternMismatch) return '형식을 확인해주세요.';
  if(v.tooShort) return `최소 ${el.minLength}자 이상 입력해주세요.`;
  if(v.tooLong) return `최대 ${el.maxLength}자까지 입력할 수 있어요.`;
  if(v.rangeUnderflow || v.rangeOverflow) return '입력 가능한 범위를 확인해주세요.';
  return el.validationMessage || '입력값을 확인해주세요.';
}
function showFieldError(el){
  const field = el.closest('.field') || el.parentElement;
  if(!field) return;
  field.classList.add('field-invalid');
  let msg = field.querySelector('.field-error');
  if(!msg){ msg = document.createElement('div'); msg.className = 'field-error'; field.appendChild(msg); }
  msg.textContent = fieldValidationMessage(el);
}
function clearFieldError(el){
  const field = el.closest('.field') || el.parentElement;
  if(!field) return;
  field.classList.remove('field-invalid');
  const msg = field.querySelector('.field-error');
  if(msg) msg.remove();
}
document.addEventListener('invalid', (e)=>{
  e.preventDefault(); // 기본 말풍선 억제
  showFieldError(e.target);
}, true);
document.addEventListener('input', (e)=>{
  if(e.target && e.target.willValidate && e.target.checkValidity()) clearFieldError(e.target);
}, true);
document.addEventListener('change', (e)=>{
  if(e.target && e.target.willValidate && e.target.checkValidity()) clearFieldError(e.target);
}, true);

document.addEventListener('submit', async (e)=>{
  const form = e.target;
  e.preventDefault();

  const formId = form.getAttribute('id');
  if(!formId){
    toast('폼을 인식하지 못했습니다');
    return;
  }

  const HANDLERS = {
    'login-form': handleLogin,
    'signup-form': handleSignup,
    'class-form': handleClassSubmit,
    'event-form': handleEventSubmit,
    'memo-form': handleMemoSubmit,
    'exam-form': handleExamSubmit,
    'meal-form': handleMealSubmit,
    'notice-form': handleNoticeSubmit,
    'suggestion-form': handleSuggestionSubmit,
    'reply-form': handleReplySubmit,
    'poll-form': handlePollSubmit,
    'poll-vote-form': handlePollVoteSubmit,
    'recruitment-form': handleRecruitmentSubmit,
    'council-verify-form': handleCouncilVerify,
    'change-password-form': handleChangePasswordSubmit,
    'delete-account-form': handleDeleteAccountSubmit,
    'kick-member-form': handleKickMemberSubmit,
    'roster-form': handleRosterSubmit,
    'gemini-keys-form': handleGeminiKeysSubmit,
    'nickname-form': handleNicknameSubmit,
  };
  const fn = HANDLERS[formId];
  if(!fn){ toast('알 수 없는 폼: ' + formId); return; }
  try{
    await fn(new FormData(form));
  }catch(err){
    toast('오류: ' + (err && err.message || '처리에 실패했습니다'));
  }
});

function showAuthError(msg){
  const box=document.getElementById('auth-error');
  if(box) box.innerHTML=`<div class="error-msg">${escapeHtml(msg)}</div>`;
  else toast(msg);
}
function mapAuthError(err){
  const c = err && err.code;
  if(c==='auth/email-already-in-use') return '이미 가입된 학번입니다.';
  if(c==='auth/user-not-found') return '가입되지 않은 학번입니다. 회원가입을 먼저 진행해주세요.';
  if(c==='auth/wrong-password') return '비밀번호가 올바르지 않습니다. 본인의 정보를 정확히 입력해주세요.';
  if(c==='auth/invalid-credential') return '가입되지 않은 학번이거나 비밀번호가 올바르지 않습니다. 본인의 정보를 정확히 입력해주세요.';
  if(c==='auth/weak-password') return '비밀번호는 6자 이상이어야 합니다.';
  if(c==='auth/invalid-email') return '학번을 다시 확인해주세요.';
  if(c==='auth/too-many-requests') return '로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.';
  if(c==='auth/user-disabled') return '1년 이상 미접속으로 계정이 잠겼습니다. 정보는 그대로 남아있어요 — 다시 쓰시려면 학생회에 문의해주세요.';
  return '오류가 발생했습니다: ' + (c || (err && err.message) || '알 수 없음');
}

async function handleLogin(fd){
  const studentId=(fd.get('studentId')||'').trim();
  const password=fd.get('password');
  const check=validateStudentId(studentId);
  if(!check.valid){ showAuthError(check.message); return; }

  const btn=document.querySelector('#login-form button[type=submit]');
  if(btn) btn.disabled=true;
  try{
    const roster = await loadRoster().catch(()=>({}));
    if(Object.keys(roster).length>0 && !roster[studentId]){
      showAuthError('학과 명단에 등록되지 않은 학번입니다. 학생회에 문의해주세요.');
      return;
    }
    let cred;
    try{
      cred = await signInWithEmailAndPassword(auth, studentId+STUDENT_EMAIL_DOMAIN, password);
    }catch(err1){
      if(err1.code==='auth/user-not-found' || err1.code==='auth/invalid-credential'){
        // 개명 이전(@ies.local)에 가입한 계정일 수 있으니 한 번 더 시도
        cred = await signInWithEmailAndPassword(auth, studentId+LEGACY_STUDENT_EMAIL_DOMAIN, password);
      } else {
        throw err1;
      }
    }
    if(Object.keys(roster).length>0){
      const udoc = await fetchUserDoc(cred.user.uid);
      const rEntry = rosterEntry(roster[studentId]);
      if(udoc && rEntry && String(rEntry.name).trim() !== String(udoc.name).trim()){
        await signOut(auth);
        showAuthError('명단에 등록된 이름과 계정 정보가 일치하지 않습니다. 학생회에 문의해주세요.');
      }
    }
  }catch(err){
    showAuthError(mapAuthError(err));
  }finally{ if(btn) btn.disabled=false; }
}

// createUserWithEmailAndPassword가 성공하는 순간 onAuthStateChanged가 먼저 깨어난다.
// 그런데 그 시점은 handleSignup이 아직 명단의 "이름"을 대조하기 전이라, 감지기가 학번만
// 보고 통과시켜 버리면 명단에 없는 이름으로도 로그인이 끝나버린다. 가입 처리가 끝날
// 때까지 감지기가 기다리게 하려고 두는 플래그.
let signupInProgress = false;

async function handleSignup(fd){
  const studentId=(fd.get('studentId')||'').trim();
  const name=(fd.get('name')||'').trim();
  const password=fd.get('password');
  const password2=fd.get('password2');
  let role = state.signupRole==='council' ? 'council' : 'student';

  if(!studentId||!name){ showAuthError('학번과 이름을 입력해주세요.'); return; }
  const check=validateStudentId(studentId);
  if(!check.valid){ showAuthError(check.message); return; }
  if(password.length<6){ showAuthError('비밀번호는 6자 이상이어야 합니다.'); return; }
  if(password!==password2){ showAuthError('비밀번호가 일치하지 않습니다.'); return; }

  // 코드가 맞는지는 클라이언트가 판단하지 않는다. 입력된 코드를 users/{uid} 문서에
  // roleCode로 함께 써서 Firestore 규칙이 서버에서 대조하게 하고, 틀리면 쓰기 자체가
  // 거부된다(permission-denied). 그때는 방금 만든 계정을 되돌린다.
  // 어느 직급인지는 코드 모양으로 구분할 수 없으므로, 학생회로 가입할 땐 council →
  // president → developer 순으로 시도해서 규칙이 통과시키는 직급을 찾는다.
  let councilCodeInput = '';
  if(state.signupRole==='council'){
    councilCodeInput=(fd.get('councilCode')||'').trim();
  }

  const btn=document.querySelector('#signup-form button[type=submit]');
  if(btn) btn.disabled=true;
  let cred=null;
  signupInProgress = true;
  const birthYear=(fd.get('birthYear')||'').trim();

  // 명단과 안 맞을 때, 예전엔 바로 계정을 지우고 실패 메시지만 띄웠다. 이제는 본인 확인
  // (오타)인지 정말 명단에 없는 건지 갈라서, 후자는 계정을 지우지 않고 학생회에 문의를
  // 넣을 수 있게 한다 — 계정은 이미 본인이 비밀번호까지 정해서 만든 상태라, 나중에
  // 학생회가 승인만 하면 비밀번호를 다시 받을 필요 없이 바로 프로필이 붙는다.
  const offerInquiry = async (reason) => {
    const goInquiry = await showConfirm(
      `${reason}\n\n학번·이름을 다시 확인하시겠어요, 아니면 학생회에 확인을 요청할까요?`,
      { okLabel:'학생회에 문의 넣기', cancelLabel:'다시 입력', danger:false }
    );
    if(goInquiry){
      try{
        await setDoc(doc(db,'signupInquiries',cred.user.uid), {
          studentId, name, birthYear, status:'pending', createdAt: now(),
        });
        // signOut()이 onAuthStateChanged를 깨워 로그인 화면으로 다시 그려버리므로, 여기서
        // 바로 showAuthError를 불러도 그 DOM이 곧 통째로 사라진다. 로그인 화면이 다시
        // 그려진 뒤에 대신 띄워줄 메시지를 남겨둔다.
        state.pendingAuthFlash = '문의가 접수됐어요. 학생회 확인 후 가입이 완료되면 이 학번으로 다시 로그인해주세요.';
      }catch(e){
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('문의 접수에 실패했습니다. 다시 시도해주세요.');
        return;
      }
      await signOut(auth).catch(()=>{});
    }else{
      await deleteUser(cred.user).catch(()=>{});
      showAuthError('학번과 이름을 다시 확인해주세요.');
    }
  };

  try{
    // 명단 대조는 인증된 상태에서만 신뢰할 수 있어(Firestore 규칙), 계정을 먼저 만들고
    // 그 다음 명단을 확인한다. 조회 자체가 실패하면 방금 만든 계정을 즉시 삭제해 되돌린다
    // ("조회 실패"를 "검증 통과"로 오인하지 않도록 fail-closed 처리).
    cred = await createUserWithEmailAndPassword(auth, studentId+STUDENT_EMAIL_DOMAIN, password);

    // 명단 대조 결과(맞음/안 맞음)가 곧바로 갈리면 "확인하는 척만 하는 것"처럼 보인다.
    // 그래서 결과를 알기 전, 확인 자체를 이 대기 시간 동안 하는 것처럼 보여준다 — 맞아서
    // 바로 되든 안 맞아서 문의로 가든 항상 똑같이 이 화면부터 거친다.
    if(state.signupRole!=='council'){
      if(btn) btn.textContent = '학생회 승인 후 가입이 완료됩니다 (약 5초 소요)…';
      await new Promise(resolve=>setTimeout(resolve, 5000));
    }

    const rosterCheck = await loadRosterStrict();
    if(!rosterCheck.ok){
      await deleteUser(cred.user).catch(()=>{});
      showAuthError('학과 명단 확인에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해주세요.');
      return;
    }
    const roster = rosterCheck.map;
    if(Object.keys(roster).length>0 && state.signupRole!=='council'){
      const rEntry = rosterEntry(roster[studentId]);
      if(!rEntry){ await offerInquiry('학과 명단에 등록되지 않은 학번이에요.'); return; }
      if(String(rEntry.name).trim()!==name){ await offerInquiry('명단에 등록된 이름과 일치하지 않아요.'); return; }
      if(rEntry.birthYear){
        if(!birthYear){ await offerInquiry('명단에 출생연도 확인이 필요해요. 출생연도(4자리)를 입력해주세요.'); return; }
        if(birthYear!==String(rEntry.birthYear).trim()){ await offerInquiry('입력하신 출생연도가 명단과 일치하지 않아요.'); return; }
      }
    }

    if(state.signupRole==='council'){
      // 규칙이 통과시키는 직급을 찾는다. 전부 거부되면 코드가 틀린 것.
      const grantedRole = await createUserDocWithCode(
        cred.user.uid, { studentId, name, createdAt: now() }, councilCodeInput);
      if(!grantedRole){
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('학생회 인증코드가 올바르지 않습니다.');
        return;
      }
    }else{
      const ok=await createUserDoc(cred.user.uid, { studentId, name, role:'student', createdAt: now() });
      if(!ok){
        // 프로필 저장이 실패하면 로그인 계정만 남아 이 학번으로 재가입이 막히는 유령
        // 계정이 된다 — 학생회 가입 실패 때처럼 여기서도 즉시 되돌린다.
        await deleteUser(cred.user).catch(()=>{});
        showAuthError('프로필 저장에 실패했습니다. 다시 시도해주세요.');
        return;
      }
    }
  }catch(err){
    if(cred){ await deleteUser(cred.user).catch(()=>{}); }
    showAuthError(mapAuthError(err));
  }finally{ signupInProgress = false; if(btn){ btn.disabled=false; btn.textContent='가입하기'; } }
}

async function logout(){
  if(!await showConfirm('로그아웃 하시겠습니까?')) return;
  if(myRoleUnsub){ myRoleUnsub(); myRoleUnsub=null; } // 다음 사람 로그인 뒤에도 내 리스너가 계속 도는 일이 없게
  await releasePushTokenForLogout(state.user && state.user.uid);
  state.user=null;
  state.memos={}; // 개인 메모가 다음 로그인 사용자에게 잠깐이라도 보이지 않게 비운다
  await signOut(auth).catch(()=>{});
  renderApp();
}

async function resetTimetable(){
  const label = state.activeSemester ? `${semesterLabel(state.activeSemester)} · ${activeVariantName()}` : '현재';

async function resetAllTimetables(){
  if(!await showConfirm('모든 학기의 시간표를 전부 삭제할까요? 되돌릴 수 없습니다.')) return;
  const uidStr = state.user.uid;

  const ts = now();
  localSet('tt_'+uidStr, { bySemester: {}, activeSemester: state.activeSemester });
  localSet('tt_at_'+uidStr, ts);
  let ok = false;
  if(!auth.currentUser){ LAST_SAVE_ERROR='unauthenticated'; }
  else{
    dirtySet('tt', uidStr, Date.now());
    try{ await withSaveTimeout(setDoc(doc(db,'timetables',uidStr), { bySemester: {}, activeSemester: state.activeSemester, updatedAt: ts }), 12000); dirtySet('tt', uidStr, 0); LAST_SAVE_ERROR=''; ok=true; ttVerQueue(); }
    catch(e){ LAST_SAVE_ERROR=(e&&e.code)||'unknown'; if(TRANSIENT_SAVE_ERRORS.includes(LAST_SAVE_ERROR)){ LAST_SAVE_QUEUED = true; scheduleDirtyFlush(); ok = true; } else dirtySet('tt', uidStr, 0); }
  }
  renderMain();
  saveResultToast(ok, '모든 시간표가 삭제되었습니다');
}

/* ===== 권한 & 가입자 관리 ===== */
// 권한 해제(→ 재학생)는 코드가 필요 없다. 규칙도 student로 내리는 건 그냥 허용한다.
async function setRole(role){
  if(role==='student' && !await showConfirm('학생회 권한을 해제할까요? 관리 기능을 사용할 수 없게 됩니다.')) return false;
  try{ await setDoc(doc(db,'users',state.user.uid), { role }, { merge:true }); }
  catch(e){ toast('권한 변경에 실패했습니다'); return false; }
  state.user.role=role;
  localSet('user_'+state.user.uid, state.user);
  await trackUserPresence(state.user, true);
  renderApp();
  toast(role==='student' ? '재학생 권한으로 전환되었습니다' : `${roleLabel(role)} 권한이 활성화되었습니다`);
  return true;
}
// 승급은 코드를 클라이언트가 판정하지 않고, role+roleCode를 써서 Firestore 규칙의
// 판정을 받는다. 낮은 직급부터 시도해 규칙이 통과시키는 직급을 찾는다.
async function handleCouncilVerify(fd){
  const code=(fd.get('code')||'').trim();
  if(!code){ toast('인증코드를 입력해주세요'); return; }
  const uidStr = state.user.uid;
  for(const role of ROLE_CODE_CANDIDATES){
    try{
      await setDoc(doc(db,'users',uidStr), { role, roleCode: code }, { merge:true });
      await setDoc(doc(db,'users',uidStr), { roleCode: deleteField() }, { merge:true }).catch(()=>{});
      state.user.role=role;
      localSet('user_'+uidStr, state.user);
      await trackUserPresence(state.user, true);
      closeModal();
      renderApp();
      toast(`${roleLabel(role)} 권한이 활성화되었습니다`);
      return;
    }catch(e){ /* 이 직급의 코드가 아님 */ }
  }
  toast('인증코드가 올바르지 않습니다');
}
async function refreshUsersList(){
  try{ state.allUsers = await loadAllUsersList(); }catch(e){}
}
async function assignRole(studentId, role){
  if(!isPresident()){ toast('학생회장만 직급을 부여할 수 있습니다'); return; }
  if(!ROLES[role]) return;
  const users={ ...(state.allUsers||{}) };
  if(!users[studentId]) return;

  const targetUid = users[studentId].uid;
  if(!targetUid){
    toast('이 계정의 내부 ID를 찾을 수 없어 직급을 바꿀 수 없습니다');
    return;
  }

  // 예전에는 화면용 캐시(shared/usersList) 저장 결과로 성공/실패를 판단하고, 정작 진짜
  // 직급이 들어가는 users/{uid} 쓰기는 catch로 삼켰다. 그래서 규칙에 막혀 직급이 그대로인
  // 경우에도 "변경했습니다"가 떠서, 권한을 내렸는데 안 내려가는 것처럼 보였다.
  // 이제 진짜 쓰기 결과만 보고, 실패하면 그 이유를 그대로 띄운다.
  let ok = false;
  LAST_SAVE_ERROR = '';
  try{
    await setDoc(doc(db,'users',targetUid), { role }, { merge:true });
    ok = true;
  }catch(e){
    LAST_SAVE_ERROR = (e && e.code) || 'unknown';
    console.error('[assignRole] 직급 변경 실패', e);
  }

  if(ok){
    users[studentId]={ ...users[studentId], role };
    state.allUsers=users;
    if(state.user && state.user.studentId===studentId){
      state.user.role=role;
      localSet('user_'+state.user.uid, state.user);
    }
  }
  saveResultToast(ok, `${users[studentId].name}님을 ${roleLabel(role)}(으)로 변경했습니다`);
  // 목록 다시 그리기는 호출한 쪽(pick-role)이 서버에서 새로 읽어서 한다.
}

/* ===== 시간표 저장 ===== */
async function handleClassSubmit(fd){
  const subject = (fd.get('subject') || '').trim();
  const professor = (fd.get('professor') || '').trim();
  const color = (fd.get('color') || '').trim() || COLORS[0].hex;
  const textColor = (fd.get('textColor') || '#FFFFFF').trim();
  const groupId = (fd.get('groupId') || '').trim() || ('grp_' + uid());
  if(!subject){ toast('과목명을 입력해주세요'); return; }

  const slots = readCurrentFormSlots();
  if(slots.length === 0){ toast('최소 1개 이상의 시간대를 입력해주세요'); return; }
  for(let i = 0; i < slots.length; i++){
    if(!(slots[i].end > slots[i].start)){ toast(`시간대 ${i+1}: 종료 시간은 시작 시간보다 늦어야 합니다`); return; }
  }
  for(let i = 0; i < slots.length; i++){
    for(let j = i + 1; j < slots.length; j++){
      if(slots[i].day === slots[j].day && Math.max(slots[i].start, slots[j].start) < Math.min(slots[i].end, slots[j].end)){
        toast(`입력한 시간대 ${i+1}과 ${j+1}이 서로 겹칩니다`);
        return;
      }
    }
  }
  const others = state.timetable.filter(c => (c.groupId ? c.groupId !== groupId : c.id !== groupId));
  for(const s of slots){
    for(const ex of others){
      if(s.day === ex.day && Math.max(s.start, ex.start) < Math.min(s.end, ex.end)){
        toast(`${DAYS[s.day]}요일 ${minutesToLabel(ex.start)}~${minutesToLabel(ex.end)}에 '${ex.subject}' 수업과 겹칩니다`);
        return;
      }
    }
  }

  const next = others.slice();
  slots.forEach(s => next.push({ id: uid(), groupId, day: s.day, start: s.start, end: s.end, subject, professor, room: s.room, color, textColor }));
  const ok = await saveTimetable(state.user.uid, next);
  state.timetable = next;
  closeModal();
  renderMain();
  saveResultToast(ok, '시간표가 저장되었습니다');
}
