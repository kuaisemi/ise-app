document.addEventListener('click', async (e)=>{

  const a = el.dataset.action;

  const councilOnly = ['add-notice','edit-notice','delete-notice','toggle-pin','reply-suggestion','add-event','delete-event','edit-meal','add-council-post','delete-council-post','add-council-event','delete-all-calendar','ocr-calendar'];

  if(presidentOnly.includes(a) && !isPresident()){ toast('학생회장 권한이 필요한 기능입니다'); return; }

    if(a === 'switch-auth'){ state.authMode = el.dataset.mode; renderAuth(); }

      if(!picker) return;
      const hidden = picker.querySelector('input[type=hidden]');
      const part = el.dataset.part, dir = parseInt(el.dataset.dir, 10);
      let [h, m] = hidden.value.split(':').map(Number);
      if(part==='h') h = (h + dir + 24) % 24;
      else m = (m + dir*5 + 60) % 60;
      hidden.value = `${pad(h)}:${pad(m)}`;
      picker.querySelector('.tp-val[data-part="h"]').textContent = pad(h);
      picker.querySelector('.tp-val[data-part="m"]').textContent = pad(m);

    else if(a === 'global-refresh'){

    else if(a === 'nav'){
      state.view = el.dataset.view;

      if(['home', 'info', 'council'].includes(state.view)){ await refreshShared(); renderMain(); }

    else if(a === 'toggle-preview-mode'){
      if(!isRawDeveloper()) return;
      state.previewAsStudent = !state.previewAsStudent;
      renderApp();
      toast(state.previewAsStudent ? '재학생 화면으로 미리보기 중' : '개발자 화면으로 복귀했습니다');
    }
    else if(a === 'open-semester-picker'){ openModal(semesterPickerModal()); }
    else if(a === 'open-timetable-list'){ openModal(timetableListModal()); }
    else if(a === 'open-tt-more-menu'){ openModal(ttMoreMenuModal()); }
    else if(a === 'pick-semester'){
      state.activeSemester = el.dataset.key;
      state.activeVariant = 0;
      syncActiveTimetable();
      closeModal();
      renderMain();
      if(state.user) await saveTimetable(state.user.uid, state.timetable);
    }
    else if(a === 'pick-variant'){
      state.activeSemester = el.dataset.key;
      state.activeVariant = parseInt(el.dataset.idx, 10) || 0;
      syncActiveTimetable();
      closeModal();
      renderMain();
    }
    else if(a === 'show-add-variant-input'){
      const key = el.dataset.key;
      el.outerHTML = `<div class="tt-list-add-input-row">
        <input type="text" class="tt-list-add-input" placeholder="시간표 이름 (예: 임시, 복수전공)" maxlength="12">
        <button type="button" class="btn btn-primary btn-sm" style="width:auto;" data-action="confirm-add-variant" data-key="${key}">추가</button>
      </div>`;
      const input = document.querySelector('.tt-list-add-input');
      if(input) input.focus();
    }
    else if(a === 'confirm-add-variant'){
      const key = el.dataset.key;
      const input = document.querySelector('.tt-list-add-input');
      const list = semesterVariants(key);
      const name = (input && input.value.trim()) || `시간표 ${list.length+1}`;
      list.push({ name, slots: [] });
      state.timetablesBySemester[key] = list;
      state.activeSemester = key;
      state.activeVariant = list.length-1;
      syncActiveTimetable();
      if(state.user) await saveTimetable(state.user.uid, []);
      openModal(timetableListModal());
      renderMain();
    }
    else if(a === 'delete-variant'){
      const key = el.dataset.key, idx = parseInt(el.dataset.idx,10);
      const list = semesterVariants(key);
      const target = list[idx];
      if(!await showConfirm(`'${target?target.name:'이'}' 시간표를 삭제할까요? 되돌릴 수 없어요.`)) return;
      list.splice(idx,1);
      if(list.length===0){
        // 그 학기의 마지막 시간표까지 지우면 빈 학기로 남기지 않고 학기 자체를 목록에서 제거한다.
        delete state.timetablesBySemester[key];
      } else {
        state.timetablesBySemester[key] = list;
      }
      if(state.activeSemester===key){
        if(list.length===0){
          const keys = sortedSemesterKeys();
          state.activeSemester = keys[0] || null;
          state.activeVariant = 0;
        } else {
          state.activeVariant = Math.min(state.activeVariant, list.length-1);
        }
        syncActiveTimetable();
      }
      if(state.user){
        const ts=now();
        localSet('tt_'+state.user.uid, { bySemester: state.timetablesBySemester, activeSemester: state.activeSemester });
        localSet('tt_at_'+state.user.uid, ts);
        try{ await setDoc(doc(db,'timetables',state.user.uid), { bySemester: state.timetablesBySemester, activeSemester: state.activeSemester, updatedAt: ts }); }catch(e){}
      }
      openModal(timetableListModal());
      renderMain();
    }
    else if(a === 'rename-variant'){ if(state.activeSemester) openModal(renameVariantModal()); }
    else if(a === 'confirm-rename-variant'){
      const input = document.getElementById('rename-variant-input');
      const name = (input && input.value.trim()) || activeVariantName();
      if(state.user) await renameActiveVariant(state.user.uid, name);
      closeModal();
      renderMain();
    }
    else if(a === 'regen-council-code'){ await regenCouncilCode(); }
    else if(a === 'copy-council-code'){ copyCouncilCode(); }
    else if(a === 'user-tab'){ state.activeUserListTab = el.dataset.tab; openModal(usersListModal()); }
    else if(a === 'manage-roster'){ openModal(await rosterModal()); }
    else if(a === 'change-password'){ openModal(changePasswordModal()); }
    else if(a === 'delete-account'){ openModal(deleteAccountModal()); }
    else if(a === 'kick-member'){ openModal(kickMemberModal(el.dataset.sid, el.dataset.name)); }
    else if(a === 'toggle-tt-fab'){ state.ttFabOpen = !state.ttFabOpen; renderMain(); }
    else if(a === 'close-tt-fab'){ state.ttFabOpen = false; renderMain(); }
    else if(a === 'add-class'){ state.ttFabOpen = false; openModal(classModal(null)); setupClassModalListeners(); }
    else if(a === 'edit-class'){ const c = state.timetable.find(x => x.id === el.dataset.id); if(c){ openModal(classModal(c)); setupClassModalListeners(); } }
    else if(a === 'delete-class-group'){ await deleteClassGroup(el.dataset.groupId); }
    else if(a === 'ocr-timetable'){ state.ttFabOpen = false; openModal(ocrModal()); setupOcrModalListeners(); }
    else if(a === 'pick-color'){
      // 프리셋을 고르면 "직접 선택" 스와치는 다시 무지개(선택 안 됨) 상태로 되돌린다
      document.querySelectorAll('#class-swatches-wrap .swatch').forEach(s => {
        s.classList.remove('selected'); s.innerHTML = '';
        if(s.dataset.action === 'toggle-inline-color') s.style.background = 'var(--surface-2)';
      });
      el.classList.add('selected'); el.innerHTML = '✓';
      const inp = document.getElementById('class-color-input');
      if(inp) inp.value = el.dataset.hex;
    }
    else if(a === 'pick-schedule-color'){
      document.querySelectorAll('#schedule-swatches-wrap .swatch').forEach(s => {
        s.classList.remove('selected'); s.innerHTML = '';
        if(s.dataset.action === 'toggle-inline-color') s.style.background = 'var(--surface-2)';
      });
      el.classList.add('selected'); el.innerHTML = '✓';
      const inp = document.getElementById('schedule-color-input');
      if(inp) inp.value = el.dataset.hex;
    }
    else if(a === 'pick-text-color'){
      document.querySelectorAll('#class-text-swatches-wrap .text-swatch').forEach(s => { s.classList.remove('selected'); s.innerHTML = ''; });
      el.classList.add('selected'); el.innerHTML = '✓';
      const inp = document.getElementById('class-text-color-input');
      if(inp) inp.value = el.dataset.color;
    }
    else if(a==='del-slot'){
      const idx=parseInt(el.dataset.idx,10);
      const c=document.getElementById('slots-container');
      if(!c) return;
      const slots=readCurrentFormSlots();
      if(slots.length<=1){ toast('최소 1개 이상의 시간대가 필요합니다'); return; }
      slots.splice(idx,1);
      c.innerHTML = slots.map((s,i)=>renderSlotHtml(s,i,slots.length)).join('');
    }
    else if(a==='cal-month-prev'){ state.calendarMonth=addMonths(state.calendarMonth,-1); renderMain(); }
    else if(a==='cal-month-next'){ state.calendarMonth=addMonths(state.calendarMonth,1); renderMain(); }
    else if(a==='toggle-council-filter'){
      state.showCouncilEvents = !state.showCouncilEvents;
      localSet('cal_show_council', state.showCouncilEvents);
      renderMain();
      toast(state.showCouncilEvents ? '학생회 일정이 표시됩니다' : '학생회 일정이 숨겨졌습니다');
    }
    else if(a==='toggle-academic-filter'){
      state.showAcademicEvents = !state.showAcademicEvents;
      localSet('cal_show_academic', state.showAcademicEvents);
      renderMain();
      toast(state.showAcademicEvents ? '학사일정이 표시됩니다' : '학사일정이 숨겨졌습니다');
    }
    else if(a==='select-exam-date'){
      state.selectedExamDate = el.dataset.date;
      renderMain();
    }
    else if(a==='add-event'){ openModal(eventModal(null)); }
    else if(a==='delete-all-calendar'){ await deleteAllCalendarEvents(); }
    else if(a==='ocr-calendar'){ openModal(calendarOcrModal()); setupCalendarOcrModalListeners(); }
    else if(a==='open-official-schedule'){ openModal(officialScheduleModal()); setupOfficialScheduleModalListeners(); }
    else if(a==='add-student-event'){ openModal(scheduleModal(el.dataset.date || state.selectedExamDate, false)); }
    else if(a==='add-council-event'){ openModal(scheduleModal(el.dataset.date || state.selectedExamDate, true)); }
    else if(a==='add-exam-event'){ openModal(examScheduleModal(el.dataset.date || state.selectedExamDate)); setupExamModalListeners(); }
    else if(a==='settings-tab'){ state.settingsTab = el.dataset.tab; renderMain(); }
    // 위젯 설정은 지금 고른 위젯(state.widgetFontScaleTarget) 하나에만 적용된다
    else if(a==='set-widget-bg'){ setWidgetSetting(state.widgetFontScaleTarget, { bg: el.dataset.bg }); renderMain(); }
    else if(a==='set-widget-accent'){ setWidgetSetting(state.widgetFontScaleTarget, { accent: el.dataset.hex }); renderMain(); }
    else if(a==='open-color-modal'){
      const target = el.dataset.target;
      const wkey = state.widgetFontScaleTarget;
      const w = getWidgetSettings(wkey);
      const hex = target==='bg' ? w.customBg : w.accent;
      const label = target==='bg' ? '배경 색' : '강조 색';
      openModal(colorPickerModal(target, isValidHexColor(hex)?hex:WIDGET_ACCENTS[0], label));
      setupColorPicker(target, (newHex)=>{
        if(target==='bg') setWidgetSetting(wkey, { bg:'custom', customBg:newHex });
        else setWidgetSetting(wkey, { accent:newHex });
      });
    }
    else if(a==='close-color-modal'){ closeModal(); renderMain(); }
    // 모달 안 색상 선택기 — 접었다 펴기. 열 때 한 번만 연결하면 되므로 여기서 setup을 부른다.
    else if(a==='toggle-inline-color'){
      const id = el.dataset.id;
      const wrap = document.getElementById('cp-wrap-'+id);
      if(!wrap) return;
      const show = wrap.style.display === 'none';
      wrap.style.display = show ? 'block' : 'none';
      if(show) setupColorPicker(id, (hex)=>{ const fn = INLINE_COLOR_HANDLERS[id]; if(fn) fn(hex); });
    }
    else if(a==='pick-widget-font-target'){ state.widgetFontScaleTarget = el.dataset.key; renderMain(); }
    else if(a==='toggle-widget-date-events'){ setWidgetSetting('date', { dateShowEvents: !getWidgetSettings('date').dateShowEvents }); renderMain(); }
    else if(a==='toggle-widget-calendar-memo'){
      const k = state.widgetFontScaleTarget === 'calendarWide' ? 'calendarWide' : 'calendar';
      setWidgetSetting(k, { calendarShowMemo: !getWidgetSettings(k).calendarShowMemo }); renderMain();
    }
    else if(a==='toggle-widget-calendar-official'){ setWidgetSetting('calendarWide', { calendarShowOfficial: !getWidgetSettings('calendarWide').calendarShowOfficial }); renderMain(); }
    else if(a==='toggle-widget-calendar-council'){ setWidgetSetting('calendarWide', { calendarShowCouncil: !getWidgetSettings('calendarWide').calendarShowCouncil }); renderMain(); }
    else if(a==='toggle-widget-week-fullday'){ setWidgetSetting('week', { weekShowFullDay: !getWidgetSettings('week').weekShowFullDay }); renderMain(); }
    else if(a==='toggle-widget-week-room'){ setWidgetSetting('week', { weekShowRoom: !getWidgetSettings('week').weekShowRoom }); renderMain(); }
    else if(a==='open-primary-timetable'){ openModal(primaryTimetableModal()); }
    else if(a==='pick-primary-variant'){
      if(el.dataset.idx === '-1') clearWidgetPrimaryTimetable();
      else setWidgetPrimaryTimetable(el.dataset.key, parseInt(el.dataset.idx,10));
      closeModal(); renderMain();
    }
    else if(a==='edit-memo'){ openModal(memoModal(el.dataset.date || state.selectedExamDate)); setupMemoModalListeners(); }
    else if(a==='delete-memo'){ await deleteMemo(el.dataset.date || state.selectedExamDate); }
    else if(a==='edit-event'){
      const ev=live(state.calendar).find(x=>x.id===el.dataset.id);
      if(ev) openModal(eventModal(ev));
    }
    else if(a === 'delete-event'){ await deleteEvent(el.dataset.id); }
    else if(a === 'select-meal-date'){ state.mealDate = el.dataset.date; renderMain(); }
    // 학식은 평일에만 운영해서 주말 날짜엔 보여줄 게 없다. 화살표로 하루씩 넘길 때
    // 토·일은 건너뛰고 바로 다음(이전) 평일로 이동한다.
    else if(a === 'meal-day-prev'){ state.mealDate = shiftWeekday(state.mealDate, -1); renderMain(); }
    else if(a === 'meal-day-next'){ state.mealDate = shiftWeekday(state.mealDate, 1); renderMain(); }
    else if(a === 'edit-meal'){ openModal(mealModal(el.dataset.date)); }
    else if(a === 'fetch-meal-page'){ await fetchMealFromSource(false); }
    else if(a === 'add-notice'){ openModal(noticeModal(null)); setupNoticeModalListeners(); }
    else if(a === 'edit-notice'){
      const n = live(state.notices).find(x => x.id === el.dataset.id);
      if(n && canModify(n)){ openModal(noticeModal(n)); setupNoticeModalListeners(); }
    }
    else if(a === 'delete-notice'){ await deleteNotice(el.dataset.id); }
    else if(a === 'toggle-pin'){ await togglePin(el.dataset.id); }
    else if(a === 'add-suggestion'){ openModal(suggestionModal()); }
    else if(a === 'reply-suggestion'){ const s = live(state.suggestions).find(x => x.id === el.dataset.id); if(s) openModal(replyModal(s)); }
    else if(a === 'delete-suggestion'){ await deleteSuggestion(el.dataset.id); }
    else if(a === 'add-poll'){ openModal(pollModal()); updatePollOptionUI(); }
    else if(a === 'add-poll-option'){
      const wrap = document.getElementById('poll-options-wrap');
      if(!wrap) return;
      const div = document.createElement('div');
      div.className = 'field poll-option-field';
      div.style.marginBottom = '8px';
      div.innerHTML = `<div style="display:flex; gap:6px;"><input type="text" name="option" required style="font-family:var(--font-display)"><button type="button" class="btn btn-danger btn-sm" data-action="remove-poll-option" style="width:auto;">삭제</button></div>`;
      wrap.appendChild(div);
      updatePollOptionUI();
    }
    else if(a === 'remove-poll-option'){ const f = el.closest('.poll-option-field'); if(f) f.remove(); updatePollOptionUI(); }
    else if(a === 'close-poll'){ await closePollNow(el.dataset.id); }
    else if(a === 'reopen-poll'){ await reopenPoll(el.dataset.id); }
    else if(a === 'delete-poll'){ await deletePoll(el.dataset.id); }
    else if(a === 'edit-poll-vote'){ state.editingPollVoteId = el.dataset.id; renderMain(); }
    else if(a === 'cancel-edit-poll-vote'){ state.editingPollVoteId = null; renderMain(); }
    else if(a === 'cancel-poll-vote'){ await cancelPollVote(el.dataset.id); }
    else if(a === 'export-poll-csv'){ exportPollResultsCSV(el.dataset.id); }
    else if(a === 'add-recruitment'){ openModal(recruitmentModal(null)); }
    else if(a === 'open-recruitment'){
      const r = live(state.recruitmentPosts).find(x => x.id === el.dataset.id);
      if(r){
        const mine = state.user && r.authorId === state.user.studentId;
        if(mine || myLevel() >= 3) openModal(recruitmentModal(r));
      }
    }
    else if(a === 'delete-recruitment'){ await deleteRecruitment(el.dataset.id); }
    else if(a === 'add-council-post'){ openModal(councilPostModal()); }
    else if(a === 'delete-council-post'){ await deleteCouncilPost(el.dataset.id); }
    else if(a === 'delete-council-comment'){ await deleteCouncilComment(el.dataset.postId, el.dataset.commentId); }
    else if(a === 'clear-all-board'){ await clearAllBoard(el.dataset.type); }
    else if(a === 'toggle-like'){ await handleToggleLike(el.dataset.type, el.dataset.id); }
    else if(a === 'toggle-comment-like'){ await handleToggleCommentLike(el.dataset.postId, el.dataset.commentId); }
    else if(a === 'toggle-more-comments'){
      state.expandedComments[el.dataset.postId] = !state.expandedComments[el.dataset.postId];
      renderMain();
    }
  }catch(err){
    console.error(err);
  }
});

boot();

// 네이티브 앱(APK)은 파일이 이미 APK 안에 통째로 들어있어서 서비스워커 캐시가 필요 없고,
// 오히려 새 버전을 설치해도 예전 index.html(예전 API 키 등)을 캐시에서 계속 물고 있을 수 있어
// 실제로 그 문제가 있었다. 그래서 웹(브라우저 PWA)에서만 등록한다.
const isNativeApp = typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform && Capacitor.isNativePlatform();
if(isNativeApp && 'serviceWorker' in navigator){
  // 예전 버전(네이티브에서도 등록하던 시절)에 이미 깔린 서비스워커·캐시가 남아있을 수 있으니 정리한다.
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
  if(window.caches) caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(()=>{});
} else if(!isNativeApp && 'serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
