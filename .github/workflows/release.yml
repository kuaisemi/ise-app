name: Release APK

# v로 시작하는 태그(예: v174)를 올리면 GitHub 릴리즈를 만들고 APK를 붙인다.
# 앱의 "업데이트 확인"은 최신 릴리즈의 태그 번호를 설치된 versionCode와 비교하고,
# 다운로드 버튼은 releases/latest/download/app-release.apk 를 가리키므로
# 같은 파일을 app-release.apk 와 ku-ise-Beta_0.0.0.apk 두 이름으로 올린다
# (옛 버전 앱이 예전 파일명을 아직 쓴다).
#
# 쓰는 법: releases/ku-ise-Beta_0.0.0.apk 를 새 APK로 바꿔 커밋·푸시한 뒤
#   git tag v175 && git push origin v175
# 같은 태그를 다시 올리면(APK를 고쳐서 다시 낼 때) 릴리즈를 새로 만들지 않고 파일과 제목만 교체한다.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          BUILD=${GITHUB_REF_NAME#v}
          TITLE="${VERSION_NAME} (build ${BUILD})"
          cp releases/ku-ise-Beta_0.0.0.apk app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app-release.apk releases/ku-ise-Beta_0.0.0.apk --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              app-release.apk \
              releases/ku-ise-Beta_0.0.0.apk \
              --title "$TITLE" \
              --notes "$TITLE" \
              --latest
          fi
