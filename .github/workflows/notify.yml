name: Send push notifications

on:
  schedule:
    # 5분 간격은 매 실행마다 users 컬렉션을 통째로 읽어서(친구요청·식단·투표리마인더 등에 필요)
    # Firestore 무료 할당량(하루 5만 읽기)을 다 써버렸다(2026-09-28). 채팅 등 진짜 즉시성이
    # 필요한 알림은 이미 Cloudflare Worker(notify/../worker-notify, 1분 주기)로 옮겨져 있어서
    # 이 크론은 더 이상 안 촘촘해도 된다 — 1시간으로 늘려 읽기량을 12분의 1로 줄인다.
    # GitHub Actions 크론은 정확히 정시를 보장하지 않고 몇 분 밀릴 수 있음(실시간 아님, 근접 실시간)
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: notify
        run: npm install --omit=dev
      # 학과 공지/학식을 먼저 갱신한 뒤 알림을 보낸다.
      # (같은 실행 안에서 새로 들어온 식단이 바로 알림 대상이 되도록)
      - name: Refresh dept notices and meals
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run fetch
      # 위 갱신(크롤링)이 실패해도 알림 발송은 돌아야 한다 — 학교 사이트가 잠깐 죽었다고
      # 식단·투표 알림과 수신자 목록(pushAudience) 갱신까지 같이 멈추면 안 된다.
      # 잡 자체는 갱신 실패 때문에 여전히 실패로 표시된다.
      - name: Send notifications
        if: ${{ !cancelled() }}
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run send
