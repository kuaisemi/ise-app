name: Send push notifications

on:
  schedule:
    # GitHub Actions 크론은 정확히 5분 간격을 보장하지 않고 몇 분 밀릴 수 있음(실시간 아님, 근접 실시간)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: notify
        run: npm install --omit=dev
      # 학과 공지/학식을 먼저 갱신한 뒤 알림을 보낸다.
      # (같은 실행 안에서 새로 들어온 식단이 바로 알림 대상이 되도록)
      - name: Refresh dept notices and meals
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run fetch
      - name: Send notifications
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run send
